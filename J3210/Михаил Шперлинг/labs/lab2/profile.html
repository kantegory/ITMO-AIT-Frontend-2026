<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | AI Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html text-primary">AI Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Модели</a></li>
                <li class="nav-item"><a class="nav-link" href="datasets.html">Датасеты</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <a href="login.html" class="btn btn-outline-light me-2">Вход</a>
                <a href="register.html" class="btn btn-primary">Регистрация</a>
                <a href="profile.html" class="btn btn-secondary ms-2"><i class="bi bi-person-circle"></i></a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-4 text-center mb-4">
            <div class="card p-4 shadow-sm border-0">
                <img src="" id="profileAvatar" alt="Avatar" class="rounded-circle mx-auto mb-3 profile-img" style="width: 120px; height: 120px; display: none;">
                <h4 class="fw-bold" id="profileName">Загрузка...</h4>
                <p class="text-muted mb-3" id="profileEmail"></p>
                <div class="d-flex justify-content-center gap-2 mb-3">
                    <span class="badge bg-secondary"><i class="bi bi-box"></i> <span id="profileModelsCount">0</span> Моделей</span>
                </div>
                <button class="btn btn-outline-primary w-100" id="editProfileBtn">Редактировать профиль</button>
            </div>
        </div>

        <div class="col-md-8">
            <h3 class="mb-4">Мои загруженные модели</h3>
            <div class="list-group shadow-sm" id="profileResources">
                <div class="text-center p-4">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
