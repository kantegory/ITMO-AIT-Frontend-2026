<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub | Поиск моделей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">AI Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="index.html">Модели</a></li>
                <li class="nav-item"><a class="nav-link" href="datasets.html">Датасеты</a></li>
            </ul>
            <div class="d-flex align-items-center">
                <a href="login.html" class="btn btn-outline-light me-2">Вход</a>
                <a href="register.html" class="btn btn-primary">Регистрация</a>
                <a href="profile.html" class="btn btn-secondary ms-2"><i class="bi bi-person-circle"></i></a>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="row">
        <aside class="col-md-3 mb-4">
            <div class="card p-3 shadow-sm border-0">
                <h5 class="fw-bold">Фильтры</h5>
                <hr>
                <h6 class="text-muted text-uppercase small fw-bold">Задача</h6>
                <div class="form-check">
                    <input class="form-check-input task-filter" type="checkbox" id="nlp" value="nlp">
                    <label class="form-check-label" for="nlp">NLP (Текст)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input task-filter" type="checkbox" id="cv" value="cv">
                    <label class="form-check-label" for="cv">Computer Vision</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input task-filter" type="checkbox" id="audio" value="audio">
                    <label class="form-check-label" for="audio">Audio / Speech</label>
                </div>
                
                <h6 class="text-muted text-uppercase small fw-bold mt-4">Фреймворк</h6>
                <select id="frameworkSelect" class="form-select border-0 bg-light">
                    <option value="all" selected>Все</option>
                    <option value="pytorch">PyTorch</option>
                    <option value="tensorflow">TensorFlow</option>
                    <option value="jax">JAX</option>
                </select>
            </div>
        </aside>

        <main class="col-md-9">
            <div class="input-group mb-4 shadow-sm">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Поиск по названию или описанию...">
                <button class="btn btn-primary" id="searchBtn">Найти</button>
                <button class="btn btn-success ms-2 rounded" id="openCreateModalBtn" type="button">Создать модель</button>
            </div>

            <div class="row row-cols-1 row-cols-md-2 g-4" id="dataContainer">
                
            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="createModelModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title fw-bold">Создать новую модель</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createModelForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Название модели</label>
                        <input type="text" class="form-control" id="modelTitle" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea class="form-control" id="modelDesc" rows="3" required></textarea>
                    </div>
                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Задача</label>
                            <select class="form-select" id="modelTask" required>
                                <option value="nlp">NLP (Текст)</option>
                                <option value="cv">Computer Vision</option>
                                <option value="audio">Audio / Speech</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Фреймворк</label>
                            <select class="form-select" id="modelFramework" required>
                                <option value="pytorch">PyTorch</option>
                                <option value="tensorflow">TensorFlow</option>
                                <option value="jax">JAX</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Опубликовать модель</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
