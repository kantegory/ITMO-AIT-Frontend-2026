<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль | AI Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" aria-label="Главная навигация">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">AI Hub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключатель навигации">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Модели</a></li>
                <li class="nav-item"><a class="nav-link" href="datasets.html">Датасеты</a></li>
            </ul>
                <button id="themeToggle" class="btn btn-link text-light me-3 p-0 border-0" aria-label="Переключить тему">
                    <svg class="svg-icon fs-5" id="themeIcon" aria-hidden="true"><use href="sprite.svg#icon-moon"></use></svg>
                </button>
            <div class="d-flex align-items-center">
                <a href="login.html" class="btn btn-outline-light me-2">Вход</a>
                <a href="register.html" class="btn btn-primary">Регистрация</a>
                <a href="profile.html" class="btn btn-secondary ms-2" aria-label="Профиль пользователя"><svg class="svg-icon" aria-hidden="true"><use href="sprite.svg#icon-person"></use></svg></a>
            </div>
        </div>
    </div>
</nav>

<main class="container mt-5">
    <div class="row">
        <aside class="col-md-4 text-center mb-4" aria-label="Информация о профиле">
            <div class="card p-4 shadow-sm border-0">
                <img src="" id="profileAvatar" alt="Аватар пользователя" class="rounded-circle mx-auto mb-3 profile-img" style="width: 120px; height: 120px; display: none;">
                <h4 class="fw-bold" id="profileName">Загрузка...</h4>
                <p class="text-muted mb-3" id="profileEmail"></p>
                <div class="d-flex justify-content-center gap-2 mb-3">
                    <span class="badge bg-secondary"><svg class="svg-icon" aria-hidden="true"><use href="sprite.svg#icon-box"></use></svg> Моделей: <span id="profileModelsCount">0</span></span>
                </div>
                <button class="btn btn-outline-primary w-100" id="editProfileBtn">Редактировать профиль</button>
            </div>
        </aside>

        <section class="col-md-8" aria-label="Загруженные модели">
            <h3 class="mb-4">Мои загруженные модели</h3>
            <div class="list-group shadow-sm" id="profileResources" aria-live="polite">
                <div class="text-center p-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Загрузка...</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>

<div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true" role="dialog">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title fw-bold" id="editProfileModalLabel">Редактировать профиль</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form id="editProfileForm" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="editUsername" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="editUsername" required>
                    </div>
                    <div class="mb-4">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Сохранить изменения</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
