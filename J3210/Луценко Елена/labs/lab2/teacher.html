<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль преподавателя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar navbar-dark bg-dark py-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="index.html">TopCourses</a>
        <div class="d-flex gap-2">
            <a href="index.html" class="btn btn-outline-light">В каталог</a>
            <button onclick="logout()" class="btn btn-outline-light">Выйти</button>
        </div>
    </div>
</header>

<main class="container py-5">
    <div class="card border-0 p-4 mb-5">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h4 class="fw-bold mb-0">Здравствуйте, <span class="text-primary" id="name"></span></h4>
            </div>

            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#createCourseModal">+ Создать курс</button>
            </div>
        </div>
    </div>

    <div class="text-center mb-4 px-1">
        <h3 class="fw-bold mb-3">Ваши активные курсы</h3>
        <div class="d-flex justify-content-center gap-3">
            <button class="btn btn-sm btn-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#addLessonModal">+ Добавить урок</button>
            <button class="btn btn-sm btn-outline-primary px-4 py-2" data-bs-toggle="modal" data-bs-target="#modal">+ Добавить материал</button>
        </div>
    </div>

    <div class="card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-4 py-3">Название курса</th>
                    <th class="py-3">Студентов</th>
                    <th class="py-3">Категория</th>
                    <th class="py-3 pe-4">Статус</th>
                </tr>
                </thead>
                <tbody id="teacherCourses"></tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="modal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold w-100 text-center">Новый материал</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <form id="uploadForm">
                    <div class="mb-3">
                        <label for="courseSelect" class="form-label small">Выберите курс</label>
                        <select class="form-select" id="courseSelect" onchange="loadLessonsForModal()" required></select>
                    </div>

                    <div class="mb-3">
                        <label for="lessonSelect" class="form-label small">Тема урока</label>
                        <select class="form-select" id="lessonSelect" required></select>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small">Файл</label>
                        <input type="file" id="fileInput" class="form-control">
                    </div>

                    <button type="button" onclick="upload()" class="btn btn-primary w-100">Опубликовать</button>
                </form>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="createCourseModal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title w-100 text-center fw-bold">Создание нового курса</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form id="createCourseForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="newCourseTitle" class="form-label small fw-bold">Название курса</label>
                            <input type="text" id="newCourseTitle" class="form-control" placeholder="Основы C++" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="newCourseCategory" class="form-label small fw-bold">Категория</label>
                            <select id="newCourseCategory" class="form-select">
                                <option value="Программирование">Программирование</option>
                                <option value="Дизайн">Дизайн</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="newCourseLevel" class="form-label small fw-bold">Уровень</label>
                            <select id="newCourseLevel" class="form-select">
                                <option value="Новичок">Новичок</option>
                                <option value="Средний">Средний</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="newCoursePrice" class="form-label small fw-bold">Цена (₽)</label>
                            <input type="number" id="newCoursePrice" class="form-control" value="5000" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="newCourseDescription" class="form-label small fw-bold">Описание курса</label>
                        <textarea id="newCourseDescription" class="form-control" rows="3" placeholder="О чем этот курс?"></textarea>
                    </div>

                    <div class="p-3 bg-light rounded mb-4">
                        <h6 class="fw-bold mb-2 small text-primary">Первый урок</h6>
                        <label for="newCourseFirstLesson" class="form-label small">Название вводного занятия</label>
                        <input type="text" id="newCourseFirstLesson" class="form-control" value="Введение и основы">
                    </div>

                    <button type="button" onclick="createNewCourse()" class="btn btn-primary w-100 py-2 fw-bold">Опубликовать курс на платформе</button>
                </form>
            </div>
        </div>
    </div>
</div>


<div class="modal fade" id="addLessonModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title w-100 text-center fw-bold">Новая тема курса</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <form>
                    <div class="mb-3">
                        <label for="lessonCourseSelect" class="form-label small fw-bold">Выберите курс</label>
                        <select class="form-select" id="lessonCourseSelect" required></select>
                    </div>
                    <div class="mb-3">
                        <label for="newLessonTitle" class="form-label small fw-bold">Название урока</label>
                        <input type="text" id="newLessonTitle" class="form-control" placeholder="Работа с массивами" required>
                    </div>
                    <div class="mb-3">
                        <label for="newLessonDesc" class="form-label small fw-bold">Описание урока</label>
                        <textarea id="newLessonDesc" class="form-control" rows="3" placeholder="О чем этот урок?"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="newLessonTask" class="form-label small fw-bold">Практическое задание</label>
                        <textarea id="newLessonTask" class="form-control" rows="2" placeholder="Что должен сделать ученик?"></textarea>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Прикрепить материал (необязательно)</label>
                        <input type="file" id="newLessonFile" class="form-control">
                    </div>
                    <button type="button" onclick="addNewLesson()" class="btn btn-primary w-100 fw-bold">Опубликовать урок</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>

<script>
    async function upload() {
        const courseId = document.getElementById('courseSelect').value;
        const lessonIndex = document.getElementById('lessonSelect').value;
        const fileInput = document.getElementById('fileInput');

        if (!fileInput.files[0]) {
            alert("Пожалуйста, выберите файл");
            return;
        }

        const fileName = fileInput.files[0].name;

        const course = await apiRequest(`/courses/${courseId}`);

        course.lessons[lessonIndex].materials.push(fileName);

        const response = await apiRequest(`/courses/${courseId}`, {
            method: 'PATCH',
            body: JSON.stringify({ lessons: course.lessons })
        });

        if (response) {
            alert(`Файл "${fileName}" успешно добавлен к уроку "${course.lessons[lessonIndex].title}"`);
            location.reload();
        }
    }

    async function loadLessonsForModal() {
        const courseId = parseInt(document.getElementById('courseSelect').value);
        const lessonSelect = document.getElementById('lessonSelect');

        if (!courseId) {
            return;
        }

        const course = await apiRequest(`/courses/${courseId}`);

        if (course && course.lessons) {
            lessonSelect.innerHTML = course.lessons.map((lesson, index) => `
                <option value="${index}">${lesson.title}</option>
            `).join('');
        }
    }

    async function createNewCourse() {
        const title = document.getElementById('newCourseTitle').value;
        const category = document.getElementById('newCourseCategory').value;
        const level = document.getElementById('newCourseLevel').value;
        const price = parseInt(document.getElementById('newCoursePrice').value);
        const description = document.getElementById('newCourseDescription').value;
        const firstLessonTitle = document.getElementById('newCourseFirstLesson').value;

        if (!title || !description) {
            alert("Заполните название и описание курса");
            return;
        }

        const userLocal = getCurrentUser();

        const newCourseData = {
            title,
            category,
            level,
            price,
            studentsCount: 0,
            description,
            lessons: [
                {
                    id: 0,
                    title: firstLessonTitle,
                    description: "Добро пожаловать на первый урок курса " + title + "! Здесь начнется ваше обучение",
                    task: "Ознакомьтесь с материалами",
                    materials: []
                }
            ]
        };

        const createdCourse = await apiRequest('/courses', {
            method: 'POST',
            body: JSON.stringify(newCourseData)
        });

        if (createdCourse) {
            const user = await apiRequest(`/600/users/${userLocal.id}`);
            const updatedTeacherCourses = [...user.courses, createdCourse.id];

            await apiRequest(`/600/users/${user.id}`, {
                method: 'PATCH',
                body: JSON.stringify({ courses: updatedTeacherCourses })
            });

            alert("Курс '" + title + "' успешно создан и опубликован!");
            location.reload();
        }
    }

    async function addNewLesson() {
        const courseId = document.getElementById('lessonCourseSelect').value;
        const title = document.getElementById('newLessonTitle').value;
        const description = document.getElementById('newLessonDesc').value;
        const task = document.getElementById('newLessonTask').value;
        const fileInput = document.getElementById('newLessonFile');

        if (!courseId || !title || !description || !task) {
            alert("Заполните основные поля урока");
            return;
        }

        const course = await apiRequest(`/courses/${courseId}`);
        if (!course) {
            return;
        }

        const newLesson = {
            id: course.lessons.length,
            title: title,
            description: description,
            task: task,
            materials: fileInput.files[0] ? [fileInput.files[0].name] : []
        };

        const updatedLessons = [...course.lessons, newLesson];

        const response = await apiRequest(`/courses/${courseId}`, {
            method: 'PATCH',
            body: JSON.stringify({ lessons: updatedLessons })
        });

        if (response) {
            alert(`Урок "${title}" успешно добавлен в программу курса!`);
            location.reload();
        }
    }

    async function deleteCourse(courseId, courseTitle) {
        if (!confirm(`Вы уверены, что хотите полностью удалить курс "${courseTitle}"? Это действие нельзя отменить`)) {
            return;
        }

        const response = await apiRequest(`/courses/${courseId}`, {
            method: 'DELETE'
        });

        const userLocal = getCurrentUser();
        const user = await apiRequest(`/600/users/${userLocal.id}`);

        const updatedCourses = user.courses.filter(id => id !== courseId);

        await apiRequest(`/600/users/${user.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ courses: updatedCourses })
        });

        alert(`Курс "${courseTitle}" успешно удален`);
        location.reload();
    }

    document.addEventListener("DOMContentLoaded", async function () {
        const userLocal = getCurrentUser();

        if (!userLocal || userLocal.role !== 'teacher') {
            window.location.href = "login.html";
            return;
        }

        const user = await apiRequest(`/600/users/${userLocal.id}`);
        const allCourses = await apiRequest('/courses');
        document.getElementById('name').innerText = user.name;

        const userCourses = allCourses.filter(course => user.courses.includes(course.id));
        const tableBody = document.getElementById('teacherCourses');

        if (userCourses.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="4" class="text-center py-5 text-muted">
                        У вас пока нет активных курсов (
                    </td>
                </tr>`;
        } else {
            tableBody.innerHTML = userCourses.map(course => `
                <tr>
                    <td class="ps-4 py-3">
                        <a href="course.html?id=${course.id}&lesson=0" class="text-decoration-none course-link fw-bold">${course.title}</a>
                    </td>
                    <td><span class="badge bg-light text-dark border">${course.studentsCount} чел.</span></td>
                    <td><small>${course.category}</small></td>
                    <td class="pe-4">
                        <button onclick="deleteCourse(${course.id}, '${course.title}')" class="btn btn-sm btn-outline-danger border-0"> Удалить</button>
                    </td>
                </tr>
            `).join('');
        }

        const select = document.getElementById('courseSelect');
        select.innerHTML = userCourses.map(course => `
            <option value="${course.id}">${course.title}</option>
        `).join('');

        const lessonCourseSelect = document.getElementById('lessonCourseSelect');
        if (lessonCourseSelect) {
            lessonCourseSelect.innerHTML = '<option value="">Выберите курс...</option>' + userCourses.map(course => `<option value="${course.id}">${course.title}</option>`).join('');
        }

        document.getElementById('modal').addEventListener('shown.bs.modal', function () {
            loadLessonsForModal();
        });
    });
</script>

</body>
</html>
