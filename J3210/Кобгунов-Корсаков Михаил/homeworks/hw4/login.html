<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <main id="main-content">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 400px">

            <h3 class="text-center mb-4">
                <svg class="icon" aria-hidden="true"><use href="sprite.svg#user"></use></svg>
                Вход
            </h3>

            <div class="text-center mb-3">
                <button class="btn btn-sm btn-outline-secondary" type="button" onclick="toggleTheme()">
                    Тема
                </button>
            </div>

            <form onsubmit="return loginUser(event)">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        required
                    >
                </div>


                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <div class="input-group">
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            required
                        >
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="togglePassword()"
                        >
                            Показать
                        </button>

                    </div>
                </div>

                <div id="error" class="text-danger mb-3" role="alert" aria-live="assertive"></div>


                <button class="btn btn-primary w-100" type="submit" >
                    Войти
                </button>


                <div class="text-center mt-3">
                    <a href="register.html">
                        Регистрация
                    </a>
                </div>
            </form>
        </div>
    </div>
    </main>


    <script>
        function togglePassword() {

            const input = document.getElementById("password");

            input.type =
                input.type === "password"
                    ? "text"
                    : "password";

        }

        async function loginUser(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const error = document.getElementById("error");

            error.innerText = "";

            try {
                const response = await fetch(
                    `http://localhost:3000/users?email=${encodeURIComponent(email)}`
                );

                const users = await response.json();

                const user = users.find(item => String(item.password).trim() === password);

                if (!user) {
                    error.innerText = "Неверный email или пароль";
                    return false;
                }

                localStorage.setItem("user", JSON.stringify(user));
                window.location.href = "dashboard.html";
                return false;
            } catch (e) {
                error.innerText = "Не удалось подключиться к JSON Server";
                return false;
            }
        }
        function toggleTheme() {
            const currentTheme = document.body.dataset.theme || "light";

            if (currentTheme === "dark") {
                document.body.dataset.theme = "light";
                localStorage.setItem("theme", "light");
            } else {
                document.body.dataset.theme = "dark";
                localStorage.setItem("theme", "dark");
            }
        }

        const savedTheme = localStorage.getItem("theme") || "light";
        document.body.dataset.theme = savedTheme;
    </script>
</body>
</html>
