<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>

<body>
    <main id="main-content">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 420px">
            <h3 class="text-center mb-4">Регистрация</h3>

            <div class="text-center mb-3">
                <button class="btn btn-sm btn-outline-secondary" type="button" onclick="toggleTheme()">
                    Тема
                </button>
            </div>

            <form onsubmit="return validateForm(event)">
                
                <label class="visually-hidden" for="name">Имя</label>
                <input
                    class="form-control mb-3"
                    placeholder="Имя"
                    id="name"
                    required
                >
                
                <label class="visually-hidden" for="email">Email</label>
                <input
                    class="form-control mb-3"
                    placeholder="Email"
                    id="email"
                    type="email"
                    required
                >
                
                <label class="visually-hidden" for="pass1">Пароль</label>
                <input
                    type="password"
                    id="pass1"
                    class="form-control mb-3"
                    placeholder="Пароль"
                    required
                >

                <label class="visually-hidden" for="pass2">Повторите пароль</label>
                <input
                    type="password"
                    id="pass2"
                    class="form-control mb-3"
                    placeholder="Повторите пароль"
                    required
                >

                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="agree"
                    >
                    <label class="form-check-label" for="agree">
                        Согласен с условиями
                    </label>
                </div>

                <div id="error" class="text-danger mb-2" role="alert" aria-live="assertive"></div>

                <button class="btn btn-success w-100" type="submit">
                    Зарегистрироваться
                </button>
            </form>
        </div>
    </div>
    </main>


    <script>

        async function validateForm(event) {
            event.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const p1 = document.getElementById("pass1").value;
            const p2 = document.getElementById("pass2").value;
            const agree = document.getElementById("agree").checked;

            if (p1 !== p2) {
                document.getElementById("error").innerText = "Пароли не совпадают";
                return false;
            }

            if (!agree) {
                document.getElementById("error").innerText = "Подтвердите условия";
                return false;
            }

            try {
                const response = await fetch(
                    `http://localhost:3000/users?email=${encodeURIComponent(email)}`
                );

                const users = await response.json();

                if (users.length > 0) {
                    document.getElementById("error").innerText = "Пользователь с таким email уже существует";
                    return false;
                }

                await fetch("http://localhost:3000/users", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: p1
                    })
                });

                alert("Регистрация успешна");
                window.location.href = "login.html";
                return false;
            } catch (e) {
                document.getElementById("error").innerText = "Не удалось подключиться к JSON Server";
                return false;
            }

        }
        function toggleTheme() {
            const currentTheme = document.body.dataset.theme || "light";

            if (currentTheme === "dark") {
                document.body.dataset.theme = "light";
                localStorage.setItem("theme", "light");
            } else {
                document.body.dataset.theme = "dark";
                localStorage.setItem("theme", "dark");
            }
        }

        const savedTheme = localStorage.getItem("theme") || "light";
        document.body.dataset.theme = savedTheme;
    </script>
</body>
</html>
