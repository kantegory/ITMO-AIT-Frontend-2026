<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="index.html">Финансы от Михалыча</a>

            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="dashboard.html">Кабинет</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="transactions.html">
                        <svg class="icon" aria-hidden="true"><use href="sprite.svg#wallet"></use></svg>
                        Транзакции
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="reports.html">Отчёты</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="integrations.html">Интеграции</a>
                </li>

                <li class="nav-item ms-2">
                    <button class="btn btn-sm btn-outline-light" type="button" onclick="toggleTheme()">
                        Тема
                    </button>
                </li>
            </ul>
        </div>
    </nav>

    <main id="main-content">
    <div class="container py-5">
        <h2 class="mb-4">Поиск и фильтрация транзакций</h2>

        <div class="card shadow-sm p-3 mb-4">

            <div class="row g-3">

                <div class="col-md-3">
                    <label for="searchInput" class="form-label">Поиск</label>
                    <input
                        type="text"
                        class="form-control"
                        id="searchInput"
                        name="search"
                        placeholder="Поиск"
                    >
                </div>

                <div class="col-md-3">
                    <label for="categorySelect" class="form-label">Категория</label>
                    <select class="form-select" id="categorySelect" name="category">
                        <option value="">Категория</option>
                        <option>Продукты</option>
                        <option>Транспорт</option>
                        <option>Развлечения</option>
                        <option>Доходы</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label for="amountInput" class="form-label">Сумма</label>
                    <input
                        type="number"
                        class="form-control"
                        id="amountInput"
                        name="amount"
                        placeholder="Сумма"
                    >
                </div>

                <div class="col-md-2">
                    <label for="dateInput" class="form-label">Дата</label>
                    <input
                        type="date"
                        class="form-control"
                        id="dateInput"
                        name="date"
                        aria-label="Дата"
                    >
                </div>

                <div class="col-md-2 d-grid align-self-end">
                    <button
                        class="btn btn-primary"
                        type="button"
                        onclick="applyFilters()"
                    >
                        Применить
                    </button>
                </div>
            </div>

            <div class="mt-3">
                <button
                    class="btn btn-outline-secondary"
                    type="button"
                    onclick="resetFilters()"
                >
                    Сбросить
                </button>
            </div>
        </div>


        <div class="card shadow-sm">

            <div class="card-header">
                Список транзакций
            </div>

            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <caption class="visually-hidden">
                        Список транзакций пользователя
                    </caption>

                    <thead>
                        <tr>
                            <th scope="col">Дата</th>
                            <th scope="col">Категория</th>
                            <th scope="col">Описание</th>
                            <th scope="col">Сумма</th>
                        </tr>
                    </thead>

                    <tbody id="transactionsBody">

                        <tr>
                            <td colspan="4" class="text-center">Загрузка...</td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </div>
    </main>


    <script>
        const user = localStorage.getItem("user");

        if (!user) {
            window.location.href = "login.html";
        }

        let transactions = [];

        async function loadTransactions() {

            try {
                const response = await fetch("http://localhost:3000/transactions");
                transactions = await response.json();
                renderTransactions(transactions);
            } catch (e) {
                document.getElementById("transactionsBody").innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-danger">Не удалось загрузить транзакции</td>
                    </tr>
                `;
            }

        }

        function renderTransactions(items) {

            const tbody = document.getElementById("transactionsBody");

            tbody.innerHTML = "";

            if (items.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center">Ничего не найдено</td>
                    </tr>
                `;
                return;
            }

            items.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td>${item.date}</td>
                        <td>${item.category}</td>
                        <td>${item.description}</td>
                        <td class="${item.amount > 0 ? "text-success" : "text-danger"}">${item.amount > 0 ? "+" : ""}${item.amount} ₽</td>
                    </tr>
                `;
            });

        }

        function applyFilters() {

            const search = document.getElementById("searchInput").value.toLowerCase().trim();
            const category = document.getElementById("categorySelect").value;
            const amount = document.getElementById("amountInput").value;
            const date = document.getElementById("dateInput").value;

            const filtered = transactions.filter(item => {

                const matchSearch =
                    item.description.toLowerCase().includes(search) ||
                    item.category.toLowerCase().includes(search);

                const matchCategory = !category || item.category === category;
                const matchAmount = !amount || Math.abs(item.amount) == Number(amount);
                const matchDate = !date || item.date === date;

                return matchSearch && matchCategory && matchAmount && matchDate;

            });

            renderTransactions(filtered);
        }

        function resetFilters() {

            document.getElementById("searchInput").value = "";
            document.getElementById("categorySelect").selectedIndex = 0;
            document.getElementById("amountInput").value = "";
            document.getElementById("dateInput").value = "";

            renderTransactions(transactions);

        }

        loadTransactions();

        function toggleTheme() {
            const currentTheme = document.body.dataset.theme || "light";

            if (currentTheme === "dark") {
                document.body.dataset.theme = "light";
                localStorage.setItem("theme", "light");
            } else {
                document.body.dataset.theme = "dark";
                localStorage.setItem("theme", "dark");
            }
        }

        const savedTheme = localStorage.getItem("theme") || "light";
        document.body.dataset.theme = savedTheme;
    </script>

</body>
</html>
