<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow" style="width: 420px">
            <h3 class="text-center mb-4">Регистрация</h3>

            <form onsubmit="return validateForm()">

                <input
                    class="form-control mb-3"
                    placeholder="Имя"
                >

                <input
                    class="form-control mb-3"
                    placeholder="Email"
                >

                <input
                    type="password"
                    id="pass1"
                    class="form-control mb-3"
                    placeholder="Пароль"
                >

                <input
                    type="password"
                    id="pass2"
                    class="form-control mb-3"
                    placeholder="Повторите пароль"
                >

                <div class="form-check mb-3">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="agree"
                    >
                    <label class="form-check-label">
                        Согласен с условиями
                    </label>
                </div>

                <div id="error" class="text-danger mb-2"></div>

                <button class="btn btn-success w-100">
                    Зарегистрироваться
                </button>
            </form>
        </div>
    </div>


    <script>

        function validateForm() {
            const p1 = document.getElementById("pass1").value;
            const p2 = document.getElementById("pass2").value;
            const agree = document.getElementById("agree").checked;

            if (p1 !== p2) {
                document.getElementById("error").innerText = "Пароли не совпадают";
                return false;
            }

            if (!agree) {
                document.getElementById("error").innerText = "Подтвердите условия";
                return false;
            }

            alert("Регистрация успешна");
            return false;

        }
    </script>
</body>
</html>
