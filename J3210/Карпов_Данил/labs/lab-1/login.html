<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Minion Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card">
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
                <h2 class="mt-2">Вход в <span class="brand-minion">Minion</span> <span class="brand-courses">Courses</span></h2>
                <p class="text-muted">Войдите, чтобы продолжить обучение</p>
            </div>

            <!-- Алерт для ошибок -->
            <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="example@mail.ru" required>
                    <div class="invalid-feedback">Введите корректный email</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="Введите пароль" required minlength="6">
                    <div class="invalid-feedback">Пароль должен содержать минимум 6 символов</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <a href="#" class="text-primary text-decoration-none">Забыли пароль?</a>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">
                    <span id="btnText">Войти</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                </button>

                <div class="text-center">
                    <span class="text-muted">Нет аккаунта?</span>
                    <a href="register.html" class="text-primary text-decoration-none ms-1">Зарегистрироваться</a>
                </div>
            </form>

            <!-- Тестовые данные -->
            <div class="mt-4 p-3 rounded" style="background: rgba(102,16,242,0.07);">
                <p class="text-muted small mb-2"><i class="bi bi-info-circle me-1"></i>Тестовые аккаунты:</p>
                <div class="d-flex gap-2 flex-wrap">
                    <button class="btn btn-outline-secondary btn-sm" onclick="fillDemo('admin@minion.ru','admin123')">
                        👤 Студент
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="fillDemo('teacher@minion.ru','teacher123')">
                        🎓 Преподаватель
                    </button>
                </div>
            </div>

            <div class="text-center mt-4">
                <span class="theme-toggle" onclick="toggleTheme()">
                    <i class="bi bi-moon-fill" id="themeIcon"></i>
                </span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Если уже авторизован — редирект
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }

        function fillDemo(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const form = this;
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Показываем спиннер
            submitBtn.disabled = true;
            btnText.textContent = 'Входим...';
            btnSpinner.classList.remove('d-none');
            alertBox.classList.add('d-none');

            try {
                await login(email, password);
                // Успешный вход — редирект
                window.location.href = 'index.html';
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Войти';
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
