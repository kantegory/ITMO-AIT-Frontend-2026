<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Войдите в аккаунт Minion Courses, чтобы продолжить обучение.">
    <title>Вход - Minion Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <a href="#login-form" class="visually-hidden-focusable btn btn-primary position-absolute top-0 start-0 m-2">
        Перейти к форме входа
    </a>

    <main class="auth-container" id="main-content">
        <div class="card auth-card" role="region" aria-labelledby="login-heading">
            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;" aria-hidden="true"></i>
                <h1 class="h2 mt-2" id="login-heading">Вход в <span class="brand-minion">Minion</span> <span class="brand-courses">Courses</span></h1>
                <p class="text-muted">Войдите, чтобы продолжить обучение</p>
            </div>

            <!-- Алерт для ошибок -->
            <div id="alertBox" class="alert alert-danger d-none" role="alert" aria-live="assertive" aria-atomic="true"></div>

            <form id="loginForm" class="needs-validation" novalidate
                  aria-labelledby="login-heading"
                  aria-describedby="login-hint">
                <p id="login-hint" class="visually-hidden">Заполните поля email и пароль для входа в аккаунт</p>

                <div class="mb-3">
                    <label for="email" class="form-label">Email <span aria-hidden="true" class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email"
                           name="email"
                           placeholder="example@mail.ru"
                           autocomplete="email"
                           required
                           aria-required="true"
                           aria-describedby="email-error">
                    <div class="invalid-feedback" id="email-error" role="alert">Введите корректный email</div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Пароль <span aria-hidden="true" class="text-danger">*</span></label>
                    <input type="password" class="form-control" id="password"
                           name="password"
                           placeholder="Введите пароль"
                           autocomplete="current-password"
                           required
                           minlength="6"
                           aria-required="true"
                           aria-describedby="password-error">
                    <div class="invalid-feedback" id="password-error" role="alert">Пароль должен содержать минимум 6 символов</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember" autocomplete="off">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <button type="button" class="btn btn-link p-0 text-primary text-decoration-none" aria-label="Восстановить пароль (функция в разработке)">Забыли пароль?</button>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn" aria-live="polite">
                    <span id="btnText">Войти</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"
                          role="status"
                          aria-label="Выполняется вход..."></span>
                </button>

                <div class="text-center">
                    <span class="text-muted">Нет аккаунта?</span>
                    <a href="register.html" class="text-primary text-decoration-none ms-1">Зарегистрироваться</a>
                </div>
            </form>

            <!-- Тестовые данные -->
            <div class="mt-4 p-3 rounded" style="background: rgba(102,16,242,0.07);"
                 role="region" aria-labelledby="demo-accounts-label">
                <p class="text-muted small mb-2" id="demo-accounts-label">
                    <i class="bi bi-info-circle me-1" aria-hidden="true"></i>Тестовые аккаунты:
                </p>
                <div class="d-flex gap-2 flex-wrap" role="group" aria-label="Заполнить форму тестовыми данными">
                    <button class="btn btn-outline-secondary btn-sm"
                            onclick="fillDemo('admin@minion.ru','admin123')"
                            aria-label="Войти как студент (admin@minion.ru)">
                        <span aria-hidden="true">👤</span> Студент
                    </button>
                    <button class="btn btn-outline-secondary btn-sm"
                            onclick="fillDemo('teacher@minion.ru','teacher123')"
                            aria-label="Войти как преподаватель (teacher@minion.ru)">
                        <span aria-hidden="true">🎓</span> Преподаватель
                    </button>
                </div>
            </div>

            <div class="text-center mt-4">
                <button class="theme-toggle btn btn-link p-0 border-0"
                        onclick="toggleTheme()"
                        aria-label="Переключить тему оформления"
                        title="Переключить тему">
                    <i class="bi bi-moon-fill" id="themeIcon" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Если уже авторизован — редирект
        if (isLoggedIn()) {
            window.location.href = 'index.html';
        }

        function fillDemo(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const form = this;
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Показываем спиннер
            submitBtn.disabled = true;
            btnText.textContent = 'Входим...';
            btnSpinner.classList.remove('d-none');
            alertBox.classList.add('d-none');

            try {
                await login(email, password);
                // Успешный вход — редирект
                window.location.href = 'index.html';
            } catch (err) {
                alertBox.textContent = err.message;
                alertBox.classList.remove('d-none');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Войти';
                btnSpinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
