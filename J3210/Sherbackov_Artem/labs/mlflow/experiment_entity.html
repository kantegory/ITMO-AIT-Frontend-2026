    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/themization/light.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
    <link rel="stylesheet" href="css/themization/dark.css" media="(prefers-color-scheme: dark)">
</head>

<body class="experiment-entity-page">

<div class="app-layout d-flex">

    <aside> <button class="btn btn-primary d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="Open navigation menu">
        ☰
    </button>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="mobileSidebarLabel">Pipes</h5>
            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body p-0">
            <nav class="d-flex flex-column flex-shrink-0 bg-body-tertiary h-100 p-3" aria-label="Mobile navigation">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item mb-2"><a href="dashboard.html" class="nav-link link-body-emphasis">Home</a></li>
                    <li class="mb-2"><a href="experiments.html" class="nav-link active" aria-current="page">Experiments</a></li> <li class="mb-2"><a href="models.html" class="nav-link link-body-emphasis">Model Registry</a></li>
                </ul>

                <div class="mt-auto">
                    <hr>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://github.com/mdo.png" width="32" height="32" class="rounded-circle me-2" alt="User profile">
                            <strong>User</strong>
                        </a>
                        <ul class="dropdown-menu text-small shadow">
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html">Sign out</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <nav class="d-none d-md-flex flex-column flex-shrink-0 p-4 bg-body-tertiary border-end" style="width:260px; min-height:100vh;" aria-label="Main sidebar">

        <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none" aria-label="Pipes Home">
            <span class="fs-4 fw-bold" aria-hidden="true">Pipes</span>
        </a>

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-2"><a href="dashboard.html" class="nav-link link-body-emphasis">Home</a></li>
            <li class="mb-2"><a href="experiments.html" class="nav-link active" aria-current="page">Experiments</a></li>
            <li class="mb-2"><a href="models.html" class="nav-link link-body-emphasis">Model Registry</a></li>
        </ul>

        <div class="mt-auto">
            <hr>
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://github.com/mdo.png" width="32" height="32" class="rounded-circle me-2" alt="User avatar">
                    <strong>User</strong>
                </a>
                <ul class="dropdown-menu text-small shadow">
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="index.html">Sign out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    </aside>


    <main class="flex-grow-1 p-4">

        <header class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-0" id="experimentTitle" aria-live="polite"></h1> </div>
        </header>

        <section class="card mb-4" aria-label="Filters">
            <div class="card-body">
                <form class="row g-3" role="search"> <div class="col-md-6">
                        <label for="searchInput" class="visually-hidden">Filter by run name</label> <input type="search" class="form-control" id="searchInput" placeholder="Filter by run name"> </div>

                    <div class="col-md-2">
                        <label for="statusFilter" class="visually-hidden">Filter by status</label> <select class="form-select" id="statusFilter">
                            <option value="all">All Statuses</option>
                            <option value="Finished">Finished</option>
                            <option value="In stage">In stage</option>
                        </select>
                    </div>

                    <div class="col-md-2">
                        <label for="sortFilter" class="visually-hidden">Sort runs</label> <select class="form-select" id="sortFilter">
                            <option value="createdAt">Sort: Created</option>
                            <option value="metricValue">Sort: Metric</option>
                            <option value="duration">Sort: Duration</option>
                        </select>
                    </div>
                </form>
            </div>
        </section>
        
        <section class="card" aria-label="Runs list">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" aria-describedby="runsStats"> <thead class="table-light">
                    <tr>
                        <th scope="col">Run Name</th> <th scope="col">Created</th>
                        <th scope="col">Status</th>
                        <th scope="col">Metrics</th>
                        <th scope="col">Parameters</th>
                        <th scope="col">Duration</th>
                    </tr>
                    </thead>

                    <tbody id="runsTableBody" aria-live="polite"> </tbody>
                </table>
            </div>
        </section>

        <nav class="mt-4 d-flex justify-content-between align-items-center" aria-label="Runs pagination"> <span class="text-muted" id="runsStats" aria-live="polite"></span> <ul class="pagination mb-0">
                <li class="page-item disabled" aria-disabled="true">
                    <a class="page-link" tabindex="-1" aria-label="Previous page">Previous</a>
                </li>

                <li class="page-item active" aria-current="page">
                    <a class="page-link" href="#" aria-label="Page 1">1</a>
                </li>

                <li class="page-item disabled" aria-disabled="true"> <a class="page-link" tabindex="-1" aria-label="Next page">Next</a>
                </li>
            </ul>
        </nav>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="js/app.js"></script>

</html>
