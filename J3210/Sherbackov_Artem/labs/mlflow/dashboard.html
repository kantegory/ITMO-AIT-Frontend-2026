<!doctype html>
<html lang="en" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Pipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="css/themization/light.css" media="(prefers-color-scheme: light), (prefers-color-scheme: no-preference)">
    <link rel="stylesheet" href="css/themization/dark.css" media="(prefers-color-scheme: dark)">
</head>
<body>

<div class="app-layout d-flex">

    <aside> 
        <button class="btn btn-primary d-md-none d-flex align-items-center justify-content-center" 
                type="button" 
                data-bs-toggle="offcanvas" 
                data-bs-target="#mobileSidebar" 
                aria-controls="mobileSidebar"
                aria-label="Open navigation menu"
                style="width: 45px; height: 45px;"> 
            <svg width="24" height="24"><use href="img/sprite.svg#icon-home"></use></svg>
        </button>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
        <div class="offcanvas-header">
            
            <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none gap-2 text-body-emphasis" aria-label="Pipes Home">
                <svg width="26" height="26" fill="currentColor">
                    <use href="img/sprite.svg#icon-logo-pipes"></use>
                </svg>
                <span class="fs-4 fw-bold">Pipes</span> 
            </a>

            <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close menu"></button>
        </div>
        <div class="offcanvas-body p-0">
            <nav class="d-flex flex-column flex-shrink-0 bg-body-tertiary h-100 p-3" aria-label="Mobile navigation">
                <ul class="nav nav-pills flex-column mb-auto">
                    <li class="nav-item mb-2">
                        <a href="dashboard.html" class="nav-link active d-flex align-items-center gap-2" aria-current="page">
                            <svg width="18" height="18"><use href="img/sprite.svg#icon-grid"></use></svg>
                            Home
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="experiments.html" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
                            <svg width="18" height="18"><use href="img/sprite.svg#icon-flask"></use></svg>
                            Experiments
                        </a>
                    </li>
                    <li class="nav-item mb-2">
                        <a href="models.html" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
                            <svg width="18" height="18"><use href="img/sprite.svg#icon-layers"></use></svg>
                            Model Registry
                        </a>
                    </li>
                </ul>

                <div class="mt-auto">
                    <hr>
                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://github.com/mdo.png" width="32" height="32" class="rounded-circle me-2" alt="User profile"> <strong>User</strong>
                        </a>
                        <ul class="dropdown-menu text-small shadow">
                            <li><a class="dropdown-item" href="#">Settings</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="index.html">Sign out</a></li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <nav class="d-none d-md-flex flex-column flex-shrink-0 p-4 bg-body-tertiary border-end" 
             style="width:260px; min-height:100vh;" 
             aria-label="Main sidebar">

            <a href="dashboard.html" class="d-flex align-items-center mb-4 text-decoration-none gap-2 text-body-emphasis" aria-label="Pipes Home">
                <svg width="32" height="32" fill="currentColor">
                    <use href="img/sprite.svg#icon-logo-pipes"></use>
                </svg>
                <span class="fs-4 fw-bold">Pipes</span> 
            </a>

        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item mb-2">
                <a href="dashboard.html" class="nav-link active d-flex align-items-center gap-2" aria-current="page">
                    <svg width="18" height="18"><use href="img/sprite.svg#icon-grid"></use></svg>
                    Home
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="experiments.html" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
                    <svg width="18" height="18"><use href="img/sprite.svg#icon-flask"></use></svg>
                    Experiments
                </a>
            </li>
            <li class="nav-item mb-2">
                <a href="models.html" class="nav-link link-body-emphasis d-flex align-items-center gap-2">
                    <svg width="18" height="18"><use href="img/sprite.svg#icon-layers"></use></svg>
                    Model Registry
                </a>
            </li>
        </ul>

        <div class="mt-auto">
            <hr>
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <img src="https://github.com/mdo.png" width="32" height="32" class="rounded-circle me-2" alt="User avatar">
                    <strong>User</strong>
                </a>
                <ul class="dropdown-menu text-small shadow">
                    <li><a class="dropdown-item" href="#">Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="index.html">Sign out</a></li>
                </ul>
            </div>
        </div>
    </nav>

    </aside>


    <main class="flex-grow-1 p-4">

        <header class="d-flex justify-content-between align-items-center mb-4">
            <h1>Home</h1>
            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#newExperimentModal"
                    aria-haspopup="dialog"> New Experiment
            </button>
        </header>


        <section class="mb-4" aria-label="Quick links">

            <div class="alert alert-info d-flex justify-content-between align-items-center" role="note">
                <div class="d-flex align-items-center gap-3">
                    <svg width="32" height="32" class="opacity-50">
                        <use href="img/sprite.svg#icon-docs"></use>
                    </svg>
                    <div>
                        <strong>Documentation</strong><br>
                        Learn how to use Pipes
                    </div>
                </div>

                <a href="https://mlflow.org/docs/latest/index.html"
                target="_blank"
                class="btn btn-outline-primary btn-sm d-flex align-items-center gap-2"
                aria-label="Open Documentation in a new tab"> 
                    <svg width="16" height="16"><use href="img/sprite.svg#icon-docs"></use></svg>
                    Open Docs
                </a>
            </div>

        </section>


        <section>
            <h2 class="mb-4">Your Experiments</h2>

            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="experimentList" aria-live="polite">
                </div>
        </section>

    </main>

</div>


<div class="modal fade" id="newExperimentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 shadow">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="modalTitle">Create New Experiment</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label for="expName" class="form-label">Experiment Name</label>
                        <input type="text" id="expName" class="form-control" required aria-required="true">
                    </div>
                    <div class="mb-3">
                        <label for="expModel" class="form-label">Model</label>
                        <input type="text" id="expModel" class="form-control" required aria-required="true">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
