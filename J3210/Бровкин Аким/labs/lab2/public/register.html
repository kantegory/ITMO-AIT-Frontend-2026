<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация - EduPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="edu-card p-4">
                        <h3 class="text-center mb-4">Создание аккаунта</h3>
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">Имя и Фамилия</label>
                                <input type="text" id="fullName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" id="password" class="form-control" required>
                            </div>
                            <button type="submit" class="btn-brand w-100" style="background-color: #27ae60;">Зарегистрироваться</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="index.html">Уже есть аккаунт? Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const checkRes = await fetch(`http://localhost:3000/users?email=${email}`);
                const existingUsers = await checkRes.json();

                if (existingUsers.length > 0) {
                    alert('Пользователь с таким email уже существует!');
                    return;
                }

                const newUser = {
                    fullName: fullName,
                    email: email,
                    password: password,
                    myCourses: []
                };

                const response = await fetch('http://localhost:3000/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newUser)
                });

                const createdUser = await response.json();
                localStorage.setItem('user', JSON.stringify(createdUser));
                window.location.href = 'dashboard.html';

            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при регистрации.');
            }
        });
    </script>
</body>
</html>
