<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DataPort – Детали датасета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex dashboard">
    <div class="sidebar">
        <div class="brand mb-4">DataPort</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="my-models.html">My Models</a>
            <a class="nav-link active" href="my-datasets.html">My Datasets</a>
            <a class="nav-link" href="my-subscriptions.html">Subscriptions</a>
            <a class="nav-link" href="settings.html">Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" id="logoutBtn">Выход</a>
        </nav>
    </div>

    <div class="flex-grow-1">
        <div class="topbar px-4 py-3 d-flex align-items-center">
            <a href="my-datasets.html" class="btn btn-light btn-sm me-3">← Назад</a>
            <div class="page-title" id="dsTitle">Загрузка...</div>
        </div>

        <div class="content-area">
            <div class="row">
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-3">Описание данных</h5>
                        <p class="text-muted mb-4" id="dsDescription">-</p>

                        <h6 class="fw-bold mb-2">Структура файлов</h6>
                        <div class="bg-light p-3 rounded-3 font-monospace small border">
                            dataset_root/<br>
                            ├── train/<br>
                            ├── val/<br>
                            └── metadata.json
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">Лицензия и использование</h5>
                        <p class="small text-muted" id="dsLicense">Creative Commons Attribution 4.0 International</p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-4">Характеристики</h5>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Формат</label>
                            <span class="fw-semibold" id="dsFormat">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Размер архива</label>
                            <span class="fw-semibold" id="dsSize">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Количество записей</label>
                            <span class="fw-semibold" id="dsRows">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Дата создания</label>
                            <span class="fw-semibold" id="dsDate">-</span>
                        </div>
                        <div class="mb-4">
                            <label class="small text-muted d-block mb-1">Категория</label>
                            <span class="tag" id="dsTag">-</span>
                        </div>
                        <button class="btn btn-primary w-100 py-2">Скачать архив (.zip)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
