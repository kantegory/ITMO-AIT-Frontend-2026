<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DataPort – Детали модели</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex dashboard">
    <div class="sidebar">
        <div class="brand mb-4">DataPort</div>
        <nav class="nav flex-column">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="explore.html">Explore</a>
            <a class="nav-link active" href="my-models.html">My Models</a>
            <a class="nav-link" href="my-datasets.html">My Datasets</a>
            <a class="nav-link" href="my-subscriptions.html">Subscriptions</a>
            <a class="nav-link" href="settings.html">Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" id="logoutBtn">Выход</a>
        </nav>
    </div>

    <div class="flex-grow-1">
        <div class="topbar px-4 py-3 d-flex align-items-center">
            <a href="my-models.html" class="btn btn-light btn-sm me-3">← Назад</a>
            <div class="page-title" id="modelTitle">Загрузка...</div>
        </div>

        <div class="content-area">
            <div class="row">
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-3">Описание модели</h5>
                        <p class="text-muted mb-4" id="modelDescription">-</p>

                        <h6 class="fw-bold mb-2">Пример подключения (Python)</h6>
                        <div class="bg-dark text-light p-3 rounded-3 font-monospace small">
                            import dataport<br>
                            model = dataport.load_model("<span id="modelSlug">name</span>")<br>
                            print(model.summary())
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-3">История изменений</h5>
                        <div class="d-flex justify-content-between border-bottom py-2">
                            <span class="text-muted">v.1.0.0</span>
                            <span class="text-muted">Первоначальный релиз</span>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-4">Информация</h5>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Автор</label>
                            <span class="fw-semibold" id="modelAuthor">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Фреймворк</label>
                            <span class="fw-semibold" id="modelFramework">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Размер файла</label>
                            <span class="fw-semibold" id="modelSize">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Текущая версия</label>
                            <span class="fw-semibold" id="modelVersion">-</span>
                        </div>
                        <div class="mb-3">
                            <label class="small text-muted d-block">Дата публикации</label>
                            <span class="fw-semibold" id="modelDate">-</span>
                        </div>
                        <div class="mb-4">
                            <label class="small text-muted d-block mb-1">Категория</label>
                            <span class="tag" id="modelTag">-</span>
                        </div>
                        <button class="btn btn-primary w-100 py-2">Скачать веса (.bin)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
