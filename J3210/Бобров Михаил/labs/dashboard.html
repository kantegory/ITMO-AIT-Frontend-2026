<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPort – Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div class="d-flex dashboard">

    <div class="sidebar">
        <div class="brand mb-4">DataPort</div>
        <nav class="nav flex-column">
            <a class="nav-link active" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="my-models.html">My Models</a>
            <a class="nav-link" href="my-datasets.html">My Datasets</a>
            <a class="nav-link" href="my-subscriptions.html">Subscriptions</a>
            <a class="nav-link" href="settings.html">Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" id="logoutBtn">Выход</a>
        </nav>
    </div>

    <div class="flex-grow-1">

        <div class="topbar px-4 py-3 d-flex justify-content-between align-items-center">
            <div class="page-title">Личный кабинет</div>
            <button class="btn btn-primary upload-btn" data-bs-toggle="modal" data-bs-target="#uploadModal">
                Загрузить
            </button>
        </div>

        <div class="content-area">

            <ul class="nav nav-pills mb-4" id="dashboardTabs">
                <li class="nav-item">
                    <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#models">Модели</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#datasets">Датасеты</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" data-bs-toggle="pill" data-bs-target="#subscriptions">Подписки</button>
                </li>
            </ul>

            <div class="tab-content">

                <div class="tab-pane fade show active" id="models">
                    <div class="row g-4" id="dashboard-models-row">
                    </div>
                </div>

                <div class="tab-pane fade" id="datasets">
                    <div class="row g-4" id="dashboard-datasets-row">
                    </div>
                </div>

                <div class="tab-pane fade" id="subscriptions">
                    <div class="row g-4" id="dashboard-subscriptions-row"></div>
                </div>

            </div>

        </div>

    </div>

</div>

<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 border-0 rounded-4 shadow">
            <h5 class="mb-3 fw-bold">Загрузить новый объект</h5>

            <div class="mb-3">
                <label class="form-label small text-muted">Название</label>
                <input class="form-control" placeholder="Например: BERT-Base-Russian">
            </div>

            <div class="mb-3">
                <label class="form-label small text-muted">Тип</label>
                <select class="form-select">
                    <option value="model">Модель</option>
                    <option value="dataset">Датасет</option>
                </select>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-2">
                <button class="btn btn-light px-4" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-primary px-4" id="submitUpload">Загрузить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
