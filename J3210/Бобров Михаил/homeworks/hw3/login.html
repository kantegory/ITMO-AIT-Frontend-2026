<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPort – Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="navbar bg-white border-bottom px-4 py-3">
    <div class="brand">DataPort</div>

    <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-primary btn-sm me-2">Вход</a>
        <a href="register.html" class="btn btn-primary btn-sm">Регистрация</a>
    </div>
</header>

<div class="container auth-wrapper d-flex align-items-center">
    <div class="row w-100">

        <div class="col-md-6 d-flex align-items-center">
            <div class="left-panel">

                <div class="left-title">
                    AI Model & Dataset Hub
                </div>

                <div class="left-text">
                    Платформа для обмена и публикации моделей машинного обучения и датасетов.
                    Загружай, находи, обсуждай и переиспользуй AI-решения.
                </div>

                <div class="left-badges">
                    <div class="badge-soft">Models</div>
                    <div class="badge-soft">Datasets</div>
                    <div class="badge-soft">Reproducibility</div>
                    <div class="badge-soft">Community</div>
                </div>

            </div>
        </div>

        <div class="col-md-6 d-flex justify-content-center">
            <div class="card auth-card glass p-4">

                <h4 class="mb-3 fw-semibold">Вход</h4>

                <form>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control">
                    </div>

                    <div class="d-flex justify-content-between mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox">
                            <label class="form-check-label">Запомнить</label>
                        </div>

                        <a href="#" data-bs-toggle="modal" data-bs-target="#forgotModal">
                            Забыли пароль?
                        </a>
                    </div>

                    <button class="btn btn-primary w-100">Войти</button>
                </form>

            </div>
        </div>

    </div>
</div>

<div class="modal fade" id="forgotModal">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3">

            <h5>Восстановление пароля</h5>
            <input class="form-control mt-2" placeholder="Email">

            <div class="mt-3 d-flex justify-content-end gap-2">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button class="btn btn-primary">Отправить</button>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
