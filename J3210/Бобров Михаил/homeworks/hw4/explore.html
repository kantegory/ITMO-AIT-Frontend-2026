<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPort – Explore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex dashboard">
    <aside class="sidebar">
        <div class="brand mb-4">DataPort</div>
        <nav class="nav flex-column" aria-label="Основная навигация">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link active" href="explore.html" aria-current="page">Explore</a>
            <a class="nav-link" href="my-models.html">My Models</a>
            <a class="nav-link" href="my-datasets.html">My Datasets</a>
            <a class="nav-link" href="my-subscriptions.html">Subscriptions</a>
            <a class="nav-link" href="settings.html">Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" id="logoutBtn"><svg class="icon" aria-hidden="true"><use href="sprite.svg#logout"></use></svg>Выход</a>
        </nav>
    </aside>

    <main class="flex-grow-1">
        <div class="topbar px-4 py-3 d-flex justify-content-between align-items-center">
            <h1 class="page-title mb-0">Исследовать ресурсы</h1>
            <div class="search-box" style="width: 300px;">
                <svg class="icon" aria-hidden="true"><use href="sprite.svg#search"></use></svg>
                <label class="visually-hidden" for="globalSearch">Поиск по названию</label>
                <input type="search" class="form-control" id="globalSearch" placeholder="Поиск по названию..." autocomplete="off">
            </div>
        </div>

        <div class="content-area">
            <div class="row">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h6 class="fw-bold mb-3">Фильтры</h6>

                        <div class="mb-3">
                            <label class="small text-muted mb-2" for="filterTag">Задача (Тег)</label>
                            <select class="form-select form-select-sm filter-input" id="filterTag">
                                <option value="">Все задачи</option>
                                <option value="LLM">LLM</option>
                                <option value="CV">Vision</option>
                                <option value="NLP">NLP</option>
                                <option value="GenAI">GenAI</option>
                                <option value="Audio">Audio</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted mb-2" for="filterFramework">Фреймворк</label>
                            <select class="form-select form-select-sm filter-input" id="filterFramework">
                                <option value="">Все</option>
                                <option value="PyTorch">PyTorch</option>
                                <option value="Transformers">Transformers</option>
                                <option value="GGUF">GGUF</option>
                                <option value="Diffusers">Diffusers</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="small text-muted mb-2" for="filterLicense">Лицензия</label>
                            <select class="form-select form-select-sm filter-input" id="filterLicense">
                                <option value="">Любая</option>
                                <option value="MIT">MIT</option>
                                <option value="Apache 2.0">Apache 2.0</option>
                                <option value="OpenRail">OpenRail</option>
                            </select>
                        </div>

                        <button class="btn btn-light btn-sm w-100" id="resetFilters" type="button">Сбросить</button>
                    </div>
                </div>

                <div class="col-md-9">
                    <ul class="nav nav-pills mb-4" id="exploreTabs" role="tablist" aria-label="Типы ресурсов">
                        <li class="nav-item">
                            <button class="nav-link active" id="exploreModels-tab" type="button" role="tab" data-bs-toggle="pill" data-bs-target="#exploreModels" aria-controls="exploreModels" aria-selected="true">Модели</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="exploreDatasets-tab" type="button" role="tab" data-bs-toggle="pill" data-bs-target="#exploreDatasets" aria-controls="exploreDatasets" aria-selected="false">Датасеты</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="exploreModels" role="tabpanel" aria-labelledby="exploreModels-tab" tabindex="0">
                            <div class="row g-4" id="explore-models-row" aria-live="polite"></div>
                        </div>
                        <div class="tab-pane fade" id="exploreDatasets" role="tabpanel" aria-labelledby="exploreDatasets-tab" tabindex="0">
                            <div class="row g-4" id="explore-datasets-row" aria-live="polite"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
