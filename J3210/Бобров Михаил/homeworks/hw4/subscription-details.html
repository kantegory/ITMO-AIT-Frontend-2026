<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPort – Сообщество</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex dashboard">
    <aside class="sidebar">
        <div class="brand mb-4">DataPort</div>
        <nav class="nav flex-column" aria-label="Основная навигация">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="explore.html">Explore</a>
            <a class="nav-link" href="my-models.html">My Models</a>
            <a class="nav-link" href="my-datasets.html">My Datasets</a>
            <a class="nav-link active" href="my-subscriptions.html" aria-current="page">Subscriptions</a>
            <a class="nav-link" href="settings.html">Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" id="logoutBtn"><svg class="icon" aria-hidden="true"><use href="sprite.svg#logout"></use></svg>Выход</a>
        </nav>
    </aside>

    <main class="flex-grow-1">
        <div class="topbar px-4 py-3 d-flex align-items-center">
            <a href="my-subscriptions.html" class="btn btn-light btn-sm me-3"><svg class="icon" aria-hidden="true"><use href="sprite.svg#back"></use></svg>Назад</a>
            <h1 class="page-title mb-0" id="subTitle">Загрузка...</h1>
        </div>

        <div class="content-area">
            <div class="row">
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-3">О сообществе</h5>
                        <p class="text-muted mb-0" id="subDescription">-</p>
                    </div>

                    <h5 class="fw-bold mb-3">Последние релизы</h5>
                    <div id="subReleasesList">
                        <div class="card border-0 shadow-sm rounded-4 p-3 mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="fw-bold mb-1">New Russian LLM v2</h6>
                                    <div class="text-muted small">Опубликовано 2 дня назад • Модель</div>
                                </div>
                                <button class="btn btn-outline-primary btn-sm" type="button">Посмотреть</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 text-center">
                        <div class="mb-3">
                            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 80px; height: 80px; font-size: 2rem;">
                                <span id="subInitials">??</span>
                            </div>
                        </div>
                        <h5 class="fw-bold mb-1" id="subNameDisplay">-</h5>
                        <p class="text-muted small mb-3" id="subTypeDisplay">-</p>

                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <div class="p-2 bg-light rounded-3">
                                    <div class="small text-muted">Участники</div>
                                    <div class="fw-bold" id="subMembers">-</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="p-2 bg-light rounded-3">
                                    <div class="small text-muted">Релизы</div>
                                    <div class="fw-bold" id="subReleases">-</div>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-danger w-100 py-2 mb-2" type="button" onclick="deleteSubscriptionFromDetails()">Отписаться</button>
                        <button class="btn btn-light w-100 py-2" type="button">Поделиться</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
