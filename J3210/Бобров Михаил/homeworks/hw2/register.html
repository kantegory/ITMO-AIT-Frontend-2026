<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPort – Регистрация</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="navbar bg-white border-bottom px-4 py-3">
    <div class="brand">DataPort</div>

    <nav class="ms-auto" aria-label="Навигация авторизации">
        <a href="login.html" class="btn btn-outline-primary btn-sm me-2">Вход</a>
        <a href="register.html" class="btn btn-primary btn-sm" aria-current="page">Регистрация</a>
    </nav>
</header>

<main class="container auth-wrapper d-flex align-items-center">
    <div class="row w-100">

        <div class="col-md-6 d-flex align-items-center">
            <div class="left-panel">

                <div class="left-title">
                    AI Model & Dataset Hub
                </div>

                <div class="left-text">
                    Платформа для обмена и публикации моделей машинного обучения и датасетов.
                    Загружай, находи, обсуждай и переиспользуй AI-решения.
                </div>

                <div class="left-badges">
                    <div class="badge-soft">Models</div>
                    <div class="badge-soft">Datasets</div>
                    <div class="badge-soft">Reproducibility</div>
                    <div class="badge-soft">Community</div>
                </div>

            </div>
        </div>

        <div class="col-md-6 d-flex justify-content-center">
            <div class="card auth-card glass p-4">

                <form aria-labelledby="registerTitle">
                    <h4 class="mb-3 fw-semibold" id="registerTitle">Регистрация</h4>

                    <div class="mb-3">
                        <label class="form-label" for="registerName">Имя</label>
                        <input type="text" class="form-control" id="registerName" autocomplete="name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="registerEmail">Email</label>
                        <input type="email" class="form-control" id="registerEmail" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="registerPassword">Пароль</label>
                        <input type="password" class="form-control" id="registerPassword" autocomplete="new-password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="registerPasswordRepeat">Повтор пароля</label>
                        <input type="password" class="form-control" id="registerPasswordRepeat" autocomplete="new-password" required>
                    </div>

                    <button class="btn btn-success w-100" type="submit">Создать аккаунт</button>
                </form>

            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>

</body>
</html>
