<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPort – Настройки</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="d-flex dashboard">
    <aside class="sidebar">
        <div class="brand mb-4">DataPort</div>
        <nav class="nav flex-column" aria-label="Основная навигация">
            <a class="nav-link" href="dashboard.html">Dashboard</a>
            <a class="nav-link" href="explore.html">Explore</a>
            <a class="nav-link" href="my-models.html">My Models</a>
            <a class="nav-link" href="my-datasets.html">My Datasets</a>
            <a class="nav-link" href="my-subscriptions.html">Subscriptions</a>
            <a class="nav-link active" href="settings.html" aria-current="page">Settings</a>
            <hr>
            <a class="nav-link text-danger" href="#" id="logoutBtn">Выход</a>
        </nav>
    </aside>

    <main class="flex-grow-1">
        <div class="topbar px-4 py-3 d-flex justify-content-between align-items-center">
            <h1 class="page-title mb-0">Настройки</h1>
            <button class="btn btn-primary px-4" type="button" id="saveSettingsBtn">Сохранить</button>
        </div>

        <div class="content-area">
            <div class="row">
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
                        <h5 class="fw-bold mb-4">Профиль пользователя</h5>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="userNameInput">Имя пользователя</label>
                            <input type="text" class="form-control" id="userNameInput" placeholder="Введите имя">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="userEmailInput">Email</label>
                            <input type="email" class="form-control" id="userEmailInput" placeholder="user@example.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="userBioInput">О себе</label>
                            <textarea class="form-control" id="userBioInput" rows="3"></textarea>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 p-4">
                        <h5 class="fw-bold mb-4">Уведомления</h5>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="notifyEmail" checked>
                            <label class="form-check-label" for="notifyEmail">Уведомления по Email</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="notifyUpdates" checked>
                            <label class="form-check-label" for="notifyUpdates">Обновления подписок</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="notifyNews">
                            <label class="form-check-label" for="notifyNews">Новости платформы</label>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 text-center">
                        <div class="mb-3 position-relative d-inline-block">
                            <img src="https://via.placeholder.com/100" class="rounded-circle border" alt="Аватар пользователя" id="userAvatar" style="width: 100px; height: 100px; object-fit: cover;">
                        </div>

                        <button class="btn btn-outline-primary btn-sm w-100 mb-2" type="button" onclick="document.getElementById('avatarInput').click()">
                            Сменить фото
                        </button>

                        <label class="visually-hidden" for="avatarInput">Выбрать новое фото профиля</label>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">

                        <button class="btn btn-outline-secondary btn-sm w-100" type="button">Изменить пароль</button>
                    </div>

                    <div class="card border-0 shadow-sm rounded-4 p-4 bg-light">
                        <h6 class="fw-bold text-danger mb-3">Опасная зона</h6>
                        <p class="small text-muted">Удаление аккаунта приведет к потере всех ваших моделей и датасетов.</p>
                        <button class="btn btn-danger btn-sm w-100" type="button" onclick="deleteAccount()">Удалить аккаунт</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
