<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Личный кабинет | MLShare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark.css" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="css/light.css" media="(prefers-color-scheme: light)">
    <script src="js/theme.js"></script>
</head>
<body>
    <header class="navbar navbar-expand-md">
        <div class="container-fluid">
            
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Открыть боковое меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand d-none d-md-inline" href="index.html">
                <h2 class="fw-bolder"> MLShare </h2>
            </a>
            
            <div class="dropdown ms-auto">
                <button class="btn p-0 border-0 bg-transparent d-flex align-items-center text-contrast text-decoration-none dropdown-toggle" id="userMenuToggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Открыть меню пользователя">
                    <img src="https://www.placekittens.com/32/32" alt="Аватар пользователя" width="32" height="32" class="rounded-circle me-2">
                    <span>Гость</span>
                </button>
                
                <ul class="dropdown-menu dropdown-menu-dark shadow" id="userMenuDropdown">
                    <li><a class="dropdown-item" href="index.html">Личный кабинет</a></li>
                    <li><a class="dropdown-item" href="#">Настройки</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item" type="button" data-theme-option="light">Светлая</button></li>
                    <li><button class="dropdown-item" type="button" data-theme-option="dark">Темная</button></li>
                    <li><button class="dropdown-item" type="button" data-theme-option="auto">Автоматически</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="login.html">Выйти</a></li>
                </ul>
            </div>
            
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">

            <aside class="col-md-3 col-lg-2 p-0 border-end" id="sidebarMenuWrapper">
                <div class="offcanvas-md offcanvas-start" id="sidebarMenu" tabindex="-1" aria-labelledby="sidebarMenuLabel">
                    
                    <div class="offcanvas-header">
                        <h4 class="offcanvas-title" id="sidebarMenuLabel">
                            <a class="navbar-brand" href="index.html">MLShare</a>
                        </h4>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Закрыть боковое меню"></button>
                    </div>

                    <nav class="offcanvas-body p-0 sidebar-menu-scroll-area">
                        <ul class="nav flex-column w-100 nav-pills">
                            <li class="nav-item">
                                <a class="nav-link fw-bold text-bg-secondary" href="index.html">
                                    <i class="bi bi-person-badge me-2"></i> Мой профиль
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-contrast" href="subscriptions.html">
                                    <i class="bi bi-bell me-2"></i> Подписки
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-contrast" href="hub.html">
                                    <i class="bi bi-search me-2"></i> Хаб
                                </a>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link text-contrast w-100 text-start border-0 bg-transparent" type="button" disabled aria-disabled="true">
                                    <i class="bi bi-cloud-upload me-2"></i> Загрузить
                                </button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10" id="profileMain">
                <section class="profile-header mb-5" id="profileHeader">
                    <div class="d-flex align-items-center">
                        <img src="https://www.placekittens.com/80/80" alt="Avatar" class="rounded-circle me-4" id="profileAvatar">
                        <div>
                            <h1 class="display-6 fw-bold" id="profileName">Гость</h1>

                            <div class="d-flex gap-3 small text-contrast">
                                <span><strong id="profileModelsCount">1</strong> Моделей</span>
                                <span><strong id="profileDatasetsCount">0</strong> Датасетов</span>
                                <a href="subscriptions.html" class="link-primary link-underline-opacity-0 link-underline-opacity-100-hover text-reset" id="profileSubscriptionsLink">
                                    <strong id="profileSubscriptionsCount">4</strong> Подписок
                                </a>

                                <span><strong id="profileRatingCount">42</strong> 
                                    <i class="bi bi-star-fill"></i>
                                </span>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    
                    <ul class="nav nav-tabs mb-4" id="profileTabs">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active text-reset" id="models-tab" data-bs-toggle="tab" data-bs-target="#models" type="button" role="tab">
                                Мои Модели
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link text-reset" id="datasets-tab" data-bs-toggle="tab" data-bs-target="#datasets" type="button" role="tab">
                                Мои Датасеты
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content bg-transparent" id="profileTabsContent">
                        <div class="tab-pane fade active show" id="models">
                            <div class="row g-4" id="profileModelsGrid"></div>
                            <div class="text-center py-5 d-none" id="profileModelsEmptyState">
                                <i class="bi bi-cpu display-1 text-blunted opacity-25"></i>
                                <p class="text-blunted mt-3">Вы пока не загрузили ни одной модели.</p>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="datasets" role="tabpanel">
                            <div class="row g-4" id="profileDatasetsGrid"></div>
                            <div class="text-center py-5 d-none" id="profileDatasetsEmptyState">
                                <i class="bi bi-database display-1 text-blunted opacity-25"></i>
                                <p class="text-blunted mt-3">Вы пока не загрузили ни одного датасета.</p>
                                <button class="btn bg-primary text-white mt-1" id="uploadDatasetButton" type="button">Загрузить датасет</button>
                            </div>
                        </div>

                    </div>
                </section>

            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
