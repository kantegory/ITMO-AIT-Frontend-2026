<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Хаб моделей и датасетов | MLShare</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark.css" media="(prefers-color-scheme: dark)">
    <script src="js/theme.js"></script>
</head>
<body>
    <header class="navbar navbar-expand-md">
        <div class="container-fluid">
            
            <button class="navbar-toggler d-md-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Открыть боковое меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <a class="navbar-brand d-none d-md-inline" href="index.html">
                <h2 class="fw-bolder"> MLShare </h2>
            </a>
            
            <div class="dropdown ms-auto">
                <button class="btn p-0 border-0 bg-transparent d-flex align-items-center text-contrast text-decoration-none dropdown-toggle" id="userMenuToggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Открыть меню пользователя">
                    <img src="https://www.placekittens.com/32/32" alt="Аватар пользователя" width="32" height="32" class="rounded-circle me-2">
                    <span>Гость</span>
                </button>
                
                <ul class="dropdown-menu dropdown-menu-dark shadow" id="userMenuDropdown">
                    <li><a class="dropdown-item" href="index.html">Личный кабинет</a></li>
                    <li><a class="dropdown-item" href="#">Настройки</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><button class="dropdown-item" type="button" data-theme-option="light">Светлая</button></li>
                    <li><button class="dropdown-item" type="button" data-theme-option="dark">Темная</button></li>
                    <li><button class="dropdown-item" type="button" data-theme-option="auto">Автоматически</button></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item" href="login.html">Выйти</a></li>
                </ul>
            </div>
            
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <aside class="col-md-3 col-lg-2 p-0 border-end" id="sidebarMenuWrapper">
                <div class="offcanvas-md offcanvas-start" id="sidebarMenu" tabindex="-1" aria-labelledby="sidebarMenuLabel">
                    
                    <div class="offcanvas-header">
                        <h4 class="offcanvas-title" id="sidebarMenuLabel">
                            <a class="navbar-brand" href="index.html">MLShare</a>
                        </h4>
                        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarMenu" aria-label="Закрыть боковое меню"></button>
                    </div>

                    <nav class="offcanvas-body p-0 sidebar-menu-scroll-area">
                        <ul class="nav flex-column w-100 nav-pills">
                            <li class="nav-item">
                                <a class="nav-link text-contrast" href="index.html">
                                    <i class="bi bi-person-badge me-2"></i> Мой профиль
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link text-contrast" href="subscriptions.html">
                                    <i class="bi bi-bell me-2"></i> Подписки
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link fw-bold text-bg-secondary" href="hub.html">
                                    <i class="bi bi-search me-2"></i> Хаб
                                </a>
                            </li>
                            <li class="nav-item">
                                <button class="nav-link text-contrast" aria-label="Загрузить">
                                    <i class="bi bi-cloud-upload me-2"></i> Загрузить
                                </button>
                            </li>
                        </ul>
                    </nav>
                </div>
            </aside>

            <main class="col-md-9 col-lg-10 px-md-4">
                <section class="mb-4">
                    <h1 class="display-5 fw-bold mb-2">Модели и Датасеты</h1>
                    <p class="text-blunted fs-5">
                        Исследуйте, скачивайте и делитесь тысячами AI-моделей и датасетов для машинного обучения
                    </p>
                </section>

                <section class="mb-3">
                    <form id="hubSearchForm">
                    <label class="visually-hidden" for="searchInput">Поиск моделей и датасетов</label>
                    <div class="input-group input-group-lg rounded" id="hubSearchBar">
                        <span class="input-group-text border-end-0 text-blunted">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" id="searchInput" name="searchQuery" placeholder="Поиск по названию, задаче или фреймворку..." autocomplete="off">
                        <button class="btn bg-primary text-white px-4" id="searchButton" type="submit">Найти</button>
                    </div>
                    </form>
                </section>

                <section class="d-flex align-items-center gap-2 mb-4 overflow-x-auto pb-2 flex-nowrap" id="activeFiltersBar">
                    
                    <button class="btn btn-outline-dark rounded-pill flex-shrink-0" id="openFiltersButton" type="button" data-bs-toggle="modal" data-bs-target="#filtersModal">
                        <i class="bi bi-sliders me-1"></i> Все фильтры
                    </button>

                    <div class="vr"></div>

                    <div class="d-flex align-items-center gap-2 flex-nowrap" id="activeFilterChips"></div>
                </section>

                <section id="searchResultsSection">
                    <h2 class="mb-3 fs-5 fw-normal text-blunted" id="searchResultsCount"></h2>
                    
                    <div class="row g-4" id="resultsGrid"></div>
                </section>

            </main>
        </div>
    </div>

<div class="modal fade" id="filtersModal">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="filtersModalLabel"><i class="bi bi-sliders me-2"></i> Расширенный поиск</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть фильтры"></button>
            </div>
            
            <div class="modal-body">
                <form id="filtersForm">
                <ul class="nav nav-tabs mb-4" id="filtersTab">
                    <li class="nav-item">
                        <button class="nav-link active text-contrast" id="filter-models-tab" data-bs-toggle="tab" data-bs-target="#filter-models" type="button">
                            Модели
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link text-contrast" id="filter-datasets-tab" data-bs-toggle="tab" data-bs-target="#filter-datasets" type="button">
                            Датасеты
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="filtersTabContent">

                    <div class="tab-pane fade show active" id="filter-models" role="tabpanel">
                        <label class="form-label fw-bold mb-2" for="modelTaskSelect">Задача (Task)</label>
                        <select class="form-select mb-4" id="modelTaskSelect" name="modelTask">
                            <option value="" selected>Любая задача</option>
                            <option value="cv">Computer Vision</option>
                            <option value="nlp">Natural Language Processing</option>
                            <option value="audio">Audio Classification</option>
                            <option value="rl">Reinforcement Learning</option>
                        </select>


                        <h6 class="fw-bold mb-2">Фреймворк</h6>
                        <div class="mb-4" id="modelFrameworkGroup">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="fwPyTorch" name="modelFramework" value="pytorch">
                                <label class="form-check-label" for="fwPyTorch">PyTorch</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="fwTensorFlow" name="modelFramework" value="tensorflow">
                                <label class="form-check-label" for="fwTensorFlow">TensorFlow</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="fwJax" name="modelFramework" value="jax">
                                <label class="form-check-label" for="fwJax">JAX</label>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-2">Лицензия</h6>
                        <div class="mb-2" id="modelLicenseGroup">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="licMitModel" name="modelLicense" value="mit">
                                <label class="form-check-label" for="licMitModel">MIT</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="licApacheModel" name="modelLicense" value="apache-2.0">
                                <label class="form-check-label" for="licApacheModel">Apache 2.0</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="licGplModel" name="modelLicense" value="gpl-3.0">
                                <label class="form-check-label" for="licGplModel">GPL</label>
                            </div>
                        </div>
                    </div>

                    <div class="tab-pane fade" id="filter-datasets" role="tabpanel">
                        
                        <label class="form-label fw-bold mb-2" for="datasetTaskSelect">Применимость (Task)</label>
                        <select class="form-select mb-4" id="datasetTaskSelect" name="datasetTask">
                            <option value="" selected>Любая задача</option>
                            <option value="img_clf">Классификация изображений</option>
                            <option value="obj_det">Детекция объектов</option>
                            <option value="text_gen">Генерация текста</option>
                            <option value="translation">Машинный перевод</option>
                        </select>

                        <h6 class="fw-bold mb-2">Тип данных</h6>
                        <div class="mb-4" id="datasetModalityGroup">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="modImages" name="datasetModality" value="images">
                                <label class="form-check-label" for="modImages">Изображения</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="modText" name="datasetModality" value="text">
                                <label class="form-check-label" for="modText">Текст</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="modTabular" name="datasetModality" value="tabular">
                                <label class="form-check-label" for="modTabular">Таблицы (CSV/Excel)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="modAudio" name="datasetModality" value="audio-video">
                                <label class="form-check-label" for="modAudio">Аудио / Видео</label>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-2">Лицензия</h6>
                        <div class="mb-2" id="datasetLicenseGroup">
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="licCc0" name="datasetLicense" value="cc0">
                                <label class="form-check-label" for="licCc0">CC0 (Public Domain)</label>
                            </div>
                            <div class="form-check mb-1">
                                <input class="form-check-input" type="checkbox" id="licCcBy" name="datasetLicense" value="cc-by-4.0">
                                <label class="form-check-label" for="licCcBy">CC BY 4.0</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="licCustom" name="datasetLicense" value="custom">
                                <label class="form-check-label" for="licCustom">Коммерческая (Custom)</label>
                            </div>
                        </div>
                    </div>
                </div>
                </form>
            </div>
            
            <div class="modal-footer border-top">
                <button type="reset" class="btn btn-outline-secondary" id="resetFilters" form="filtersForm" data-bs-dismiss="modal">Сбросить</button>
                <button type="button" class="btn bg-primary text-white" id="applyFilters" data-action="apply-filters" data-bs-dismiss="modal">Применить фильтры</button>
            </div>
        </div>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/hub.js"></script>
</body>
</html>
