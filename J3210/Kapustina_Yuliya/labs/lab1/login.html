<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Вход</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/api.js"></script>
    
    <style>
        body {
            height: 100vh;
            background: linear-gradient(120deg, #ffb69e, #f8b8a4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 420px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-main {
            background: #ff7043;
            color: white;
        }

        .btn-main:hover {
            background: #f4511e;
        }

        .btn-outline-main {
            border: 1px solid #ff7043;
            color: #ff7043;
            background: transparent;
        }

        .btn-outline-main:hover {
            background: #ff7043;
            color: white;
        }
        
        .error-message {
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>

</head>

<body>

    <section class="card login-card">

        <div class="card-body p-4">

            <h3 class="text-center mb-4">Вход</h3>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label">Имя пользователя или Email</label>
                    <input type="text" class="form-control" id="username" placeholder="Введите имя пользователя или email">
                    <div class="invalid-feedback" id="usernameError"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" placeholder="Введите пароль">
                    <div class="invalid-feedback" id="passwordError"></div>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label">Запомнить меня</label>
                </div>

                <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
                <div id="successMessage" class="alert alert-success" style="display: none;"></div>

                <button type="submit" class="btn btn-main w-100 mb-3">
                    Войти
                </button>

            </form>

            <div class="text-center mb-3">
                <a href="#" class="text-decoration-none">
                    Забыли пароль?
                </a>
            </div>

            <hr>

            <div class="text-center">
                <p>Нет аккаунта?</p>
                <a href="register.html" class="btn btn-outline-main w-100">
                    Регистрация
                </a>
            </div>
        </div>

    </section>

    <script>
        const API_URL = 'http://localhost:3000/api';
        
        // Функция валидации
        function validateForm(username, password) {
            let isValid = true;
            
            if (!username) {
                document.getElementById('username').classList.add('is-invalid');
                document.getElementById('usernameError').textContent = 'Введите имя пользователя или email';
                isValid = false;
            } else {
                document.getElementById('username').classList.remove('is-invalid');
                document.getElementById('usernameError').textContent = '';
            }
            
            if (!password) {
                document.getElementById('password').classList.add('is-invalid');
                document.getElementById('passwordError').textContent = 'Введите пароль';
                isValid = false;
            } else {
                document.getElementById('password').classList.remove('is-invalid');
                document.getElementById('passwordError').textContent = '';
            }
            
            return isValid;
        }
        
        // Обработчик отправки формы
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            if (!validateForm(username, password)) {
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (rememberMe) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                    } else {
                        sessionStorage.setItem('token', data.token);
                        sessionStorage.setItem('user', JSON.stringify(data.user));
                    }
                    
                    document.getElementById('successMessage').textContent = 'Вход выполнен! Перенаправление...';
                    document.getElementById('successMessage').style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    document.getElementById('errorMessage').textContent = data.error || 'Ошибка входа';
                    document.getElementById('errorMessage').style.display = 'block';
                    
                    document.getElementById('password').value = '';
                }
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('errorMessage').textContent = 'Ошибка подключения к серверу. Убедитесь, что сервер запущен.';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
        
        // Убираем валидацию при вводе
        document.getElementById('username').addEventListener('input', () => {
            document.getElementById('username').classList.remove('is-invalid');
            document.getElementById('usernameError').textContent = '';
        });
        
        document.getElementById('password').addEventListener('input', () => {
            document.getElementById('password').classList.remove('is-invalid');
            document.getElementById('passwordError').textContent = '';
        });
        
        // Если пользователь уже авторизован, перенаправляем на главную
        const token = localStorage.getItem('token') || sessionStorage.getItem('token');
        if (token) {
            window.location.href = 'index.html';
        }
    </script>

</body>

</html>
