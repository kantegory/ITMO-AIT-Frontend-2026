<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinFlow — Регистрация</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body data-page="register">
    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>
    <header class="site-header">
      <nav class="navbar navbar-expand-lg" aria-label="Основная навигация">
        <div class="container">
          <a class="navbar-brand brand-mark" href="./index.html">FinFlow</a>
          <button
            class="navbar-toggler border-0 shadow-none"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNav"
            aria-controls="mainNav"
            aria-expanded="false"
            aria-label="Переключить навигацию"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto gap-lg-2">
              <li class="nav-item"><a class="nav-link" href="./index.html">Главная</a></li>
              <li class="nav-item"><a class="nav-link" href="./dashboard.html">Кабинет</a></li>
              <li class="nav-item"><a class="nav-link" href="./reports.html">Отчёты</a></li>
              <li class="nav-item"><a class="nav-link" href="./integrations.html">Интеграции</a></li>
            </ul>
            <div class="d-flex gap-2 flex-wrap" data-navbar-auth>
              <a class="btn btn-outline-dark btn-sm px-3" href="./login.html">Войти</a>
              <a class="btn btn-accent btn-sm px-3" href="./register.html">Регистрация</a>
            </div>
          </div>
        </div>
      </nav>
    </header>

    <main class="auth-page" id="main-content" tabindex="-1">
      <div class="container">
        <div class="auth-shell auth-shell--single">
          <div class="auth-panel">
            <span class="section-label">Регистрация</span>
            <h1 class="section-title mt-3">Создать аккаунт</h1>
            <form class="row g-3 mt-1" data-register-form>
              <div class="col-md-6">
                <label class="form-label" for="firstName">Имя</label>
                <input class="form-control form-control-lg" id="firstName" type="text" placeholder="Матвей" autocomplete="given-name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="lastName">Фамилия</label>
                <input class="form-control form-control-lg" id="lastName" type="text" placeholder="Муртазалиев" autocomplete="family-name" required />
              </div>
              <div class="col-12">
                <label class="form-label" for="registerEmail">Email</label>
                <input class="form-control form-control-lg" id="registerEmail" type="email" placeholder="you@example.com" autocomplete="email" inputmode="email" required />
              </div>
              <div class="col-12">
                <label class="form-label" for="registerPassword">Пароль</label>
                <input
                  class="form-control form-control-lg"
                  id="registerPassword"
                  type="password"
                  placeholder="Не менее 8 символов"
                  autocomplete="new-password"
                  aria-describedby="register-password-hint password-strength-text"
                  data-strength-input
                  required
                />
                <small class="text-secondary d-block mt-2" id="register-password-hint">Для демо достаточно пароля длиной от 8 символов.</small>
                <div class="password-strength mt-3">
                  <div class="password-strength__bar"><span data-strength-bar role="progressbar" aria-label="Надежность пароля" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></span></div>
                  <small class="text-secondary" id="password-strength-text" data-strength-text aria-live="polite">Укажите пароль</small>
                </div>
              </div>
              <div class="col-12">
                <fieldset class="border-0 p-0 m-0">
                  <legend class="form-label mb-2">Тариф</legend>
                  <div class="row g-3">
                  <div class="col-md-6">
                    <label class="plan-card">
                      <input type="radio" name="plan" value="Starter" checked />
                      <span class="plan-card__title">Starter</span>
                      <span class="plan-card__price">Бесплатно</span>
                      <span class="plan-card__copy">1 банк, ручное ведение бюджета</span>
                    </label>
                  </div>
                  <div class="col-md-6">
                    <label class="plan-card">
                      <input type="radio" name="plan" value="Pro" />
                      <span class="plan-card__title">Pro</span>
                      <span class="plan-card__price">₽ 399 / месяц</span>
                      <span class="plan-card__copy">Прогнозы, отчёты и автоправила</span>
                    </label>
                  </div>
                  </div>
                </fieldset>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="agreeTerms" checked required />
                  <label class="form-check-label" for="agreeTerms">
                    Я согласен с условиями обработки данных и пользовательским соглашением
                  </label>
                </div>
              </div>
              <div class="col-12">
                <button class="btn btn-accent btn-lg w-100" type="submit">Зарегистрироваться</button>
              </div>
              <div class="col-12">
                <div class="alert d-none mb-0" data-form-message role="alert" aria-live="assertive"></div>
              </div>
              <div class="col-12">
                <div class="alert alert-light border mb-0">
                  Уже зарегистрированы?
                  <a class="fw-semibold link-dark text-decoration-none" href="./login.html">Перейти ко входу</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="./assets/js/main.js"></script>
  </body>
</html>
