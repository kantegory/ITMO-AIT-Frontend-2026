<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Кабинет - AInator</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="light.css"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="stylesheet"
            href="dark.css"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="catalog.html">AInator</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#nav"
                        aria-label="Открыть меню"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="nav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="catalog.html"
                                    >Каталог</a
                                >
                            </li>
                            <li class="nav-item auth" hidden>
                                <a class="nav-link active" href="dashboard.html">
                                    <svg class="icon" aria-hidden="true">
                                        <use href="sprites.svg#user" />
                                    </svg>
                                    Аккаунт
                                </a>
                            </li>
                            <li class="nav-item ms-lg-2 auth" hidden>
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="#"
                                    id="logout"
                                    >Выйти</a
                                >
                            </li>
                            <li class="nav-item notauth" hidden>
                                <a class="nav-link" href="login.html">Вход</a>
                            </li>
                            <li class="nav-item ms-lg-2 notauth" hidden>
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="register.html"
                                    >Регистрация</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-5">
            <section class="row g-4 mb-5">
                <div class="col-md-4">
                    <div class="card p-4 text-center">
                        <h4 class="fw-bold mb-1" id="userName"></h4>
                        <p class="text-muted small">ML-инженер</p>
                    </div>
                </div>
                <div class="col-md-8">
                    <ul class="row g-3 list-unstyled mb-0">
                        <li class="col-4">
                            <div class="card p-3 text-center">
                                <span class="stat-value">3</span>
                                <small class="text-muted">Загрузки</small>
                            </div>
                        </li>
                        <li class="col-4">
                            <div class="card p-3 text-center">
                                <span class="stat-value">5</span>
                                <small class="text-muted">Подписки</small>
                            </div>
                        </li>
                        <li class="col-4">
                            <div class="card p-3 text-center">
                                <span class="stat-value">15</span>
                                <small class="text-muted">Звёзды</small>
                            </div>
                        </li>
                    </ul>
                </div>
            </section>

            <section>
                <div class="d-flex align-items-center mb-3">
                    <h2 class="h5 fw-bold mb-0 me-auto">
                        Мои модели и датасеты
                    </h2>
                    <button
                        id="toggleCreate"
                        class="btn btn-accent btn-sm"
                        type="button"
                    >
                        + Добавить
                    </button>
                </div>

                <form
                    id="createForm"
                    class="card p-4 mb-4"
                    onsubmit="createItem(event)"
                    hidden
                >
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="new-type">Тип</label>
                            <select
                                class="form-select"
                                id="new-type"
                                name="type"
                                required
                            >
                                <option value="model">Модель</option>
                                <option value="dataset">Датасет</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label" for="new-name"
                                >Название</label
                            >
                            <input
                                class="form-control"
                                id="new-name"
                                name="name"
                                type="text"
                                required
                            />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="new-framework"
                                >Фреймворк</label
                            >
                            <select
                                class="form-select"
                                id="new-framework"
                                name="framework"
                            >
                                <option value="">—</option>
                                <option value="PyTorch">PyTorch</option>
                                <option value="TensorFlow">TensorFlow</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="new-license"
                                >Лицензия</label
                            >
                            <select
                                class="form-select"
                                id="new-license"
                                name="license"
                                required
                            >
                                <option value="MIT">MIT</option>
                                <option value="Apache-2.0">Apache-2.0</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="new-task"
                                >Задача</label
                            >
                            <select
                                class="form-select"
                                id="new-task"
                                name="task"
                                required
                            >
                                <option value="CV">Computer Vision</option>
                                <option value="NLP">NLP</option>
                            </select>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button class="btn btn-accent" type="submit">
                                Создать
                            </button>
                            <button
                                id="cancelCreate"
                                class="btn btn-alt"
                                type="button"
                            >
                                Отмена
                            </button>
                        </div>
                    </div>
                </form>

                <ul id="myItems" class="row g-4 list-unstyled mb-0"></ul>
                <p id="myItemsEmpty" class="text-muted" hidden>
                    Пока ничего нет.
                </p>
            </section>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="auth.js"></script>
        <script>
            if (!localStorage.accessToken) {
                location.href = "login.html";
            }
            const user = JSON.parse(localStorage.user || "{}");
            document.getElementById("userName").textContent =
                (user.firstName || "") + " " + (user.lastName || "");

            const list = document.getElementById("myItems");
            const empty = document.getElementById("myItemsEmpty");

            function cardHTML(i) {
                const meta = [i.framework, i.license]
                    .filter(Boolean)
                    .join(", ");
                const badge =
                    i.type === "model"
                        ? '<span class="badge bg-primary mb-2"><svg class="icon" aria-hidden="true"><use href="sprites.svg#model"/></svg> Model</span>'
                        : '<span class="badge bg-success mb-2"><svg class="icon" aria-hidden="true"><use href="sprites.svg#dataset"/></svg> Dataset</span>';
                return `
                    <li class="col-md-4">
                        <article class="card p-4">
                            ${badge}
                            <h3 class="h6 fw-bold">${i.name}</h3>
                            <p class="text-muted small mb-2">${meta}</p>
                            <a href="details.html" class="small">Открыть</a>
                        </article>
                    </li>`;
            }

            fetch("http://localhost:3000/items?userId=" + user.id)
                .then((r) => r.json())
                .then((items) => {
                    if (!items.length) {
                        empty.hidden = false;
                        return;
                    }
                    list.innerHTML = items.map(cardHTML).join("");
                });

            const form = document.getElementById("createForm");
            document
                .getElementById("toggleCreate")
                .addEventListener("click", () => (form.hidden = !form.hidden));
            document
                .getElementById("cancelCreate")
                .addEventListener("click", () => {
                    form.reset();
                    form.hidden = true;
                });

            async function createItem(e) {
                e.preventDefault();
                const data = Object.fromEntries(new FormData(e.target));
                const payload = {
                    userId: user.id,
                    type: data.type,
                    name: data.name,
                    framework: data.framework || null,
                    license: data.license,
                    task: data.task,
                    stars: 0,
                    downloads: 0,
                };
                const res = await fetch("http://localhost:3000/items", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                if (!res.ok) {
                    alert("Не удалось создать");
                    return;
                }
                const created = await res.json();
                empty.hidden = true;
                list.insertAdjacentHTML("beforeend", cardHTML(created));
                form.reset();
                form.hidden = true;
            }
        </script>
    </body>
</html>
