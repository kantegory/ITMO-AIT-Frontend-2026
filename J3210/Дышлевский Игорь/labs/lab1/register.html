<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Регистрация - AInator</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="light.css"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="stylesheet"
            href="dark.css"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="catalog.html">AInator</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#nav"
                        aria-label="Открыть меню"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="nav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="catalog.html"
                                    >Каталог</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="dashboard.html"
                                    >Кабинет</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="login.html">Вход</a>
                            </li>
                            <li class="nav-item ms-lg-2">
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="register.html"
                                    >Регистрация</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-5 d-flex justify-content-center">
            <div class="col-md-5">
                <section class="card p-5">
                    <h3 class="fw-bold mb-4">Регистрация</h3>
                    <form action="dashboard.html">
                        <div class="mb-3">
                            <label class="form-label" for="fname">Имя</label>
                            <input
                                class="form-control"
                                id="fname"
                                name="fname"
                                type="text"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="lname"
                                >Фамилия</label
                            >
                            <input
                                class="form-control"
                                id="lname"
                                name="lname"
                                type="text"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="reg-email"
                                >Email</label
                            >
                            <input
                                class="form-control"
                                id="reg-email"
                                name="email"
                                type="email"
                                placeholder="user@example.com"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="reg-pass"
                                >Пароль</label
                            >
                            <input
                                class="form-control"
                                id="reg-pass"
                                name="password"
                                type="password"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="reg-pass2"
                                >Повторите пароль</label
                            >
                            <input
                                class="form-control"
                                id="reg-pass2"
                                type="password"
                                required
                            />
                            <div
                                id="pass-error"
                                class="text-danger small mt-1"
                                style="display: none"
                            >
                                Пароли не совпадают
                            </div>
                        </div>
                        <div class="form-check mb-4">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="agree"
                                required
                            />
                            <label class="form-check-label" for="agree"
                                >Принимаю условия использования</label
                            >
                        </div>
                        <button class="btn btn-accent w-100" type="submit">
                            Создать аккаунт
                        </button>
                    </form>
                    <p class="text-center mt-4 mb-0 small">
                        Уже есть аккаунт? <a href="login.html">Войти</a>
                    </p>
                </section>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            document
                .querySelector("form")
                .addEventListener("submit", function (e) {
                    const pass1 = document.getElementById("reg-pass").value;
                    const pass2 = document.getElementById("reg-pass2").value;
                    const error = document.getElementById("pass-error");

                    if (pass1 !== pass2) {
                        e.preventDefault();
                        error.style.display = "block";
                    } else {
                        error.style.display = "none";
                    }
                });
        </script>
    </body>
</html>
