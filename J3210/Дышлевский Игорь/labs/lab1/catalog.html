<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Каталог - AInator</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="catalog.html">AInator</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#nav"
                        aria-label="Открыть меню"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="nav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link active" href="catalog.html"
                                    >Каталог</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="dashboard.html"
                                    >Кабинет</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="login.html">Вход</a>
                            </li>
                            <li class="nav-item ms-lg-2">
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="register.html"
                                    >Регистрация</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-5">
            <section class="mb-4">
                <h1 class="fw-bold mb-3">Каталог</h1>
                <form class="row g-2" action="catalog.html">
                    <div class="col-md-9">
                        <input
                            class="form-control form-control-lg"
                            type="search"
                            name="q"
                            placeholder="Поиск моделей и датасетов"
                        />
                    </div>
                    <div class="col-md-3">
                        <button
                            class="btn btn-accent btn-lg w-100"
                            type="submit"
                        >
                            Найти
                        </button>
                    </div>
                </form>
            </section>

            <div class="row g-4">
                <div class="col-lg-3">
                    <aside class="card p-4">
                        <h2 class="h6 fw-bold mb-3">Фильтры</h2>
                        <form action="catalog.html">
                            <div class="mb-3">
                                <label class="form-label" for="type">Тип</label>
                                <select
                                    class="form-select"
                                    id="type"
                                    name="type"
                                >
                                    <option value="all">Все</option>
                                    <option value="model">Модели</option>
                                    <option value="dataset">Датасеты</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="task"
                                    >Задача</label
                                >
                                <select
                                    class="form-select"
                                    id="task"
                                    name="task"
                                >
                                    <option value="all">Любая</option>
                                    <option value="cv">Computer Vision</option>
                                    <option value="nlp">NLP</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="license"
                                    >Лицензия</label
                                >
                                <select
                                    class="form-select"
                                    id="license"
                                    name="license"
                                >
                                    <option value="all">Любая</option>
                                    <option value="mit">MIT</option>
                                    <option value="apache">Apache-2.0</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="framework"
                                    >Фреймворк</label
                                >
                                <select
                                    class="form-select"
                                    id="framework"
                                    name="framework"
                                >
                                    <option value="all">Любой</option>
                                    <option value="pytorch">PyTorch</option>
                                    <option value="tensorflow">
                                        TensorFlow
                                    </option>
                                </select>
                            </div>
                        </form>
                    </aside>
                </div>

                <div class="col-lg-9">
                    <ul class="row g-4 list-unstyled mb-0">
                        <li class="col-md-6 item model nlp mit pytorch">
                            <article class="card p-4 h-100">
                                <span class="badge bg-primary mb-2">Model</span>
                                <h3 class="h6 fw-bold">
                                    <a href="details.html">GPT</a>
                                </h3>
                                <p class="text-muted small">PyTorch, MIT</p>
                                <small class="text-muted"
                                    >8 stars, 120 downloads</small
                                >
                            </article>
                        </li>
                        <li class="col-md-6 item dataset cv mit">
                            <article class="card p-4 h-100">
                                <span class="badge bg-success mb-2"
                                    >Dataset</span
                                >
                                <h3 class="h6 fw-bold">
                                    <a href="details.html">CIFAR-10</a>
                                </h3>
                                <p class="text-muted small">MIT</p>
                                <small class="text-muted"
                                    >4 stars, 50 downloads</small
                                >
                            </article>
                        </li>
                        <li class="col-md-6 item model cv apache tensorflow">
                            <article class="card p-4 h-100">
                                <span class="badge bg-primary mb-2">Model</span>
                                <h3 class="h6 fw-bold">
                                    <a href="details.html">YOLO</a>
                                </h3>
                                <p class="text-muted small">
                                    TensorFlow, Apache-2.0
                                </p>
                                <small class="text-muted"
                                    >3 stars, 30 downloads</small
                                >
                            </article>
                        </li>
                    </ul>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            function applyFilters() {
                const type = document.getElementById("type").value;
                const task = document.getElementById("task").value;
                const license = document.getElementById("license").value;
                const framework = document.getElementById("framework").value;

                document.querySelectorAll(".item").forEach(function (card) {
                    const matches =
                        (type === "all" || card.classList.contains(type)) &&
                        (task === "all" || card.classList.contains(task)) &&
                        (license === "all" ||
                            card.classList.contains(license)) &&
                        (framework === "all" ||
                            card.classList.contains(framework));

                    card.style.display = matches ? "" : "none";
                });
            }

            document
                .getElementById("type")
                .addEventListener("change", applyFilters);
            document
                .getElementById("task")
                .addEventListener("change", applyFilters);
            document
                .getElementById("license")
                .addEventListener("change", applyFilters);
            document
                .getElementById("framework")
                .addEventListener("change", applyFilters);
        </script>
    </body>
</html>
