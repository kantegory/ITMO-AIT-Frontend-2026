<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Каталог - AInator</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="light.css"
            media="(prefers-color-scheme: light)"
        />
        <link
            rel="stylesheet"
            href="dark.css"
            media="(prefers-color-scheme: dark)"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="catalog.html">AInator</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#nav"
                        aria-label="Открыть меню"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="nav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link active" href="catalog.html"
                                    >Каталог</a
                                >
                            </li>
                            <li class="nav-item auth" hidden>
                                <a class="nav-link" href="dashboard.html"
                                    >Аккаунт</a
                                >
                            </li>
                            <li class="nav-item ms-lg-2 auth" hidden>
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="#"
                                    id="logout"
                                    >Выйти</a
                                >
                            </li>
                            <li class="nav-item notauth" hidden>
                                <a class="nav-link" href="login.html">Вход</a>
                            </li>
                            <li class="nav-item ms-lg-2 notauth" hidden>
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="register.html"
                                    >Регистрация</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main class="container py-5">
            <section class="text-center mb-5">
                <h1 class="fw-bold mb-3 display-4">AInator</h1>
                <p class="text-muted mb-2 fs-5">
                    Платформа для моделей и датасетов
                </p>
                <p class="text-muted fst-italic small mb-0">
                    Без СМС, но с регистрацией
                </p>
            </section>

            <section class="mb-4">
                <h2 class="fw-bold mb-3">Каталог</h2>
                <form class="row g-2" action="catalog.html">
                    <div class="col-md-9">
                        <input
                            class="form-control form-control-lg"
                            type="search"
                            name="q"
                            placeholder="Поиск моделей и датасетов"
                        />
                    </div>
                    <div class="col-md-3">
                        <button
                            class="btn btn-accent btn-lg w-100"
                            type="submit"
                        >
                            Найти
                        </button>
                    </div>
                </form>
            </section>

            <div class="row g-4">
                <div class="col-lg-3">
                    <aside class="card p-4">
                        <h2 class="h6 fw-bold mb-3">Фильтры</h2>
                        <form action="catalog.html">
                            <div class="mb-3">
                                <label class="form-label" for="type">Тип</label>
                                <select
                                    class="form-select"
                                    id="type"
                                    name="type"
                                >
                                    <option value="all">Все</option>
                                    <option value="model">Модели</option>
                                    <option value="dataset">Датасеты</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="task"
                                    >Задача</label
                                >
                                <select
                                    class="form-select"
                                    id="task"
                                    name="task"
                                >
                                    <option value="all">Любая</option>
                                    <option value="CV">Computer Vision</option>
                                    <option value="NLP">NLP</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="license"
                                    >Лицензия</label
                                >
                                <select
                                    class="form-select"
                                    id="license"
                                    name="license"
                                >
                                    <option value="all">Любая</option>
                                    <option value="MIT">MIT</option>
                                    <option value="Apache-2.0">
                                        Apache-2.0
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="framework"
                                    >Фреймворк</label
                                >
                                <select
                                    class="form-select"
                                    id="framework"
                                    name="framework"
                                >
                                    <option value="all">Любой</option>
                                    <option value="PyTorch">PyTorch</option>
                                    <option value="TensorFlow">
                                        TensorFlow
                                    </option>
                                </select>
                            </div>
                        </form>
                    </aside>
                </div>

                <div class="col-lg-9">
                    <ul id="results" class="row g-4 list-unstyled mb-0"></ul>
                </div>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <script src="auth.js"></script>
        <script>
            let items = [];

            fetch("http://localhost:3000/items")
                .then((r) => r.json())
                .then((d) => {
                    items = d;
                    render();
                });

            function render() {
                const type = document.getElementById("type").value;
                const task = document.getElementById("task").value;
                const license = document.getElementById("license").value;
                const framework = document.getElementById("framework").value;

                const filtered = items.filter(
                    (i) =>
                        (type === "all" || i.type === type) &&
                        (task === "all" || i.task === task) &&
                        (license === "all" || i.license === license) &&
                        (framework === "all" || i.framework === framework),
                );

                document.getElementById("results").innerHTML = filtered
                    .map((i) => {
                        const meta = [i.framework, i.license]
                            .filter(Boolean)
                            .join(", ");
                        const badge =
                            i.type === "model"
                                ? '<span class="badge bg-primary mb-2">Model</span>'
                                : '<span class="badge bg-success mb-2">Dataset</span>';
                        return `
                            <li class="col-md-6">
                                <article class="card p-4 h-100">
                                    ${badge}
                                    <h3 class="h6 fw-bold">
                                        <a href="details.html">${i.name}</a>
                                    </h3>
                                    <p class="text-muted small">${meta}</p>
                                    <small class="text-muted">${i.stars} stars, ${i.downloads} downloads</small>
                                </article>
                            </li>`;
                    })
                    .join("");
            }

            document
                .querySelectorAll("select")
                .forEach((el) => el.addEventListener("change", render));
        </script>
    </body>
</html>
