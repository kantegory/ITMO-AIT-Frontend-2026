<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Вход - AInator</title>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <nav class="navbar navbar-expand-lg sticky-top">
                <div class="container">
                    <a class="navbar-brand" href="catalog.html">AInator</a>
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#nav"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="nav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="catalog.html"
                                    >Каталог</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="dashboard.html"
                                    >Кабинет</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="login.html"
                                    >Вход</a
                                >
                            </li>
                            <li class="nav-item ms-lg-2">
                                <a
                                    class="btn btn-accent btn-sm"
                                    href="register.html"
                                    >Регистрация</a
                                >
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <main
            class="container py-5 d-flex justify-content-center align-items-center"
        >
            <div class="col-md-5">
                <section class="card p-5">
                    <h3 class="fw-bold mb-4">Вход</h3>
                    <form action="dashboard.html">
                        <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input
                                class="form-control"
                                id="email"
                                name="email"
                                type="email"
                                placeholder="user@example.com"
                                required
                            />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password"
                                >Пароль</label
                            >
                            <input
                                class="form-control"
                                id="password"
                                name="password"
                                type="password"
                                required
                            />
                        </div>
                        <div class="form-check mb-4">
                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="remember"
                            />
                            <label class="form-check-label" for="remember"
                                >Запомнить меня</label
                            >
                        </div>
                        <button class="btn btn-accent w-100" type="submit">
                            Войти
                        </button>
                    </form>
                    <p class="text-center mt-4 mb-0 small">
                        Нет аккаунта?
                        <a href="register.html">Зарегистрироваться</a>
                    </p>
                </section>
            </div>
        </main>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
