<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="sign-in.css" />
</head>

<body>
  <div class="auth-card" style="position:relative; padding-top:3rem;">
    <a href="index.html" class="btn-close btn-close-white" style="position:absolute; top:0.75rem; right:0.75rem;"
      aria-label="Закрыть"></a>
    <div class="tab-buttons">
      <button class="active">Вход</button>
      <a href="registration.html"><button>Регистрация</button></a>
    </div>

    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <form id="loginForm" novalidate>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="loginEmail" name="email" placeholder="name@example.com" required>
        <label for="loginEmail">E-mail</label>
        <div class="invalid-feedback">Введите корректный email</div>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="loginPassword" name="password" placeholder="Пароль" required>
        <label for="loginPassword">Пароль</label>
        <div class="invalid-feedback">Пароль не может быть пустым</div>
      </div>
      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="loginRemember">
        <label class="form-check-label" for="loginRemember">Запомнить меня</label>
      </div>
      <button class="btn btn-primary w-100 py-2 mb-3" type="submit" id="submitBtn">Войти</button>
    </form>
  </div>

  <script src="theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script>
    const API_URL = 'http://localhost:3000';

    function checkAuth() {
      if (localStorage.getItem('accessToken')) {
        window.location.href = 'index.html';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const errorAlert = document.getElementById('errorAlert');
      errorAlert.classList.add('d-none');

      const form = e.target;
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Вход...';

      try {
        const response = await axios.post(`${API_URL}/login`, { email, password });
        const { accessToken, user } = response.data;

        localStorage.setItem('accessToken', accessToken);

        const fullUser = await axios.get(`${API_URL}/users/${user.id}`, {
          headers: { Authorization: `Bearer ${accessToken}` }
        });
        localStorage.setItem('user', JSON.stringify(fullUser.data));

        if (fullUser.data.role === 'teacher') {
          window.location.href = 'TeacherCourses/TeacherCourses.html';
        } else {
          window.location.href = 'index.html';
        }
      } catch (err) {
        console.error('Login error:', err);
        errorAlert.textContent = 'Неверный email или пароль';
        errorAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    });

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>

</html>
