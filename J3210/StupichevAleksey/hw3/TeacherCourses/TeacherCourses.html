<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Мои курсы — Преподаватель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../UserCourses/AU-styles.css" />
    <script src="../theme-toggle.js"></script>
</head>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileSidebar"><i class="bi bi-list"></i></button>
                <a href="../index.html" class="d-flex text-white text-decoration-none me-auto">
                    <img src="../images/logo.png" alt="Логотип" width="40" height="40" class="me-2">
                </a>
                <button class="btn btn-outline-light theme-toggle me-2" onclick="toggleTheme()" title="Сменить тему">
                    <span class="icon-sun"><i class="bi bi-sun-fill"></i></span>
                    <span class="icon-moon"><i class="bi bi-moon-fill"></i></span>
                </button>
                <a href="../index.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-house-door me-1"></i>На главную
                </a>
                <button class="btn btn-warning" onclick="logout()">Sign out</button>
            </div>
        </div>
    </header>

    <div class="offcanvas offcanvas-start text-bg-dark d-lg-none" id="mobileSidebar" style="width: 280px;">
        <div class="offcanvas-header border-bottom border-secondary pb-3">
            <div class="d-flex align-items-center gap-2">
                <img src="../images/jinx.png" alt="Аватар" class="rounded-circle" style="width:40px; height:40px; object-fit:cover;">
                <div>
                    <div class="fw-semibold" style="font-size:.9rem" id="mobUserName">Преподаватель</div>
                    <div style="font-size:.75rem; opacity:.6" id="mobUserEmail">email</div>
                </div>
            </div>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body p-0">
            <ul class="list-unstyled mb-0">
                <li><a class="d-flex align-items-center gap-2 px-3 py-2 text-white text-decoration-none" style="font-size:.9rem; background:rgba(13,110,253,.25);"><i class="bi bi-book"></i> Мои курсы</a></li>
                <li><a href="AddNewCourse.html" class="d-flex align-items-center gap-2 px-3 py-2 text-white-50 text-decoration-none" style="font-size:.9rem;"><i class="bi bi-plus-lg"></i> Создать новый курс</a></li>
                <li class="border-top border-secondary my-2"></li>
                <li><a href="#" onclick="logout()" class="d-flex align-items-center gap-2 px-3 py-2 text-white-50 text-decoration-none" style="font-size:.9rem;"><i class="bi bi-box-arrow-left"></i> Выйти</a></li>
            </ul>
        </div>
    </div>

    <div class="cabinet-wrapper">
        <aside class="cabinet-sidebar" id="sidebar">
            <div class="sidebar-user">
                <img src="../images/jinx.png" alt="Аватар">
                <div>
                    <div class="user-name" id="sideUserName">Преподаватель</div>
                    <div class="user-email" id="sideUserEmail">email</div>
                </div>
            </div>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item"><a class="nav-link active"><i class="bi bi-book"></i> Мои курсы</a></li>
                <li class="nav-item"><a href="AddNewCourse.html" class="nav-link"><i class="bi bi-plus-lg"></i> Создать новый курс</a></li>
            </ul>
        </aside>

        <main class="cabinet-main">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="fw-bold mb-0">Мои курсы</h4>
                <a href="AddNewCourse.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Новый курс</a>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th style="width:50px"></th>
                            <th>Название</th>
                            <th>Статус</th>
                            <th>Студенты</th>
                            <th>Рейтинг</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="coursesTableBody">
                        <tr><td colspan="6" class="text-center py-4"><div class="spinner-border text-primary" role="status"></div></td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
            </ul>
            <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="../auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '../signIn.html';

        async function deleteCourse(id) {
            if (!confirm('Удалить курс?')) return;
            try {
                await axios.delete(`${API_URL}/courses/${id}`);
                loadTeacherCourses();
            } catch (err) {
                console.error('Delete error:', err);
                alert('Ошибка удаления');
            }
        }

        async function loadTeacherCourses() {
            const user = getUser();
            if (!user) return;

            document.getElementById('sideUserName').textContent = user.name;
            document.getElementById('sideUserEmail').textContent = user.email;
            document.getElementById('mobUserName').textContent = user.name;
            document.getElementById('mobUserEmail').textContent = user.email;

            try {
                const response = await axios.get(`${API_URL}/courses`, {
                    params: { teacherId: user.id }
                });
                const courses = response.data;

                if (courses.length === 0) {
                    document.getElementById('coursesTableBody').innerHTML =
                        '<tr><td colspan="6" class="text-muted text-center">Нет курсов</td></tr>';
                    return;
                }

                document.getElementById('coursesTableBody').innerHTML = courses.map(course => {
                    const statusBadge = course.isPublished
                        ? '<span class="badge bg-success">Опубликован</span>'
                        : '<span class="badge bg-warning text-dark">Черновик</span>';

                    return `
                        <tr>
                            <td><img src="${course.image}" alt="" class="rounded" style="width:48px;height:36px;object-fit:cover"></td>
                            <td class="fw-semibold">${course.title}</td>
                            <td>${statusBadge}</td>
                            <td>${course.studentsCount || '—'}</td>
                            <td>${course.rating ? '<i class="bi bi-star-fill text-warning"></i> ' + course.rating : '—'}</td>
                            <td>
                                <a href="EditCourse.html?id=${course.id}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteCourse(${course.id})"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error('Error:', err);
                document.getElementById('coursesTableBody').innerHTML =
                    '<tr><td colspan="6" class="text-danger text-center">Ошибка загрузки</td></tr>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadTeacherCourses);
    </script>
</body>

</html>
