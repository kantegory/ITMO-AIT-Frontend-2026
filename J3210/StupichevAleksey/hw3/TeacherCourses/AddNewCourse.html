<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавить новый курс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../UserCourses/AU-styles.css" />
    <script src="../theme-toggle.js"></script>
</head>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex align-items-center">
                <a href="../index.html" class="d-flex text-white text-decoration-none me-auto">
                    <img src="../images/logo.png" alt="Логотип" width="40" height="40" class="me-2">
                </a>
                <button class="btn btn-outline-light theme-toggle me-2" onclick="toggleTheme()" title="Сменить тему">
                    <span class="icon-sun"><i class="bi bi-sun-fill"></i></span>
                    <span class="icon-moon"><i class="bi bi-moon-fill"></i></span>
                </button>
                <a href="../index.html" class="btn btn-outline-light me-2">
                    <i class="bi bi-house-door me-1"></i>На главную
                </a>
                <button class="btn btn-warning" onclick="logout()">Sign out</button>
            </div>
        </div>
    </header>

    <div class="cabinet-wrapper">
        <aside class="cabinet-sidebar" id="sidebar">
            <div class="sidebar-user">
                <img src="../images/jinx.png" alt="Аватар">
                <div>
                    <div class="user-name" id="sideUserName">Преподаватель</div>
                    <div class="user-email" id="sideUserEmail">email</div>
                </div>
            </div>
            <ul class="nav flex-column mb-auto">
                <li class="nav-item"><a href="TeacherCourses.html" class="nav-link"><i class="bi bi-book"></i> Мои курсы</a></li>
                <li class="nav-item"><a class="nav-link active"><i class="bi bi-plus-lg"></i> Создать новый курс</a></li>
            </ul>
        </aside>

        <main class="cabinet-main">
            <h4 class="mb-4 fw-bold">Добавить новый курс</h4>

            <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
            <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="courseForm">
                <div class="settings-section">
                    <h5 class="fw-semibold mb-3">Основная информация</h5>
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Название курса</label>
                            <input type="text" class="form-control" id="courseTitle" placeholder="Например: Python для начинающих" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Категория</label>
                            <select class="form-select" id="courseCategory">
                                <option selected disabled value="">Выберите категорию</option>
                                <option>Программирование</option>
                                <option>Дизайн</option>
                                <option>Data Science</option>
                                <option>DevOps</option>
                                <option>Маркетинг</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Краткое описание</label>
                            <textarea class="form-control" rows="2" id="courseShortDesc" placeholder="Одно-два предложения о курсе"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Полное описание</label>
                            <textarea class="form-control" rows="5" id="courseFullDesc" placeholder="Подробное описание, чему научатся студенты..."></textarea>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Язык курса</label>
                            <select class="form-select" id="courseLang">
                                <option selected>Русский</option>
                                <option>Английский</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Уровень</label>
                            <select class="form-select" id="courseLevel">
                                <option selected>Начинающий</option>
                                <option>Средний</option>
                                <option>Продвинутый</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">URL обложки</label>
                            <input type="text" class="form-control" id="courseImage" placeholder="https://...">
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <h5 class="fw-semibold mb-3">Параметры публикации</h5>
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Цена (₽)</label>
                            <input type="number" class="form-control" id="coursePrice" placeholder="0 = бесплатный" value="0">
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" id="certSwitch">
                                <label class="form-check-label" for="certSwitch">Выдавать сертификат</label>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-check form-switch mt-4">
                                <input class="form-check-input" type="checkbox" id="publishSwitch">
                                <label class="form-check-label" for="publishSwitch">Опубликовать сразу</label>
                            </div>
                        </div>
                        <div class="col-12 d-flex gap-2">
                            <button type="submit" class="btn btn-primary" id="submitBtn"><i class="bi bi-check-lg me-1"></i>Сохранить курс</button>
                            <a href="TeacherCourses.html" class="btn btn-outline-secondary">Отмена</a>
                        </div>
                    </div>
                </div>
            </form>
        </main>
    </div>

    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
            </ul>
            <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="../auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '../signIn.html';

        const user = getUser();
        if (user) {
            document.getElementById('sideUserName').textContent = user.name;
            document.getElementById('sideUserEmail').textContent = user.email;
        }

        document.getElementById('courseForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');
            successAlert.classList.add('d-none');
            errorAlert.classList.add('d-none');

            const courseData = {
                title: document.getElementById('courseTitle').value.trim(),
                shortDescription: document.getElementById('courseShortDesc').value.trim(),
                fullDescription: document.getElementById('courseFullDesc').value.trim(),
                category: document.getElementById('courseCategory').value,
                language: document.getElementById('courseLang').value,
                level: document.getElementById('courseLevel').value,
                image: document.getElementById('courseImage').value.trim() || 'https://images.unsplash.com/photo-1516116216624-53e697fedbea',
                price: parseInt(document.getElementById('coursePrice').value) || 0,
                hasCertificate: document.getElementById('certSwitch').checked,
                isPublished: document.getElementById('publishSwitch').checked,
                teacherId: user.id,
                teacherName: user.name,
                rating: 0,
                reviewsCount: 0,
                studentsCount: 0,
                duration: '0 часов',
                progress: 0,
                lessonsCompleted: 0,
                lessonsTotal: 0,
                modules: []
            };

            if (!courseData.title) {
                errorAlert.textContent = 'Введите название курса';
                errorAlert.classList.remove('d-none');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            try {
                await axios.post(`${API_URL}/courses`, courseData);
                successAlert.textContent = 'Курс успешно создан! Перенаправление...';
                successAlert.classList.remove('d-none');
                setTimeout(() => {
                    window.location.href = 'TeacherCourses.html';
                }, 1500);
            } catch (err) {
                console.error('Create course error:', err);
                errorAlert.textContent = 'Ошибка создания курса';
                errorAlert.classList.remove('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
