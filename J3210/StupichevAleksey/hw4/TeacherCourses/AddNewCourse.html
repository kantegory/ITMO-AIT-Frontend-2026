<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Добавить новый курс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../UserCourses/AU-styles.css" />
    <script src="../theme-toggle.js"></script>
</head>

<body>

    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex align-items-center">

                <button class="btn btn-outline-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#mobileSidebar">

                    <svg width="20" height="20">
                        <use href="../icons.svg#menu"></use>
                    </svg>
                </button>

                <a href="../index.html" class="d-flex text-white text-decoration-none me-auto">
                    <img src="../images/logo.png" width="40" height="40">
                </a>

                <button class="btn btn-outline-light theme-toggle me-2" onclick="toggleTheme()"
                    aria-label="Сменить тему оформления">
                    <span class="icon-sun">
                        <svg class="icon">
                            <use href="../icons.svg#icon-sun-fill"></use>
                        </svg>
                    </span>
                    <span class="icon-moon">
                        <svg class="icon">
                            <use href="../icons.svg#icon-moon-fill"></use>
                        </svg>
                    </span>
                </button>

                <a href="../index.html" class="btn btn-outline-light me-2">
                    <svg width="16" height="16" class="icon">
                        <use href="../icons.svg#icon-house"></use>
                    </svg>
                    <span>На главную</span>
                </a>

                <button class="btn btn-warning" onclick="logout()">Sign out</button>

            </div>
        </div>
    </header>

    <div class="cabinet-wrapper">

        <aside class="cabinet-sidebar">
            <div class="sidebar-user">
                <img src="../images/jinx.png" alt="Аватар пользователя">
                <div>
                    <div id="sideUserName">Преподаватель</div>
                    <div id="sideUserEmail">email</div>
                </div>
            </div>

            <ul class="nav flex-column mb-auto">
                <li class="nav-item">
                    <a href="TeacherCourses.html" class="nav-link">
                        <svg class="icon">
                            <use href="../icons.svg#icon-book"></use>
                        </svg> Мои курсы
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active">
                        <svg class="icon">
                            <use href="../icons.svg#icon-plus-lg"></use>
                        </svg> Создать новый курс
                    </a>
                </li>
            </ul>
        </aside>

        <main class="cabinet-main">

            <h4 class="mb-4 fw-bold">Добавить новый курс</h4>

            <div id="successAlert" class="alert alert-success d-none" role="alert" aria-live="polite"></div>
            <div id="errorAlert" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

            <form id="courseForm">

                <div class="settings-section">
                    <h5 class="fw-semibold mb-3">Основная информация</h5>

                    <div class="row g-3">

                        <div class="col-md-8">
                            <label for="courseTitle" class="form-label">Название курса</label>
                            <input type="text" class="form-control" id="courseTitle"
                                placeholder="Например: Python для начинающих" required>
                        </div>

                        <div class="col-md-4">
                            <label for="courseCategory" class="form-label">Категория</label>
                            <select id="courseCategory" class="form-select" required>
                                <option value="" disabled selected>Выберите категорию</option>
                                <option>Программирование</option>
                                <option>Дизайн</option>
                                <option>Data Science</option>
                                <option>DevOps</option>
                                <option>Маркетинг</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="courseShortDesc" class="form-label">Краткое описание</label>
                            <textarea id="courseShortDesc" class="form-control" rows="2"></textarea>
                        </div>

                        <div class="col-12">
                            <label for="courseFullDesc" class="form-label">Полное описание</label>
                            <textarea id="courseFullDesc" class="form-control" rows="5"></textarea>
                        </div>

                        <div class="col-md-4">
                            <label for="courseLang" class="form-label">Язык курса</label>
                            <select id="courseLang" class="form-select">
                                <option>Русский</option>
                                <option>Английский</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="courseLevel" class="form-label">Уровень</label>
                            <select id="courseLevel" class="form-select">
                                <option>Начинающий</option>
                                <option>Средний</option>
                                <option>Продвинутый</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="courseImage" class="form-label">URL обложки</label>
                            <input type="url" id="courseImage" class="form-control" placeholder="https://...">
                        </div>

                    </div>
                </div>

                <div class="settings-section">
                    <h5 class="fw-semibold mb-3">Параметры публикации</h5>

                    <div class="row g-3">

                        <div class="col-md-4">
                            <label for="coursePrice" class="form-label">Цена (₽)</label>
                            <input type="number" id="coursePrice" class="form-control" value="0">
                        </div>

                        <div class="col-md-4">
                            <div class="form-check form-switch mt-4">
                                <input id="certSwitch" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="certSwitch">
                                    Выдавать сертификат
                                </label>
                            </div>
                        </div>

                        <div class="col-md-4">
                            <div class="form-check form-switch mt-4">
                                <input id="publishSwitch" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="publishSwitch">
                                    Опубликовать сразу
                                </label>
                            </div>
                        </div>

                        <div class="col-12 d-flex gap-2">

                            <button type="submit" class="btn btn-primary" id="submitBtn" aria-label="Сохранить курс">
                                <svg class="icon me-1">
                                    <use href="../icons.svg#icon-check-lg"></use>
                                </svg>
                                Сохранить курс
                            </button>

                            <a href="TeacherCourses.html" class="btn btn-outline-secondary"
                                aria-label="Отменить создание курса">
                                Отмена
                            </a>

                        </div>

                    </div>
                </div>

            </form>

        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="../auth.js"></script>

    <script>
        if (!isLoggedIn()) window.location.href = '../signIn.html';

        const user = getUser();
        if (user) {
            sideUserName.textContent = user.name;
            sideUserEmail.textContent = user.email;
        }

        courseForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            successAlert.classList.add('d-none');
            errorAlert.classList.add('d-none');

            const title = courseTitle.value.trim();

            if (!title) {
                errorAlert.textContent = 'Введите название курса';
                errorAlert.classList.remove('d-none');
                return;
            }

            submitBtn.disabled = true;

            try {
                await axios.post(`${API_URL}/courses`, {
                    title,
                    teacherId: user.id
                });

                successAlert.textContent = 'Курс создан!';
                successAlert.classList.remove('d-none');

            } catch {
                errorAlert.textContent = 'Ошибка создания курса';
                errorAlert.classList.remove('d-none');
                submitBtn.disabled = false;
            }
        });
    </script>

</body>

</html>
