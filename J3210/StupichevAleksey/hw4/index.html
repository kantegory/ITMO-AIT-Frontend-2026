<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Платформа курсов — Обучение онлайн</title>
    <link rel="stylesheet" href="theme.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="theme-toggle.js"></script>
</head>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
                <h1 class="visually-hidden">Образовательная платформа курсов</h1>

                <a href="index.html"
                    class="d-flex align-items-center col-lg-auto mb-2 me-lg-auto text-white text-decoration-none">
                    <img src="images/logo.png" alt="На главную" width="40" height="40" class="me-2">
                </a>

                <form class="col-12 col-lg-auto mb-3 mb-lg-0 me-lg-3" role="search" id="searchForm">
                    <label for="searchInput" class="visually-hidden">Поиск по сайту</label>
                    <input type="search" class="form-control form-control-dark text-bg-white" placeholder="Поиск..."
                        aria-label="Поиск" id="searchInput">
                </form>

                <button class="btn btn-outline-light theme-toggle me-2" onclick="toggleTheme()"
                    aria-label="Сменить тему оформления">
                    <span class="icon-sun">
                        <svg class="icon">
                            <use href="icons.svg#icon-sun-fill"></use>
                        </svg>
                    </span>
                    <span class="icon-moon">
                        <svg class="icon">
                            <use href="icons.svg#icon-moon-fill"></use>
                        </svg>
                    </span>
                </button>

                <div class="text-end" id="authButtons">
                    <a href="signIn.html" class="btn btn-outline-light me-2">Войти</a>
                    <a href="registration.html" class="btn btn-warning">Регистрация</a>
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container mt-4">
            <div class="bg-light border rounded-3 p-3">
                <form class="row g-2 align-items-center" id="filterForm">
                    <div class="col-lg-4">
                        <label for="filterSearch" class="visually-hidden">Поиск по названию или автору</label>
                        <input type="search" class="form-control" placeholder="Название курса, автор или предмет"
                            id="filterSearch">
                    </div>
                    <div class="col-lg-2">
                        <label for="filterLang" class="visually-hidden">Выберите язык курса</label>
                        <select class="form-select" id="filterLang">
                            <option value="" selected>На любом языке</option>
                            <option value="Русский">На русском</option>
                            <option value="Английский">На английском</option>
                        </select>
                    </div>
                    <div class="col-lg-auto">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterCert">
                            <label class="form-check-label" for="filterCert">С сертификатами</label>
                        </div>
                    </div>
                    <div class="col-lg-auto">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="filterFree">
                            <label class="form-check-label" for="filterFree">Бесплатные</label>
                        </div>
                    </div>
                    <div class="col-lg-auto">
                        <button class="btn btn-primary" type="submit">Искать</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="container">
            <h2 class="section-title mt-4">Топ-10 курсов</h2>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="topCourses">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"><span
                            class="visually-hidden">Загрузка...</span></div>
                </div>
            </div>

            <h2 class="section-title mt-4">Для новичков</h2>
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="beginnerCourses">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"><span
                            class="visually-hidden">Загрузка...</span></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="container">
        <div class="py-3 my-4 border-top">
            <ul class="nav justify-content-center pb-3 mb-3">
                <li class="nav-item"><a href="index.html" class="nav-link px-2 text-body-secondary">Главная</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Возможности</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Цены</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Помощь</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">О нас</a></li>
            </ul>
            <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script>
        const API_URL = 'http://localhost:3000';

        function getCourseCardHtml(course) {
            return `
                <div class="col">
                    <div class="card course-card h-100">
                        <img src="${course.image}" class="card-img-top" alt="${course.title}">
                        <div class="card-body d-flex flex-column">
                            <h3 class="card-title">${course.title}</h3>
                            <p class="card-text">${course.shortDescription}</p>
                            <div class="mt-auto d-flex align-items-center justify-content-between">
                                <a href="Course/CoursePreview.html?id=${course.id}" class="btn btn-primary">Подробнее</a>
                                <span class="text-muted small"><svg class="icon text-warning"><use href="icons.svg#icon-star-fill"/></svg> ${course.rating}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadCourses(params = {}) {
            try {
                const response = await axios.get(`${API_URL}/courses`, { params: { ...params, isPublished: true } });
                return response.data;
            } catch (err) {
                console.error('Error loading courses:', err);
                return [];
            }
        }

        async function renderCourses() {
            const courses = await loadCourses();

            const topCourses = [...courses].sort((a, b) => b.rating - a.rating).slice(0, 4);
            document.getElementById('topCourses').innerHTML = topCourses.map(getCourseCardHtml).join('');

            const beginnerCourses = courses.filter(c => c.level === 'Начинающий').slice(0, 4);
            document.getElementById('beginnerCourses').innerHTML = beginnerCourses.map(getCourseCardHtml).join('');
        }

        document.getElementById('filterForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const params = { isPublished: true };
            const search = document.getElementById('filterSearch').value.trim();
            const lang = document.getElementById('filterLang').value;
            const cert = document.getElementById('filterCert').checked;
            const free = document.getElementById('filterFree').checked;

            if (search) params.q = search;
            if (lang) params.language = lang;
            if (cert) params.hasCertificate = true;
            if (free) params.price = 0;

            const courses = await loadCourses(params);
            document.getElementById('topCourses').innerHTML = courses.length
                ? courses.map(getCourseCardHtml).join('')
                : '<p class="text-muted">Ничего не найдено</p>';
            document.getElementById('beginnerCourses').innerHTML = '';
        });

        document.getElementById('searchForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const q = document.getElementById('searchInput').value.trim();
            document.getElementById('filterSearch').value = q;
            document.getElementById('filterForm').dispatchEvent(new Event('submit'));
        });

        function logout() {
            localStorage.removeItem('accessToken');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        function updateHeader() {
            if (localStorage.getItem('accessToken')) {
                const user = JSON.parse(localStorage.getItem('user'));
                const cabinetUrl = user && user.role === 'teacher'
                    ? 'TeacherCourses/TeacherCourses.html'
                    : 'UserCourses/View.html';
                document.getElementById('authButtons').innerHTML = `
                    <div class="d-flex align-items-center gap-2">
                        <a href="${cabinetUrl}" class="btn btn-outline-light d-flex align-items-center gap-2" title="Личный кабинет">
                            <svg class="icon" style="font-size:1.3rem;"><use href="icons.svg#icon-person-circle"/></svg>
                            <span class="d-none d-md-inline">Личный кабинет</span>
                        </a>
                        <button class="btn btn-warning" onclick="logout()">Sign out</button>
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateHeader();
            renderCourses();
        });
    </script>
</body>

</html>
