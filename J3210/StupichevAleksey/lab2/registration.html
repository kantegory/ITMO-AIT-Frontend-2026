<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="sign-in.css" />
</head>

<body>
  <div class="auth-card" style="position:relative; padding-top:3rem;">
    <a href="index.html" class="btn-close btn-close-white" style="position:absolute; top:0.75rem; right:0.75rem;"
      aria-label="Закрыть"></a>
    <div class="tab-buttons">
      <a href="signIn.html"><button>Вход</button></a>
      <button class="active">Регистрация</button>
    </div>

    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
    <div id="successAlert" class="alert alert-success d-none" role="alert"></div>

    <form id="registerForm" novalidate>
      <div class="form-floating mb-3">
        <input type="text" class="form-control" id="registerName" name="name" placeholder="Имя" required>
        <label for="registerName">Имя</label>
        <div class="invalid-feedback">Введите имя</div>
      </div>
      <div class="form-floating mb-3">
        <input type="email" class="form-control" id="registerEmail" name="email" placeholder="name@example.com"
          required>
        <label for="registerEmail">E-mail</label>
        <div class="invalid-feedback">Введите корректный email</div>
      </div>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="registerPassword" name="password" placeholder="Пароль"
          required minlength="4">
        <label for="registerPassword">Пароль</label>
        <div class="invalid-feedback">Пароль должен быть не менее 4 символов</div>
      </div>

      <div class="mb-3">
        <label class="form-label">Я регистрируюсь как</label>
        <div class="d-flex gap-3">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="role" id="roleStudent" value="student" checked>
            <label class="form-check-label" for="roleStudent">Студент</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="role" id="roleTeacher" value="teacher">
            <label class="form-check-label" for="roleTeacher">Преподаватель</label>
          </div>
        </div>
      </div>

      <button class="btn btn-primary w-100 py-2 mb-3" type="submit" id="submitBtn">Зарегистрироваться</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script>
    const API_URL = 'http://localhost:3000';

    function checkAuth() {
      if (localStorage.getItem('accessToken')) {
        window.location.href = 'index.html';
      }
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const errorAlert = document.getElementById('errorAlert');
      const successAlert = document.getElementById('successAlert');
      errorAlert.classList.add('d-none');
      successAlert.classList.add('d-none');

      const form = e.target;
      if (!form.checkValidity()) {
        form.classList.add('was-validated');
        return;
      }

      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;
      const role = document.querySelector('input[name="role"]:checked').value;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Регистрация...';

      try {
        const userData = {
          email,
          password,
          name,
          role,
          enrolledCourses: [],
          completedCourses: [],
          favorites: []
        };

        const response = await axios.post(`${API_URL}/register`, userData);
        const { accessToken, user } = response.data;

        user.role = role;
        user.name = name;

        localStorage.setItem('accessToken', accessToken);
        localStorage.setItem('user', JSON.stringify(user));

        successAlert.textContent = 'Регистрация успешна! Перенаправление...';
        successAlert.classList.remove('d-none');

        setTimeout(() => {
          if (user.role === 'teacher') {
            window.location.href = 'TeacherCourses/TeacherCourses.html';
          } else {
            window.location.href = 'index.html';
          }
        }, 1000);
      } catch (err) {
        console.error('Register error:', err);
        if (err.response && err.response.status === 400) {
          errorAlert.textContent = 'Пользователь с таким email уже существует';
        } else {
          errorAlert.textContent = 'Ошибка регистрации. Попробуйте позже.';
        }
        errorAlert.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Зарегистрироваться';
      }
    });

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
</body>

</html>
