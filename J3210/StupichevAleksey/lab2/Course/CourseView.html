<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Урок — Загрузка...</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="view.css" />
    <script src="../theme-toggle.js"></script>
</head>

<body>
    <header class="p-3 text-bg-dark" style="z-index:1030; top:0; position:sticky; height:62px">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light d-lg-none me-2" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#courseSidebar">
                    <i class="bi bi-list"></i>
                </button>
                <a href="../index.html" class="d-flex text-white text-decoration-none me-3">
                    <img src="../images/logo.png" alt="Логотип" width="40" height="40">
                </a>
                <a href="../UserCourses/authtorizatedUser.html"
                    class="text-white text-decoration-none fw-semibold me-auto" id="backLink">
                    <i class="bi bi-arrow-left me-1"></i><span>Вернуться</span>
                </a>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-light theme-toggle me-2" onclick="toggleTheme()" title="Сменить тему"><span class="icon-sun"><i class="bi bi-sun-fill"></i></span><span class="icon-moon"><i class="bi bi-moon-fill"></i></span></button>
                    <button class="btn btn-warning btn-sm ms-2" onclick="logout()">Sign out</button>
                </div>
            </div>
        </div>
    </header>

    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="course-sidebar offcanvas-lg offcanvas-start" id="courseSidebar">
            <div class="offcanvas-header d-lg-none">
                <h6 class="offcanvas-title fw-bold">Содержание курса</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="sidebar-header">
                <h6 id="sidebarTitle">Загрузка...</h6>
                <div class="small mb-2" id="sidebarLessons">0 уроков</div>
            </div>
            <ul class="list-unstyled ps-0 mb-0" id="sidebarModules">
                <li class="text-center py-4"><div class="spinner-border spinner-border-sm text-light"></div></li>
            </ul>
        </nav>

        <!-- Main content -->
        <div class="player-main">
            <div class="video-wrapper">
                <img src="" id="lessonImage" alt="">
                <div class="play-overlay">
                    <i class="bi bi-play-fill"></i>
                </div>
            </div>

            <div class="lesson-content">
                <div class="d-flex align-items-center gap-2 mb-1">
                    <span class="badge bg-primary" id="lessonModule">Модуль</span>
                    <span class="badge bg-secondary" id="lessonMeta">Видео</span>
                </div>
                <h3 class="fw-bold mb-3" id="lessonTitle">Загрузка...</h3>

                <ul class="nav nav-underline tab-material mb-4">
                    <li class="nav-item"><a class="nav-link active" href="#">Описание</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Материалы</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Обсуждение</a></li>
                </ul>

                <div class="mb-4" id="lessonDescription">
                    <p class="text-muted">Загрузка содержимого урока...</p>
                </div>

                <div class="card">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-2"><i class="bi bi-download me-2 text-primary"></i>Материалы к уроку</h6>
                        <div class="d-flex flex-wrap gap-2">
                            <a href="#" class="btn btn-outline-secondary btn-sm"><i class="bi bi-file-earmark-pdf me-1"></i>Конспект (PDF)</a>
                            <a href="#" class="btn btn-outline-secondary btn-sm"><i class="bi bi-file-earmark-code me-1"></i>Примеры кода</a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lesson-nav">
                <button class="btn btn-outline-secondary" id="prevBtn" onclick="goToPrev()" disabled>
                    <i class="bi bi-arrow-left me-1"></i>Предыдущий
                </button>
                <button class="btn btn-outline-secondary" id="nextBtn" onclick="goToNext()" disabled>
                    Следующий<i class="bi bi-arrow-right ms-1"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="../auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '../signIn.html';

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = parseInt(urlParams.get('id'));
        const lessonParam = parseInt(urlParams.get('lesson')) || null;

        let course = null;
        let allLessons = [];
        let currentLessonIndex = 0;

        function typeIcon(type) {
            if (type === 'video') return 'bi-play-circle';
            if (type === 'quiz') return 'bi-pencil-square';
            return 'bi-file-text';
        }

        async function init() {
            if (!courseId) { document.getElementById('lessonTitle').textContent = 'Курс не найден'; return; }

            try {
                const resp = await axios.get(`${API_URL}/courses/${courseId}`);
                course = resp.data;

                if (!course.modules || course.modules.length === 0) {
                    document.getElementById('lessonTitle').textContent = 'У этого курса пока нет уроков';
                    return;
                }

                course.modules.forEach((mod, mi) => {
                    mod.lessons.forEach(lesson => {
                        allLessons.push({ ...lesson, moduleIndex: mi, moduleTitle: mod.title });
                    });
                });

                if (lessonParam) {
                    const idx = allLessons.findIndex(l => l.id === lessonParam);
                    currentLessonIndex = idx >= 0 ? idx : 0;
                }

                renderSidebar();
                renderLesson();

            } catch (err) {
                console.error('Init error:', err);
                document.getElementById('lessonTitle').textContent = 'Ошибка загрузки курса';
            }
        }

        function renderSidebar() {
            document.title = course.title + ' — Урок';
            document.getElementById('sidebarTitle').textContent = course.title;
            document.getElementById('sidebarLessons').textContent = allLessons.length + ' уроков';

            const container = document.getElementById('sidebarModules');
            container.innerHTML = '';

            course.modules.forEach((mod, mi) => {
                const currentLesson = allLessons[currentLessonIndex];
                const isActiveModule = currentLesson && currentLesson.moduleIndex === mi;

                const li = document.createElement('li');
                li.innerHTML = `
                    <button class="btn btn-toggle border-0 rounded-0" type="button"
                        data-bs-toggle="collapse" data-bs-target="#mod-${mi}-collapse"
                        aria-expanded="${isActiveModule ? 'true' : 'false'}">
                        Модуль ${mi + 1}: ${mod.title}
                    </button>
                    <div class="collapse ${isActiveModule ? 'show' : ''}" id="mod-${mi}-collapse">
                        <ul class="btn-toggle-nav list-unstyled pb-1">
                            ${mod.lessons.map(lesson => {
                                const globalIdx = allLessons.findIndex(l => l.id === lesson.id);
                                const isActive = globalIdx === currentLessonIndex;
                                const cls = isActive ? 'lesson-link active' : 'lesson-link';

                                return `
                                    <li>
                                        <a href="#" class="${cls}" onclick="goToLesson(${globalIdx}); return false;">
                                            <i class="${typeIcon(lesson.type)} type-icon"></i>
                                            ${lesson.title}
                                        </a>
                                    </li>
                                `;
                            }).join('')}
                        </ul>
                    </div>
                `;
                container.appendChild(li);
            });
        }

        function renderLesson() {
            const lesson = allLessons[currentLessonIndex];
            if (!lesson) return;

            document.getElementById('lessonTitle').textContent = lesson.title;
            document.getElementById('lessonModule').textContent = `Модуль ${lesson.moduleIndex + 1}`;

            const typeLabel = lesson.type === 'video' ? 'Видео' : lesson.type === 'quiz' ? 'Тест' : 'Текст';
            document.getElementById('lessonMeta').textContent = `${typeLabel} • ${lesson.duration}`;
            document.getElementById('lessonImage').src = course.image;

            document.getElementById('lessonDescription').innerHTML = `
                <p>Урок <strong>«${lesson.title}»</strong> из модуля <em>«${lesson.moduleTitle}»</em>.</p>
                <p>Длительность: ${lesson.duration}. Тип: ${typeLabel}.</p>
            `;

            document.getElementById('prevBtn').disabled = currentLessonIndex === 0;
            document.getElementById('nextBtn').disabled = currentLessonIndex === allLessons.length - 1;

            const newUrl = `CourseView.html?id=${courseId}&lesson=${lesson.id}`;
            history.replaceState(null, '', newUrl);

            const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('courseSidebar'));
            if (offcanvas) offcanvas.hide();
        }

        function goToLesson(index) {
            currentLessonIndex = index;
            renderSidebar();
            renderLesson();
            window.scrollTo(0, 0);
        }

        function goToPrev() {
            if (currentLessonIndex > 0) goToLesson(currentLessonIndex - 1);
        }

        function goToNext() {
            if (currentLessonIndex < allLessons.length - 1) goToLesson(currentLessonIndex + 1);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
