<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Редактирование курса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../UserCourses/AU-styles.css" />
</head>

<body>
    <header class="p-3 text-bg-dark">
        <div class="container">
            <div class="d-flex align-items-center">
                <a href="../index.html" class="d-flex text-white text-decoration-none me-auto">
                    <img src="../images/logo.png" alt="Логотип" width="40" height="40" class="me-2">
                </a>
                <button class="btn btn-warning" onclick="logout()">Sign out</button>
            </div>
        </div>
    </header>

    <main class="cabinet-main">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold mb-0">Редактирование курса</h4>
            <a href="TeacherCourses.html" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>Назад к списку
            </a>
        </div>

        <div id="successAlert" class="alert alert-success d-none" role="alert"></div>
        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <div id="loadingSpinner" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
        </div>

        <form id="editForm" class="d-none">
            <div class="settings-section">
                <h5 class="fw-semibold mb-3">Основная информация</h5>
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Название курса</label>
                        <input type="text" class="form-control" id="courseTitle">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Категория</label>
                        <select class="form-select" id="courseCategory">
                            <option>Программирование</option>
                            <option>Дизайн</option>
                            <option>Data Science</option>
                            <option>DevOps</option>
                            <option>Маркетинг</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Краткое описание</label>
                        <textarea class="form-control" rows="2" id="courseShortDesc"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Полное описание</label>
                        <textarea class="form-control" rows="5" id="courseFullDesc"></textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Язык курса</label>
                        <select class="form-select" id="courseLang">
                            <option>Русский</option>
                            <option>Английский</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Уровень</label>
                        <select class="form-select" id="courseLevel">
                            <option>Начинающий</option>
                            <option>Средний</option>
                            <option>Продвинутый</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">URL обложки</label>
                        <input type="text" class="form-control" id="courseImage">
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h5 class="fw-semibold mb-3">Параметры публикации</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Цена (₽)</label>
                        <input type="number" class="form-control" id="coursePrice">
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" id="certSwitch">
                            <label class="form-check-label" for="certSwitch">Выдавать сертификат</label>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" id="publishSwitch">
                            <label class="form-check-label" for="publishSwitch">Опубликован</label>
                        </div>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn"><i class="bi bi-check-lg me-1"></i>Сохранить изменения</button>
                        <a href="TeacherCourses.html" class="btn btn-outline-secondary">Отмена</a>
                        <button type="button" class="btn btn-outline-danger ms-auto" id="deleteBtn"><i class="bi bi-trash me-1"></i>Удалить курс</button>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <div class="container">
        <footer class="py-3 my-4">
            <ul class="nav justify-content-center border-bottom pb-3 mb-3">
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Home</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Features</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">Pricing</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">FAQs</a></li>
                <li class="nav-item"><a href="#" class="nav-link px-2 text-body-secondary">About</a></li>
            </ul>
            <p class="text-center text-body-secondary">© 2025 Company, Inc</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
    <script src="../auth.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = '../signIn.html';

        const params = new URLSearchParams(window.location.search);
        const courseId = params.get('id');

        if (!courseId) {
            window.location.href = 'TeacherCourses.html';
        }

        async function loadCourse() {
            try {
                const response = await axios.get(`${API_URL}/courses/${courseId}`);
                const course = response.data;

                document.getElementById('courseTitle').value = course.title || '';
                document.getElementById('courseShortDesc').value = course.shortDescription || '';
                document.getElementById('courseFullDesc').value = course.fullDescription || '';
                document.getElementById('courseCategory').value = course.category || 'Программирование';
                document.getElementById('courseLang').value = course.language || 'Русский';
                document.getElementById('courseLevel').value = course.level || 'Начинающий';
                document.getElementById('courseImage').value = course.image || '';
                document.getElementById('coursePrice').value = course.price || 0;
                document.getElementById('certSwitch').checked = course.hasCertificate || false;
                document.getElementById('publishSwitch').checked = course.isPublished || false;

                document.getElementById('loadingSpinner').classList.add('d-none');
                document.getElementById('editForm').classList.remove('d-none');
            } catch (err) {
                console.error('Load error:', err);
                document.getElementById('loadingSpinner').innerHTML = '<p class="text-danger">Курс не найден</p>';
            }
        }

        document.getElementById('editForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');
            successAlert.classList.add('d-none');
            errorAlert.classList.add('d-none');

            const updates = {
                title: document.getElementById('courseTitle').value.trim(),
                shortDescription: document.getElementById('courseShortDesc').value.trim(),
                fullDescription: document.getElementById('courseFullDesc').value.trim(),
                category: document.getElementById('courseCategory').value,
                language: document.getElementById('courseLang').value,
                level: document.getElementById('courseLevel').value,
                image: document.getElementById('courseImage').value.trim(),
                price: parseInt(document.getElementById('coursePrice').value) || 0,
                hasCertificate: document.getElementById('certSwitch').checked,
                isPublished: document.getElementById('publishSwitch').checked
            };

            try {
                await axios.patch(`${API_URL}/courses/${courseId}`, updates);
                successAlert.textContent = 'Изменения сохранены!';
                successAlert.classList.remove('d-none');
            } catch (err) {
                console.error('Save error:', err);
                errorAlert.textContent = 'Ошибка сохранения';
                errorAlert.classList.remove('d-none');
            }
        });

        document.getElementById('deleteBtn').addEventListener('click', async function () {
            if (!confirm('Удалить курс? Это действие нельзя отменить.')) return;
            try {
                await axios.delete(`${API_URL}/courses/${courseId}`);
                window.location.href = 'TeacherCourses.html';
            } catch (err) {
                console.error('Delete error:', err);
                alert('Ошибка удаления');
            }
        });

        document.addEventListener('DOMContentLoaded', loadCourse);
    </script>
</body>

</html>
