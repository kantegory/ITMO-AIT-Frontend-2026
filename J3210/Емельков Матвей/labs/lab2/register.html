<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | MLPipelines</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="container d-flex justify-content-center align-items-center vh-100">

    <section class="auth-card">
        <header class="auth-card__header">
            <h1 class="auth-card__title">MLPipelines</h1>
            <p class="auth-card__subtitle">Создание аккаунта</p>
        </header>

        <form id="registerForm" action="index.html">
            <div class="mb-3">
                <label for="regName" class="form-label">Имя и Фамилия</label>
                <input type="text" class="form-control" id="regName" placeholder="Иван Иванов" required>
            </div>

            <div class="mb-3">
                <label for="regGroup" class="form-label">Учебная группа</label>
                <input type="text" class="form-control" id="regGroup" placeholder="Например, J3210" required>
            </div>

            <div class="mb-3">
                <label for="regEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="regEmail"  placeholder="name@yandex.ru" required>
            </div>

            <div class="mb-3">
                <label for="regPassword" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="regPassword" placeholder="********" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
        </form>

        <footer class="mt-4 text-center">
            <span class="text-muted">Уже есть аккаунт?</span>
            <a href="login.html" class="text-decoration-none">Войти</a>
        </footer>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="js/authentication.js"></script>

</body>
</html>
