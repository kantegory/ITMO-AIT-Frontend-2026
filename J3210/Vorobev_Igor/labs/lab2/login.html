<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper {
            background: var(--bg-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .auth-card {
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
        }

        .auth-title {
            font-family: Arial, sans-serif;
            font-weight: 700;
            font-size: 32px;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .auth-links a {
            color: var(--text-link);
            text-decoration: underline;
        }
        
        .auth-links a:hover {
            color: var(--text-link-hover);
        }
    </style>
</head>
<body>
    <header class="landing-header">
        <button onclick="changeTheme()" class="theme-toggle" aria-label="Переключить тему">
            <span class="sun">☀️</span>
            <span class="moon">🌙</span>
        </button>
    </header>

    <main class="auth-wrapper">
        <div class="card auth-card">
            <div class="card-body p-4">
                <h2 class="auth-title">Вход</h2>
                
                <form id="loginForm">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="floatingEmail" placeholder="Email">
                        <label>Email</label>
                    </div>
                    
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="floatingPassword" placeholder="Пароль">
                        <label>Пароль</label>
                    </div>

                    <button type="button" id="btnLogin" class="btn btn-outline-black w-100 py-2 fw-bold">
                        Войти
                    </button>
                </form>

                <div class="auth-links">
                    <a href="index.html">← Назад</a>
                    <span class="mx-2">|</span>
                    <a href="register.html">Регистрация</a>
                </div>
            </div>
        </div>

        <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
            <div id="errorToast" class="toast border-2 border-black" role="alert">
                <div class="d-flex align-items-center">
                    <div id="errorToastText" class="toast-body fw-bold">Ошибка</div>
                    <button type="button" class="btn-close me-2" data-bs-dismiss="toast"></button>
                </div>
            </div>
            <div id="successToast" class="toast border-2 border-black" role="alert">
                <div class="d-flex align-items-center">
                    <div id="successToastText" class="toast-body fw-bold">Успех</div>
                    <button type="button" class="btn-close me-2" data-bs-dismiss="toast"></button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/login.js"></script>
    <script src="js/theme_switcher.js"></script>
</body>
</html>
