<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-white border-bottom">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold">Project Manager</span>
                <div class="d-flex align-items-center gap-2">
                    <span class="small" id="userName">Пользователь</span>
                    <button id="btnLogout" class="btn btn-sm">Выйти</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <div class="bg-light mb-4">
            <div class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label small">Поиск</label>
                    <input type="text" class="form-control" id="searchInput" placeholder="Название проекта...">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Статус</label>
                    <select class="form-select" id="filterStatus">
                        <option value="">Все</option>
                        <option value="Новый">Новый</option>
                        <option value="В процессе">В процессе</option>
                        <option value="Завершён">Завершён</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Приоритет</label>
                    <select class="form-select" id="filterPriority">
                        <option value="">Все</option>
                        <option value="Высокий">Высокий</option>
                        <option value="Средний">Средний</option>
                        <option value="Низкий">Низкий</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Исполнитель</label>
                    <select class="form-select" id="filterAssignee">
                        <option value="">Все</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end mb-4">
            <button class="btn btn-outline-black" data-bs-toggle="modal" data-bs-target="#createProjectModal">
                Создать проект
            </button>
        </div>

        <div class="modal fade" id="createProjectModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Новый проект</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                <div class="modal-body">
                    <form id="createForm">
                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" class="form-control" id="newProjName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            <textarea class="form-control" id="newProjDesc" rows="3"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Статус</label>
                                <select class="form-select" id="newProjStatus">
                                    <option value="Новый">Новый</option>
                                    <option value="В процессе">В процессе</option>
                                </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Приоритет</label>
                                    <select class="form-select" id="newProjPriority">
                                        <option value="Низкий">Низкий</option>
                                        <option value="Средний">Средний</option>
                                        <option value="Высокий">Высокий</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Дедлайн</label>
                                <input type="date" class="form-control" id="newProjDeadline">
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                        <button type="button" class="btn btn-outline-black" id="btnCreateProject">Создать</button>
                    </div>
                </div>
            </div>
        </div>

        <h5 class="fw-bold mb-3">Проекты</h5>
        <div id="projects-container" class="d-flex flex-wrap gap-3"></div>
    </main>

    <footer class="py-3">
        <div class="container text-center small text-muted">
            @ IgorVorobev. Все права защищены
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/personal_account.js"></script>
</body>
</html>
