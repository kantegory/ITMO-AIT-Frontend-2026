<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Project Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .landing-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .landing-card { max-width: 320px; width: 100%; }
        .landing-title { font-size: 28px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .landing-subtitle { color: var(--text-secondary); margin-bottom: 32px; font-size: 14px; }
        .btn-landing { width: 100%; margin-bottom: 12px; }
        .btn-landing:last-child { margin-bottom: 0; }
    </style>
</head>
<body>
    <header class="landing-header">
        <button onclick="changeTheme()" class="theme-toggle" aria-label="Переключить тему">
            <span class="sun">☀️</span>
            <span class="moon">🌙</span>
        </button>
    </header>

    <main class="landing-wrapper">
        <div class="card landing-card">
            <div class="card-body text-center p-4">
                <h1 class="landing-title">Project Manager</h1>
                <p class="landing-subtitle">Управление проектами</p>
                <div class="d-grid">
                    <a href="login.html" class="btn btn-outline-black btn-landing" aria-label="Перейти на страницу входа">Вход</a>
                    <a href="register.html" class="btn btn-outline-black btn-landing" aria-label="Перейти на страницу регистрации">Регистрация</a>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/theme_switcher.js"></script>
</body>
</html>
