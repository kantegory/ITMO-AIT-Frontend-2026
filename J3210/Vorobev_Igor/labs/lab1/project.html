<!DOCTYPE html>
<html lang="ru" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Проект</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .project-header {
            padding: 20px 0;
            border-bottom: 2px solid #000;
            background: #fff;
        }
        
        .back-link {
            color: #000;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
        }
        .back-link:hover { color: #b9ff66; }

        .info-card {
            border: 2px solid #000;
            border-radius: 20px;
            box-shadow: 6px 6px 0px 0px #000;
            background: #fff;
            padding: 24px;
            margin-bottom: 24px;
        }

        .team-member {
            border: 2px solid #000;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 12px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pos-tabs {
            border-bottom: 2px solid #000;
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
        }
        .pos-tab {
            padding: 10px 0;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            font-size: 18px;
            border-bottom: 3px solid transparent;
            cursor: pointer;
        }
        .pos-tab.active {
            border-bottom-color: #000;
        }
        .pos-tab:hover { color: #666; }

        .file-item {
            border: 2px solid #000;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }
        .file-info { display: flex; align-items: center; gap: 12px; }
        .file-icon { font-size: 24px; }

        .comment-item {
            border-bottom: 2px solid #000;
            padding-bottom: 16px;
            margin-bottom: 16px;
        }
        .comment-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .comment-time { font-weight: 400; color: #666; }
        
        .comment-input-area {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
    </style>
</head>
<body>
    <header class="project-header">
        <div class="container d-flex justify-content-between align-items-center">
            <a href="personal_account.html" class="back-link">← Назад</a>
            <h2 class="fw-bold mb-0" id="headerProjectName">Название проекта</h2>
            <button id="btnLogout" class="btn btn-sm btn-outline-black">Выйти</button>
        </div>
    </header>

    <main class="container py-4">
        <div class="row">
            <div class="col-lg-8">
                <div class="info-card">
                    <h3 class="fw-bold mb-2" id="projTitle">Загрузка...</h3>
                    <p class="text-muted mb-4" id="projDesc">Описание проекта</p>
                    <div class="d-flex align-items-center gap-4">
                        <div>
                            <span class="fw-bold d-block mb-1">Дедлайн</span>
                            <span class="fs-5 fw-bold" id="projDeadline">--.--.----</span>
                        </div>
                        <div>
                            <span class="fw-bold d-block mb-1">Статус</span>
                            <span class="badge" id="projStatus">Статус</span>
                        </div>
                    </div>
                </div>

                <div class="pos-tabs">
                    <a class="pos-tab active" data-target="filesTab">Файлы</a>
                    <a class="pos-tab" data-target="commentsTab">Обсуждения</a>
                </div>

                <div id="filesTab">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0">Загруженные файлы</h5>
                        <button class="btn btn-outline-black btn-sm" id="uploadFileBtn">Загрузить</button>
                    </div>
                    <div id="filesList">
                    </div>
                </div>

                <div id="commentsTab" style="display: none;">
                    <div id="commentsList" style="max-height: 400px; overflow-y: auto; padding-right: 10px;">
                    </div>
                    <div class="comment-input-area">
                        <input type="text" class="form-control" id="commentInput" placeholder="Написать комментарий...">
                        <button class="btn btn-outline-black px-4" id="sendComment">Отправить</button>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <h5 class="fw-bold mb-3">Команда</h5>
                <div id="teamList">
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/project.js"></script>
</body>
</html>
