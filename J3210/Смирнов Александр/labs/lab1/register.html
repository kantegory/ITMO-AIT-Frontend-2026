<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - Models & Datasets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main-content" class="container" tabindex="-1">
        <h1 class="visually-hidden">Registration</h1>
        <div class="form-container">
            <h2 class="text-center mb-4">Register</h2>
            <form id="register-form" action="login.html">
                <div class="mb-3">
                    <label for="register-username" class="form-label">Username</label>
                    <input type="text" id="register-username" class="form-control" autocomplete="username" required>
                </div>
                <div class="mb-3">
                    <label for="register-email" class="form-label">Email</label>
                    <input type="email" id="register-email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="register-password" class="form-label">Password</label>
                    <input type="password" id="register-password" class="form-control" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Create account</button>
            </form>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
