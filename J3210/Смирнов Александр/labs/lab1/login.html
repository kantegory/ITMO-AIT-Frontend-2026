<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - Models & Datasets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="site-header"></div>

    <!-- Content -->
    <main id="main-content" class="container" tabindex="-1">
        <h1 class="visually-hidden">Log in</h1>
        <div class="form-container">
            <h2 class="text-center mb-4">Log in</h2>
            <form id="login-form" action="profile.html">
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email</label>
                    <input type="email" id="login-email" class="form-control" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="login-password" class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-control" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>
            <p class="text-center mt-3">
                Don't have an account? <a href="register.html">Sign up</a>
            </p>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
