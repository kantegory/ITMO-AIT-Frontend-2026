<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - Models & Datasets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="container">
        <div class="row">
            <!-- User sidebar -->
            <div class="col-md-4">
                <div class="item-card text-center">
                    <div class="bg-secondary text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 80px; height: 80px; font-size: 24px;">
                        <span id="profile-initials">SU</span>
                    </div>
                    <h3 id="profile-name">Student User</h3>
                    <p class="text-muted" id="profile-email">student@itmo.ru</p>
                    <button id="edit-profile-btn" class="btn btn-outline-primary btn-sm w-100" data-bs-toggle="modal" data-bs-target="#editProfileModal">Edit Profile</button>
                </div>
            </div>

            <div class="col-md-8">
                <!-- Bootstrap Tabs -->
                <ul class="nav nav-tabs mb-4" id="profileTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active text-dark" id="uploads-tab" data-bs-toggle="tab" data-bs-target="#uploads" type="button" role="tab" aria-controls="uploads" aria-selected="true">My Uploads</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link text-dark" id="subscriptions-tab" data-bs-toggle="tab" data-bs-target="#subscriptions" type="button" role="tab" aria-controls="subscriptions" aria-selected="false">Subscriptions</button>
                    </li>
                </ul>

                <div class="tab-content" id="profileTabsContent">
                    <div class="tab-pane fade show active" id="uploads" role="tabpanel" aria-labelledby="uploads-tab">
                        <div class="item-card">
                            <h5 class="mb-3">Upload model or dataset</h5>
                            <form id="upload-form">
                                <div class="row g-3">
                                    <div class="col-md-4">
                                        <label for="upload-type" class="form-label">Type</label>
                                        <select id="upload-type" class="form-select" required>
                                            <option value="model">Model</option>
                                            <option value="dataset">Dataset</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="upload-task" class="form-label">Task</label>
                                        <select id="upload-task" class="form-select" required>
                                            <option value="cv">Computer Vision</option>
                                            <option value="nlp">NLP</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label for="upload-license" class="form-label">License</label>
                                        <select id="upload-license" class="form-select" required>
                                            <option value="mit">MIT</option>
                                            <option value="apache">Apache 2.0</option>
                                            <option value="cc">Creative Commons</option>
                                        </select>
                                    </div>

                                    <div class="col-12">
                                        <label for="upload-name" class="form-label">Name</label>
                                        <input type="text" id="upload-name" class="form-control" placeholder="My-awesome-model" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="upload-framework" class="form-label">Framework</label>
                                        <input type="text" id="upload-framework" class="form-control" placeholder="pytorch / tensorflow / none">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="upload-file" class="form-label">File</label>
                                        <input type="file" id="upload-file" class="form-control" required>
                                    </div>

                                    <div class="col-12">
                                        <label for="upload-short-desc" class="form-label">Short description</label>
                                        <input type="text" id="upload-short-desc" class="form-control" maxlength="160" required>
                                    </div>

                                    <div class="col-12">
                                        <label for="upload-full-desc" class="form-label">Detailed description</label>
                                        <textarea id="upload-full-desc" class="form-control" rows="4" required></textarea>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary mt-3">Upload</button>
                            </form>
                        </div>

                        <div id="my-uploads-list"></div>
                    </div>
                    
                    <div class="tab-pane fade" id="subscriptions" role="tabpanel" aria-labelledby="subscriptions-tab">
                            <div id="subscriptions-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editProfileModalLabel">Edit Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <label for="edit-name-input" class="form-label">Username</label>
                    <input type="text" id="edit-name-input" class="form-control" placeholder="Enter new username">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="save-profile-btn" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
