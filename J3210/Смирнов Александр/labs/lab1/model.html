<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Hub - Models & Datasets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="site-header"></div>

    <main id="main-content" class="container" tabindex="-1">
        <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 id="detail-name">Loading...</h1>
            <p class="text-muted"><span id="detail-type" class="badge bg-primary">...</span></p>
        </div>
        <div>
            <button type="button" class="btn btn-outline-secondary" id="detail-stars" aria-label="Add star">Star</button>
            <button type="button" class="btn btn-outline-primary ms-2" id="btn-subscribe" style="display: none;" aria-label="Subscribe to updates">Subscribe</button>
        </div>
    </div>

        <div class="row">
            <div class="col-md-8">
                <div class="item-card">
                    <h4>Description</h4>
                    <p id="detail-desc">...</p>
                    
                    <h4 class="mt-4">Usage Example</h4>
                    <pre class="bg-light p-3 border rounded"><code id="detail-usage">...</code></pre>
                </div>
                <div class="mt-4">
                    <h4>Discussions & Reproducibility</h4>
                    <div class="item-card mb-3">
                        <div id="comments-list" aria-live="polite"></div>
                        
                        <div class="mt-3">
                            <label for="comment-input" class="form-label">Comment</label>
                            <textarea id="comment-input" class="form-control mb-2" rows="2" placeholder="Start a discussion..."></textarea>
                            <button type="button" id="post-comment-btn" class="btn btn-sm btn-primary">Post Comment</button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="item-card">
                    <h4>Metadata</h4>
                    <ul class="list-unstyled">
                        <li class="mb-2"><strong>License:</strong> <span id="detail-lic">...</span></li>
                        <li class="mb-2"><strong>Size:</strong> <span id="detail-size">...</span></li>
                        <li class="mb-2"><strong>Task:</strong> <span id="detail-task">...</span></li>
                        <li class="mb-2"><strong>Framework:</strong> <span id="detail-fw">...</span></li>
                        <li class="mb-2"><strong>Metrics:</strong> <br><span id="detail-metrics" class="text-success fw-bold">...</span></li>
                    </ul>
                    <button type="button" id="detail-download-btn" class="btn btn-primary w-100 mt-3" aria-label="Download item">Download (<span id="detail-dl">...</span>)</button>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="js/pages/model.js"></script>
</body>
</html>
