<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — EventTix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html">EventTix</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">Мероприятия</a></li>
          </ul>
          <div class="d-flex gap-2">
            <a href="login.html" class="btn btn-outline-secondary">Войти</a>
            <a href="register.html" class="btn btn-brand active" aria-current="page">Регистрация</a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="container">
    <div class="card auth-card p-4 shadow-sm">
      <h1 class="h3 mb-4 text-center">Регистрация</h1>

      <form novalidate>
        <div class="mb-3">
          <label for="regName" class="form-label">Имя</label>
          <input type="text" id="regName" name="name" class="form-control" required autocomplete="name">
        </div>
        <div class="mb-3">
          <label for="regEmail" class="form-label">Email</label>
          <input type="email" id="regEmail" name="email" class="form-control" required autocomplete="email">
        </div>
        <div class="mb-3">
          <label for="regPassword" class="form-label">Пароль</label>
          <input type="password" id="regPassword" name="password" class="form-control" required autocomplete="new-password" minlength="8">
          <div class="form-text">Минимум 8 символов.</div>
        </div>
        <div class="mb-3">
          <label for="regPasswordConfirm" class="form-label">Повторите пароль</label>
          <input type="password" id="regPasswordConfirm" name="passwordConfirm" class="form-control" required autocomplete="new-password">
        </div>

        <fieldset class="mb-3">
          <legend class="form-label h6">Тип аккаунта</legend>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="accountType" id="typeVisitor" value="visitor" checked>
            <label class="form-check-label" for="typeVisitor">Посетитель — хочу покупать билеты</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="accountType" id="typeOrganizer" value="organizer">
            <label class="form-check-label" for="typeOrganizer">Организатор — хочу создавать мероприятия</label>
          </div>
        </fieldset>

        <div class="mb-3 form-check">
          <input type="checkbox" id="agreeTerms" class="form-check-input" required>
          <label for="agreeTerms" class="form-check-label">Согласен с условиями использования</label>
        </div>

        <button type="submit" class="btn btn-brand w-100">Зарегистрироваться</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Уже есть аккаунт? <a href="login.html">Войти</a>
      </p>
    </div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-muted">© 2026 EventTix</span>
      <a href="#main" class="text-muted">Наверх</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
