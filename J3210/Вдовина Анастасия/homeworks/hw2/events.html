<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <title>Мероприятия — EventTix</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Перейти к основному содержимому</a>

  <header>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm" aria-label="Основная навигация">
      <div class="container">
        <a class="navbar-brand" href="index.html">EventTix</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="events.html">Мероприятия</a></li>
          </ul>
          <div class="d-flex gap-2 js-auth-buttons">
            <a href="login.html" class="btn btn-outline-secondary">Войти</a>
            <a href="register.html" class="btn btn-brand">Регистрация</a>
          </div>
          <div class="dropdown js-user-menu d-none">
            <button class="btn btn-outline-secondary dropdown-toggle js-user-name" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              Аккаунт
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Личный кабинет</a></li>
              <li><a class="dropdown-item js-organizer-link" href="organizer.html">Кабинет организатора</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item js-logout" href="login.html">Выйти</a></li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main id="main" class="container py-5">
    <h1 class="mb-4">Мероприятия</h1>

    <form class="row g-3 align-items-end mb-4 js-filters-form" role="search" aria-label="Фильтр мероприятий">
      <div class="col-12 col-md-4 col-lg-3">
        <label for="filterQuery" class="form-label">Поиск по названию</label>
        <input type="search" id="filterQuery" name="q" class="form-control" placeholder="Например: Москва или Пицца">
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <label for="filterType" class="form-label">Тип</label>
        <select id="filterType" name="type" class="form-select">
          <option value="">Любой</option>
          <option value="concert">Концерт</option>
          <option value="festival">Фестиваль</option>
        </select>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <label for="filterCity" class="form-label">Город</label>
        <select id="filterCity" name="city" class="form-select">
          <option value="">Любой</option>
          <option value="spb">Санкт-Петербург</option>
          <option value="msk">Москва</option>
          <option value="suzdal">Суздаль</option>
          <option value="istra">Истра</option>
          <option value="izhevsk">Ижевск</option>
          <option value="tver">Тверь</option>
          <option value="kamyshin">Камышин</option>
          <option value="tomsk">Томск</option>
          <option value="krapivna">Крапивна</option>
          <option value="kologriv">Кологрив</option>
          <option value="molebka">Молёбка</option>
        </select>
      </div>
      <div class="col-6 col-md-4 col-lg-2">
        <label for="filterDate" class="form-label">Дата, от</label>
        <input type="date" id="filterDate" name="date" class="form-control" min="2026-09-01" max="2026-12-31">
      </div>
      <div class="col-6 col-md-8 col-lg-3 d-flex gap-2">
        <button type="submit" class="btn btn-brand flex-fill">Применить</button>
        <button type="reset" class="btn btn-outline-secondary">Сбросить</button>
      </div>
    </form>

    <div class="js-loading text-center py-5">
      <div class="spinner-border text-secondary" role="status"></div>
      <p class="text-muted mt-2 mb-0">Загружаем мероприятия…</p>
    </div>

    <p class="js-empty-state d-none text-muted">По заданным фильтрам мероприятий не найдено. Попробуйте изменить параметры поиска.</p>

    <div class="row g-4 js-events-grid" aria-live="polite">
      <!-- Карточки мероприятий рендерятся динамически из json-server (см. js/events.js) -->
    </div>
  </main>

  <footer class="py-4 mt-5">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
      <span class="text-muted">© 2026 EventTix</span>
      <a href="#main" class="text-muted">Наверх</a>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
