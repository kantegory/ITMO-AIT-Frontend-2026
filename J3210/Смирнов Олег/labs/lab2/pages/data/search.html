<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Поиск ML-моделей и датасетов на AI Hub.">
  <title>Поиск — AI Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
  <script src="../../assets/js/theme.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

  <nav class="navbar navbar-expand-lg sticky-top" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand" href="../../index.html"><i class="bi bi-cpu" aria-hidden="true"></i> AI Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" id="navModels" href="search.html#models">Модели</a></li>
          <li class="nav-item"><a class="nav-link" id="navDatasets" href="search.html#datasets">Датасеты</a></li>
        </ul>
        <div id="navbarActions"></div>
      </div>
    </div>
  </nav>

  <main id="main-content" class="py-4">
    <div class="container">
      <h1 class="h4 mb-3" id="pageTitle">Поиск</h1>
      <div class="input-group search-box mb-3">
        <span class="input-group-text bg-transparent"><i class="bi bi-search" aria-hidden="true"></i></span>
        <label for="searchInput" class="visually-hidden">Поиск</label>
        <input type="text" class="form-control" placeholder="Название, задача или автор..." id="searchInput">
      </div>

      <div class="d-flex align-items-center gap-3 mb-2 flex-wrap">
        <label for="sortSelect" class="visually-hidden">Сортировка</label>
        <select class="form-select form-select-sm w-auto" id="sortSelect">
          <option value="">Сортировка</option>
          <option value="stars">По звёздочкам</option>
          <option value="downloads">По загрузкам</option>
        </select>
        <div id="tagFilters" class="d-flex flex-wrap gap-2"></div>
      </div>

      <div class="row">
        <section class="col-12">
          <p class="text-muted small mb-3" aria-live="polite">Найдено: <span id="resultsCount">0</span></p>
          <div class="row g-3" id="cardList" aria-live="polite"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-4">
    <div class="container text-center">
      <small class="text-muted">&copy; 2026 AI Hub</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/search.js?v=3"></script>
  <script>window.APP_PATHS = { home: '../../index.html', login: '../auth/login.html', register: '../auth/register.html', dashboard: '../dashboard/dashboard.html' };</script>
  <script src="../../assets/js/ui.js"></script>
</body>
</html>
