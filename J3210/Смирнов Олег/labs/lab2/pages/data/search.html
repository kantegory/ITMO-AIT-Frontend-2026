<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск — AI Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="../../index.html"><i class="bi bi-cpu"></i> AI Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" id="navModels" href="search.html?type=models">Модели</a></li>
          <li class="nav-item"><a class="nav-link" id="navDatasets" href="search.html?type=datasets">Датасеты</a></li>
        </ul>
        <div id="navbarActions"></div>
      </div>
    </div>
  </nav>

  <main class="py-4">
    <div class="container">
      <h1 class="h4 mb-3">Поиск</h1>
      <div class="input-group search-box mb-4">
        <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
        <input type="text" class="form-control" placeholder="Название, задача или автор..." id="searchInput">
      </div>

      <div class="d-flex gap-3 mb-3">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="type" id="typeAll" value="all">
          <label class="form-check-label" for="typeAll">Все</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="type" id="typeModels" value="models">
          <label class="form-check-label" for="typeModels">Модели</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="type" id="typeDatasets" value="datasets">
          <label class="form-check-label" for="typeDatasets">Датасеты</label>
        </div>
      </div>

      <div class="row">
        <section class="col-12">
          <p class="text-muted small mb-3">Найдено: <span id="resultsCount">0</span></p>
          <div class="row g-3" id="cardList"></div>
        </section>
      </div>
    </div>
  </main>

  <footer class="py-4 mt-4">
    <div class="container text-center">
      <small class="text-muted">&copy; 2026 AI Hub</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/main.js"></script>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/search.js"></script>
  <script>window.APP_PATHS = { home: '../../index.html', login: '../auth/login.html', register: '../auth/register.html' };</script>
  <script src="../../assets/js/ui.js"></script>
</body>
</html>
