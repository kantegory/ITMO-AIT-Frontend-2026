<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="../../assets/css/style.css" rel="stylesheet">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

  <nav class="navbar navbar-expand-lg sticky-top" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand" href="../../index.html"><i class="bi bi-cpu" aria-hidden="true"></i> AI Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="../../index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="../data/search.html#models">Модели</a></li>
          <li class="nav-item"><a class="nav-link" href="../data/search.html#datasets">Датасеты</a></li>
        </ul>
        <div id="navbarActions"></div>
      </div>
    </div>
  </nav>

  <main id="main-content" class="d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="text-center mb-4">
            <h1 class="h3">Вход</h1>
            <p class="text-muted">Войдите в свой аккаунт</p>
          </div>
          <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Пароль</label>
              <input type="password" class="form-control" id="password" placeholder="Ваш пароль" required>
            </div>
            <button type="submit" class="btn btn-accent w-100">Войти</button>
          </form>
          <p class="text-center text-muted small mt-4">
            Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-4">
    <div class="container text-center">
      <small class="text-muted">&copy; 2026 AI Hub</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
