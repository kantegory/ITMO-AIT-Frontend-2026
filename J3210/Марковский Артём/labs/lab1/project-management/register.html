<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskHub — Регистрация</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="register">
    <header class="site-header">
      <div class="container header-row">
        <a href="index.html"><strong>TaskHub</strong></a>
        <nav class="nav-links">
          <a href="index.html">Вход</a>
          <a href="register.html">Регистрация</a>
          <a href="dashboard.html">Личный кабинет</a>
          <a href="search.html">Поиск</a>
          <a href="faq.html">Справка</a>
        </nav>
      </div>
    </header>
    <main class="page-section">
      <div class="container layout-stack">
        <section class="grid-2">
          <article class="hero-panel">
            <div class="eyebrow">Регистрация</div>
            <h1 class="hero-title">Создание аккаунта</h1>
            <p class="hero-text">После регистрации пользователь получает доступ к проектам, задачам, поиску и справке по разделам.</p>
          </article>
          <section class="panel-card">
            <div class="eyebrow">Новый пользователь</div>
            <h2 class="section-title">Заполните данные</h2>
            <div class="grid-2">
              <div><label class="form-label">Имя</label><input class="form-control" /></div>
              <div><label class="form-label">Фамилия</label><input class="form-control" /></div>
            </div>
            <label class="form-label" style="margin-top:14px;">Email</label>
            <input class="form-control" />
            <div class="grid-2" style="margin-top:14px;">
              <div><label class="form-label">Пароль</label><input class="form-control" type="password" /></div>
              <div><label class="form-label">Повтор пароля</label><input class="form-control" type="password" /></div>
            </div>
            <div class="actions" style="margin-top:16px;">
              <button class="btn btn-primary" type="button">Создать аккаунт</button>
            </div>
          </section>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container footer-row">
        <div>TaskHub</div>
        <div>Учебный сервис для работы с проектами</div>
      </div>
    </footer>
    <script src="js/app-core.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/project-page.js"></script>
    <script src="js/search-page.js"></script>
    <script src="js/init.js"></script>
  </body>
</html>
