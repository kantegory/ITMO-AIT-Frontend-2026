<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskHub — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="index">
    <header class="site-header">
      <div class="container header-row">
        <a href="index.html"><strong>TaskHub</strong></a>
        <nav class="nav-links">
          <a href="index.html">Вход</a>
          <a href="register.html">Регистрация</a>
          <a href="dashboard.html">Личный кабинет</a>
          <a href="search.html">Поиск</a>
          <a href="faq.html">Справка</a>
        </nav>
      </div>
    </header>
    <main class="page-section">
      <div class="container layout-stack">
        <section class="grid-2">
          <article class="hero-panel">
            <div class="eyebrow">TaskHub</div>
            <h1 class="hero-title">Сервис для работы с проектами и задачами</h1>
            <p class="hero-text">В одной панели можно открыть проект, посмотреть статус задач и быстро перейти к нужному разделу.</p>
          </article>
          <section class="panel-card">
            <div class="eyebrow">Вход</div>
            <h2 class="section-title">Войти в аккаунт</h2>
            <label class="form-label" for="loginEmail">Email</label>
            <input class="form-control" id="loginEmail" type="email" placeholder="name@example.com" />
            <label class="form-label" for="loginPassword" style="margin-top:14px;">Пароль</label>
            <input class="form-control" id="loginPassword" type="password" placeholder="Введите пароль" />
            <div class="actions" style="margin-top:16px;">
              <button class="btn btn-primary" type="button">Войти</button>
              <a class="btn btn-light" href="register.html">Регистрация</a>
            </div>
          </section>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container footer-row">
        <div>TaskHub</div>
        <div>Учебный сервис для работы с проектами</div>
      </div>
    </footer>
    <script src="js/app-core.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/project-page.js"></script>
    <script src="js/search-page.js"></script>
    <script src="js/init.js"></script>
  </body>
</html>
