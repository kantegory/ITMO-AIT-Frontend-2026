<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskHub — Поиск</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="search">
    <header class="site-header">
      <nav class="navbar navbar-expand-lg app-navbar">
        <div class="container">
          <a class="navbar-brand app-brand" href="dashboard.html">TaskHub</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#userNav"
            aria-controls="userNav"
            aria-expanded="false"
            aria-label="Меню"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="userNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
              <li class="nav-item">
                <a class="nav-link" href="dashboard.html">Личный кабинет</a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  href="dashboard.html#projectsSection"
                  data-nav-group="projects"
                  >Проекты</a
                >
              </li>
              <li class="nav-item">
                <a class="nav-link" href="search.html">Поиск</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="faq.html">Справка</a>
              </li>
              <li class="nav-item user-chip">
                <span id="headerUserName">Марковский Артём</span>
              </li>
              <li class="nav-item">
                <a class="btn btn-light btn-sm logout-link" href="index.html"
                  >Выйти</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="page-section">
      <div class="container layout-stack">
        <section class="panel-card">
          <div class="eyebrow">Поиск</div>
          <h1 class="section-title section-title-lg">Поиск по задачам</h1>
          <div class="row g-3 align-items-end mt-1">
            <div class="col-lg-4">
              <label class="form-label" for="searchQuery"
                >Что ищем</label
              >
              <input
                class="form-control"
                id="searchQuery"
                type="text"
                placeholder="Например: регистрация или Sprint"
              />
            </div>
            <div class="col-md-4 col-lg-2">
              <label class="form-label" for="statusFilter">Статус</label>
              <select class="form-select" id="statusFilter">
                <option value="all">Все</option>
                <option value="Новая">Новая</option>
                <option value="В работе">В работе</option>
                <option value="На проверке">На проверке</option>
                <option value="Завершено">Завершено</option>
              </select>
            </div>
            <div class="col-md-4 col-lg-2">
              <label class="form-label" for="priorityFilter">Приоритет</label>
              <select class="form-select" id="priorityFilter">
                <option value="all">Все</option>
                <option value="Высокий">Высокий</option>
                <option value="Средний">Средний</option>
                <option value="Низкий">Низкий</option>
              </select>
            </div>
            <div class="col-md-4 col-lg-2">
              <label class="form-label" for="assigneeFilter">Исполнитель</label>
              <select class="form-select" id="assigneeFilter">
                <option value="all">Все</option>
              </select>
            </div>
            <div class="col-lg-2 d-grid">
              <button
                class="btn btn-primary"
                id="applySearchButton"
                type="button"
              >
                Применить
              </button>
            </div>
          </div>
        </section>

        <section>
          <div class="section-head">
            <div>
              <div class="eyebrow">Результаты</div>
              <h2 class="section-title">Найденные задачи</h2>
            </div>
            <span class="soft-badge" id="searchResultCount">0 результатов</span>
          </div>
          <div class="row g-4" id="searchResults"></div>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-row">
        <div>
          <div class="footer-brand">TaskHub</div>
          <div class="footer-text">Поиск по задачам</div>
        </div>
        <div class="footer-text">Фильтры и быстрый переход в проект</div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

      <script src="js/app-core.js"></script>
    <script src="js/search-page.js"></script>
    <script src="js/init.js"></script>
  </body>
</html>
