<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">Online Courses</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="courses.html">Курсы</a>
                <a href="login.html">Вход</a>
                <a href="register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    <section class="form-page">
        <div class="form-box">
            <h2>Вход</h2>
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Введите email">
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="Введите пароль">
                </div>

                <button type="button" class="btn" style="width: 100%; text-align: center; border: none; cursor: pointer;">Войти</button>
                    <p>Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                </div>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 Online Courses</p>
        </div>
    </footer>
    <script type="module" src="assets/js/app.js"></script>

</body>
</html>
