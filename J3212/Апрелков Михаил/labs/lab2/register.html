<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tripatropa — Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    (function () {
      try {
        if (localStorage.getItem("tripatropa-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
</head>

<body class="auth-page bg-light">
  <div class="position-fixed top-0 end-0 p-2 p-md-3" style="z-index: 1050">
    <button type="button" class="btn btn-outline-secondary btn-sm theme-toggle" id="themeToggle"
      aria-label="Переключить на тёмную или светлую тему" title="Тема оформления">
      <svg class="icon-svg theme-icon-when-light" aria-hidden="true">
        <use href="images/sprite.svg#icon-moon-stars-fill"></use>
      </svg>
      <svg class="icon-svg theme-icon-when-dark" aria-hidden="true">
        <use href="images/sprite.svg#icon-brightness-high-fill"></use>
      </svg>
    </button>
  </div>
  <main class="container d-flex align-items-center justify-content-center py-5">
    <section class="auth-card card tripatropa-card p-4 p-md-5 bg-white" aria-labelledby="register-title">
      <header class="text-center mb-4">
        <div
          class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle text-primary mb-3"
          style="width: 52px; height: 52px">
          <svg class="icon-svg icon-svg--xl text-primary" aria-hidden="true"><use href="images/sprite.svg#icon-compass"></use></svg>
        </div>
        <h1 class="h4 mb-1" id="register-title">Создайте аккаунт Tripatropa</h1>
        <p class="text-muted mb-0">
          Сохраняйте маршруты и путешествуйте осознанно
        </p>
      </header>

      <form>
        <div class="mb-3">
          <label for="registerName" class="form-label">Имя</label>
          <input type="text" class="form-control" id="registerName" placeholder="Анна Петрова" required
            autocomplete="name" />
        </div>
        <div class="mb-3">
          <label for="registerEmail" class="form-label">Email</label>
          <input type="email" class="form-control" id="registerEmail" placeholder="you@example.com" required
            autocomplete="email" />
        </div>
        <div class="mb-3">
          <label for="registerPassword" class="form-label">Пароль</label>
          <input type="password" class="form-control" id="registerPassword" placeholder="••••••••" required
            autocomplete="new-password" />
        </div>
        <div class="mb-3">
          <label for="registerPasswordConfirm" class="form-label">
            Подтверждение пароля
          </label>
          <input type="password" class="form-control" id="registerPasswordConfirm" placeholder="••••••••" required
            autocomplete="new-password" />
        </div>
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" value="" id="agreeTerms" required />
          <label class="form-check-label" for="agreeTerms">
            Я принимаю условия использования сервиса
          </label>
        </div>
        <div class="d-grid mb-3">
          <button type="submit" class="btn btn-primary">
            Создать аккаунт
          </button>
        </div>
        <p class="mb-0 text-center text-muted-sm">
          Уже есть аккаунт?
          <a href="login.html" class="text-decoration-none">Войти</a>
        </p>
      </form>

      <div class="mt-4 text-center">
        <a href="search.html" class="small text-decoration-none">
          <- Вернуться к поиску направлений </a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="js/core.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
  <script src="js/destination.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/collaboration.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
