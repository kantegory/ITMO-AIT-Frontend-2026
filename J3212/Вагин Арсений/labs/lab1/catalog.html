<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог | CONSISTENT AIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">CONSISTENT AIR</a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="collections.html">Коллекции</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">О бренде</a></li>
                    
                    <li class="nav-item ms-lg-4">
                        <a class="nav-link d-flex align-items-center gap-2" href="catalog.html">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <span class="d-lg-none">Поиск</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="login.html">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <span class="d-lg-none">Профиль</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link d-flex align-items-center gap-2" href="cart.html">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            <span class="d-lg-none">Корзина</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-4">
        <div class="row mb-5">
            <div class="col-12 d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
                <h1 class="h3 mb-0">Каталог</h1>
                <span class="text-muted small">Showing 12 products</span>
            </div>
        </div>

        <div class="row">
            <aside class="col-lg-3 mb-5 pe-lg-5">
                <form id="filterForm">
                    <div class="mb-5">
                        <div class="input-group border-bottom border-dark">
                            <input type="text" class="form-control border-0 px-0 shadow-none bg-transparent" placeholder="Search items..." style="border-radius: 0;">
                            <button class="btn btn-link border-0 text-dark px-0 shadow-none" type="button">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <h4 class="filter-title">Коллекция</h4>
                        <select class="form-select">
                            <option value="all">Все коллекции</option>
                            <option value="sapporo">SAPPORO 26 SS</option>
                            <option value="edelweiss">EDELWEISS 26 SS</option>
                            <option value="oslo">OSLO 26 FW</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <h4 class="filter-title">Категория</h4>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="cat1">
                            <label class="form-check-label" for="cat1">Jackets</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="cat2">
                            <label class="form-check-label" for="cat2">Shirts</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" id="cat3">
                            <label class="form-check-label" for="cat3">Pants</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <h4 class="filter-title">Размер</h4>
                        <div class="d-flex gap-2">
                            <input type="button" class="btn btn-outline-secondary btn-sm rounded-0 w-100" value="S">
                            <input type="button" class="btn btn-outline-secondary btn-sm rounded-0 w-100" value="M">
                            <input type="button" class="btn btn-outline-secondary btn-sm rounded-0 w-100" value="L">
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary-ca w-100 mt-3" onclick="applyFilters()">Применить</button>
                </form>
            </aside>

            <main class="col-lg-9">
                <div class="row" id="productGrid">
                    <div class="col-md-6 mb-4">
                        <article class="card product-card">
                            <div class="img-wrapper">
                                <img src="https://ido.in.ua/15123/rubashka-dlya-malchika-ido-podrostka-klassika-belaya-41704000113.jpg?auto=format&fit=crop&q=80&w=600" class="card-img-top" alt="Overshirt">
                                <button class="btn btn-outline-ca quick-view-btn" onclick="openProductModal('Overshirt', 'CA-S26-004', '5 800 ₽')">Быстрый просмотр</button>
                            </div>
                            <div class="card-body">
                                <p class="product-code">CA-S26-004 | SAPPORO 26 SS</p>
                                <h5 class="card-title">Overshirt</h5>
                                <p class="card-text">5 800 ₽</p>
                            </div>
                        </article>
                    </div>
                    <div class="col-md-6 mb-4">
                        <article class="card product-card">
                            <div class="img-wrapper">
                                <img src="https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&q=80&w=600" class="card-img-top" alt="Minimal Hoodie">
                                <button class="btn btn-outline-ca quick-view-btn" onclick="openProductModal('Minimal Hoodie', 'CA-S26-012', '7 200 ₽')">Быстрый просмотр</button>
                            </div>
                            <div class="card-body">
                                <p class="product-code">CA-S26-012 | EDELWEISS 26 SS</p>
                                <h5 class="card-title">Minimal Hoodie</h5>
                                <p class="card-text">7 200 ₽</p>
                            </div>
                        </article>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-0 border-0">
                <div class="modal-header border-0 pb-0">
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body px-5 pb-5 text-center">
                    <p id="modalCode" class="text-muted small mb-2"></p>
                    <h3 class="modal-title mb-3" id="modalTitle">Название товара</h3>
                    <p class="fs-4 mb-4" id="modalPrice"></p>
                    <select class="form-select mb-4 rounded-0">
                        <option selected disabled>Выберите размер</option>
                        <option>S</option>
                        <option>M</option>
                        <option>L</option>
                    </select>
                    <button type="button" class="btn btn-primary-ca w-100">Добавить в корзину</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
