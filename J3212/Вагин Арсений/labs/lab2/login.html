<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | CONSISTENT AIR</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container justify-content-center">
            <a class="navbar-brand m-0" href="index.html">CONSISTENT AIR</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <h2 class="text-center mb-5">Sign In</h2>

                    <form id="loginForm">
                        <div class="mb-4">
                            <label class="form-label text-muted small text-uppercase">Email</label>
                            <input type="email" class="form-control" id="emailInput" required placeholder="your@email.com">
                        </div>
                        <div class="mb-5">
                            <label class="form-label text-muted small text-uppercase d-flex justify-content-between">
                                <span>Пароль</span>
                                <a href="#" class="text-muted text-decoration-none text-lowercase">forgot?</a>
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control border-end-0" id="passwordInput" required minlength="4" placeholder="Min 4 characters">
                                <button class="btn border border-start-0 bg-white text-muted" type="button" id="togglePassword">
                                    Show
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary-ca w-100 mb-3">Sign In</button>
                    </form>

                    <div class="text-center mt-4">
                        <a href="register.html" class="text-dark text-decoration-none small">Don't have an account? Register</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
