<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет — Касса.ру</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

<header>
    <nav class="navbar navbar-expand site-navbar" aria-label="Основная навигация">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Касса.ру — перейти на главную страницу">Касса.ру</a>
            <div id="authButtons" aria-label="Авторизация и профиль"></div>
        </div>
    </nav>
</header>

<main id="main-content" class="container mt-5" tabindex="-1">
    <h1 class="mb-4">Личный кабинет</h1>
    <section aria-labelledby="profile-title" class="mb-4">
        <h2 id="profile-title" class="visually-hidden">Информация о пользователе</h2>
        <div id="profileInfo"></div>
    </section>

    <section id="organizerSection" style="display:none;" class="mb-5" aria-labelledby="organizer-title">
        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
            <h2 class="mb-0" id="organizer-title">Мои мероприятия</h2>
            <button type="button" class="btn btn-success" onclick="openAddEventModal()" aria-controls="addEventModal"><span class="btn-icon"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ticket" xlink:href="assets/icons.svg#ticket"></use></svg><span>Добавить мероприятие</span></span></button>
        </div>
        <div id="organizerEventsList" aria-live="polite"></div>
    </section>

    <section aria-labelledby="tickets-title">
        <h2 class="mb-3 section-title-with-icon" id="tickets-title"><svg class="ui-icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#ticket" xlink:href="assets/icons.svg#ticket"></use></svg><span>Мои билеты</span></h2>
        <div id="ticketsContainer" aria-live="polite"></div>
    </section>
</main>

<div class="modal fade" id="addEventModal" tabindex="-1" aria-labelledby="addEventModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <form id="createEventForm" onsubmit="createEvent(event)" aria-label="Форма создания мероприятия">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="addEventModalTitle">Новое мероприятие</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть окно"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="eventTitle" class="form-label">Название мероприятия</label>
                            <input type="text" id="eventTitle" class="form-control" required aria-required="true">
                        </div>
                        <div class="col-md-6">
                            <label for="eventType" class="form-label">Тип мероприятия</label>
                            <select id="eventType" class="form-select" aria-label="Выберите тип мероприятия">
                                <option value="concert">Концерт</option>
                                <option value="theatre">Театр</option>
                                <option value="exhibition">Выставка</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="eventCity" class="form-label">Город</label>
                            <input type="text" id="eventCity" class="form-control" autocomplete="address-level2" required aria-required="true">
                        </div>
                        <div class="col-md-4">
                            <label for="eventDate" class="form-label">Дата</label>
                            <input type="text" id="eventDate" class="form-control" placeholder="Например: 15 апреля" required aria-required="true">
                        </div>
                        <div class="col-md-4">
                            <label for="eventPlace" class="form-label">Место проведения</label>
                            <input type="text" id="eventPlace" class="form-control" required aria-required="true">
                        </div>
                        <div class="col-12">
                            <label for="eventImage" class="form-label">Ссылка на изображение</label>
                            <input type="url" id="eventImage" class="form-control" inputmode="url" required aria-required="true">
                        </div>
                        <div class="col-12">
                            <label for="eventDescription" class="form-label">Описание</label>
                            <textarea id="eventDescription" class="form-control" rows="4" required aria-required="true"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-success">Сохранить мероприятие</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="mainToastTitle">Уведомление</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Закрыть уведомление"></button>
        </div>
        <div class="toast-body" id="mainToastBody">Сообщение</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
