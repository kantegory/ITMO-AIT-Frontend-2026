<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Касса.ру</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

<header>
    <nav class="navbar navbar-dark bg-dark" aria-label="Основная навигация">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Касса.ру — перейти на главную страницу">Касса.ру</a>
            <div id="authButtons" aria-label="Авторизация и профиль"></div>
        </div>
    </nav>
</header>

<main id="main-content" class="container mt-5" tabindex="-1">
    <div class="card auth-card p-4">
        <h1 class="mb-4">Регистрация</h1>
        <form onsubmit="registerUser(event)" aria-label="Форма регистрации">
            <div class="mb-3">
                <label for="registerName" class="form-label">Имя</label>
                <input type="text" id="registerName" class="form-control" autocomplete="name" required aria-required="true">
            </div>
            <div class="mb-3">
                <label for="registerEmail" class="form-label">Email</label>
                <input type="email" id="registerEmail" class="form-control" autocomplete="email" required aria-required="true">
            </div>
            <div class="mb-3">
                <label for="registerPassword" class="form-label">Пароль</label>
                <input type="password" id="registerPassword" class="form-control" autocomplete="new-password" required aria-required="true">
            </div>
            <div class="mb-4">
                <label for="registerRole" class="form-label">Тип аккаунта</label>
                <select id="registerRole" class="form-select" aria-label="Выберите тип аккаунта">
                    <option value="user">Пользователь</option>
                    <option value="organizer">Организатор</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success w-100">Зарегистрироваться</button>
        </form>
    </div>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="mainToastTitle">Уведомление</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Закрыть уведомление"></button>
        </div>
        <div class="toast-body" id="mainToastBody">Сообщение</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
