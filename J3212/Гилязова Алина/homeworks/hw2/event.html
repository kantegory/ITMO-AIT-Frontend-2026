<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка мероприятия — Касса.ру</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

<header>
    <nav class="navbar navbar-dark bg-dark" aria-label="Основная навигация">
        <div class="container">
            <a class="navbar-brand" href="index.html" aria-label="Касса.ру — перейти на главную страницу">Касса.ру</a>
            <div id="authButtons" aria-label="Авторизация и профиль"></div>
        </div>
    </nav>
</header>

<main id="main-content" class="container mt-4" tabindex="-1">
    <article aria-labelledby="eventPageTitle">
        <div class="card hero-card border-0 shadow-sm">
            <img id="eventHeroImage" class="event-hero-image" alt="Изображение мероприятия">
        </div>

        <div class="card border-0 shadow-sm p-4 event-content-card">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
                <span class="badge text-bg-light" id="eventPageType">Мероприятие</span>
            </div>
            <h1 class="mb-2" id="eventPageTitle">Название мероприятия</h1>
            <p class="text-muted mb-3" id="eventPageMeta"></p>
            <p class="mb-4" id="eventPageDescription"></p>
            <div>
                <button id="buyTicketButton" type="button" class="btn btn-success" onclick="buyTicketFromPage()" aria-label="Купить билет на выбранное мероприятие">Купить билет</button>
            </div>
        </div>
    </article>
</main>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="mainToastTitle">Уведомление</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Закрыть уведомление"></button>
        </div>
        <div class="toast-body" id="mainToastBody">Сообщение</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
