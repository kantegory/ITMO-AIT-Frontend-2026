<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Личный кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Касса.ру</a>
        <div id="authButtons"></div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Личный кабинет</h1>
    <div id="profileInfo" class="mb-4"></div>

    <div id="organizerSection" style="display:none;" class="mb-5">
        <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
            <h2 class="mb-0">Мои мероприятия</h2>
            <button class="btn btn-success" onclick="openAddEventModal()">Добавить мероприятие</button>
        </div>
        <div id="organizerEventsList"></div>
    </div>

    <h2 class="mb-3">Мои билеты</h2>
    <div id="ticketsContainer"></div>
</div>

<div class="modal fade" id="addEventModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="createEventForm" onsubmit="createEvent(event)">
                <div class="modal-header">
                    <h5 class="modal-title">Новое мероприятие</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Название мероприятия</label>
                            <input type="text" id="eventTitle" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Тип мероприятия</label>
                            <select id="eventType" class="form-select">
                                <option value="concert">Концерт</option>
                                <option value="theatre">Театр</option>
                                <option value="exhibition">Выставка</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Город</label>
                            <input type="text" id="eventCity" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Дата</label>
                            <input type="text" id="eventDate" class="form-control" placeholder="Например: 15 апреля">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Место проведения</label>
                            <input type="text" id="eventPlace" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Ссылка на изображение</label>
                            <input type="text" id="eventImage" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Описание</label>
                            <textarea id="eventDescription" class="form-control" rows="4"></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-success">Сохранить мероприятие</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="mainToastTitle">Уведомление</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="mainToastBody">Сообщение</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
