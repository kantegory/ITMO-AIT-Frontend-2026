<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Ticket Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Касса.ру</a>
        <div id="authButtons"></div>
    </div>
</nav>

<div class="container mt-5">
    <h1 class="mb-4">Купить билет на мероприятие</h1>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <input type="text" id="searchInput" class="form-control" placeholder="Поиск по названию">
        </div>
        <div class="col-md-3">
            <select id="typeFilter" class="form-select">
                <option value="all">Все типы</option>
                <option value="concert">Концерт</option>
                <option value="theatre">Театр</option>
                <option value="exhibition">Выставка</option>
            </select>
        </div>
        <div class="col-md-3">
            <input type="text" id="cityFilter" class="form-control" placeholder="Введите город">
        </div>
        <div class="col-md-2">
            <button onclick="filterEvents()" class="btn btn-primary w-100">Найти</button>
        </div>
    </div>

    <h2 class="mb-4">Мероприятия</h2>
    <div class="row g-4" id="eventsContainer"></div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="mainToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <strong class="me-auto" id="mainToastTitle">Уведомление</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="mainToastBody">Сообщение</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
