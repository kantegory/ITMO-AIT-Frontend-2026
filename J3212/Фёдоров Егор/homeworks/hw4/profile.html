<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Профиль</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

<nav class="navbar navbar-expand-md bg-white sticky-top" role="navigation" aria-label="Основная навигация">
  <div class="container">
    <a href="search.html" class="navbar-brand brand" aria-label="ModelHub — на главную страницу поиска">ModelHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="Открыть меню навигации">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="ms-auto d-flex gap-3 align-items-center">
        <a href="search.html" class="nav-link">
          <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-search"/></svg> Поиск
        </a>
        <span class="nav-link">
          <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-user"/></svg>
          <span class="nav-username"></span>
        </span>
        <button class="btn btn-outline-secondary d-flex align-items-center gap-2"
                onclick="authHelper.logout()" aria-label="Выйти из аккаунта">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-logout"/></svg> Выйти
        </button>
        <button class="theme-toggle" aria-label="Переключить тему" aria-pressed="false">
          <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-moon"/></svg> <span>Тёмная</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<main id="main-content" class="container py-4 d-flex flex-column gap-4">
  <div id="pageState" class="alert alert-info" role="status" aria-live="polite" aria-atomic="true">Загружаем профиль…</div>
  <section id="pageContent" class="d-none d-flex flex-column gap-4" aria-label="Личный кабинет">
    <div class="hub-card">
      <div class="row g-4 align-items-start">
        <div class="col-lg-8">
          <h1 id="userName" class="fw-bold mt-3 mb-1">—</h1>
          <p id="userMeta" class="muted mb-0">—</p>
        </div>
        <div class="col-lg-4">
          <dl class="row g-3 text-center">
            <div class="col-6">
              <div class="inner-box">
                <dt class="visually-hidden">Избранное</dt>
                <dd class="mini-stat-value mb-0 d-flex align-items-center justify-content-center gap-1">
                  <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-heart"/></svg>
                  <span id="statFavorites">0</span>
                </dd>
                <div class="muted small" aria-hidden="true">избранное</div>
              </div>
            </div>
            <div class="col-6">
              <div class="inner-box">
                <dt class="visually-hidden">Комментарии</dt>
                <dd class="mini-stat-value mb-0 d-flex align-items-center justify-content-center gap-1">
                  <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-comment"/></svg>
                  <span id="statComments">0</span>
                </dd>
                <div class="muted small" aria-hidden="true">комментарии</div>
              </div>
            </div>
            <div class="col-6">
              <div class="inner-box">
                <dt class="visually-hidden">Публикации</dt>
                <dd class="mini-stat-value mb-0" id="statPublications">0</dd>
                <div class="muted small" aria-hidden="true">публикации</div>
              </div>
            </div>
            <div class="col-6">
              <div class="inner-box">
                <dt class="visually-hidden">Подписки</dt>
                <dd class="mini-stat-value mb-0" id="statSubscriptions">0</dd>
                <div class="muted small" aria-hidden="true">подписки</div>
              </div>
            </div>
          </dl>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8 d-flex flex-column gap-4">
        <div class="hub-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold fs-4 mb-0" id="publications-heading">Мои публикации</h2>
            <button class="btn btn-light d-flex align-items-center gap-2" data-bs-toggle="modal"
                    data-bs-target="#publicationModal" aria-haspopup="dialog" aria-label="Добавить новую публикацию">
              <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-plus"/></svg> Добавить
            </button>
          </div>
          <div id="publicationsList" aria-labelledby="publications-heading" aria-live="polite"></div>
        </div>
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3" id="activity-heading">Активность</h2>
          <div id="activityList" aria-labelledby="activity-heading" aria-live="polite"></div>
        </div>
      </div>
      <aside class="col-lg-4 d-flex flex-column gap-4" aria-label="Боковая панель профиля">
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3" id="favorites-heading">
            <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-heart"/></svg> Избранное
          </h2>
          <div id="favoritesList" aria-labelledby="favorites-heading"></div>
        </div>
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3" id="subscriptions-heading">Подписки</h2>
          <div id="subscriptionsList" aria-labelledby="subscriptions-heading"></div>
        </div>
      </aside>
    </div>
  </section>
</main>

<div class="modal fade" id="publicationModal" tabindex="-1" aria-labelledby="publicationModalTitle" aria-modal="true" role="dialog">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:22px;border:none;">
      <div class="modal-header border-0">
        <h2 class="modal-title fs-5 fw-bold" id="publicationModalTitle">Новая публикация</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть диалог"></button>
      </div>
      <div class="modal-body">
        <label class="form-label fw-semibold" for="pubTitle">Название публикации</label>
        <input id="pubTitle" class="form-control mb-3" aria-required="true" placeholder="Введите название">
        <label class="form-label fw-semibold" for="pubType">Тип публикации</label>
        <select id="pubType" class="form-select">
          <option>Подборка</option>
          <option>Заметка</option>
        </select>
        <div id="pubError" class="alert alert-danger d-none mt-3" role="alert" aria-live="assertive"></div>
      </div>
      <div class="modal-footer border-0">
        <button class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
        <button class="btn btn-primary d-flex align-items-center gap-2" id="savePublication">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-plus"/></svg> Сохранить
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!authHelper.requireAuth()) return;
  await authHelper.syncMe();
  authHelper.updateNavbar();
  document.getElementById('savePublication').addEventListener('click', createPublication);
  await loadProfile();
});

async function loadProfile() {
  try {
    const data = await profileApi.summary();
    renderProfile(data);
    document.getElementById('pageState').classList.add('d-none');
    document.getElementById('pageContent').classList.remove('d-none');
  } catch (error) {
    const box = document.getElementById('pageState');
    box.className = 'alert alert-danger';
    box.setAttribute('role', 'alert');
    box.textContent = error.message;
  }
}

function renderProfile(data) {
  const { user, stats, favorites, subscriptions, activity, publications } = data;
  document.getElementById('userName').textContent = user.name;
  document.getElementById('userMeta').textContent = `@${user.username} · ${user.bio}`;
  document.getElementById('statFavorites').textContent = stats.favorites;
  document.getElementById('statComments').textContent = stats.comments;
  document.getElementById('statPublications').textContent = stats.publications;
  document.getElementById('statSubscriptions').textContent = stats.subscriptions;
  document.querySelectorAll('.nav-username').forEach(el => el.textContent = user.name);

  document.getElementById('favoritesList').innerHTML = favorites.length ? favorites.map(item => `
    <article class="list-item">
      <div class="fw-semibold d-flex align-items-center gap-2">
        <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#icon-heart-fill"/></svg>
        ${escapeHtml(item.title)}
      </div>
      <div class="muted small">${escapeHtml(item.author || '—')} · ${escapeHtml(item.subtitle || '—')}</div>
    </article>`).join('') : '<div class="muted">Избранное пусто.</div>';

  document.getElementById('subscriptionsList').innerHTML = subscriptions.length ? subscriptions.map(item => `
    <article class="list-item">
      <div class="fw-semibold">${escapeHtml(item.name)}</div>
      <div class="muted small">${escapeHtml(item.updates)}</div>
    </article>`).join('') : '<div class="muted">Подписок нет.</div>';

  document.getElementById('activityList').innerHTML = activity.length ? activity.map(item => `
    <article class="list-item">
      <div>${escapeHtml(item.text)}</div>
      <time class="muted small mt-2 d-block" datetime="${item.createdAt}">${new Date(item.createdAt).toLocaleString('ru-RU')}</time>
    </article>`).join('') : '<div class="muted">Активности пока нет.</div>';

  document.getElementById('publicationsList').innerHTML = publications.length ? publications.map(item => `
    <article class="list-item d-flex justify-content-between gap-3 align-items-start">
      <div>
        <div class="fw-semibold">${escapeHtml(item.title)}</div>
        <div class="muted small">${escapeHtml(item.type)} · ${escapeHtml(item.status)}</div>
      </div>
      <span class="chip" aria-label="Тип ресурса: ${escapeHtml(item.resourceType)}">${escapeHtml(item.resourceType)}</span>
    </article>`).join('') : '<div class="muted">Публикаций пока нет.</div>';
}

async function createPublication() {
  const errorBox = document.getElementById('pubError');
  errorBox.classList.add('d-none');
  try {
    await publicationsApi.create({
      title: document.getElementById('pubTitle').value,
      type: document.getElementById('pubType').value,
      status: 'draft',
      resourceType: 'model',
    });
    bootstrap.Modal.getInstance(document.getElementById('publicationModal')).hide();
    document.getElementById('pubTitle').value = '';
    await loadProfile();
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('d-none');
  }
}

function escapeHtml(value) {
  return String(value || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
</script>
</body>
</html>
