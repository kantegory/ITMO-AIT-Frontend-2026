<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Регистрация</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

<nav class="navbar navbar-expand-md bg-white sticky-top" role="navigation" aria-label="Основная навигация">
  <div class="container">
    <a href="search.html" class="navbar-brand brand" aria-label="ModelHub — на главную страницу поиска">ModelHub</a>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a href="search.html" class="nav-link">
        <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-search"/></svg> Поиск
      </a>
      <a href="login.html" class="nav-link">Вход</a>
      <button class="theme-toggle" aria-label="Переключить тему" aria-pressed="false">
        <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-moon"/></svg> <span>Тёмная</span>
      </button>
    </div>
  </div>
</nav>

<main id="main-content" class="auth-page container">
  <section class="hub-card w-100" style="max-width:720px;" aria-labelledby="register-heading">
    <span class="hero-badge" aria-hidden="true">Регистрация</span>
    <h1 id="register-heading" class="fw-bold mt-3">Создать аккаунт</h1>
    <form id="registerForm" class="row g-3 mt-1" novalidate aria-describedby="errorMsg">
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="firstName">Имя</label>
        <input id="firstName" class="form-control" required aria-required="true" autocomplete="given-name">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="lastName">Фамилия</label>
        <input id="lastName" class="form-control" required aria-required="true" autocomplete="family-name">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="username">Логин</label>
        <input id="username" class="form-control" required aria-required="true" autocomplete="username">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="email">Email</label>
        <input id="email" type="email" class="form-control" required aria-required="true" autocomplete="email">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="password">Пароль</label>
        <input id="password" type="password" class="form-control" required aria-required="true"
               autocomplete="new-password" aria-describedby="passwordHint">
        <div id="passwordHint" class="form-text">Минимум 6 символов</div>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold" for="confirmPassword">Подтверждение пароля</label>
        <input id="confirmPassword" type="password" class="form-control" required aria-required="true"
               autocomplete="new-password" aria-describedby="errorMsg">
      </div>
      <div class="col-12">
        <div id="errorMsg" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>
      </div>
      <div class="col-12">
        <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2" type="submit" id="submitBtn">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-user"/></svg> Зарегистрироваться
        </button>
      </div>
      <div class="col-12 text-center">
        <p class="muted mb-0">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </div>
    </form>
  </section>
</main>

<script src="auth.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  authHelper.redirectIfLoggedIn('profile.html');
  document.getElementById('registerForm').addEventListener('submit', register);
});

async function register(event) {
  event.preventDefault();
  const errorBox = document.getElementById('errorMsg');
  const btn = document.getElementById('submitBtn');
  errorBox.classList.add('d-none');
  if (password.value !== confirmPassword.value) {
    errorBox.textContent = 'Пароли не совпадают.';
    errorBox.classList.remove('d-none');
    return;
  }
  btn.disabled = true;
  btn.setAttribute('aria-busy', 'true');
  try {
    const { token, user } = await authApi.register(firstName.value, lastName.value, username.value, email.value, password.value);
    authHelper.save(token, user);
    window.location.href = 'profile.html';
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('d-none');
  } finally {
    btn.disabled = false;
    btn.removeAttribute('aria-busy');
  }
}
</script>
</body>
</html>
