<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Поиск на Hugging Face</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

<nav class="navbar navbar-expand-md bg-white sticky-top" role="navigation" aria-label="Основная навигация">
  <div class="container">
    <a href="search.html" class="navbar-brand brand" aria-label="ModelHub — на главную страницу поиска">ModelHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="Открыть меню навигации">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="search.html" class="nav-link fw-semibold" aria-current="page">
          <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-search"/></svg> Поиск
        </a>
        <span class="nav-link nav-auth" style="display:none" aria-hidden="true">Здравствуйте, <span class="nav-username"></span></span>
        <a href="profile.html" class="btn btn-primary rounded-3 nav-auth" style="display:none" aria-label="Перейти в личный кабинет">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-user"/></svg> Профиль
        </a>
        <button class="btn btn-outline-secondary rounded-3 nav-auth" style="display:none"
                onclick="authHelper.logout()" aria-label="Выйти из аккаунта">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-logout"/></svg> Выйти
        </button>
        <a href="login.html" class="nav-link fw-semibold nav-unauth">Вход</a>
        <a href="register.html" class="btn btn-primary rounded-3 nav-unauth">Регистрация</a>
        <button class="theme-toggle" aria-label="Переключить тему" aria-pressed="false">
          <svg class="icon icon-md" aria-hidden="true"><use href="icons.svg#icon-moon"/></svg> <span>Тёмная</span>
        </button>
      </div>
    </div>
  </div>
</nav>

<main id="main-content" class="container py-4 d-flex flex-column gap-4">
  <section class="hero-panel" aria-labelledby="hero-heading">
    <div class="row g-4 align-items-center">
      <div class="col-lg-8">
        <h1 id="hero-heading" class="fw-bold mt-3 mb-2" style="font-size: clamp(2rem, 4vw, 3rem);">
          Поиск моделей и датасетов
        </h1>
      </div>
      <div class="col-lg-4 text-lg-end">
        <div class="text-muted small" id="resultCountLabel">Найдено элементов</div>
        <div class="stat-value" id="resultCount" aria-live="polite" aria-atomic="true" aria-labelledby="resultCountLabel">—</div>
      </div>
    </div>
  </section>

  <div class="row g-4">
    <aside class="col-12 col-lg-3" aria-label="Фильтры поиска">
      <section class="hub-card d-flex flex-column gap-3" role="search" aria-label="Поиск по Hugging Face">
        <div>
          <label class="form-label fw-semibold" for="searchInput">Поисковый запрос</label>
          <input id="searchInput" class="form-control" placeholder="Например: bert, translation, imdb"
                 aria-describedby="searchHint" type="search" autocomplete="off">
          <div id="searchHint" class="visually-hidden">Введите название модели или датасета</div>
        </div>
        <div>
          <label class="form-label fw-semibold" for="typeFilter">Тип ресурса</label>
          <select id="typeFilter" class="form-select">
            <option value="all">Все</option>
            <option value="model">Модели</option>
            <option value="dataset">Датасеты</option>
          </select>
        </div>
        <div>
          <label class="form-label fw-semibold" for="sortSelect">Сортировка результатов</label>
          <select id="sortSelect" class="form-select">
            <option value="downloads">По загрузкам</option>
            <option value="likes">По лайкам</option>
            <option value="updatedAt">По дате обновления</option>
          </select>
        </div>
        <button class="btn btn-primary d-flex align-items-center gap-2 justify-content-center" id="searchBtn">
          <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-search"/></svg> Найти
        </button>
      </section>
    </aside>

    <section class="col-12 col-lg-9 d-flex flex-column gap-4" aria-label="Результаты поиска">
      <div id="statusBox" class="alert alert-info mb-0" role="status" aria-live="polite" aria-atomic="true">
        Введите запрос или нажмите «Найти», чтобы получить данные.
      </div>
      <div class="row g-4" id="results" aria-label="Список результатов"></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
let allResults = [];

document.addEventListener('DOMContentLoaded', async () => {
  await authHelper.syncMe();
  authHelper.updateNavbar();
  document.getElementById('searchBtn').addEventListener('click', loadResults);
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadResults();
  });
  document.getElementById('sortSelect').addEventListener('change', renderResults);
  loadResults();
});

async function loadResults() {
  const query = document.getElementById('searchInput').value.trim() || 'transformers';
  const type = document.getElementById('typeFilter').value;
  const status = document.getElementById('statusBox');
  const container = document.getElementById('results');
  status.className = 'alert alert-info';
  status.textContent = 'Загружаем данные из внешнего API…';
  container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Загрузка…</span></div></div>';
  try {
    allResults = await hubApi.search({ query, type, limit: 18 });
    renderResults();
    status.className = 'alert alert-success';
    status.textContent = `Получено ${allResults.length} элементов по запросу «${query}».`;
  } catch (error) {
    container.innerHTML = '';
    document.getElementById('resultCount').textContent = '0';
    status.className = 'alert alert-danger';
    status.textContent = error.message;
  }
}

function renderResults() {
  const sortKey = document.getElementById('sortSelect').value;
  const container = document.getElementById('results');
  const items = [...allResults].sort((a, b) => {
    if (sortKey === 'updatedAt') return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
    return (b[sortKey] || 0) - (a[sortKey] || 0);
  });
  document.getElementById('resultCount').textContent = items.length;
  if (!items.length) {
    container.innerHTML = '<div class="col-12"><div class="hub-card">Ничего не найдено.</div></div>';
    return;
  }
  container.innerHTML = items.map(item => {
    const href = item.resourceType === 'model'
      ? `model.html?id=${encodeURIComponent(item.id)}`
      : `dataset.html?id=${encodeURIComponent(item.id)}`;
    const badge = item.resourceType === 'model' ? 'Модель' : 'Датасет';
    const subtitle = item.resourceType === 'model' ? item.pipelineTag : (item.taskCategories[0] || 'Dataset');
    return `
      <div class="col-12 col-md-6 col-xl-4">
        <article class="hub-card result-card h-100" aria-label="${escapeHtml(item.title)} — ${badge}">
          <div class="d-flex gap-2 flex-wrap" aria-hidden="true">
            <span class="pill">${badge}</span>
            <span class="chip">${item.license}</span>
          </div>
          <div>
            <h2 class="fw-bold fs-5 mb-2">${escapeHtml(item.title)}</h2>
            <p class="muted mb-0">${escapeHtml(item.description)}</p>
          </div>
          <dl class="result-meta mb-0">
            <div class="d-flex gap-1"><dt class="visually-hidden">Автор:</dt><dd class="mb-0">Автор: ${escapeHtml(item.author)}</dd></div>
            <div><dt class="visually-hidden">Категория:</dt><dd class="mb-0">${escapeHtml(subtitle || '—')}</dd></div>
          </dl>
          <dl class="result-meta mb-0">
            <div>
              <dt class="visually-hidden">Загрузки:</dt>
              <dd class="mb-0 d-flex align-items-center gap-1">
                <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#icon-download"/></svg>
                ${(item.downloads || 0).toLocaleString()}
              </dd>
            </div>
            <div>
              <dt class="visually-hidden">Лайки:</dt>
              <dd class="mb-0 d-flex align-items-center gap-1">
                <svg class="icon icon-sm" aria-hidden="true"><use href="icons.svg#icon-heart"/></svg>
                ${(item.likes || 0).toLocaleString()}
              </dd>
            </div>
          </dl>
          <div class="mt-auto d-flex gap-2">
            <a class="btn btn-primary d-flex align-items-center gap-1" href="${href}"
               aria-label="Открыть ${escapeHtml(item.title)}">
              <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-external-link"/></svg> Открыть
            </a>
            <button class="btn btn-light d-flex align-items-center gap-1"
                    onclick='toggleFavoriteFromSearch(${JSON.stringify(JSON.stringify(item))})'
                    aria-label="Добавить ${escapeHtml(item.title)} в избранное">
              <svg class="icon" aria-hidden="true"><use href="icons.svg#icon-heart"/></svg> В избранное
            </button>
          </div>
        </article>
      </div>`;
  }).join('');
}

async function toggleFavoriteFromSearch(raw) {
  if (!authHelper.isLoggedIn()) { alert('Для работы с избранным нужно войти.'); return; }
  const item = JSON.parse(raw);
  const subtitle = item.resourceType === 'model' ? item.pipelineTag : (item.taskCategories[0] || 'Dataset');
  const result = await favoritesApi.toggle({ resourceType: item.resourceType, resourceKey: item.id, title: item.title, author: item.author, subtitle });
  alert(result.active ? 'Добавлено в избранное.' : 'Удалено из избранного.');
}

function escapeHtml(value) {
  return String(value || '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}
</script>
</body>
</html>
