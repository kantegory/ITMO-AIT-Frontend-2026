<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Датасет</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a href="#main-content" class="skip-link">Перейти к основному содержимому</a>

<nav class="navbar navbar-expand-md bg-white sticky-top" role="navigation" aria-label="Основная навигация">
  <div class="container">
    <a href="search.html" class="navbar-brand brand" aria-label="ModelHub — на главную страницу поиска">ModelHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
            aria-controls="navMenu" aria-expanded="false" aria-label="Открыть меню навигации">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="search.html" class="nav-link fw-semibold">Поиск</a>
        <span class="nav-link nav-auth" style="display:none" aria-hidden="true"><span class="nav-username"></span></span>
        <a href="profile.html" class="btn btn-primary rounded-3 nav-auth" style="display:none" aria-label="Перейти в личный кабинет">Профиль</a>
        <button class="btn btn-outline-secondary nav-auth" style="display:none" onclick="authHelper.logout()" aria-label="Выйти из аккаунта">Выйти</button>
        <a href="login.html" class="nav-link nav-unauth">Вход</a>
      </div>
    </div>
  </div>
</nav>

<main id="main-content" class="container py-4 d-flex flex-column gap-4">
  <div id="pageState" class="alert alert-info" role="status" aria-live="polite" aria-atomic="true">Загружаем датасет…</div>
  <section id="pageContent" class="d-none d-flex flex-column gap-4" aria-label="Информация о датасете">
    <div class="hub-card">
      <div class="row g-4">
        <div class="col-lg-8">
          <div id="tags" class="d-flex gap-2 flex-wrap mb-3" aria-label="Теги датасета" role="list"></div>
          <h1 id="title" class="fw-bold mb-2">—</h1>
          <p id="description" class="muted mb-3">—</p>
          <dl class="d-flex gap-4 flex-wrap muted small mb-4">
            <div><dt class="visually-hidden">Загрузки</dt><dd id="downloads" class="mb-0">—</dd></div>
            <div><dt class="visually-hidden">Лайки</dt><dd id="likes" class="mb-0">—</dd></div>
            <div><dt class="visually-hidden">Дата обновления</dt><dd id="updated" class="mb-0">—</dd></div>
          </dl>
          <div class="d-flex gap-2 flex-wrap">
            <a id="openHub" class="btn btn-primary" target="_blank" rel="noopener noreferrer"
               aria-label="Открыть датасет на Hugging Face (откроется в новой вкладке)">Открыть на Hugging Face</a>
            <button id="favBtn" class="btn btn-light" aria-pressed="false" aria-label="Добавить в избранное">В избранное</button>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="inner-box">
            <h2 class="fs-5 fw-bold mb-3">Автор</h2>
            <div id="author" class="fw-semibold">—</div>
            <div class="muted small mt-2">Источник: Hugging Face Hub API</div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8 d-flex flex-column gap-4">
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3">Применение</h2>
          <p id="summary" class="mb-0 muted"></p>
        </div>
        <div class="hub-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold fs-4 mb-0" id="comments-heading">Комментарии</h2>
            <button class="btn btn-light" id="commentAction"
                    aria-expanded="false" aria-controls="commentForm">Добавить комментарий</button>
          </div>
          <div id="commentForm" class="d-none mb-3" role="form" aria-label="Форма добавления комментария">
            <label for="commentText" class="form-label fw-semibold">Текст комментария</label>
            <textarea id="commentText" class="form-control mb-2" rows="4"
                      placeholder="Напишите комментарий" aria-required="true"></textarea>
            <button class="btn btn-primary" id="sendComment" aria-label="Отправить комментарий">Отправить</button>
          </div>
          <div id="commentsList" aria-live="polite" aria-labelledby="comments-heading"></div>
        </div>
      </div>
      <aside class="col-lg-4 d-flex flex-column gap-4" aria-label="Дополнительная информация">
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3">Теги</h2>
          <div id="tagList" class="d-flex gap-2 flex-wrap" role="list" aria-label="Все теги датасета"></div>
        </div>
      </aside>
    </div>
  </section>
</main>

<script src="auth.js"></script>
<script src="api.js"></script>
<script>
let dataset = null;
const datasetId = new URLSearchParams(window.location.search).get('id');

document.addEventListener('DOMContentLoaded', async () => {
  await authHelper.syncMe();
  authHelper.updateNavbar();
  const commentAction = document.getElementById('commentAction');
  const commentForm = document.getElementById('commentForm');

  commentAction.addEventListener('click', () => {
    if (!authHelper.isLoggedIn()) return alert('Для комментариев нужно войти.');
    const isOpen = !commentForm.classList.contains('d-none');
    commentForm.classList.toggle('d-none');
    commentAction.setAttribute('aria-expanded', String(!isOpen));
  });
  document.getElementById('sendComment').addEventListener('click', submitComment);
  document.getElementById('favBtn').addEventListener('click', toggleFavorite);
  if (!datasetId) return showError('Не указан идентификатор датасета.');
  await loadDataset();
});

async function loadDataset() {
  try {
    dataset = await hubApi.getDataset(datasetId);
    renderDataset();
    await loadComments();
    await syncFavoriteState();
    document.getElementById('pageState').classList.add('d-none');
    document.getElementById('pageContent').classList.remove('d-none');
  } catch (error) {
    showError(error.message);
  }
}

function renderDataset() {
  document.title = `ModelHub — ${dataset.title}`;
  document.getElementById('title').textContent = dataset.title;
  document.getElementById('description').textContent = dataset.description;
  document.getElementById('summary').textContent = dataset.description;
  document.getElementById('author').textContent = dataset.author;
  document.getElementById('downloads').textContent = `Загрузки: ${(dataset.downloads || 0).toLocaleString()}`;
  document.getElementById('likes').textContent = `Лайки: ${(dataset.likes || 0).toLocaleString()}`;
  document.getElementById('updated').textContent = dataset.updatedAt ? `Обновлено: ${new Date(dataset.updatedAt).toLocaleDateString('ru-RU')}` : 'Дата обновления не указана';
  const openHub = document.getElementById('openHub');
  openHub.href = `https://huggingface.co/datasets/${encodeURIComponent(dataset.id).replace(/%2F/g, '/')}`;
  openHub.setAttribute('aria-label', `Открыть ${dataset.title} на Hugging Face (откроется в новой вкладке)`);
  const chips = [dataset.license, ...(dataset.taskCategories || []).slice(0, 3), ...(dataset.tags || []).slice(0, 3)].filter(Boolean);
  document.getElementById('tags').innerHTML = chips.map(tag => `<span class="chip" role="listitem">${escapeHtml(tag)}</span>`).join('');
  document.getElementById('tagList').innerHTML = (dataset.tags || []).map(tag => `<span class="chip" role="listitem">${escapeHtml(tag)}</span>`).join('') || '<div class="muted">Нет тегов.</div>';
}

async function loadComments() {
  const comments = await commentsApi.list('dataset', dataset.id);
  const list = document.getElementById('commentsList');
  if (!comments.length) {
    list.innerHTML = '<div class="muted">Комментариев пока нет.</div>';
    return;
  }
  list.innerHTML = comments.map(item => `
    <article class="list-item">
      <div class="fw-semibold">${escapeHtml(item.author)}</div>
      <time class="muted small mb-2 d-block" datetime="${item.createdAt}">${new Date(item.createdAt).toLocaleString('ru-RU')}</time>
      <div>${escapeHtml(item.text)}</div>
    </article>
  `).join('');
}

async function submitComment() {
  const text = document.getElementById('commentText').value.trim();
  if (!text) return;
  await commentsApi.add('dataset', dataset.id, text);
  document.getElementById('commentText').value = '';
  document.getElementById('commentForm').classList.add('d-none');
  document.getElementById('commentAction').setAttribute('aria-expanded', 'false');
  await loadComments();
}

async function toggleFavorite() {
  if (!authHelper.isLoggedIn()) return alert('Для работы с избранным нужно войти.');
  const response = await favoritesApi.toggle({
    resourceType: 'dataset',
    resourceKey: dataset.id,
    title: dataset.title,
    author: dataset.author,
    subtitle: dataset.taskCategories[0] || 'Dataset',
  });
  const btn = document.getElementById('favBtn');
  const active = response.active;
  btn.textContent = active ? 'Убрать из избранного' : 'В избранное';
  btn.setAttribute('aria-pressed', String(active));
  btn.setAttribute('aria-label', active ? `Убрать ${dataset.title} из избранного` : `Добавить ${dataset.title} в избранное`);
}

async function syncFavoriteState() {
  if (!authHelper.isLoggedIn()) return;
  const { active } = await favoritesApi.check('dataset', dataset.id);
  const btn = document.getElementById('favBtn');
  btn.textContent = active ? 'Убрать из избранного' : 'В избранное';
  btn.setAttribute('aria-pressed', String(active));
}

function showError(message) {
  const box = document.getElementById('pageState');
  box.className = 'alert alert-danger';
  box.setAttribute('role', 'alert');
  box.textContent = message;
}

function escapeHtml(value) {
  return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}
</script>
</body>
</html>
