<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Поиск на Hugging Face</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-md bg-white sticky-top">
  <div class="container">
    <a href="search.html" class="navbar-brand brand">ModelHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="ms-auto d-flex align-items-center gap-3">
        <a href="search.html" class="nav-link fw-semibold">Поиск</a>
        <span class="nav-link nav-auth" style="display:none">Здравствуйте, <span class="nav-username"></span></span>
        <a href="profile.html" class="btn btn-primary rounded-3 nav-auth" style="display:none">Профиль</a>
        <button class="btn btn-outline-secondary rounded-3 nav-auth" style="display:none" onclick="authHelper.logout()">Выйти</button>
        <a href="login.html" class="nav-link fw-semibold nav-unauth">Вход</a>
        <a href="register.html" class="btn btn-primary rounded-3 nav-unauth">Регистрация</a>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4 d-flex flex-column gap-4">
  <section class="hero-panel">
    <div class="row g-4 align-items-center">
      <div class="col-lg-8">
        <h1 class="fw-bold mt-3 mb-2" style="font-size: clamp(2rem, 4vw, 3rem);">Поиск моделей и датасетов</h1>
      </div>
      <div class="col-lg-4 text-lg-end">
        <div class="text-muted small">Найдено элементов</div>
        <div class="stat-value" id="resultCount">—</div>
      </div>
    </div>
  </section>

  <section class="row g-4">
    <aside class="col-12 col-lg-3">
      <div class="hub-card d-flex flex-column gap-3">
        <div>
          <label class="form-label fw-semibold" for="searchInput">Поиск</label>
          <input id="searchInput" class="form-control" placeholder="Например: bert, translation, imdb">
        </div>
        <div>
          <label class="form-label fw-semibold" for="typeFilter">Тип</label>
          <select id="typeFilter" class="form-select">
            <option value="all">Все</option>
            <option value="model">Модели</option>
            <option value="dataset">Датасеты</option>
          </select>
        </div>
        <div>
          <label class="form-label fw-semibold" for="sortSelect">Сортировка</label>
          <select id="sortSelect" class="form-select">
            <option value="downloads">По загрузкам</option>
            <option value="likes">По лайкам</option>
            <option value="updatedAt">По дате обновления</option>
          </select>
        </div>
        <button class="btn btn-primary" id="searchBtn">Найти</button>
      </div>
    </aside>

    <section class="col-12 col-lg-9 d-flex flex-column gap-4">
      <div id="statusBox" class="alert alert-info mb-0">Введите запрос или нажмите «Найти», чтобы получить данные.</div>
      <div class="row g-4" id="results"></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
let allResults = [];

document.addEventListener('DOMContentLoaded', async () => {
  await authHelper.syncMe();
  authHelper.updateNavbar();
  document.getElementById('searchBtn').addEventListener('click', loadResults);
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') loadResults();
  });
  document.getElementById('sortSelect').addEventListener('change', renderResults);
  loadResults();
});

async function loadResults() {
  const query = document.getElementById('searchInput').value.trim() || 'transformers';
  const type = document.getElementById('typeFilter').value;
  const status = document.getElementById('statusBox');
  const container = document.getElementById('results');
  status.className = 'alert alert-info';
  status.textContent = 'Загружаем данные из внешнего API…';
  container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>';

  try {
    allResults = await hubApi.search({ query, type, limit: 18 });
    renderResults();
    status.className = 'alert alert-success';
    status.textContent = `Получено ${allResults.length} элементов по запросу «${query}».`;
  } catch (error) {
    container.innerHTML = '';
    document.getElementById('resultCount').textContent = '0';
    status.className = 'alert alert-danger';
    status.textContent = error.message;
  }
}

function renderResults() {
  const sortKey = document.getElementById('sortSelect').value;
  const container = document.getElementById('results');
  const items = [...allResults].sort((a, b) => {
    if (sortKey === 'updatedAt') return new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0);
    return (b[sortKey] || 0) - (a[sortKey] || 0);
  });

  document.getElementById('resultCount').textContent = items.length;
  if (!items.length) {
    container.innerHTML = '<div class="col-12"><div class="hub-card">Ничего не найдено.</div></div>';
    return;
  }

  container.innerHTML = items.map(item => {
    const href = item.resourceType === 'model'
      ? `model.html?id=${encodeURIComponent(item.id)}`
      : `dataset.html?id=${encodeURIComponent(item.id)}`;
    const badge = item.resourceType === 'model' ? 'Модель' : 'Датасет';
    const subtitle = item.resourceType === 'model' ? item.pipelineTag : (item.taskCategories[0] || 'Dataset');
    return `
      <div class="col-12 col-md-6 col-xl-4">
        <article class="hub-card result-card h-100">
          <div class="d-flex gap-2 flex-wrap">
            <span class="pill">${badge}</span>
            <span class="chip">${item.license}</span>
          </div>
          <div>
            <h2 class="fw-bold fs-5 mb-2">${escapeHtml(item.title)}</h2>
            <p class="muted mb-0">${escapeHtml(item.description)}</p>
          </div>
          <div class="result-meta"><span>Автор: ${escapeHtml(item.author)}</span><span>${escapeHtml(subtitle || '—')}</span></div>
          <div class="result-meta"><span>Загрузки: ${(item.downloads || 0).toLocaleString()}</span><span>Лайки: ${(item.likes || 0).toLocaleString()}</span></div>
          <div class="mt-auto d-flex gap-2">
            <a class="btn btn-primary" href="${href}">Открыть</a>
            <button class="btn btn-light" onclick='toggleFavoriteFromSearch(${JSON.stringify(JSON.stringify(item))})'>В избранное</button>
          </div>
        </article>
      </div>`;
  }).join('');
}

async function toggleFavoriteFromSearch(raw) {
  if (!authHelper.isLoggedIn()) {
    alert('Для работы с избранным нужно войти.');
    return;
  }
  const item = JSON.parse(raw);
  const subtitle = item.resourceType === 'model' ? item.pipelineTag : (item.taskCategories[0] || 'Dataset');
  const result = await favoritesApi.toggle({
    resourceType: item.resourceType,
    resourceKey: item.id,
    title: item.title,
    author: item.author,
    subtitle,
  });
  alert(result.active ? 'Добавлено в избранное.' : 'Удалено из избранного.');
}

function escapeHtml(value) {
  return String(value || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;');
}
</script>
</body>
</html>
