<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Вход</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-md bg-white sticky-top">
  <div class="container">
    <a href="search.html" class="navbar-brand brand">ModelHub</a>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a href="search.html" class="nav-link">Поиск</a>
      <a href="register.html" class="btn btn-primary rounded-3">Регистрация</a>
    </div>
  </div>
</nav>
<main class="auth-page container">
  <section class="hub-card w-100" style="max-width:560px;">
    <span class="hero-badge">Вход </span>
    <h1 class="fw-bold mt-3">Вход в аккаунт</h1>
    <form id="loginForm" class="d-flex flex-column gap-3">
      <div>
        <label class="form-label fw-semibold" for="email">Email</label>
        <input id="email" type="email" class="form-control" required>
      </div>
      <div>
        <label class="form-label fw-semibold" for="password">Пароль</label>
        <input id="password" type="password" class="form-control" required>
      </div>
      <div id="errorMsg" class="alert alert-danger d-none"></div>
      <button class="btn btn-primary" type="submit" id="submitBtn">Войти</button>
    </form>
  </section>
</main>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  authHelper.redirectIfLoggedIn('profile.html');
  document.getElementById('loginForm').addEventListener('submit', login);
});

async function login(event) {
  event.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorBox = document.getElementById('errorMsg');
  errorBox.classList.add('d-none');
  btn.disabled = true;
  try {
    const { token, user } = await authApi.login(email.value.trim(), password.value);
    authHelper.save(token, user);
    window.location.href = 'profile.html';
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('d-none');
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
