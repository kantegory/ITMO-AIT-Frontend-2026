<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Профиль</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-md bg-white sticky-top">
  <div class="container">
    <a href="search.html" class="navbar-brand brand">ModelHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <div class="ms-auto d-flex gap-3 align-items-center">
        <a href="search.html" class="nav-link">Поиск</a>
        <span class="nav-link"><span class="nav-username"></span></span>
        <button class="btn btn-outline-secondary" onclick="authHelper.logout()">Выйти</button>
      </div>
    </div>
  </div>
</nav>
<main class="container py-4 d-flex flex-column gap-4">
  <div id="pageState" class="alert alert-info">Загружаем профиль…</div>
  <section id="pageContent" class="d-none d-flex flex-column gap-4">
    <div class="hub-card">
      <div class="row g-4 align-items-start">
        <div class="col-lg-8">
          <h1 id="userName" class="fw-bold mt-3 mb-1">—</h1>
          <p id="userMeta" class="muted mb-0">—</p>
        </div>
        <div class="col-lg-4">
          <div class="row g-3 text-center">
            <div class="col-6"><div class="inner-box"><div class="mini-stat-value" id="statFavorites">0</div><div class="muted small">избранное</div></div></div>
            <div class="col-6"><div class="inner-box"><div class="mini-stat-value" id="statComments">0</div><div class="muted small">комментарии</div></div></div>
            <div class="col-6"><div class="inner-box"><div class="mini-stat-value" id="statPublications">0</div><div class="muted small">публикации</div></div></div>
            <div class="col-6"><div class="inner-box"><div class="mini-stat-value" id="statSubscriptions">0</div><div class="muted small">подписки</div></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8 d-flex flex-column gap-4">
        <div class="hub-card">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold fs-4 mb-0">Мои публикации</h2>
            <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#publicationModal">Добавить</button>
          </div>
          <div id="publicationsList"></div>
        </div>
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3">Активность</h2>
          <div id="activityList"></div>
        </div>
      </div>
      <aside class="col-lg-4 d-flex flex-column gap-4">
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3">Избранное</h2>
          <div id="favoritesList"></div>
        </div>
        <div class="hub-card">
          <h2 class="fw-bold fs-4 mb-3">Подписки</h2>
          <div id="subscriptionsList"></div>
        </div>
      </aside>
    </div>
  </section>
</main>

<div class="modal fade" id="publicationModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="border-radius:22px;border:none;">
      <div class="modal-header border-0"><h2 class="modal-title fs-5 fw-bold">Новая публикация</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <label class="form-label fw-semibold">Название</label>
        <input id="pubTitle" class="form-control mb-3">
        <label class="form-label fw-semibold">Тип</label>
        <select id="pubType" class="form-select"><option>Подборка</option><option>Заметка</option></select>
        <div id="pubError" class="alert alert-danger d-none mt-3"></div>
      </div>
      <div class="modal-footer border-0"><button class="btn btn-light" data-bs-dismiss="modal">Отмена</button><button class="btn btn-primary" id="savePublication">Сохранить</button></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (!authHelper.requireAuth()) return;
  await authHelper.syncMe();
  authHelper.updateNavbar();
  document.getElementById('savePublication').addEventListener('click', createPublication);
  await loadProfile();
});

async function loadProfile() {
  try {
    const data = await profileApi.summary();
    renderProfile(data);
    document.getElementById('pageState').classList.add('d-none');
    document.getElementById('pageContent').classList.remove('d-none');
  } catch (error) {
    const box = document.getElementById('pageState');
    box.className = 'alert alert-danger';
    box.textContent = error.message;
  }
}

function renderProfile(data) {
  const { user, stats, favorites, subscriptions, activity, publications } = data;
  document.getElementById('userName').textContent = user.name;
  document.getElementById('userMeta').textContent = `@${user.username} · ${user.bio}`;
  document.getElementById('statFavorites').textContent = stats.favorites;
  document.getElementById('statComments').textContent = stats.comments;
  document.getElementById('statPublications').textContent = stats.publications;
  document.getElementById('statSubscriptions').textContent = stats.subscriptions;
  document.querySelectorAll('.nav-username').forEach(el => el.textContent = user.name);

  document.getElementById('favoritesList').innerHTML = favorites.length ? favorites.map(item => `
    <div class="list-item">
      <div class="fw-semibold">${escapeHtml(item.title)}</div>
      <div class="muted small">${escapeHtml(item.author || '—')} · ${escapeHtml(item.subtitle || '—')}</div>
    </div>`).join('') : '<div class="muted">Избранное пусто.</div>';

  document.getElementById('subscriptionsList').innerHTML = subscriptions.length ? subscriptions.map(item => `
    <div class="list-item">
      <div class="fw-semibold">${escapeHtml(item.name)}</div>
      <div class="muted small">${escapeHtml(item.updates)}</div>
    </div>`).join('') : '<div class="muted">Подписок нет.</div>';

  document.getElementById('activityList').innerHTML = activity.length ? activity.map(item => `
    <div class="list-item">
      <div>${escapeHtml(item.text)}</div>
      <div class="muted small mt-2">${new Date(item.createdAt).toLocaleString('ru-RU')}</div>
    </div>`).join('') : '<div class="muted">Активности пока нет.</div>';

  document.getElementById('publicationsList').innerHTML = publications.length ? publications.map(item => `
    <div class="list-item d-flex justify-content-between gap-3 align-items-start">
      <div>
        <div class="fw-semibold">${escapeHtml(item.title)}</div>
        <div class="muted small">${escapeHtml(item.type)} · ${escapeHtml(item.status)}</div>
      </div>
      <span class="chip">${escapeHtml(item.resourceType)}</span>
    </div>`).join('') : '<div class="muted">Публикаций пока нет.</div>';
}

async function createPublication() {
  const errorBox = document.getElementById('pubError');
  errorBox.classList.add('d-none');
  try {
    await publicationsApi.create({
      title: document.getElementById('pubTitle').value,
      type: document.getElementById('pubType').value,
      status: 'draft',
      resourceType: 'model',
    });
    bootstrap.Modal.getInstance(document.getElementById('publicationModal')).hide();
    document.getElementById('pubTitle').value = '';
    await loadProfile();
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('d-none');
  }
}

function escapeHtml(value) {
  return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}
</script>
</body>
</html>
