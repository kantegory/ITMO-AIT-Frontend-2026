<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ModelHub — Регистрация</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar navbar-expand-md bg-white sticky-top">
  <div class="container">
    <a href="search.html" class="navbar-brand brand">ModelHub</a>
    <div class="ms-auto d-flex gap-3 align-items-center">
      <a href="search.html" class="nav-link">Поиск</a>
      <a href="login.html" class="nav-link">Вход</a>
    </div>
  </div>
</nav>
<main class="auth-page container">
  <section class="hub-card w-100" style="max-width:720px;">
    <span class="hero-badge">Регистрация</span>
    <h1 class="fw-bold mt-3">Создать аккаунт</h1>
    <form id="registerForm" class="row g-3 mt-1">
      <div class="col-md-6"><label class="form-label fw-semibold">Имя</label><input id="firstName" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Фамилия</label><input id="lastName" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Логин</label><input id="username" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Email</label><input id="email" type="email" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Пароль</label><input id="password" type="password" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label fw-semibold">Подтверждение</label><input id="confirmPassword" type="password" class="form-control" required></div>
      <div class="col-12"><div id="errorMsg" class="alert alert-danger d-none"></div></div>
      <div class="col-12"><button class="btn btn-primary w-100" type="submit" id="submitBtn">Зарегистрироваться</button></div>
    </form>
  </section>
</main>
<script src="auth.js"></script>
<script src="api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  authHelper.redirectIfLoggedIn('profile.html');
  document.getElementById('registerForm').addEventListener('submit', register);
});

async function register(event) {
  event.preventDefault();
  const errorBox = document.getElementById('errorMsg');
  errorBox.classList.add('d-none');
  if (password.value !== confirmPassword.value) {
    errorBox.textContent = 'Пароли не совпадают.';
    errorBox.classList.remove('d-none');
    return;
  }
  try {
    const { token, user } = await authApi.register(firstName.value, lastName.value, username.value, email.value, password.value);
    authHelper.save(token, user);
    window.location.href = 'profile.html';
  } catch (error) {
    errorBox.textContent = error.message;
    errorBox.classList.remove('d-none');
  }
}
</script>
</body>
</html>
