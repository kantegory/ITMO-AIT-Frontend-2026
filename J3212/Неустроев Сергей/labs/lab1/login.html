<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — ФинТрекер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background-color: var(--finance-primary);">
    <div class="container"><a class="navbar-brand brand-logo" href="index.html">💰 ФинТрекер</a></div>
  </nav>

  <main class="container">
    <div class="auth-wrapper">
      <div class="card balance-card p-4">
        <h1 class="h4 mb-3 text-center">Вход в аккаунт</h1>
        <!-- TODO (ЛР2): отправка на API /login, сохранение токена -->
        <form class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required>
            <div class="invalid-feedback">Введите корректный e-mail.</div>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Пароль</label>
            <input type="password" class="form-control" id="password" minlength="6" required>
            <div class="invalid-feedback">Минимум 6 символов.</div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label" for="remember">Запомнить меня</label>
          </div>
          <button type="submit" class="btn btn-success w-100">Войти</button>
        </form>
        <p class="text-center mt-3 mb-0 small">
          Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
