<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отчёты — ФинТрекер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--finance-primary);">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">💰 ФинТрекер</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Кабинет</a></li>
          <li class="nav-item"><a class="nav-link" href="search.html">Транзакции</a></li>
          <li class="nav-item"><a class="nav-link active" href="report.html">Отчёты</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Выйти</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Отчёт по расходам</h1>
      <select class="form-select w-auto">
        <option>Этот месяц</option><option>Прошлый месяц</option><option>Год</option>
      </select>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card balance-card p-3">
          <h2 class="h6 text-muted">Расходы по категориям</h2>
          <!-- TODO: подключить Chart.js (CDN) и нарисовать pie/doughnut -->
          <div class="ratio ratio-1x1 bg-light rounded d-flex align-items-center justify-content-center">
            <span class="text-muted">[ круговая диаграмма ]</span>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card balance-card p-3">
          <h2 class="h6 text-muted">Динамика за период</h2>
          <!-- TODO: линейный/столбчатый график -->
          <div class="ratio ratio-1x1 bg-light rounded d-flex align-items-center justify-content-center">
            <span class="text-muted">[ график динамики ]</span>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 mt-1">
      <div class="col-md-4"><div class="card balance-card p-3"><span class="text-muted small">Доходы</span><span class="h4 amount-income mb-0">+60 000 ₽</span></div></div>
      <div class="col-md-4"><div class="card balance-card p-3"><span class="text-muted small">Расходы</span><span class="h4 amount-expense mb-0">−24 320 ₽</span></div></div>
      <div class="col-md-4"><div class="card balance-card p-3"><span class="text-muted small">Прогноз на конец месяца</span><span class="h4 mb-0">+18 000 ₽</span></div></div>
    </div>
  </main>

  <!-- TODO: для графиков подключите Chart.js:
       <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
