<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Транзакции — ФинТрекер</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="search">
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--finance-primary);">
    <div class="container">
      <a class="navbar-brand brand-logo" href="index.html">💰 ФинТрекер</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Кабинет</a></li>
          <li class="nav-item"><a class="nav-link active" href="search.html">Транзакции</a></li>
          <li class="nav-item"><a class="nav-link" href="report.html">Отчёты</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Выйти</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-4">Поиск и фильтрация транзакций</h1>

    <div class="row g-4">
      <!-- Панель фильтров (обязательный пункт варианта) -->
      <aside class="col-lg-3">
        <div class="card balance-card p-3">
          <h2 class="h6">Фильтры</h2>
          <!-- TODO (ЛР2): фильтры формируют query к API -->
          <form id="filters">
            <div class="mb-3">
              <label class="form-label small">Поиск по описанию</label>
              <input type="search" class="form-control form-control-sm" placeholder="напр. кофе">
            </div>
            <div class="mb-3">
              <label class="form-label small">Категория</label>
              <select class="form-select form-select-sm">
                <option value="">Все</option>
                <option>Продукты</option><option>Транспорт</option>
                <option>Развлечения</option><option>Зарплата</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small">Тип</label>
              <div class="form-check"><input class="form-check-input" type="radio" name="type" checked> <label class="form-check-label small">Все</label></div>
              <div class="form-check"><input class="form-check-input" type="radio" name="type"> <label class="form-check-label small">Доходы</label></div>
              <div class="form-check"><input class="form-check-input" type="radio" name="type"> <label class="form-check-label small">Расходы</label></div>
            </div>
            <div class="mb-3">
              <label class="form-label small">Сумма, ₽</label>
              <div class="d-flex gap-2">
                <input type="number" class="form-control form-control-sm" placeholder="от">
                <input type="number" class="form-control form-control-sm" placeholder="до">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small">Период</label>
              <input type="date" class="form-control form-control-sm mb-1">
              <input type="date" class="form-control form-control-sm">
            </div>
            <button type="submit" class="btn btn-success btn-sm w-100">Применить</button>
            <button type="reset" class="btn btn-link btn-sm w-100">Сбросить</button>
          </form>
        </div>
      </aside>

      <!-- Результаты -->
      <div class="col-lg-9">
        <div class="card balance-card">
          <table class="table table-hover mb-0 align-middle">
            <thead>
              <tr><th>Дата</th><th>Категория</th><th>Описание</th><th>Счёт</th><th class="text-end">Сумма</th></tr>
            </thead>
            <tbody id="tx-list">
              <!-- TODO (ЛР2): рендерить отфильтрованные транзакции из API -->
              <tr><td>28.06</td><td>Продукты</td><td>Супермаркет «Лента»</td><td>Основная карта</td><td class="text-end amount-expense">−1 250 ₽</td></tr>
              <tr><td>27.06</td><td>Зарплата</td><td>Аванс</td><td>Основная карта</td><td class="text-end amount-income">+60 000 ₽</td></tr>
              <tr><td>26.06</td><td>Кафе</td><td>Кофе</td><td>Наличные</td><td class="text-end amount-expense">−320 ₽</td></tr>
            </tbody>
          </table>
        </div>
        <nav class="mt-3">
          <ul class="pagination justify-content-center">
            <li class="page-item disabled"><a class="page-link">«</a></li>
            <li class="page-item active"><a class="page-link">1</a></li>
            <li class="page-item"><a class="page-link">2</a></li>
            <li class="page-item"><a class="page-link">»</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
