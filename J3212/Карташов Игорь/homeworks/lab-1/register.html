<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a DataFlow account to manage pipelines and data connections.">
  <title>DataFlow — Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <main class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-diagram-3-fill" style="font-size: 2rem; color: #1a237e;"></i>
        <h4 style="color: #1a237e;">DataFlow</h4>
        <p class="text-muted">Create a new account</p>
      </div>

      <form>
        <div class="row mb-3">
          <div class="col-6">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" placeholder="Igor">
          </div>
          <div class="col-6">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" placeholder="Kartashov">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@company.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Min 8 characters">
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password">
        </div>

        <a href="index.html" class="btn btn-primary w-100" style="background-color: #1a237e; border-color: #1a237e;">Create Account</a>

        <p class="text-center mt-3">
          Already have an account? <a href="login.html">Sign In</a>
        </p>
      </form>
    </main>
  </div>

</body>
</html>
