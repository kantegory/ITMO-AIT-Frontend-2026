<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DataFlow pipelines dashboard: schedules, last runs, and status of data orchestration DAGs.">
  <title>DataFlow — Pipelines</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link href="css/red.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4><i class="bi bi-diagram-3-fill"></i> DataFlow</h4>

    <div class="section-title">Main</div>
    <a href="index.html" class="active"><svg class="svg-icon"><use href="svg_sprites/sprites.svg#icon-boxes"></use></svg> Pipelines</a>
    <a href="#"><i class="bi bi-clock-history"></i> Runs</a>

    <div class="section-title">Monitor</div>
    <a href="#"><i class="bi bi-activity"></i> Metrics</a>
    <a href="#"><i class="bi bi-exclamation-triangle"></i> Alerts</a>

    <div class="section-title">Settings</div>
    <a href="profile.html"><i class="bi bi-plug"></i> Connections</a>
    <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <strong class="text-brand">Pipelines</strong>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="svg-icon" id="themeIcon"><use href="svg_sprites/sprites.svg#icon-brightness"></use></svg>
      </button>
      <a href="profile.html" class="text-decoration-none text-dark">
        <i class="bi bi-person-circle"></i> Profile
      </a>
    </div>
  </div>

  <main class="main-content">

    <!-- Search and filters -->
    <div class="filter-bar d-flex flex-wrap gap-2 align-items-center">
      <input type="text" class="form-control form-control-sm" style="max-width: 250px;"
             placeholder="Search pipelines..." id="searchInput">

      <button class="btn btn-sm btn-outline-secondary active" data-filter="all">All</button>
      <button class="btn btn-sm btn-outline-success" data-filter="success">Success</button>
      <button class="btn btn-sm btn-outline-danger" data-filter="failed">Failed</button>
      <button class="btn btn-sm btn-outline-warning" data-filter="running">Running</button>
    </div>

    <!-- Table -->
    <div class="table-responsive bg-card rounded shadow-sm">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Name</th>
            <th>Schedule</th>
            <th>Last Run</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="text-center p-4 text-muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/index.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
