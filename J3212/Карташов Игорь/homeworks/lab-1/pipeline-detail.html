<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pipeline details: graph, logs, and run history in DataFlow.">
  <title>DataFlow — Pipeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link href="css/red.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4><i class="bi bi-diagram-3-fill"></i> DataFlow</h4>

    <div class="section-title">Main</div>
    <a href="index.html" class="active"><svg class="svg-icon"><use href="svg_sprites/sprites.svg#icon-boxes"></use></svg> Pipelines</a>
    <a href="#"><i class="bi bi-clock-history"></i> Runs</a>

    <div class="section-title">Monitor</div>
    <a href="#"><i class="bi bi-activity"></i> Metrics</a>
    <a href="#"><i class="bi bi-exclamation-triangle"></i> Alerts</a>

    <div class="section-title">Settings</div>
    <a href="profile.html"><i class="bi bi-plug"></i> Connections</a>
    <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <a href="index.html" class="text-decoration-none text-brand">Pipelines</a>
      <span class="text-muted"> / </span>
      <strong id="pipelineName">Loading...</strong>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="svg-icon" id="themeIcon"><use href="svg_sprites/sprites.svg#icon-brightness"></use></svg>
      </button>
      <a href="profile.html" class="text-decoration-none text-dark">
        <i class="bi bi-person-circle"></i> Profile
      </a>
    </div>
  </div>

  <main class="main-content">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h5 class="text-brand"><i class="bi bi-diagram-3"></i> <span id="pipelineName2"></span></h5>
        <p class="text-muted mb-0" id="pipelineInfo">Loading...</p>
      </div>
      <div>
        <button class="btn btn-sm btn-outline-success"><i class="bi bi-play-fill"></i> Run</button>
        <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pause-fill"></i> Pause</button>
      </div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3" id="pipelineTabs">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#graph">
          <i class="bi bi-diagram-3"></i> Graph View
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#logs">
          <i class="bi bi-terminal"></i> Logs
        </button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#history">
          <i class="bi bi-clock-history"></i> History
        </button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- Graph View -->
      <div class="tab-pane fade show active" id="graph">
        <div class="bg-card rounded shadow-sm p-4">
          <div class="d-flex flex-column align-items-center" id="graphContainer">
            <p class="text-muted">Loading graph...</p>
          </div>
        </div>
      </div>

      <!-- Logs -->
      <div class="tab-pane fade" id="logs">
        <div class="log-terminal" id="logTerminal">Loading logs...</div>
      </div>

      <!-- History -->
      <div class="tab-pane fade" id="history">
        <div class="table-responsive bg-card rounded shadow-sm">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Run ID</th>
                <th>Start Time</th>
                <th>Duration</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="historyBody">
              <tr><td colspan="4" class="text-center p-4 text-muted">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p><strong>Task ID:</strong> <span id="modalId"></span></p>
          <p><strong>Start Time:</strong> <span id="modalStart"></span></p>
          <p><strong>Duration:</strong> <span id="modalDuration"></span></p>
          <p><strong>Status:</strong> <span id="modalStatus"></span></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pipeline-detail.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
