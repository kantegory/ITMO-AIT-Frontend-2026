<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="User profile, statistics, and data connections in DataFlow.">
  <title>DataFlow — Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link href="css/red.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4><i class="bi bi-diagram-3-fill"></i> DataFlow</h4>

    <div class="section-title">Main</div>
    <a href="index.html"><svg class="svg-icon"><use href="svg_sprites/sprites.svg#icon-boxes"></use></svg> Pipelines</a>
    <a href="#"><i class="bi bi-clock-history"></i> Runs</a>

    <div class="section-title">Monitor</div>
    <a href="#"><i class="bi bi-activity"></i> Metrics</a>
    <a href="#"><i class="bi bi-exclamation-triangle"></i> Alerts</a>

    <div class="section-title">Settings</div>
    <a href="profile.html"><i class="bi bi-plug"></i> Connections</a>
    <a href="profile.html" class="active"><i class="bi bi-person-circle"></i> Profile</a>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <strong class="text-brand">Profile</strong>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="svg-icon" id="themeIcon"><use href="svg_sprites/sprites.svg#icon-brightness"></use></svg>
      </button>
      <a href="#" onclick="logout()" class="text-decoration-none text-danger">
        <i class="bi bi-box-arrow-right"></i> Sign Out
      </a>
    </div>
  </div>

  <main class="main-content">
    <div class="row">

      <!-- Profile info -->
      <div class="col-md-4 mb-4">
        <div class="bg-card rounded shadow-sm p-4 text-center">
          <div class="avatar-circle mx-auto mb-3">
            <span class="text-white fs-4 fw-bold" id="profileInitials">...</span>
          </div>
          <h5 id="profileName">Loading...</h5>
          <p class="text-muted" id="profileEmail"></p>
          <span class="badge bg-primary" id="profileRole"></span>

          <hr>

          <div class="text-start">
            <p class="mb-1"><strong>Team:</strong> <span id="profileTeam"></span></p>
            <p class="mb-1"><strong>Timezone:</strong> <span id="profileTimezone"></span></p>
            <p class="mb-1"><strong>Member since:</strong> <span id="profileSince"></span></p>
            <p class="mb-0">
              <a href="#" class="text-decoration-none text-brand">
                <svg class="svg-icon"><use href="svg_sprites/sprites.svg#icon-bluesky"></use></svg> Bluesky
              </a>
            </p>
          </div>
        </div>
      </div>

      <div class="col-md-8">

        <!-- Statistics -->
        <div class="bg-card rounded shadow-sm p-4 mb-4">
          <h6><i class="bi bi-bar-chart"></i> Statistics</h6>
          <div class="row text-center mt-3">
            <div class="col-3">
              <div class="fs-4 fw-bold text-brand" id="statDags">—</div>
              <small class="text-muted">DAGs</small>
            </div>
            <div class="col-3">
              <div class="fs-4 fw-bold text-success" id="statRuns">—</div>
              <small class="text-muted">Runs</small>
            </div>
            <div class="col-3">
              <div class="fs-4 fw-bold text-warning" id="statRate">—</div>
              <small class="text-muted">Success Rate</small>
            </div>
            <div class="col-3">
              <div class="fs-4 fw-bold text-info" id="statAvg">—</div>
              <small class="text-muted">Avg Duration</small>
            </div>
          </div>
        </div>

        <!-- Connections -->
        <div class="bg-card rounded shadow-sm p-4">
          <h6><i class="bi bi-plug"></i> Connections</h6>
          <div id="connectionsList" class="mt-3">
            <p class="text-muted">Loading connections...</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
