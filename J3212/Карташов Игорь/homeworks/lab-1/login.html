<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to DataFlow to manage data pipelines and orchestration.">
  <title>DataFlow — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <main class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-diagram-3-fill" style="font-size: 2rem; color: #1a237e;"></i>
        <h4 style="color: #1a237e;">DataFlow</h4>
        <p class="text-muted">Sign in to your account</p>
      </div>

      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@company.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password">
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <a href="index.html" class="btn btn-primary w-100" style="background-color: #1a237e; border-color: #1a237e;">Sign In</a>

        <p class="text-center mt-3">
          Don't have an account? <a href="register.html">Sign Up</a>
        </p>
      </form>
    </main>
  </div>

</body>
</html>
