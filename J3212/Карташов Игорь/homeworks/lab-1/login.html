<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to DataFlow to manage data pipelines and orchestration.">
  <title>DataFlow — Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link href="css/red.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <main class="auth-card">
      <div class="text-center mb-4">
        <i class="bi bi-diagram-3-fill text-brand" style="font-size: 2rem;"></i>
        <h4 class="text-brand">DataFlow</h4>
        <p class="text-muted">Sign in to your account</p>
      </div>

      <div id="authError" class="alert alert-danger d-none"></div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="you@company.com" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">Remember me</label>
        </div>

        <button type="submit" class="btn btn-brand w-100">Sign In</button>

        <p class="text-center mt-3">
          Don't have an account? <a href="register.html">Sign Up</a>
        </p>
      </form>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
