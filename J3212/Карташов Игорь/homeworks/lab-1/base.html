<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DataFlow layout template for the data orchestration UI.">
  <title>DataFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/dark.css" rel="stylesheet" media="(prefers-color-scheme: dark)">
  <link href="css/red.css" rel="stylesheet">
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <h4><i class="bi bi-diagram-3-fill"></i> DataFlow</h4>

    <div class="section-title">Main</div>
    <a href="index.html" class="active"><svg class="svg-icon"><use href="svg_sprites/sprites.svg#icon-boxes"></use></svg> Pipelines</a>
    <a href="#"><i class="bi bi-clock-history"></i> Runs</a>

    <div class="section-title">Monitor</div>
    <a href="#"><i class="bi bi-activity"></i> Metrics</a>
    <a href="#"><i class="bi bi-exclamation-triangle"></i> Alerts</a>

    <div class="section-title">Settings</div>
    <a href="profile.html"><i class="bi bi-plug"></i> Connections</a>
    <a href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
  </div>

  <!-- Topbar -->
  <div class="topbar">
    <strong class="text-brand">Dashboard</strong>
    <div class="d-flex align-items-center gap-2">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="svg-icon" id="themeIcon"><use href="svg_sprites/sprites.svg#icon-brightness"></use></svg>
      </button>
      <a href="profile.html" class="text-decoration-none text-dark">
        <i class="bi bi-person-circle"></i> Profile
      </a>
    </div>
  </div>

  <main class="main-content">
    <p>This is the base layout template. Open <a href="index.html">index.html</a> to see the dashboard.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
