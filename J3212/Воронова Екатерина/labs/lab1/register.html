<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — FinFlow</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="container py-5">
    <div class="auth-header mb-4">
      <a href="index.html" class="back-home"><i class="bi bi-arrow-left"></i> На главную</a>
    </div>

    <div class="row g-0 auth-wrapper overflow-hidden">
      <div class="col-lg-6 auth-left p-5">
        <span class="hero-badge">Создайте аккаунт</span>
        <h1 class="fw-bold mt-3">Регистрация в FinFlow</h1>
        <p class="text-muted mt-3">
          Создайте личный кабинет и начните управлять своими финансами в одном удобном сервисе.
        </p>

        <div class="auth-feature-list mt-4">
          <div><i class="bi bi-check-circle-fill"></i> Учёт бюджета</div>
          <div><i class="bi bi-check-circle-fill"></i> Аналитика расходов</div>
          <div><i class="bi bi-check-circle-fill"></i> Интеграции с аккаунтами</div>
        </div>
      </div>

      <div class="col-lg-6 auth-right p-4 p-md-5">
        <div class="form-card">
          <h2 class="fw-bold mb-2">Регистрация</h2>
          <p class="text-muted mb-4">Заполните форму для создания аккаунта</p>

          <form action="dashboard.html">
            <div class="mb-3">
              <label class="form-label">Имя</label>
              <input type="text" class="form-control custom-input" placeholder="Введите имя" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control custom-input" placeholder="Введите email" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Пароль</label>
              <div class="input-group">
                <input type="password" class="form-control custom-input password-field" placeholder="Введите пароль" required />
                <button class="btn btn-password-toggle" type="button">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Повторите пароль</label>
              <div class="input-group">
                <input type="password" class="form-control custom-input password-field" placeholder="Повторите пароль" required />
                <button class="btn btn-password-toggle" type="button">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>

            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required />
              <label class="form-check-label" for="agreeTerms">
                Я согласен(а) с условиями использования сервиса
              </label>
            </div>

            <button type="submit" class="btn btn-main w-100">Создать аккаунт</button>
          </form>

          <p class="text-center mt-4 mb-0">
            Уже есть аккаунт?
            <a href="login.html" class="small-link fw-semibold">Войти</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
