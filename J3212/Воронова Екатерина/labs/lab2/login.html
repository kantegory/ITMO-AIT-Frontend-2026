<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — FinFlow</title>

  <script>
    (function () {
      const savedTheme = localStorage.getItem("finflow-theme");
      const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = savedTheme || (systemDark ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <main class="container py-5">
    <div class="auth-header mb-4 d-flex justify-content-between align-items-center">
      <a href="index.html" class="back-home"><i class="bi bi-arrow-left" aria-hidden="true"></i> На главную</a>

      <button class="btn btn-outline-main theme-toggle" type="button" aria-label="Переключить тему">
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
        <span class="theme-toggle-text ms-2">Тёмная тема</span>
      </button>
    </div>

    <div class="row g-0 auth-wrapper overflow-hidden">
      <div class="col-lg-6 auth-left p-5">
        <span class="hero-badge">Добро пожаловать</span>
        <h1 class="fw-bold mt-3">Вход в личный кабинет</h1>
        <p class="text-muted mt-3">
          Войдите в систему, чтобы просматривать счета, транзакции, бюджеты и финансовые отчёты.
        </p>

        <div class="auth-feature-list mt-4">
          <div><i class="bi bi-check-circle-fill" aria-hidden="true"></i> Контроль расходов и доходов</div>
          <div><i class="bi bi-check-circle-fill" aria-hidden="true"></i> Удобный поиск транзакций</div>
          <div><i class="bi bi-check-circle-fill" aria-hidden="true"></i> Отчёты и аналитика</div>
        </div>
      </div>

      <div class="col-lg-6 auth-right p-4 p-md-5">
        <div class="form-card">
          <h2 class="fw-bold mb-2">Вход</h2>
          <p class="text-muted mb-4">Введите свои данные для входа</p>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label" for="loginEmail">Email</label>
              <input
                id="loginEmail"
                type="email"
                class="form-control custom-input"
                placeholder="Введите email"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label" for="loginPassword">Пароль</label>
              <div class="input-group">
                <input
                  id="loginPassword"
                  type="password"
                  class="form-control custom-input password-field"
                  placeholder="Введите пароль"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="btn btn-password-toggle"
                  type="button"
                  aria-label="Показать пароль"
                  aria-pressed="false"
                >
                  <i class="bi bi-eye" aria-hidden="true"></i>
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe" />
                <label class="form-check-label" for="rememberMe">Запомнить меня</label>
              </div>
              <a href="#" class="small-link" aria-disabled="true">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn btn-main w-100">Войти</button>
            <p id="loginError" class="text-danger mt-3 mb-0" role="alert" aria-live="polite"></p>
          </form>

          <p class="text-center mt-4 mb-0">
            Нет аккаунта?
            <a href="register.html" class="small-link fw-semibold">Зарегистрироваться</a>
          </p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
