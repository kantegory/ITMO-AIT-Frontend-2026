<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Pipeline — Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <header class="card-header bg-dark text-white text-center">
                        <h1 class="h4">ML Pipeline</h1>
                        <p class="mb-0">Платформа управления ML-экспериментами</p>
                    </header>
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Регистрация аккаунта</h2>
                        
                        <form id="register-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="username" placeholder="Введите имя" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" placeholder="Минимум 8 символов" required minlength="8">
                            </div>
                            <div class="mb-3">
                                <label for="password-confirm" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control" id="password-confirm" placeholder="Повторите пароль" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    Я согласен с <a href="#">условиями использования</a>
                                </label>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                            </div>
                        </form>
                        
                        <div class="text-center mt-3">
                            <p class="mb-0">Уже есть аккаунт? <a href="index.html">Войти</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <footer class="text-center text-muted mt-5">
            <p>&copy; 2026 ML Pipeline. Все права защищены.</p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
