<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финанас - Поиск транзакций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm" aria-label="Главная навигация">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="Финанас - На главную">
                <img src="img/logo.png" alt="Логотип Финанас" width="45" class="me-2">
                Финанас
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html"><i class="bi bi-house-door me-1" aria-hidden="true"></i> Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="search.html" aria-current="page"><i class="bi bi-search me-1" aria-hidden="true"></i> Операции</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html"><i class="bi bi-pie-chart me-1" aria-hidden="true"></i> Отчеты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="integrations.html"><i class="bi bi-plug me-1" aria-hidden="true"></i> Настройки</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center mt-2 mt-lg-0">
                    <button id="themeToggleBtn" class="btn btn-outline-light btn-sm me-3" aria-label="Переключить тему">
                        🧟 Зомби-мод
                    </button>
                    <span id="userNameDisplay" class="navbar-text text-white me-3 d-none d-lg-block" aria-live="polite">Привет!</span>
                    <a href="login.html" class="btn btn-outline-light btn-sm" aria-label="Выйти из аккаунта">
                        <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i> Выйти
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>

<main class="container mt-4">
    <h1 class="mb-4 text-success fw-bold h2"><i class="bi bi-search me-2" aria-hidden="true"></i> Поиск и фильтрация</h1>

    <section class="card shadow-sm mb-4 border-success" style="border-radius: 15px;" aria-labelledby="filter-heading">
        <h2 id="filter-heading" class="visually-hidden">Фильтр транзакций</h2>
        <div class="card-body">
            <form id="filterForm" class="row g-3 align-items-end" aria-label="Форма фильтрации операций">
                <div class="col-md-4">
                    <label for="searchInput" class="form-label text-muted"><i class="bi bi-textarea-t me-1" aria-hidden="true"></i> Название</label>
                    <input type="text" id="searchInput" class="form-control" placeholder="Например: Супермаркет">
                </div>

                <div class="col-md-3">
                    <label for="typeFilter" class="form-label text-muted"><i class="bi bi-arrow-left-right me-1" aria-hidden="true"></i> Тип операции</label>
                    <select id="typeFilter" class="form-select">
                        <option value="all">Все типы</option>
                        <option value="expense">Только расходы</option>
                        <option value="income">Только доходы</option>
                    </select>
                </div>

                <div class="col-md-5">
                    <label for="categoryFilter" class="form-label text-muted"><i class="bi bi-tags me-1" aria-hidden="true"></i> Категория</label>
                    <select id="categoryFilter" class="form-select">
                        <option value="all">Все категории</option>
                        <option value="food">Продукты</option>
                        <option value="transport">Транспорт</option>
                        <option value="salary">Зарплата</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label for="minAmount" class="form-label text-muted"><i class="bi bi-cash-coin me-1" aria-hidden="true"></i> Сумма (₽)</label>
                    <div class="input-group">
                        <input type="number" id="minAmount" class="form-control" placeholder="От">
                        <span class="input-group-text">-</span>
                        <label for="maxAmount" class="visually-hidden">Максимальная сумма</label>
                        <input type="number" id="maxAmount" class="form-control" placeholder="До">
                    </div>
                </div>

                <div class="col-md-5">
                    <label for="startDate" class="form-label text-muted"><i class="bi bi-calendar3 me-1" aria-hidden="true"></i> Период</label>
                    <div class="input-group">
                        <input type="date" id="startDate" class="form-control">
                        <span class="input-group-text">-</span>
                        <label for="endDate" class="visually-hidden">Дата окончания</label>
                        <input type="date" id="endDate" class="form-control">
                    </div>
                </div>

                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100 shadow-sm" aria-label="Применить фильтры">
                        <i class="bi bi-search me-1" aria-hidden="true"></i> Найти
                    </button>
                </div>
            </form>
        </div>
    </section>

    <section class="card shadow-sm" style="border-radius: 15px;" aria-labelledby="results-heading">
        <h2 id="results-heading" class="visually-hidden">Результаты поиска</h2>
        <div class="card-body">
            <table class="table table-hover align-middle" aria-label="Таблица отфильтрованных транзакций">
                <thead class="table-light">
                <tr>
                    <th scope="col">Дата</th>
                    <th scope="col">Название</th>
                    <th scope="col">Категория</th>
                    <th scope="col" class="text-end">Сумма</th>
                </tr>
                </thead>
                <tbody id="transactionsTable" aria-live="polite">
                </tbody>
            </table>
            <nav aria-label="Навигация по страницам результатов" class="mt-4">
                <ul class="pagination justify-content-center" id="paginationContainer">
                </ul>
            </nav>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/guard.js"></script>
<script src="js/transactions.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
