<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — ModelHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/light.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/violet.css">
</head>

<body class="profile-page">

<nav class="custom-navbar fixed-top" aria-label="Главное меню">
    <div class="nav-wrapper">

        <div class="nav-left">
            <a href="index.html" class="logo">ModelHub</a>
        </div>

        <form class="search-box" action="search.html" method="GET">
            <i class="bi bi-search"></i>
            <input type="text" name="query" placeholder="Поиск моделей и датасетов">
        </form>

        <div class="nav-right">
            <button class="login-btn" type="button" onclick="logout()">Выйти</button>
        </div>

    </div>
</nav>

<main id="main-content">
    <section class="profile-section" aria-labelledby="profilePageTitle">
        <div class="profile-container">
            <h1 class="visually-hidden" id="profilePageTitle">Профиль пользователя</h1>

            <div class="row g-4 align-items-start">
                <div class="col-lg-4">
                    <div class="card profile-sidebar-card mb-4">
                        <div class="card-body text-center">

                            <img
                                    src="https://i.pravatar.cc/150"
                                    class="rounded-circle profile-avatar mb-3"
                                    alt="Аватар пользователя"
                                    id="profileAvatar">

                            <div class="d-grid gap-2 mt-4">
                                <h2 class="profile-name mb-1" id="profileName">Нет имени</h2>

                                <div class="mb-2 text-muted small">
                                    <div>Email: <strong id="profileEmail">—</strong></div>
                                    <div>ID: <strong id="profileId">—</strong></div>
                                </div>

                                <p class="profile-role mb-2" id="profileRole">Роль не выбрана</p>
                                <p class="profile-description" id="profileDescription">Описания нет</p>

                                <button
                                        class="btn btn-dark profile-action-btn"
                                        type="button"
                                        data-bs-toggle="modal"
                                        data-bs-target="#editProfileModal">
                                    Редактировать профиль
                                </button>
                            </div>

                            <div class="row text-center mt-4">
                                <div class="col-4">
                                    <h3 class="mb-0" id="modelsCount">0</h3>
                                    <small class="text-muted">Модели</small>
                                </div>

                                <div class="col-4">
                                    <h3 class="mb-0" id="datasetsCount">0</h3>
                                    <small class="text-muted">Датасеты</small>
                                </div>

                                <div class="col-4">
                                    <h3 class="mb-0" id="subscriptionsCount">0</h3>
                                    <small class="text-muted">Подписки</small>
                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="card profile-main-card">
                        <div class="card-body">
                            <h2 class="mb-3">Статистика</h2>

                            <div class="stats-strip">
                                <div class="stats-strip-item">
                                    <span>Загрузок </span>
                                    <strong id="totalDownloads">0</strong>
                                </div>

                                <div class="stats-strip-item">
                                    <span>Звезд </span>
                                    <strong id="totalStars">0</strong>
                                </div>

                                <div class="stats-strip-item">
                                    <span>Форков </span>
                                    <strong id="totalForks">0</strong>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card profile-main-card">
                        <div class="card-body">

                            <ul class="nav nav-tabs profile-tabs mb-4">
                                <li class="nav-item">
                                    <button class="nav-link active"
                                            data-bs-toggle="tab"
                                            data-bs-target="#modelsTab">
                                        Мои модели
                                    </button>
                                </li>

                                <li class="nav-item">
                                    <button class="nav-link"
                                            data-bs-toggle="tab"
                                            data-bs-target="#datasetsTab">
                                        Мои датасеты
                                    </button>
                                </li>

                                <li class="nav-item">
                                    <button class="nav-link"
                                            data-bs-toggle="tab"
                                            data-bs-target="#subscriptionsTab">
                                        Подписки
                                    </button>
                                </li>
                            </ul>

                            <div class="tab-content">
                                <div class="tab-pane fade show active" id="modelsTab">
                                    <div id="modelsList"></div>
                                </div>

                                <div class="tab-pane fade" id="datasetsTab">
                                    <div id="datasetsList"></div>
                                </div>

                                <div class="tab-pane fade" id="subscriptionsTab">
                                    <ul class="list-group" id="subscriptionsList"></ul>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>
</main>

<div class="modal fade" id="editProfileModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h2 class="modal-title fs-5">Редактировать профиль</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Имя</label>
                    <input type="text" class="form-control" id="editName">
                </div>

                <div class="mb-3">
                    <label class="form-label">Ссылка на аватар</label>
                    <input type="text" class="form-control" id="editAvatar">
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea class="form-control" rows="3" id="editDescription"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Роль</label>
                    <input type="text" class="form-control" id="editRole">
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-outline-dark" data-bs-dismiss="modal">Закрыть</button>
                <button class="btn btn-dark" onclick="saveProfile()">Сохранить</button>
            </div>

        </div>
    </div>
</div>

<div class="theme-switcher-fixed">
    <button class="theme-btn" data-theme="light" onclick="setTheme('light')" aria-label="Светлая тема">
        <svg class="icon">
            <use href="sprite.svg#theme-light"></use>
        </svg>
    </button>

    <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" aria-label="Тёмная тема">
        <svg class="icon">
            <use href="sprite.svg#theme-dark"></use>
        </svg>
    </button>

    <button class="theme-btn" data-theme="violet" onclick="setTheme('violet')" aria-label="Фиолетовая тема">
        <svg class="icon">
            <use href="sprite.svg#theme-violet"></use>
        </svg>
    </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
<script src="js/theme.js"></script>

<script>
    const API_URL = 'http://localhost:3000';
    let usersMap = {};

    function logout() {
        localStorage.clear();
        window.location.href = 'login.html';
    }

    function requireAuth() {
        if (!localStorage.getItem('userId')) {
            window.location.href = 'login.html';
        }
    }

    function setText(id, value, fallback='—') {
        const el = document.getElementById(id);
        if (el) el.textContent = value || fallback;
    }

    function renderCards(items, containerId) {
        const container = document.getElementById(containerId);

        if (!items.length) {
            container.innerHTML = '<div class="text-muted">Пока ничего нет</div>';
            return;
        }

        container.innerHTML = items.map(item => `
        <div class="border rounded-4 p-3 mb-3 bg-white">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                <div>
                    <h3 class="h5 mb-2">${item.title}</h3>
                    <div class="small text-muted d-flex gap-3 flex-wrap">
                        <span>Загрузок <strong>${item.downloads || 0}</strong></span>
                        <span>Звезд <strong>${item.stars || 0}</strong></span>
                        <span>Форков <strong>${item.forks || 0}</strong></span>
                    </div>
                </div>

                <a href="model.html?type=${item.type}&id=${item.id}"
                   class="btn btn-dark btn-sm rounded-pill">
                   Открыть
                </a>
            </div>
        </div>
    `).join('');
    }

    function renderSubscriptions(subs) {
        const container = document.getElementById('subscriptionsList');

        if (!subs.length) {
            container.innerHTML = '<li class="list-group-item text-muted">Подписок пока нет</li>';
            return;
        }

        container.innerHTML = subs.map(sub => {
            const user = usersMap[sub.followingId] || {};
            return `
            <li class="list-group-item">
                <strong>${user.name || sub.followingId}</strong>
                <span class="text-muted"> — ${user.role || 'пользователь'}</span>
            </li>
        `;
        }).join('');
    }

    function fillUser(user) {
        setText('profileName', user.name, 'Без имени');
        setText('profileRole', user.role, 'Без роли');
        setText('profileDescription', user.description, 'Без описания');
        setText('profileEmail', user.email);
        setText('profileId', user.id);

        document.getElementById('profileAvatar').src =
            user.avatar || 'https://i.pravatar.cc/150';

        editName.value = user.name || '';
        editAvatar.value = user.avatar || '';
        editDescription.value = user.description || '';
        editRole.value = user.role || '';
    }

    async function loadProfile() {
        requireAuth();

        const userId = localStorage.getItem('userId');

        const [usersRes, modelsRes, datasetsRes, subsRes] = await Promise.all([
            axios.get(API_URL + '/users'),
            axios.get(API_URL + '/models'),
            axios.get(API_URL + '/datasets'),
            axios.get(API_URL + '/subscriptions')
        ]);

        const users = usersRes.data;
        const models = modelsRes.data;
        const datasets = datasetsRes.data;
        const subscriptions = subsRes.data;

        usersMap = {};
        users.forEach(u => usersMap[u.id] = u);

        const user = usersMap[userId];
        if (!user) return logout();

        fillUser(user);

        const userModels = models.filter(i => i.authorId == userId);
        const userDatasets = datasets.filter(i => i.authorId == userId);
        const userSubs = subscriptions.filter(i => i.followerId == userId);

        modelsCount.textContent = userModels.length;
        datasetsCount.textContent = userDatasets.length;
        subscriptionsCount.textContent = userSubs.length;

        const all = [...userModels, ...userDatasets];

        totalDownloads.textContent =
            all.reduce((s,i)=>s+(+i.downloads||0),0);

        totalStars.textContent =
            all.reduce((s,i)=>s+(+i.stars||0),0);

        totalForks.textContent =
            all.reduce((s,i)=>s+(+i.forks||0),0);

        renderCards(userModels, 'modelsList');
        renderCards(userDatasets, 'datasetsList');
        renderSubscriptions(userSubs);
    }

    async function saveProfile() {
        const userId = localStorage.getItem('userId');

        const body = {
            name: editName.value.trim(),
            avatar: editAvatar.value.trim(),
            description: editDescription.value.trim(),
            role: editRole.value.trim()
        };

        await axios.patch(API_URL + '/users/' + userId, body);

        localStorage.setItem('userName', body.name);
        localStorage.setItem('userAvatar', body.avatar);
        localStorage.setItem('userRole', body.role);

        bootstrap.Modal.getInstance(
            document.getElementById('editProfileModal')
        ).hide();

        await loadProfile();

        updateNavAvatar();
    }

    function updateNavAvatar() {
        const img = document.querySelector('.nav-avatar-img');

        if (img) {
            img.src = localStorage.getItem('userAvatar') + '?t=' + Date.now();
        }
    }

    loadProfile();
</script>

</body>
</html>
