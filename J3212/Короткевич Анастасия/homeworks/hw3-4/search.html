<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск — ModelHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/light.css">
  <link rel="stylesheet" href="css/dark.css">
  <link rel="stylesheet" href="css/violet.css">
</head>
<body data-theme="light">

<nav class="custom-navbar model-page-navbar fixed-top" aria-label="Главное меню">
  <div class="nav-wrapper">

    <div class="nav-left">
      <a href="index.html" class="logo">ModelHub</a>
    </div>

    <form class="search-box" action="search.html" method="GET" role="search">
      <i class="bi bi-search" aria-hidden="true"></i>
      <input id="nav-search" type="text" name="query" placeholder="Поиск моделей и датасетов">
    </form>

    <div class="nav-right" id="navActions"></div>

  </div>
</nav>

<main id="main-content">
  <section class="search-page-section" aria-labelledby="search-page-title">
    <div class="search-page-container">
      <h1 class="visually-hidden" id="search-page-title">Поиск моделей и датасетов</h1>

      <div class="row g-4 align-items-start">
        <div class="col-lg-4 col-xl-3">
          <div class="card search-filters-card">
            <div class="card-body">
              <h2 class="search-section-title">Фильтры</h2>
              <form id="search-form" class="row g-3">
                <div class="col-12">
                  <label class="form-label" for="search-input">Поиск</label>
                  <input type="text" id="search-input" class="form-control" placeholder="Название, описание, автор">
                </div>

                <div class="col-12">
                  <label class="form-label" for="type-filter">Тип</label>
                  <select id="type-filter" class="form-select">
                    <option value="all">Все</option>
                    <option value="model">Модели</option>
                    <option value="dataset">Датасеты</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="task-filter">Задача</label>
                  <select id="task-filter" class="form-select">
                    <option value="all">Все</option>
                    <option value="NLP">NLP</option>
                    <option value="Computer Vision">Computer Vision</option>
                    <option value="Tabular ML">Tabular ML</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="license-filter">Лицензия</label>
                  <select id="license-filter" class="form-select">
                    <option value="all">Все</option>
                    <option value="MIT">MIT</option>
                    <option value="Apache-2.0">Apache-2.0</option>
                    <option value="BSD-3-Clause">BSD-3-Clause</option>
                    <option value="CC BY 4.0">CC BY 4.0</option>
                    <option value="CC0">CC0</option>
                    <option value="ODbL">ODbL</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="size-filter">Размер</label>
                  <select id="size-filter" class="form-select">
                    <option value="all">Все</option>
                    <option value="small">Small</option>
                    <option value="medium">Medium</option>
                    <option value="large">Large</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label" for="framework-filter">Фреймворк</label>
                  <select id="framework-filter" class="form-select">
                    <option value="all">Все</option>
                    <option value="PyTorch">PyTorch</option>
                    <option value="TensorFlow">TensorFlow</option>
                    <option value="XGBoost">XGBoost</option>
                    <option value="CSV / JSON">CSV / JSON</option>
                    <option value="Images / JPEG">Images / JPEG</option>
                    <option value="CSV">CSV</option>
                  </select>
                </div>

                <div class="col-12 d-grid gap-2">
                  <button type="submit" class="btn btn-dark search-action-btn">Найти</button>
                  <button type="button" class="btn btn-outline-dark rounded-pill" onclick="resetFilters()">Сбросить</button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-lg-8 col-xl-9">
          <div class="card search-results-card">
            <div class="card-body">
              <div class="search-results-header">
                <h2 class="search-results-title">Результаты поиска</h2>
                <p class="search-results-subtitle" id="resultsSummary" aria-live="polite">Данных нет</p>
              </div>
              <div id="results-container" class="row g-4" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="theme-switcher-fixed">
  <button class="theme-btn" data-theme="light" onclick="setTheme('light')" aria-label="Светлая тема">
    <svg class="icon">
      <use href="sprite.svg#theme-light"></use>
    </svg>
  </button>

  <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')" aria-label="Тёмная тема">
    <svg class="icon">
      <use href="sprite.svg#theme-dark"></use>
    </svg>
  </button>

  <button class="theme-btn" data-theme="violet" onclick="setTheme('violet')" aria-label="Фиолетовая тема">
    <svg class="icon">
      <use href="sprite.svg#theme-violet"></use>
    </svg>
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
<script src="js/theme.js"></script>
<script>
  const API_URL = 'http://localhost:3000';
  let allItems = [];

  function logout() {
    localStorage.removeItem('accessToken');
    localStorage.removeItem('userId');
    localStorage.removeItem('userName');
    localStorage.removeItem('userEmail');
    localStorage.removeItem('userRole');
    window.location.href = 'login.html';
  }

  function updateNav() {
    const token = localStorage.getItem('accessToken');
    const userAvatar = localStorage.getItem('userAvatar') || 'https://i.pravatar.cc/100';

    const nav = document.getElementById('navActions');
    if (!nav) return;

    if (token) {
      nav.innerHTML = `
      <a href="profile.html" class="avatar-link" title="Профиль">
        <img src="${userAvatar}" class="nav-avatar-img" alt="Профиль" loading="eager">
      </a>
    `;
    } else {
      nav.innerHTML = `<a href="login.html" class="btn-login">Войти</a>`;
    }
  }

  function getQueryParams() {
    const params = new URLSearchParams(window.location.search);
    return {
      query: params.get('query') || '',
      type: params.get('type') || 'all',
      task: params.get('task') || 'all',
      license: params.get('license') || 'all',
      size: params.get('size') || 'all',
      framework: params.get('framework') || 'all'
    };
  }

  function fillFiltersFromParams() {
    const params = getQueryParams();
    document.getElementById('search-input').value = params.query;
    document.getElementById('type-filter').value = params.type;
    document.getElementById('task-filter').value = params.task;
    document.getElementById('license-filter').value = params.license;
    document.getElementById('size-filter').value = params.size;
    document.getElementById('framework-filter').value = params.framework;
  }

  function applyFilters() {
    const query = document.getElementById('search-input').value.trim().toLowerCase();
    const type = document.getElementById('type-filter').value;
    const task = document.getElementById('task-filter').value;
    const license = document.getElementById('license-filter').value;
    const size = document.getElementById('size-filter').value;
    const framework = document.getElementById('framework-filter').value;

    const filtered = allItems.filter(item => {
      const haystack = [item.title, item.description, item.author].join(' ').toLowerCase();
      const matchesQuery = !query || haystack.includes(query);
      const matchesType = type === 'all' || item.type === type;
      const matchesTask = task === 'all' || item.task === task;
      const matchesLicense = license === 'all' || item.license === license;
      const matchesSize = size === 'all' || item.sizeCategory === size;
      const matchesFramework = framework === 'all' || item.framework === framework;
      return matchesQuery && matchesType && matchesTask && matchesLicense && matchesSize && matchesFramework;
    });

    const params = new URLSearchParams();
    if (query) params.set('query', query);
    if (type !== 'all') params.set('type', type);
    if (task !== 'all') params.set('task', task);
    if (license !== 'all') params.set('license', license);
    if (size !== 'all') params.set('size', size);
    if (framework !== 'all') params.set('framework', framework);
    history.replaceState(null, '', 'search.html' + (params.toString() ? '?' + params.toString() : ''));

    renderResults(filtered);
  }

  function renderResults(items) {
    const summary = document.getElementById('resultsSummary');
    const container = document.getElementById('results-container');
    summary.textContent = 'Найдено: ' + items.length;

    if (!items.length) {
      container.innerHTML = '<div class="col-12"><div class="alert alert-secondary mb-0">Ничего не найдено по выбранным фильтрам</div></div>';
      return;
    }

    container.innerHTML = items.map(item => `
      <div class="col-md-6 col-xl-4">
        <div class="card result-item-card h-100">
          <div class="card-body d-flex flex-column">
            <span class="result-badge">${item.type === 'model' ? 'ML Model' : 'Dataset'}</span>
            <h3 class="result-title">${item.title}</h3>
            <p class="result-text">${item.description}</p>
            <div class="small text-muted mb-2"><strong>Автор:</strong> ${item.author}</div>
            <div class="small text-muted mb-2"><strong>Задача:</strong> ${item.task}</div>
            <div class="small text-muted mb-2"><strong>Лицензия:</strong> ${item.license}</div>
            <div class="small text-muted mb-2"><strong>Фреймворк:</strong> ${item.framework}</div>
            <div class="small text-muted mb-3"><strong>Размер:</strong> ${item.size}</div>
            <a href="model.html?type=${item.type}&id=${item.id}" class="btn btn-dark result-link-btn mt-auto">Открыть</a>
          </div>
        </div>
      </div>
    `).join('');
  }

  function resetFilters() {
    document.getElementById('search-form').reset();
    document.getElementById('type-filter').value = 'all';
    document.getElementById('task-filter').value = 'all';
    document.getElementById('license-filter').value = 'all';
    document.getElementById('size-filter').value = 'all';
    document.getElementById('framework-filter').value = 'all';
    applyFilters();
  }

  async function loadItems() {
    try {
      const [modelsResponse, datasetsResponse] = await Promise.all([
        axios.get(API_URL + '/models'),
        axios.get(API_URL + '/datasets')
      ]);

      const models = modelsResponse.data;
      const datasets = datasetsResponse.data;
      allItems = [...models, ...datasets];
      applyFilters();
    } catch (error) {
      console.error(error);
      document.getElementById('resultsSummary').textContent = 'Ошибка загрузки';
      document.getElementById('results-container').innerHTML = '<div class="col-12"><div class="alert alert-danger mb-0">Не удалось загрузить данные. Проверьте, что JSON-server запущен на порту 3000.</div></div>';
    }
  }

  document.getElementById('search-form').addEventListener('submit', function (event) {
    event.preventDefault();
    applyFilters();
  });

  updateNav();

  fillFiltersFromParams();
  loadItems();
</script>
</body>
</html>
