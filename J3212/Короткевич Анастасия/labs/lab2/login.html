<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ModelHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="custom-navbar">
    <div class="nav-wrapper">
        <a href="index.html" class="logo">ModelHub</a>
    </div>
</nav>

<section class="login-section">
    <div class="card login-card">
        <div class="card-body">
            <h3 class="login-title">Вход в аккаунт</h3>

            <form onsubmit="login(event)">
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Введите email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-dark login-submit-btn">Войти</button>
                </div>
            </form>

            <p class="bottom-text">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
<script>
    const API_URL = 'http://localhost:3000';

    if (localStorage.getItem('accessToken')) {
        window.location.href = 'profile.html';
    }

    async function login(event) {
        event.preventDefault();

        const formData = new FormData(event.target);
        const email = String(formData.get('email') || '').trim();
        const password = String(formData.get('password') || '').trim();

        try {
            const response = await axios.post(API_URL + '/login', { email, password });
            const user = response.data.user || {};

            localStorage.setItem('accessToken', response.data.accessToken);
            localStorage.setItem('userId', user.id || '');
            localStorage.setItem('userName', user.name || '');
            localStorage.setItem('userEmail', user.email || '');
            localStorage.setItem('userRole', user.role || '');

            window.location.href = 'profile.html';
        } catch (error) {
            console.error(error);
            alert('Не удалось войти:(');
        }
    }
</script>
</body>
</html>
