<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — ModelHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="custom-navbar">
        <div class="nav-wrapper">
            <a href="index.html" class="logo">ModelHub</a>
        </div>
    </nav>

    <section class="register-section">
        <div class="card register-card">
            <div class="card-body">
                <h3 class="register-title">Создание аккаунта</h3>

                <div>
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" placeholder="Введите имя пользователя">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Введите email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Роль</label>
                        <select class="form-select">
                            <option selected disabled>Выберите роль</option>
                            <option>Researcher</option>
                            <option>Developer</option>
                            <option>Data Scientist</option>
                            <option>ML Engineer</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" placeholder="Введите пароль">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Повторите пароль</label>
                        <input type="password" class="form-control" placeholder="Повторите пароль">
                    </div>

                    <div class="d-grid">
                        <button type="button" class="btn btn-dark register-submit-btn" data-bs-toggle="modal" data-bs-target="#registerSuccessModal">
                            Зарегистрироваться
                        </button>
                    </div>
                </div>

                <p class="bottom-text">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </p>
            </div>
        </div>
    </section>

    <div class="modal fade" id="registerSuccessModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Регистрация завершена</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                </div>
                <div class="modal-body">
                    Аккаунт успешно создан. Теперь вы можете войти в систему.
                </div>
                <div class="modal-footer">
                    <a href="login.html" class="btn btn-dark">Перейти ко входу</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
