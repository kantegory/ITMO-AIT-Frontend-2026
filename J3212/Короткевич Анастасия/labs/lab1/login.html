<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — ModelHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="custom-navbar">
        <div class="nav-wrapper">
            <a href="index.html" class="logo">ModelHub</a>
        </div>
    </nav>

    <section class="login-section">
        <div class="card login-card">
            <div class="card-body">
                <h3 class="login-title">Вход в аккаунт</h3>

                <div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Введите email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" placeholder="Введите пароль">
                    </div>

                    <div class="d-grid">
                        <a href="profile.html" class="btn btn-dark login-submit-btn">Войти</a>
                    </div>
                </div>

                <p class="bottom-text">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
            </div>
        </div>
    </section>
</body>
</html>
