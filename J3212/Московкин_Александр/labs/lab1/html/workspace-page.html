<!-- html/workspace-page.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Рабочее пространство</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="n3n — перейти на главную">
        <span class="logo-n3n">
          <span class="logo-n3n-black">n</span>
          <span class="logo-n3n-red">3</span>
          <span class="logo-n3n-black">n</span>
        </span>
      </a>
      <span class="ms-3 small text-muted" id="workspace-name-label">Demo workspace</span>
      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="workspaces.html">Рабочие пространства</a></li>
          <li class="nav-item"><a class="nav-link" href="community.html">Сообщество</a></li>
          <li class="nav-item"><a class="nav-link" href="search.html">Поиск</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Профиль</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- # Основное содержимое страницы рабочего пространства # -->
<main class="container-fluid" id="main-content">
  <div class="row">
    <aside class="col-md-2 border-end bg-white" aria-label="Навигация рабочего пространства">
      <div class="p-3">
        <div class="page-title mb-3">
          <div>
            <div class="page-title-badge">Workspace</div>
            <h1 class="h6 mb-0" aria-describedby="workspace-name-label">Demo workspace</h1>
          </div>
        </div>
        <ul class="list-unstyled small">
          <li class="mb-2"><a href="#" class="link-secondary text-decoration-none">Все потоки</a></li>
          <li class="mb-2"><a href="#" class="link-secondary text-decoration-none">Черновики</a></li>
          <li class="mb-2"><a href="#" class="link-secondary text-decoration-none">Настройки</a></li>
        </ul>
      </div>
    </aside>

    <!-- Правая колонка: зона визуального редактора графа -->
    <div class="col-md-10">
      <section class="p-3" aria-labelledby="editor-title">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div class="page-title mb-0">
            <div>
              <div class="page-title-badge">Редактор</div>
              <h2 class="h5 mb-0" id="editor-title">Поле для графа</h2>
            </div>
          </div>
          <div>
            <button
              class="btn btn-sm btn-outline-secondary me-2"
              type="button"
              id="graph-save-button"
            >
              Сохранить
            </button>
            <button
              class="btn btn-sm btn-primary"
              type="button"
              id="graph-run-button"
            >
              Запустить (демо)
            </button>
          </div>
        </div>

        <p class="small text-muted mb-2">
          Ниже — поле визуального редактора графов для данного рабочего пространства.
        </p>
        <div
          id="graph-area"
          class="border rounded bg-white"
          style="height: 500px; position: relative;"
          role="region"
          aria-label="Редактор графа рабочего процесса"
        >
          <!-- здесь Drawflow отрисует редактор -->
        </div>

        <!-- Палитра блоков -->
        <section class="mt-3" aria-labelledby="node-palette-title">
          <h3 id="node-palette-title" class="h6 small text-muted mb-2">Блоки</h3>
          <div id="node-palette" class="d-flex gap-2 flex-wrap" aria-label="Палитра блоков для графа">
            <button
              class="btn btn-sm btn-outline-secondary"
              type="button"
              data-node-type="api"
              aria-label="Добавить блок API"
            >
              API
            </button>
            <button
              class="btn btn-sm btn-outline-secondary"
              type="button"
              data-node-type="llm"
              aria-label="Добавить блок LLM"
            >
              LLM
            </button>
            <button
              class="btn btn-sm btn-outline-secondary"
              type="button"
              data-node-type="telegram"
              aria-label="Добавить блок Telegram"
            >
              Telegram
            </button>
          </div>
        </section>
      </section>
    </div>
  </div>
</main>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/drawflow/dist/drawflow.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
