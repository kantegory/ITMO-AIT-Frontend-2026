<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Профиль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {
      // если localStorage недоступен, просто ничего не делаем
    }
  })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="n3n — перейти на главную">
        <span class="logo-n3n">
          <span class="logo-n3n-black">n</span><span class="logo-n3n-red">3</span><span class="logo-n3n-black">n</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="workspaces.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-workspaces"></use>
              </svg>
              Рабочие пространства
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="community.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-community"></use>
              </svg>
              Сообщество
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-search"></use>
              </svg>
              Поиск
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="profile.html" aria-current="page">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-user"></use>
              </svg>
              Профиль
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- # Основное содержимое страницы профиля # -->
<main class="container my-4" id="main-content">
  <div class="row g-4">
    <!-- Левая колонка: карточка профиля с аватаркой и кнопкой выхода -->
    <div class="col-md-4">
      <section class="card" aria-labelledby="profile-card-title">
        <div class="card-body text-center">
          <div class="profile-avatar mb-3" aria-label="Аватар пользователя">
            <span class="profile-avatar-initials" id="profile-avatar-text">DU</span>
          </div>
          <h1 class="h5 mb-1" id="profile-card-title">
            <span id="profile-display-name">Demo User</span>
          </h1>
          <p class="small text-muted mb-3" id="profile-display-email">demo@n3n.local</p>

          <a href="login.html" class="btn btn-outline-danger btn-sm">
            Выйти из аккаунта
          </a>
          </div>
          <button
            type="button"
            class="btn btn-outline-secondary mt-3 w-100 d-flex align-items-center justify-content-center gap-2"
            id="theme-toggle"
            aria-label="Переключить тему"
          >
            <svg width="16" height="16" aria-hidden="true">
              <use href="../assets/icons.svg#icon-theme"></use>
            </svg>
            <span id="theme-toggle-text">Тёмная тема</span>
          </button>
      </section>
    </div>

    <!-- Правая колонка: формы редактирования профиля и смены пароля -->
    <div class="col-md-8">
      <section class="card mb-3" aria-labelledby="profile-main-data-title">
        <div class="card-body">
          <h2 class="h6 mb-3" id="profile-main-data-title">Основные данные</h2>
          <form id="profile-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="profile-name">Никнейм</label>
              <input
                type="text"
                class="form-control"
                id="profile-name"
                value="Demo User"
                name="profile-name"
                autocomplete="name"
              >
            </div>
            <div class="mb-3">
              <label class="form-label" for="profile-email">Email</label>
              <input
                type="email"
                class="form-control"
                id="profile-email"
                value="demo@n3n.local"
                name="profile-email"
                autocomplete="email"
              >
            </div>
            <!-- Кнопка "Сохранить": обновляет отображаемые данные и инициалы -->
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
          </form>
        </div>
      </section>

      <!-- # Форма смены пароля (с проверкой совпадения) # -->
      <section class="card" aria-labelledby="profile-password-title">
        <div class="card-body">
          <h2 class="h6 mb-3" id="profile-password-title">Изменение пароля</h2>
          <form id="profile-password-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="current-password">Текущий пароль</label>
              <input
                type="password"
                class="form-control"
                id="current-password"
                name="current-password"
                autocomplete="current-password"
              >
            </div>
            <div class="mb-3">
              <label class="form-label" for="new-password">Новый пароль</label>
              <input
                type="password"
                class="form-control"
                id="new-password"
                name="new-password"
                autocomplete="new-password"
                aria-describedby="profile-password-error"
              >
            </div>
            <div class="mb-2">
              <label class="form-label" for="new-password-confirm">Повторите новый пароль</label>
              <input
                type="password"
                class="form-control"
                id="new-password-confirm"
                name="new-password-confirm"
                autocomplete="new-password"
                aria-describedby="profile-password-error"
              >
            </div>
            <div class="mb-3">
              <small
                id="profile-password-error"
                class="text-danger d-none"
                aria-live="polite"
              >
                Новый пароль и подтверждение не совпадают
              </small>
            </div>
            <button type="submit" class="btn btn-primary">Обновить пароль (демо)</button>
          </form>
        </div>
      </section>
    </div>
  </div>
</main>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
