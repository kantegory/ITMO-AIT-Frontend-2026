<!-- html/dashboard.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Личный кабинет</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {
      // если localStorage недоступен, просто ничего не делаем
    }
  })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="n3n — перейти на главную">
        <span class="logo-n3n">
          <span class="logo-n3n-black">n</span><span class="logo-n3n-red">3</span><span class="logo-n3n-black">n</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="workspaces.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-workspaces"></use>
              </svg>
              Рабочие пространства
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="community.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-community"></use>
              </svg>
              Сообщество
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-search"></use>
              </svg>
              Поиск
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="profile.html" aria-current="page">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-user"></use>
              </svg>
              Профиль
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- # Основное содержимое: обзор активных workflows # -->
<main class="container my-4" id="main-content">
  <section aria-labelledby="dashboard-title">
    <div class="page-title">
      <div>
        <div class="page-title-badge">Обзор</div>
        <h1 class="h4 mb-0" id="dashboard-title">Активные workflows (Рабочие пространства)</h1>
      </div>
    </div>

    <!-- # Карточки-статистики по рабочим пространствам # -->
    <div class="row justify-content-start">
      <div class="col-lg-8">
        <div class="row g-3 mb-3 mt-1">
          <div class="col-md-6">
            <a
              href="workspaces.html"
              class="card h-100 text-decoration-none text-reset d-block"
              aria-label="Перейти к рабочим пространствам. Активных пространств: 0"
            >
              <div class="card-body d-flex flex-column justify-content-between">
                <p class="text-muted small mb-1">Активных пространств</p>
                <div class="d-flex align-items-end justify-content-between">
                  <span class="fs-4 fw-semibold" id="stat-workspaces-active" aria-live="polite">0</span>
                  <span class="badge bg-success-subtle text-success border" aria-label="Статус: OK">OK</span>
                </div>
              </div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
