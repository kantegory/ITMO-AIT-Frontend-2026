<!-- html/workspaces.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Рабочие пространства</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {
      // если localStorage недоступен, просто ничего не делаем
    }
  })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="n3n — перейти на главную">
        <span class="logo-n3n">
          <span class="logo-n3n-black">n</span><span class="logo-n3n-red">3</span><span class="logo-n3n-black">n</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="workspaces.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-workspaces"></use>
              </svg>
              Рабочие пространства
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="community.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-community"></use>
              </svg>
              Сообщество
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-search"></use>
              </svg>
              Поиск
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="profile.html" aria-current="page">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-user"></use>
              </svg>
              Профиль
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- # Основное содержимое: создание и список рабочих пространств # -->
<main class="container my-4" id="main-content">
  <h1 class="h4 mb-3">Рабочие пространства</h1>
  <div class="row">
    <!-- Левая колонка: форма создания нового пространства -->
    <section class="col-md-5" aria-labelledby="create-workspace-title">
      <h2 class="h6 mb-3" id="create-workspace-title">Создать новое</h2>
      <form id="workspace-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="workspace-name">Название пространства</label>
          <input
            type="text"
            class="form-control"
            id="workspace-name"
            name="workspace-name"
            placeholder="Например, Marketing automations"
            required
          >
        </div>
        <div class="mb-3">
          <label class="form-label" for="workspace-description">Описание</label>
          <textarea
            class="form-control"
            id="workspace-description"
            name="workspace-description"
            rows="3"
            placeholder="Краткое описание"
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Создать (демо)</button>
      </form>
    </section>

    <!-- Правая колонка: список уже существующих пространств -->
    <section class="col-md-7" aria-labelledby="workspace-list-title">
      <h2 class="h6 mb-3" id="workspace-list-title">Список ваших пространств</h2>
      <ul
        class="list-group"
        id="workspace-list"
        aria-live="polite"
        aria-label="Список рабочих пространств"
      >
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>Demo workspace</span>
          <a
            href="workspace-page.html?id=1"
            class="btn btn-sm btn-outline-primary"
            aria-label="Открыть рабочее пространство Demo workspace"
          >
            Открыть
          </a>
        </li>
      </ul>
    </section>
  </div>
</main>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
