<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Сообщество</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html">
      <span class="logo-n3n">
        <span class="logo-n3n-black">n</span>
        <span class="logo-n3n-red">3</span>
        <span class="logo-n3n-black">n</span>
      </span>
    </a>
    <div class="collapse navbar-collapse show">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="workspaces.html">Рабочие пространства</a></li>
        <li class="nav-item"><a class="nav-link" href="community.html">Сообщество</a></li>
        <li class="nav-item"><a class="nav-link" href="search.html">Поиск</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Профиль</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- # Основное содержимое страницы сообщества # -->
<main class="container my-4">
  <h1 class="h4 mb-4">Сообщество n3n</h1>

  <!-- # Блок с обсуждениями (список тем) # -->
  <section class="mb-4">
    <h2 class="h5 mb-3">Обсуждения</h2>
    <ul class="list-group" id="topics-list">
      <!-- Темы форума подставит JS -->
    </ul>
  </section>

  <!-- # Блок "Форум" с демо-кнопкой создания темы # -->
  <section class="mb-4">
    <h2 class="h5 mb-3">Форум</h2>
    <button type="button" class="btn btn-outline-primary btn-sm"
            data-bs-toggle="modal" data-bs-target="#newTopicModal">
      Создать тему
    </button>
  </section>

  <!-- # Блок FAQ с Bootstrap # -->
  <section>
    <h2 class="h5 mb-3">FAQ</h2>
    <div class="accordion" id="faqAccordion">
      <!-- Вопросы FAQ подставит JS -->
    </div>
  </section>
</main>

<!-- Модалка создания темы -->
<div class="modal fade" id="newTopicModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Новая тема</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="new-topic-form">
          <div class="mb-3">
            <label class="form-label">Заголовок темы</label>
            <input type="text" class="form-control" id="new-topic-title" name="title"
                   placeholder="Введите заголовок">
          </div>
          <div class="mb-3">
            <label class="form-label">Первое сообщение</label>
            <textarea class="form-control" id="new-topic-body" name="body"
                      rows="3" placeholder="Кратко опишите вопрос"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Создать тему</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
