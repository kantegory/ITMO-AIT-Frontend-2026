<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Сообщество</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {
      // если localStorage недоступен, просто ничего не делаем
    }
  })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="n3n — перейти на главную">
        <span class="logo-n3n">
          <span class="logo-n3n-black">n</span><span class="logo-n3n-red">3</span><span class="logo-n3n-black">n</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="workspaces.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-workspaces"></use>
              </svg>
              Рабочие пространства
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="community.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-community"></use>
              </svg>
              Сообщество
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-search"></use>
              </svg>
              Поиск
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="profile.html" aria-current="page">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-user"></use>
              </svg>
              Профиль
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- # Основное содержимое страницы сообщества # -->
<main class="container my-4" id="main-content">
  <h1 class="h4 mb-4">Сообщество n3n</h1>

  <!-- # Блок с обсуждениями (список тем) # -->
  <section class="mb-4" aria-labelledby="discussions-title">
    <h2 class="h5 mb-3" id="discussions-title">Обсуждения</h2>
    <ul
      class="list-group"
      id="topics-list"
      aria-live="polite"
      aria-label="Список обсуждений сообщества"
    >
      <!-- Темы форума подставит JS -->
    </ul>
  </section>

  <!-- # Блок "Форум" с демо-кнопкой создания темы # -->
  <section class="mb-4" aria-labelledby="forum-title">
    <h2 class="h5 mb-3" id="forum-title">Форум</h2>
    <button
      type="button"
      class="btn btn-outline-primary btn-sm"
      data-bs-toggle="modal"
      data-bs-target="#newTopicModal"
      aria-controls="newTopicModal"
    >
      Создать тему
    </button>
  </section>

  <!-- # Блок FAQ с Bootstrap # -->
  <section aria-labelledby="faq-title">
    <h2 class="h5 mb-3" id="faq-title">FAQ</h2>
    <div class="accordion" id="faqAccordion" aria-label="Часто задаваемые вопросы">
      <!-- Вопросы FAQ подставит JS -->
    </div>
  </section>
</main>

<!-- Модалка создания темы -->
<div
  class="modal fade"
  id="newTopicModal"
  tabindex="-1"
  aria-labelledby="newTopicModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newTopicModalLabel">Новая тема</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="Закрыть"
        ></button>
      </div>
      <div class="modal-body">
        <form id="new-topic-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="new-topic-title">Заголовок темы</label>
            <input
              type="text"
              class="form-control"
              id="new-topic-title"
              name="title"
              placeholder="Введите заголовок"
              required
            >
          </div>
          <div class="mb-3">
            <label class="form-label" for="new-topic-body">Первое сообщение</label>
            <textarea
              class="form-control"
              id="new-topic-body"
              name="body"
              rows="3"
              placeholder="Кратко опишите вопрос"
            ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Создать тему</button>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
