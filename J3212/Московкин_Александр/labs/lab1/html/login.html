<!-- html/login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>n3n – Вход</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
  (function () {
    try {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) {
      // если localStorage недоступен, просто ничего не делаем
    }
  })();
  </script>
  <link rel="stylesheet" href="../css/style.css">
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">
<!-- # Верхнее меню (header) с логотипом и навигацией # -->
<header>
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom mb-4" aria-label="Основная навигация">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="dashboard.html" aria-label="n3n — перейти на главную">
        <span class="logo-n3n">
          <span class="logo-n3n-black">n</span><span class="logo-n3n-red">3</span><span class="logo-n3n-black">n</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="workspaces.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-workspaces"></use>
              </svg>
              Рабочие пространства
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="community.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-community"></use>
              </svg>
              Сообщество
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-search"></use>
              </svg>
              Поиск
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="profile.html" aria-current="page">
              <svg width="16" height="16" class="me-1" aria-hidden="true">
                <use href="../assets/icons.svg#icon-user"></use>
              </svg>
              Профиль
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<!-- # Основной блок с формой входа # -->
<main class="container my-5" id="main-content">
  <div class="row justify-content-center">
    <div class="col-md-4" aria-labelledby="login-title">
      <h1 id="login-title" class="h4 mb-3 text-center">
        Вход в
        <span class="logo-n3n mb-3" aria-hidden="true">
          <span class="logo-n3n-black">n</span><span class="logo-n3n-red">3</span><span class="logo-n3n-black">n</span>
        </span>
      </h1>

      <!-- Форма авторизации -->
      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label" for="login-email">Email</label>
          <input
            id="login-email"
            type="email"
            class="form-control"
            placeholder="you@example.com"
            name="email"
            autocomplete="email"
            required
          >
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password">Пароль</label>
          <input
            id="login-password"
            type="password"
            class="form-control"
            placeholder="Пароль"
            name="password"
            autocomplete="current-password"
            required
            aria-describedby="login-error"
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mb-2"
          data-bs-toggle="modal"
          data-bs-target="#loginModal"
        >
          Войти
        </button>

        <div
          id="login-error"
          class="text-danger small d-none mt-1"
          aria-live="polite"
        >
          Неверный email или пароль. Зарегистрируйтесь, если аккаунта ещё нет.
        </div>

        <div class="text-center mt-3">
          <a href="register.html" class="small">Создать аккаунт</a>
        </div>
      </form>
    </div>
  </div>
</main>

<!-- Подключение Bootstrap JS (для модалок и др. компонентов) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/main.js"></script>
</body>
</html>
