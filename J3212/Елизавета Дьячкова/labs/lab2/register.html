<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Регистрация в TicketHub.">
  <title>TicketHub | Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <script src="theme.js"></script>
  <a class="visually-hidden-focusable position-absolute top-0 start-0 p-2 m-2 z-3 rounded skip-link-theme" href="#main-content">К основному содержимому</a>
  <div class="app-layout d-flex flex-column min-vh-100">
    <header class="navbar navbar-expand-lg bg-white border-bottom">
      <div class="container">
        <a class="navbar-brand fw-semibold d-inline-flex align-items-center gap-2" href="index.html" aria-label="TicketHub — на главную"><svg class="sprite-icon sprite-icon--brand" width="22" height="22" aria-hidden="true" focusable="false"><use href="icons.svg#icon-ticket"></use></svg><span>TicketHub</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Переключить меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <nav class="collapse navbar-collapse" id="mainNav" aria-label="Основная навигация">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link d-inline-flex align-items-center gap-2" href="index.html"><svg class="sprite-icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="icons.svg#icon-calendar"></use></svg><span>Мероприятия</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link d-inline-flex align-items-center gap-2" href="organizer.html"><svg class="sprite-icon" width="18" height="18" aria-hidden="true" focusable="false"><use href="icons.svg#icon-building"></use></svg><span>Кабинет организатора</span></a>
            </li>
          </ul>
          <div class="d-flex align-items-center me-2 me-lg-3 theme-select-wrap">
            <label for="themeSelect" class="visually-hidden">Тема оформления</label>
            <select id="themeSelect" class="form-select form-select-sm" aria-label="Тема оформления">
              <option value="auto">Авто</option>
              <option value="light">Светлая</option>
              <option value="dark">Тёмная</option>
            </select>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-outline-primary btn-sm d-inline-flex align-items-center gap-1" href="login.html" data-auth="guest"><svg class="sprite-icon sprite-icon--btn" width="16" height="16" aria-hidden="true" focusable="false"><use href="icons.svg#icon-user"></use></svg>Вход</a>
            <a class="btn btn-primary btn-sm active d-inline-flex align-items-center gap-1" href="register.html" data-auth="guest"><svg class="sprite-icon sprite-icon--btn" width="16" height="16" aria-hidden="true" focusable="false"><use href="icons.svg#icon-ticket"></use></svg>Регистрация</a>
            <a class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-1 d-none" href="profile.html" data-auth="user"><svg class="sprite-icon sprite-icon--btn" width="16" height="16" aria-hidden="true" focusable="false"><use href="icons.svg#icon-user"></use></svg>Личный кабинет</a>
          </div>
        </nav>
      </div>
    </header>

    <main id="main-content" class="flex-grow-1" tabindex="-1">
      <section class="page container py-4">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6 col-lg-4">
            <h1 class="h4 mb-3 text-center">Регистрация</h1>
            <form id="registerForm" class="card p-3 p-md-4" aria-label="Форма регистрации">
              <div class="mb-3">
                <label for="registerName" class="form-label">Имя</label>
                <input type="text" class="form-control" id="registerName" name="name" autocomplete="name" required>
              </div>
              <div class="mb-3">
                <label for="registerEmail" class="form-label">E‑mail</label>
                <input type="email" class="form-control" id="registerEmail" name="email" autocomplete="email" inputmode="email" required>
              </div>
              <div class="mb-3">
                <label for="registerPassword" class="form-label">Пароль</label>
                <input type="password" class="form-control" id="registerPassword" name="password" autocomplete="new-password" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="border-top theme-footer mt-4">
      <div class="container py-3">
        <p class="mb-0 small text-secondary">2026 TicketHub</p>
      </div>
    </footer>
  </div>

  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
    <div id="actionToast" class="toast align-items-center text-bg-primary border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Готово</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
