<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — ProjectHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="visually-hidden-focusable bg-primary text-white p-2">Перейти к основному содержимому</a>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Основная навигация">
      <div class="container">
        <a class="navbar-brand" href="index.html">ProjectHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" href="index.html" data-i18n="nav_home">Главная</a></li>
            <li class="nav-item"><a class="nav-link" href="login.html" data-i18n="nav_login">Вход</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="register.html" data-i18n="nav_register">Регистрация</a></li>
            <li class="nav-item ms-2" role="group" aria-label="Переключение языка">
              <span class="navbar-text small">
                <button type="button" class="btn btn-link btn-sm text-white text-decoration-none p-0" data-i18n-set="ru">RU</button>
                <span class="mx-1" aria-hidden="true">|</span>
                <button type="button" class="btn btn-link btn-sm text-white text-decoration-none p-0" data-i18n-set="en">EN</button>
              </span>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" class="auth-wrapper" tabindex="-1">
    <div class="container">
      <section class="auth-card card shadow mx-auto p-4" aria-labelledby="register-title">
        <h2 id="register-title" class="text-center mb-4" data-i18n="reg_title">Регистрация</h2>
        <form id="register-form" aria-describedby="register-error" novalidate>
          <div class="mb-3">
            <label for="reg-name" class="form-label" data-i18n="reg_name">Имя</label>
            <input type="text" class="form-control" id="reg-name" data-i18n-placeholder="reg_name" required autocomplete="name">
          </div>
          <div class="mb-3">
            <label for="reg-email" class="form-label" data-i18n="reg_email">Email</label>
            <input type="email" class="form-control" id="reg-email" data-i18n-placeholder="reg_email" required autocomplete="email">
          </div>
          <div class="mb-3">
            <label for="reg-password" class="form-label" data-i18n="reg_password">Пароль</label>
            <input type="password" class="form-control" id="reg-password" required minlength="6" autocomplete="new-password" aria-describedby="reg-password-hint">
            <div id="reg-password-hint" class="form-text" data-i18n="reg_hint">Минимум 6 символов.</div>
          </div>
          <div class="mb-3">
            <label for="reg-password-confirm" class="form-label" data-i18n="reg_confirm">Подтверждение пароля</label>
            <input type="password" class="form-control" id="reg-password-confirm" required autocomplete="new-password">
          </div>
          <div id="register-error" class="alert alert-danger d-none" role="alert" aria-live="polite"></div>
          <button type="submit" class="btn btn-primary w-100" data-i18n="reg_submit">Зарегистрироваться</button>
        </form>
        <p class="text-center mt-3 mb-0 small text-muted">
          <span data-i18n="reg_has_account">Уже есть аккаунт?</span> <a href="login.html" data-i18n="reg_login_link">Войти</a>
        </p>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
