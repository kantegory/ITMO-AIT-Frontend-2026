<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет — ProjectHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#main-content" class="visually-hidden-focusable bg-primary text-white p-2">Перейти к основному содержимому</a>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary" aria-label="Основная навигация">
      <div class="container">
        <a class="navbar-brand" href="index.html">ProjectHub</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto align-items-center">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="dashboard.html" data-i18n="nav_dashboard">Личный кабинет</a></li>
            <li class="nav-item"><a class="nav-link" href="search.html" data-i18n="nav_search">Поиск</a></li>
            <li class="nav-item ms-2" role="group" aria-label="Переключение языка">
              <span class="navbar-text small">
                <button type="button" class="btn btn-link btn-sm text-white text-decoration-none p-0" data-i18n-set="ru">RU</button>
                <span class="mx-1" aria-hidden="true">|</span>
                <button type="button" class="btn btn-link btn-sm text-white text-decoration-none p-0" data-i18n-set="en">EN</button>
              </span>
            </li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item dropdown">
              <button class="btn nav-link dropdown-toggle text-white" id="userDropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="menu">Пользователь</button>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                <li><a class="dropdown-item" href="dashboard.html" data-i18n="nav_cabinet">Кабинет</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button type="button" class="dropdown-item" id="logout-link" data-i18n="nav_logout">Выйти</button></li>
              </ul>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main id="main-content" class="container py-4" tabindex="-1">
    <h1 class="mb-4" data-i18n="dash_title">Личный кабинет</h1>

    <section class="dashboard-section" aria-labelledby="projects-heading">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="projects-heading" class="h5 mb-0" data-i18n="dash_projects">Мои проекты</h2>
        <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#modalAddProject" data-i18n="dash_add_project">Добавить проект</button>
      </div>
      <div class="row g-3" id="projects-list" aria-live="polite" aria-busy="false"></div>
    </section>

    <section class="dashboard-section" aria-labelledby="tasks-heading">
      <h2 id="tasks-heading" class="h5 mb-3" data-i18n="dash_tasks">Мои задачи</h2>
      <div class="list-group" id="tasks-list" aria-live="polite" aria-busy="false"></div>
    </section>

    <section class="dashboard-section" aria-labelledby="notifications-heading">
      <h2 id="notifications-heading" class="h5 mb-3" data-i18n="dash_notifications">Уведомления</h2>
      <div class="list-group" id="notifications-list" role="region" aria-live="polite" aria-busy="false"></div>
    </section>
  </main>

  <div class="modal fade" id="modalAddProject" tabindex="-1" aria-labelledby="modalAddProjectLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalAddProjectLabel">
        <div class="modal-header">
          <h5 class="modal-title" id="modalAddProjectLabel" data-i18n="dash_new_project">Новый проект</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <form id="form-add-project" novalidate>
          <div class="modal-body">
            <div class="mb-3">
              <label for="project-name" class="form-label" data-i18n="dash_project_name">Название</label>
              <input type="text" class="form-control" id="project-name" required data-i18n-placeholder="dash_project_name" aria-required="true">
            </div>
            <div class="mb-3">
              <label for="project-desc" class="form-label" data-i18n="dash_project_desc">Описание (необязательно)</label>
              <input type="text" class="form-control" id="project-desc" data-i18n-placeholder="dash_project_desc">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="dash_cancel">Отмена</button>
            <button type="submit" class="btn btn-primary" data-i18n="dash_add">Добавить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-light py-3 mt-auto">
    <div class="container text-center text-muted small">&copy; 2026 ProjectHub</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
