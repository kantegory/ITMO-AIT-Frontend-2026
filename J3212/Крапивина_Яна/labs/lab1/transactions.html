<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page bg-deep-blue">

<div class="menu-btn-container">
    <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#mySidebar">
        ☰ Меню
    </button>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mySidebar" style="background-color: #112240; color: #E0DED8;">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">MyFinance</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <nav class="nav flex-column">
            <a class="nav-link text-white" href="personal_acc.html">Личный кабинет</a>
            <a class="nav-link text-white" href="transactions.html">Транзакции</a>
            <a class="nav-link text-white" href="integrations.html">Интеграции</a>
            <a class="nav-link text-white" href="reports.html">Отчёт</a>
        </nav>
    </div>
</div>

<main class="container py-5">
    <h2 class="text-cold-beige mb-4 fw-bold">Транзакции</h2>
    
    <div class="widget-card mb-4 border-gold">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-3">
                <label class="form-label">Поиск</label>
                <div class="input-group">
                    <input type="text" class="custom-input m-0" style="border-right: none;">
                    <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-left: none;">
                        <i class="bi bi-search"></i>
                    </span>
                </div>
            </div>
            
            <div class="col-12 col-md-3">
                <label class="form-label">Категория</label>
                <select class="custom-input m-0">
                    <option value="all">Все</option>
                    <option value="food">Продукты</option>
                    <option value="transport">Транспорт</option>
                    <option value="fun">Развлечения</option>
                    <option value="health">Здоровье</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label">Дата</label>
                <select class="custom-input m-0">
                    <option value="this_month">Этот месяц</option>
                    <option value="last_month">Прошлый месяц</option>
                    <option value="last_year">За последний год</option>
                    <option value="all_time">За всё время</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label">Сумма</label>
                <select class="custom-input m-0">
                    <option value="any">Любая</option>
                    <option value="low">До 1 000 ₽</option>
                    <option value="mid">1 000 - 5 000 ₽</option>
                    <option value="high">Более 5 000 ₽</option>
                </select>
            </div>
        </div>
    </div>

    
    <div class="table-container mb-3">
        <table class="table table-custom table-hover m-0">
            <thead>
                <tr>
                    <th class="p-3">Дата</th>
                    <th class="p-3">Описание</th>
                    <th class="p-3">Категория</th>
                    <th class="p-3">Счет</th>
                    <th class="p-3">Сумма</th>
                </tr>
            </thead>
            <tbody>
                <tr style="cursor: pointer;" data-bs-toggle="modal" data-bs-target="#transModal">
                    <td class="p-3">15.03</td>
                    <td class="p-3">Вкусвилл</td>
                    <td class="p-3">Продукты</td>
                    <td class="p-3">Карта</td>
                    <td class="p-3">-2 000 ₽</td>
                </tr>
                <tr>
                    <td class="p-3">14.03</td>
                    <td class="p-3">Перевод по СБП</td>
                    <td class="p-3">Переводы</td>
                    <td class="p-3">Нал.</td>
                    <td class="p-3">-1 000 ₽</td>
                </tr>
                <tr>
                    <td class="p-3">13.03</td>
                    <td class="p-3">Входящий перевод</td>
                    <td class="p-3">Переводы</td>
                    <td class="p-3">Карта</td>
                    <td class="p-3">+45 000 ₽</td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <button class="btn-widget">Показать все</button>
    <button class="btn-widget" data-bs-toggle="modal" data-bs-target="#addTransactionModal">+ Добавить</button>
</main>

<div class="modal fade" id="addTransactionModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-secondary" style="background-color: #112240; color: #E0DED8;">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Новая операция</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label small">Сумма</label>
                        <input type="text" inputmode="decimal" class="custom-input m-0" placeholder="0.00 ₽">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Описание</label>
                        <input type="text" class="custom-input m-0">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Категория</label>
                        <select class="custom-input m-0">
                            <option>Продукты</option>
                            <option>Транспорт</option>
                            <option>Развлечения</option>
                            <option>Другое</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-sm btn-custom px-4" style="width: auto;" data-bs-dismiss="modal">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-4 text-secondary mt-5 border-top border-secondary">
    <small>© 2026 MyFinance — Твой личный финансовый помощник</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
