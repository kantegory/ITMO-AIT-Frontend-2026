<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="custom-card">
        <h3 class="text-cold-beige fw-bold text-center mb-4">Вход в систему</h3>
        <form>
            <label class="form-label">Email</label>
            <input type="email" class="custom-input" placeholder="name@example.com">
            
            <label class="form-label">Пароль</label>
            <input type="password" class="custom-input" placeholder="********">
            <a href="personal_acc.html" class="btn-custom text-decoration-none d-block text-center">Войти</a>
            
            <div class="text-center mt-4">
                <span style="color: #8892B0; font-size: 0.9rem;">Нет аккаунта?</span> 
                <a href="registration.html" class="link-custom ms-1">Регистрация</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
