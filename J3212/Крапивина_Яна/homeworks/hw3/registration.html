<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page bg-deep-blue">

    <main class="custom-card">
        <h2 class="text-cold-beige fw-bold text-center mb-4">Создать аккаунт</h2>
        
        <form>
            <label class="form-label" for="regName">Ваше Имя</label>
            <input type="text" id="regName" class="custom-input" required autocomplete="name">

            <label class="form-label" for="regEmail">Email</label>
            <input type="email" id="regEmail" class="custom-input" placeholder="name@example.com" required autocomplete="email">

            <label class="form-label" for="regPass">Пароль</label>
            <input type="password" id="regPass" class="custom-input" placeholder="Придумайте пароль" required autocomplete="new-password">

            <label class="form-label" for="regPassConfirm">Повторите пароль</label>
            <input type="password" id="regPassConfirm" class="custom-input" placeholder="Введите пароль еще раз" required autocomplete="new-password">
            
            <button type="button" id="regBtn" class="btn-custom" aria-label="Зарегистрироваться в сервисе">Зарегистрироваться</button>
            
            <div class="text-center mt-4">
                <span class="text-muted" style="font-size: 0.9rem;">Уже есть аккаунт?</span>
                <a href="login.html" class="link-custom ms-1" aria-label="Перейти на страницу входа">Войти</a>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="register.js"></script>
    <script src="auth.js"></script>
</body>
</html>
