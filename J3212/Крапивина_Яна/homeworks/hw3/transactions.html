<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page bg-deep-blue">

<div class="menu-btn-container">
    <button class="btn btn-outline-light" type="button" data-bs-toggle="offcanvas" data-bs-target="#mySidebar" aria-controls="mySidebar" aria-expanded="false">
        ☰ Меню
    </button>
</div>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mySidebar" aria-labelledby="offcanvasTitle">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasTitle">MyFinance</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Закрыть меню"></button>
        </div>
        <div class="offcanvas-body">
            <nav class="nav flex-column">
                <a class="nav-link" href="personal_acc.html">Личный кабинет</a>
                <a class="nav-link" href="transactions.html">Транзакции</a>
                <a class="nav-link" href="integrations.html">Интеграции</a>
                <a class="nav-link" href="reports.html">Отчёт</a>
                <button id="themeToggle" class="nav-link border-0 bg-transparent mt-3"  style="outline: none;" aria-label="Переключить тему">
                    <i class="bi bi-sun-fill me-2" id="themeIcon"></i> 
                    <span id="themeText">Светлая тема</span>
                </button>
                <a class="nav-link text-danger fw-bold mt-3" href="#" id="logoutBtn" role="button">Выход</a>
            </nav>
        </div>
    </div>

<main class="container py-5">
    <h2 class="text-cold-beige mb-4 fw-bold">Транзакции</h2>
    
    <div class="widget-card mb-4 border-gold">
        <div class="row g-3 align-items-end">
            <div class="col-12 col-md-3">
                <label class="form-label" for="searchInput">Поиск</label>
                <div class="input-group">
                    <input type="text" id="searchInput" class="custom-input m-0" aria-label="Поиск по описанию транзакций" style="border-right: none;">
                    <span class="input-group-text bg-transparent border-secondary text-secondary" style="border-left: none;">
                        <i class="bi bi-search"></i>
                    </span>
                </div>
            </div>
            
            <div class="col-12 col-md-3">
                <label class="form-label" for="categoryFilter">Категория</label>
                <select id="categoryFilter" class="custom-input m-0">
                    <option value="all">Все</option>
                    <option>Продукты</option>
                    <option>Транспорт</option>
                    <option>Развлечения</option>
                    <option>Здоровье</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label" for="dateFilter">Дата</label>
                <select id="dateFilter" class="custom-input m-0">
                    <option value="this_month">Этот месяц</option>
                    <option value="last_month">Прошлый месяц</option>
                    <option value="last_year">За последний год</option>
                    <option value="all_time">За всё время</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label" for="amountFilter">Сумма</label>
                <select id="amountFilter" class="custom-input m-0">
                    <option value="any">Любая</option>
                    <option value="low">До 1 000 ₽</option>
                    <option value="mid">1 000 - 5 000 ₽</option>
                    <option value="high">Более 5 000 ₽</option>
                </select>
            </div>
        </div>
    </div>

    
    <div class="table-container mb-3">
        <table class="table table-custom table-hover m-0">
            <caption class="visually-hidden">Полный список транзакций</caption>
            <thead>
                <tr>
                    <th scope="col" class="p-3">Дата</th>
                    <th scope="col" class="p-3">Описание</th>
                    <th scope="col" class="p-3">Категория</th>
                    <th scope="col" class="p-3">Счет</th>
                    <th scope="col" class="p-3">Сумма</th>
                </tr>
            </thead>
            <tbody id="transactionTableBody" aria-live="polite">
            </tbody>
        </table>
    </div>
    
    <button class="btn-widget" aria-label="Показать все транзакции без фильтров">Показать все</button>
    <button class="btn-widget" data-bs-toggle="modal" data-bs-target="#addTransactionModal" aria-label="Добавить новую транзакцию вручную">+ Добавить</button>
</main>

<div class="modal fade" id="transModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="transModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Детали транзакции</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalDetailsBody">
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="addTransactionModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="addTransModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title">Новая операция</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label small" for="addAmount">Сумма</label>
                        <input type="text" id="addAmount" inputmode="decimal" class="custom-input m-0" placeholder="0.00 ₽" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" for="addDescription">Описание</label>
                        <input type="text" id="addDescription" class="custom-input m-0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small" for="addCategory">Категория</label>
                        <select id="addCategory" class="custom-input m-0">
                            <option>Продукты</option>
                            <option>Транспорт</option>
                            <option>Развлечения</option>
                            <option>Другое</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-secondary">
                <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" id="saveTransactionBtn" class="btn btn-sm btn-custom px-4" style="width: auto;" data-bs-dismiss="modal">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-4 text-secondary mt-5 border-top border-secondary">
    <small>© 2026 MyFinance — Твой личный финансовый помощник</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="transactions.js"></script>
<script src="auth.js"></script>
</body>
</html>
