<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <main class="custom-card  bg-deep-blue">
        <h3 class="text-cold-beige fw-bold text-center mb-4">Вход в систему</h3>
        <form>
            <label class="form-label" for="emailInput">Email</label>
            <input type="email" id="emailInput" class="custom-input" placeholder="name@example.com" required autocomplete="email">
            
            <label class="form-label" for="passInput">Пароль</label>
            <input type="password" id="passInput" class="custom-input" placeholder="********" required autocomplete="current-password">
            <button type="submit" id="loginBtn" class="btn-custom" aria-label="Войти в личный кабинет">Войти</button>
            
            <div class="text-center mt-4">
                <span class="text-muted" style="font-size: 0.9rem;">Нет аккаунта?</span>
                <a href="registration.html" class="link-custom ms-1" aria-label="Перейти на страницу регистрации">Регистрация</a>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auth.js"></script>
</body>
</html>
