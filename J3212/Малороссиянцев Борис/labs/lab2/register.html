<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Wanderlust — Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
</head>
<body data-page="register">
<div class="auth-wrap">
  <aside class="auth-aside">
    <div class="auth-aside-grid"></div>
    <div class="auth-aside-content">
      <div class="auth-logo">Wanderlust</div>
      <p class="auth-tagline" style="margin-top:.75rem;">Откройте мир вместе с нами</p>
      <div style="display:flex;flex-direction:column;gap:.75rem;margin-top:3rem;max-width:300px;margin-left:auto;margin-right:auto;text-align:left;">
        <div style="display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1rem;">
          <span style="font-size:1.3rem;">🗺</span>
          <div><div style="font-size:.88rem;font-weight:500;">Умный планировщик</div><div style="font-size:.75rem;opacity:.65;">Маршруты за минуты</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1rem;">
          <span style="font-size:1.3rem;">👥</span>
          <div><div style="font-size:.88rem;font-weight:500;">Совместные поездки</div><div style="font-size:.75rem;opacity:.65;">Планируйте с друзьями</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1rem;">
          <span style="font-size:1.3rem;">📔</span>
          <div><div style="font-size:.88rem;font-weight:500;">Путевые заметки</div><div style="font-size:.75rem;opacity:.65;">Храните воспоминания</div></div>
        </div>
        <div style="display:flex;align-items:center;gap:.9rem;background:rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1rem;">
          <span style="font-size:1.3rem;">💾</span>
          <div><div style="font-size:.88rem;font-weight:500;">Всё сохраняется</div><div style="font-size:.75rem;opacity:.65;">Данные на вашем сервере</div></div>
        </div>
      </div>
    </div>
  </aside>
  <div class="auth-form-panel">
    <div class="auth-form-inner">
      <h2 class="serif" style="font-size:1.8rem;margin-bottom:.4rem;">Создать аккаунт</h2>
      <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:2rem;">Присоединяйтесь к 50 000+ путешественников</p>
      <form id="registerForm" novalidate>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label" for="firstName">Имя</label>
            <input type="text" id="firstName" class="form-input" placeholder="Алексей" required/>
          </div>
          <div class="col-6">
            <label class="form-label" for="lastName">Фамилия</label>
            <input type="text" id="lastName" class="form-input" placeholder="Иванов" required/>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="regEmail">Email</label>
          <input type="email" id="regEmail" class="form-input" placeholder="your@email.com" autocomplete="email" required/>
        </div>
        <div class="mb-3">
          <label class="form-label" for="regPassword">Пароль</label>
          <div class="password-wrap">
            <input type="password" id="regPassword" class="form-input" placeholder="Минимум 8 символов" autocomplete="new-password" required/>
            <button type="button" class="password-toggle" data-target="regPassword"><i class="bi bi-eye"></i></button>
          </div>
          <div class="strength-bar mt-2"><div id="strengthBar" class="strength-fill" style="width:0%;"></div></div>
          <div id="strengthLabel" style="font-size:.73rem;color:var(--text-light);margin-top:.3rem;min-height:1em;"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="travelStyle">Стиль путешествий</label>
          <select id="travelStyle" class="form-select-custom">
            <option value="">Выберите...</option>
            <option>🏙 Городской исследователь</option>
            <option>🏔 Искатель приключений</option>
            <option>🍷 Гастро-турист</option>
            <option>🎭 Культурный путешественник</option>
            <option>🏖 Пляжный отдых</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Интересы</label>
          <div data-chips-group="multi">
            <button type="button" class="filter-chip">🏛 Культура</button>
            <button type="button" class="filter-chip">🍜 Кухня</button>
            <button type="button" class="filter-chip">🥾 Трекинг</button>
            <button type="button" class="filter-chip">📸 Фото</button>
            <button type="button" class="filter-chip">🏄 Серфинг</button>
            <button type="button" class="filter-chip">🤿 Дайвинг</button>
          </div>
        </div>
        <div class="mb-4">
          <label style="display:flex;align-items:flex-start;gap:.5rem;cursor:pointer;font-size:.85rem;color:var(--text-muted);">
            <input type="checkbox" id="agreeTerms" style="margin-top:3px;flex-shrink:0;" required/>
            <span>Я согласен с <a href="#" style="color:var(--accent);">условиями использования</a> и <a href="#" style="color:var(--accent);">политикой конфиденциальности</a></span>
          </label>
        </div>
        <button type="submit" class="btn-primary-custom w-100 mb-3" style="justify-content:center;padding:.7rem;">
          Зарегистрироваться
        </button>
        <p style="text-align:center;font-size:.875rem;color:var(--text-muted);">
          Уже есть аккаунт? <a href="login.html" style="color:var(--accent);font-weight:500;">Войти</a>
        </p>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
