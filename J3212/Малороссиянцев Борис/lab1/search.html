<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Wanderlust — Поиск</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .search-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .search-layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    @media(max-width:992px){ body{height:auto;} .search-body,.search-layout{overflow:visible;} }
  </style>
</head>
<body data-page="search">

<nav class="app-nav">
  <a href="login.html" class="nav-brand">Wanderlust</a>
  <div class="nav-links ms-auto me-3">
    <a href="dashboard.html" class="nav-link">Кабинет</a>
    <a href="search.html"    class="nav-link active">Поиск</a>
    <a href="collab.html"    class="nav-link">Совместно</a>
  </div>
  <div class="nav-avatar" data-bs-toggle="dropdown">АИ</div>
  <ul class="dropdown-menu dropdown-menu-end dropdown-menu-light">
    <li><a class="dropdown-item" href="dashboard.html"><i class="bi bi-person me-2"></i>Кабинет</a></li>
    <li><hr class="dropdown-divider"/></li>
    <li><a class="dropdown-item" href="login.html" style="color:#dc2626;"><i class="bi bi-box-arrow-right me-2"></i>Выйти</a></li>
  </ul>
</nav>

<div class="search-body">
  
  <div class="search-hero">
    <h1 class="serif mb-1" style="font-size:1.8rem;">
      Найдите следующее <em style="color:var(--accent);">приключение</em>
    </h1>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem;">10 тщательно отобранных направлений</p>
    <div class="search-bar-wrap">
      <i class="bi bi-search" style="color:var(--text-light);flex-shrink:0;"></i>
      <input class="search-bar-input" type="text" id="mainSearch" placeholder="Страна, город, тип отдыха..." autocomplete="off"/>
      <button class="btn-primary-custom" style="flex-shrink:0;" onclick="document.getElementById('mainSearch').dispatchEvent(new Event('input'))">
        <i class="bi bi-arrow-right"></i>
      </button>
    </div>
    <div class="d-flex gap-2 mt-3 flex-wrap align-items-center">
      <span style="font-size:.8rem;color:var(--text-light);">Популярное:</span>
      <button class="filter-chip" onclick="searchByTag('Европа')">🌍 Европа</button>
      <button class="filter-chip" onclick="searchByTag('Азия')">🌏 Азия</button>
      <button class="filter-chip" onclick="searchByTag('Пляж')">🏖 Пляж</button>
      <button class="filter-chip" onclick="searchByTag('Природа')">🌿 Природа</button>
      <button class="filter-chip" onclick="searchByTag('Трекинг')">🥾 Трекинг</button>
    </div>
  </div>

  
  <div class="search-layout">
    <aside class="filter-panel">

      <div class="mb-4">
        <div class="filter-section-title">Тип направления</div>
        <div>
          <button class="filter-chip active selected" data-type-chip="all">Все</button>
          <button class="filter-chip" data-type-chip="city">🏙 Город</button>
          <button class="filter-chip" data-type-chip="nature">🌿 Природа</button>
        </div>
      </div>

      <div class="mb-4">
        <div class="filter-section-title">Бюджет</div>
        <div class="d-flex justify-content-between mb-2" style="font-size:.82rem;">
          <span style="color:var(--text-light);">0 ₽</span>
          <strong id="budgetVal" style="color:var(--accent);">50 000 ₽</strong>
        </div>
        <input type="range" class="w-100" id="budgetSlider" min="0" max="50000" step="1000" value="50000"/>
      </div>

      <div class="mb-4">
        <div class="filter-section-title">Длительность</div>
        <div>
          <button class="filter-chip" data-dur-chip="short">1–5 дней</button>
          <button class="filter-chip active selected" data-dur-chip="week">6–10 дней</button>
          <button class="filter-chip" data-dur-chip="long">11+ дней</button>
        </div>
      </div>

      <div class="mb-4">
        <div class="filter-section-title">Континент</div>
        <div>
          <button class="filter-chip" onclick="searchByTag('Европа')">Европа</button>
          <button class="filter-chip" onclick="searchByTag('Азия')">Азия</button>
          <button class="filter-chip" onclick="searchByTag('Америка')">Америка</button>
          <button class="filter-chip" onclick="searchByTag('Африка')">Африка</button>
        </div>
      </div>

      <button class="btn-primary-custom w-100 mb-2" style="justify-content:center;">Применить</button>
      <button class="btn-ghost-custom w-100" id="resetFilters" style="justify-content:center;">Сбросить</button>
    </aside>

    
    <div class="results-area">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <p style="font-size:.875rem;color:var(--text-muted);margin:0;">
          Найдено: <strong style="color:var(--text);" id="destCount">10</strong> направлений
        </p>
        <select id="sortSelect" class="form-select-custom" style="width:auto;font-size:.85rem;">
          <option value="popular">По популярности</option>
          <option value="rating">По рейтингу ↓</option>
          <option value="price_asc">Цена ↑</option>
          <option value="price_desc">Цена ↓</option>
          <option value="duration_asc">Длительность ↑</option>
          <option value="duration_desc">Длительность ↓</option>
        </select>
      </div>
      <div class="row g-3" id="destGrid"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
