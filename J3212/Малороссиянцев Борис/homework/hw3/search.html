<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Wanderlust — Поиск</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link href="css/styles.css" rel="stylesheet"/>
  <script>var t=localStorage.getItem("wl_theme");if(t)document.documentElement.setAttribute("data-theme",t);</script>
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; }
    .search-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .search-layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }
    @media(max-width:992px){ body{height:auto;} .search-body,.search-layout{overflow:visible;} }
  </style>
</head>
<body data-page="search">
<a href="#main-content" class="skip-link">Перейти к содержимому</a>
<nav class="app-nav" aria-label="Основная навигация">
  <a href="dashboard.html" class="nav-brand" aria-label="Wanderlust — перейти на главную">Wanderlust</a>
  <div class="nav-links ms-auto me-3">
    <a href="dashboard.html" class="nav-link">Кабинет</a>
    <a href="search.html"    class="nav-link active" aria-current="page">Поиск</a>
    <a href="collab.html"    class="nav-link">Совместно</a>
  </div>
  <button class="theme-toggle me-2" id="themeToggle" aria-label="Переключить тему" title="Переключить тему">🌙</button>
  <button class="nav-avatar" data-bs-toggle="dropdown" aria-expanded="false" aria-haspopup="true" aria-label="Меню пользователя">АИ</button>
  <ul class="dropdown-menu dropdown-menu-end dropdown-menu-light" role="menu">
    <li role="none"><a class="dropdown-item" href="dashboard.html" role="menuitem"><i class="bi bi-person me-2" aria-hidden="true"></i>Кабинет</a></li>
    <li role="none"><hr class="dropdown-divider"/></li>
    <li role="none"><a class="dropdown-item" href="#" role="menuitem" data-action="logout" style="color:#dc2626;"><i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Выйти</a></li>
  </ul>
</nav>
<div class="search-body">
  <section class="search-hero" aria-label="Поиск направлений">
    <h1 class="serif mb-1" style="font-size:1.8rem;">
      Найдите следующее <em style="color:var(--accent);">приключение</em>
    </h1>
    <p style="color:var(--text-muted);font-size:.9rem;margin-bottom:1.5rem;">10 тщательно отобранных направлений</p>
    <div class="search-bar-wrap" role="search">
      <i class="bi bi-search" style="color:var(--text-light);flex-shrink:0;" aria-hidden="true"></i>
      <input class="search-bar-input" type="search" id="mainSearch" placeholder="Страна, город, тип отдыха..." autocomplete="off" aria-label="Поиск направлений"/>
      <button class="btn-primary-custom" style="flex-shrink:0;" aria-label="Найти" onclick="document.getElementById('mainSearch').dispatchEvent(new Event('input'))">
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
    <div class="d-flex gap-2 mt-3 flex-wrap align-items-center" role="group" aria-label="Популярные категории">
      <span style="font-size:.8rem;color:var(--text-light);" aria-hidden="true">Популярное:</span>
      <button class="filter-chip" onclick="searchByTag('Европа')" aria-label="Поиск по категории Европа">🌍 Европа</button>
      <button class="filter-chip" onclick="searchByTag('Азия')" aria-label="Поиск по категории Азия">🌏 Азия</button>
      <button class="filter-chip" onclick="searchByTag('Пляж')" aria-label="Поиск по категории Пляж">🏖 Пляж</button>
      <button class="filter-chip" onclick="searchByTag('Природа')" aria-label="Поиск по категории Природа">🌿 Природа</button>
      <button class="filter-chip" onclick="searchByTag('Трекинг')" aria-label="Поиск по категории Трекинг">🥾 Трекинг</button>
    </div>
  </section>
  <div class="search-layout">
    <aside class="filter-panel" aria-label="Фильтры поиска">
      <div class="mb-4">
        <p class="filter-section-title" id="filterTypeLabel">Тип направления</p>
        <div role="group" aria-labelledby="filterTypeLabel">
          <button class="filter-chip active selected" data-type-chip="all" aria-pressed="true">Все</button>
          <button class="filter-chip" data-type-chip="city" aria-pressed="false">🏙 Город</button>
          <button class="filter-chip" data-type-chip="nature" aria-pressed="false">🌿 Природа</button>
        </div>
      </div>
      <div class="mb-4">
        <p class="filter-section-title" id="budgetLabel">Бюджет</p>
        <div class="d-flex justify-content-between mb-2" style="font-size:.82rem;" aria-hidden="true">
          <span style="color:var(--text-light);">0 ₽</span>
          <strong id="budgetVal" style="color:var(--accent);">50 000 ₽</strong>
        </div>
        <input type="range" class="w-100" id="budgetSlider" min="0" max="50000" step="1000" value="50000"
               aria-labelledby="budgetLabel" aria-valuemin="0" aria-valuemax="50000" aria-valuenow="50000" aria-valuetext="50 000 ₽"/>
      </div>
      <div class="mb-4">
        <p class="filter-section-title" id="filterDurLabel">Длительность</p>
        <div role="group" aria-labelledby="filterDurLabel">
          <button class="filter-chip" data-dur-chip="short" aria-pressed="false">1–5 дней</button>
          <button class="filter-chip active selected" data-dur-chip="week" aria-pressed="true">6–10 дней</button>
          <button class="filter-chip" data-dur-chip="long" aria-pressed="false">11+ дней</button>
        </div>
      </div>
      <div class="mb-4">
        <p class="filter-section-title" id="filterContLabel">Континент</p>
        <div role="group" aria-labelledby="filterContLabel">
          <button class="filter-chip" aria-pressed="false" onclick="searchByTag('Европа')">Европа</button>
          <button class="filter-chip" aria-pressed="false" onclick="searchByTag('Азия')">Азия</button>
          <button class="filter-chip" aria-pressed="false" onclick="searchByTag('Америка')">Америка</button>
          <button class="filter-chip" aria-pressed="false" onclick="searchByTag('Африка')">Африка</button>
        </div>
      </div>
      <button class="btn-primary-custom w-100 mb-2" style="justify-content:center;">Применить</button>
      <button class="btn-ghost-custom w-100" id="resetFilters" style="justify-content:center;">Сбросить</button>
    </aside>
    <div class="results-area" id="main-content">
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <p style="font-size:.875rem;color:var(--text-muted);margin:0;" aria-live="polite" aria-atomic="true">
          Найдено: <strong style="color:var(--text);" id="destCount">10</strong> направлений
        </p>
        <label for="sortSelect" class="visually-hidden">Сортировка результатов</label>
        <select id="sortSelect" class="form-select-custom" style="width:auto;font-size:.85rem;" aria-label="Сортировка результатов">
          <option value="popular">По популярности</option>
          <option value="rating">По рейтингу ↓</option>
          <option value="price_asc">Цена ↑</option>
          <option value="price_desc">Цена ↓</option>
          <option value="duration_asc">Длительность ↑</option>
          <option value="duration_desc">Длительность ↓</option>
        </select>
      </div>
      <div class="row g-3" id="destGrid" aria-live="polite" aria-label="Список направлений"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
