<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Страница регистрации на платформе онлайн-курсов">
    <title>Регистрация</title>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header>
        <div class="container">
            <a class="logo" href="index.html">Online Courses</a>
            <nav aria-label="Основная навигация">
                <a href="index.html">Главная</a>
                <a href="courses.html">Курсы</a>
                <a href="login.html">Вход</a>
                <a href="register.html" aria-current="page">Регистрация</a>
            </nav>
            <button
                type="button"
                class="theme-toggle"
                id="theme-toggle"
                aria-pressed="false"
                aria-label="Переключить цветовую тему"
            >
                <svg class="button-icon" aria-hidden="true">
                    <use href="assets/icons/sprite.svg#icon-theme"></use>
                </svg>
                <span>Сменить тему</span>
            </button>
        </div>
    </header>

    <main id="main-content">
        <section class="form-page">
            <div class="form-box">
                <h1>Регистрация</h1>
                <form aria-label="Форма регистрации">
                    <div class="form-group">
                        <label for="name">Имя</label>
                        <input type="text" id="name" name="name" placeholder="Введите имя" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email</label>
                        <input type="email" id="reg-email" name="email" placeholder="Введите email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Пароль</label>
                        <input type="password" id="reg-password" name="password" placeholder="Введите пароль" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Подтвердите пароль</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Повторите пароль" autocomplete="new-password" required>
                    </div>

                    <button type="submit" class="btn btn-full">Зарегистрироваться</button>

                    <div class="form-link">
                        <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 Online Courses</p>
        </div>
    </footer>
    <script type="module" src="assets/js/app.js"></script>

</body>
</html>
