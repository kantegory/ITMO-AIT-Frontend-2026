<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход и Регистрация — Билеты.ру</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles/style.css" rel="stylesheet">
</head>
<body>
    <div class="container d-flex align-items-center justify-content-center vh-100">
        <div class="card auth-card shadow-lg border-0">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">Билеты.ру</h2>
                    <p class="text-muted">Добро пожаловать в мир событий</p>
                </div>

                <ul class="nav nav-pills nav-fill mb-4" id="pills-tab" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active" id="pills-login-tab" data-bs-toggle="pill" data-bs-target="#pills-login" type="button" role="tab">Вход</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="pills-register-tab" data-bs-toggle="pill" data-bs-target="#pills-register" type="button" role="tab">Регистрация</button>
                    </li>
                </ul>

                <div class="tab-content" id="pills-tabContent">
                    <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
                        <form id="login-form">
                            <div class="mb-3">
                                <label class="form-label">Email адрес</label>
                                <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="login-password" placeholder="••••••••" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">Запомнить меня</label>
                            </div>
                            <div id="login-error" class="text-danger small mb-3 d-none"></div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
                            <div class="text-center mt-3">
                                <a href="#" class="text-decoration-none small">Забыли пароль?</a>
                            </div>
                        </form>
                    </div>

                    <div class="tab-pane fade" id="pills-register" role="tabpanel">
                        <form id="register-form">
                            <div class="mb-3">
                                <label class="form-label">Полное имя</label>
                                <input type="text" class="form-control" id="reg-name" placeholder="Иван Иванов" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email адрес</label>
                                <input type="email" class="form-control" id="reg-email" placeholder="email@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="reg-password" placeholder="Придумайте пароль" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Роль</label>
                                <select class="form-select" id="reg-role">
                                    <option value="user" selected>Покупатель</option>
                                    <option value="organizer">Организатор</option>
                                </select>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="agreeTerms" required>
                                <label class="form-check-label small" for="agreeTerms">
                                    Я согласен с условиями использования
                                </label>
                            </div>
                            <div id="register-error" class="text-danger small mb-3 d-none"></div>
                            <button type="submit" class="btn btn-success w-100 py-2">Создать аккаунт</button>
                        </form>
                    </div>
                </div>

                <div class="mt-4 text-center">
                    <a href="index.html" class="btn btn-link text-muted p-0">← Вернуться на главную</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="scripts/auth.js"></script>
</body>
</html>
