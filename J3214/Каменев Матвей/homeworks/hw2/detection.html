<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>annotaylor: Детекция людей с камер</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar border-bottom" aria-label="Основная навигация">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <img src="img/logo.png" alt="" height="40">
                annotaylor
            </a>
            <div class="d-flex align-items-center gap-3">
                <ul class="navbar-nav list-group-horizontal gap-4">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
                </ul>
                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#loginModal">Вход</button>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#registerModal">Регистрация</button>
            </div>
        </div>
    </nav>

    <header class="annotation-header border-bottom">
        <div class="container py-3">
            <h1 class="h5 mb-1">Детекция людей с камер</h1>
            <p class="annotation-header-desc text-muted mb-0">Обведите всех людей на кадре прямоугольными баундбоксами. Кликните на изображение и потяните, чтобы нарисовать рамку; тяните за угловые маркеры, чтобы изменить размер; нажмите × на рамке, чтобы удалить.</p>
        </div>
    </header>

    <main class="py-4">
        <div class="container">
            <p class="text-muted text-center mb-3" role="status" aria-label="Прогресс: 1 из 50">1 / 50</p>
            <div class="d-flex justify-content-center mb-4">
                <div id="detect-wrapper" class="detect-wrapper">
                    <img id="detect-img" src="img/to_detect.jpg" alt="Кадр для разметки">
                </div>
            </div>
            <div class="text-center">
                <button type="button" class="btn btn-primary btn-lg" id="confirm-btn" disabled>Подтвердить</button>
            </div>
        </div>
    </main>

    <footer class="border-top py-3 mt-auto">
        <div class="container text-center text-muted">
            <small>© annotaylor 2026</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth-modals.js"></script>
    <script src="js/detection.js"></script>
</body>
</html>
