<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneta ID - Регистрация</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page-bg d-flex align-items-center justify-content-center min-vh-100 position-relative">

    <div class="position-absolute top-0 end-0 p-4">
        <a href="#" class="small text-white-50 text-decoration-none fw-medium me-2">Русский</a>
        <a href="#" class="small text-white-50 text-decoration-none fw-medium">English</a>
    </div>

    <main class="card border-0 shadow-lg p-5 bg-white text-center" style="max-width: 460px; width: 100%; border-radius: 24px !important;">
        
        <h1 class="h3 fw-bold mb-2 text-dark" style="letter-spacing: -0.5px;">Регистрация</h1>
        <p class="text-muted small mb-4">Создайте новый аккаунт Moneta ID</p>

        <form id="registerForm">
            
            <div class="mb-3 text-start">
                <input id="nameInput" type="text" class="form-control form-control-lg shadow-none fs-6 py-3" placeholder="Имя" required>
            </div>

            <div class="mb-3 text-start">
                <input id="emailInput" type="email" class="form-control form-control-lg shadow-none fs-6 py-3" placeholder="Email" required>
            </div>

            <div class="mb-3 text-start">
                <input id="passwordInput" type="password" class="form-control form-control-lg shadow-none fs-6 py-3" placeholder="Пароль" required>
            </div>

            <div class="mb-4 text-start">
                <input id="confirmPasswordInput" type="password" class="form-control form-control-lg shadow-none fs-6 py-3" placeholder="Повтор пароля" required>
            </div>

            <button type="submit" class="btn btn-dark w-100 fw-semibold py-3 rounded-3 mb-4 fs-6">Зарегистрироваться</button>
        </form>

        <div class="position-relative mb-4">
            <hr class="text-muted opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">уже есть аккаунт?</span>
        </div>

        <a href="index.html" class="btn btn-light w-100 fw-semibold py-3 rounded-3 text-dark fs-6">
            Войти в аккаунт
        </a>

    </main>

    <div class="position-absolute bottom-0 text-center pb-4 w-100">
        <a href="#" class="small text-white-50 text-decoration-none m-0">Поддержка</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
