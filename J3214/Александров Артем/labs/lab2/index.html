<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moneta ID - Вход</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page-bg d-flex align-items-center justify-content-center min-vh-100 position-relative">

    <div class="position-absolute top-0 end-0 p-4">
        <a href="#" class="small text-white-50 text-decoration-none fw-medium me-2">Русский</a>
        <a href="#" class="small text-white-50 text-decoration-none fw-medium">English</a>
    </div>

    <main class="card border-0 shadow-lg p-5 bg-white text-center" style="max-width: 440px; width: 100%; border-radius: 24px !important;">
        
        <h1 class="h3 fw-bold mb-4 text-dark" style="letter-spacing: -0.5px;">Moneta ID</h1>

        <form id="loginForm">
            <div class="mb-3 text-start">
                <input type="email" class="form-control form-control-lg shadow-none fs-6 py-3" id="emailInput" placeholder="Email" required>
            </div>

            <div class="mb-3 text-start">
                <input type="password" class="form-control form-control-lg shadow-none fs-6 py-3" id="passwordInput" placeholder="Пароль" required>
            </div>

            <div class="d-flex justify-content-between align-items-center small mb-4">
                <div class="form-check m-0">
                    <input class="form-check-input shadow-none" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary fw-medium" for="rememberMe">
                        Запомнить меня
                    </label>
                </div>
                <a href="#" class="text-decoration-none fw-medium">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn btn-dark w-100 fw-semibold py-3 rounded-3 mb-2 fs-6">Вход</button>
            
            <a href="register.html" class="btn btn-light w-100 fw-semibold py-3 rounded-3 text-dark mb-4 fs-6">
                Регистрация
            </a>
        </form>

        <div class="position-relative mb-4">
            <hr class="text-muted opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">или войдите с помощью</span>
        </div>

        <div class="d-flex justify-content-center gap-3">
            <a href="#" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 44px; height: 44px;">
                <span class="fw-bold text-primary">VK</span>
            </a>
            <a href="#" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center shadow-sm" style="width: 44px; height: 44px;">
                <span class="fw-bold text-danger">Я</span>
            </a>
        </div>

    </main>

    <div class="position-absolute bottom-0 text-center pb-4 w-100">
        <a href="#" class="small text-white-50 text-decoration-none m-0">Поддержка</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
