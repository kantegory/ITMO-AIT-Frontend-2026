<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монета - Настройки профиля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-12 col-md-3 col-lg-2 bg-white border-end p-4 d-flex flex-column justify-content-between sidebar">
                <div>
                    <h2 class="h2 text-dark fw-bold mb-4" style="letter-spacing: -0.5px;">
                        <i class="bi bi-stack"></i>
                        Moneta
                    </h2>
                    
                    <nav class="nav flex-column gap-2">
                        <a href="dashboard.html" class="nav-link active-menu-item p-2 rounded-3">
                            <i class="bi bi-layout-sidebar me-1"></i>
                            Главная панель
                        </a>
                        <a href="search.html" class="nav-link text-secondary p-2 rounded-3">
                            <i class="bi bi-search me-1"></i>
                            Поиск транзакций
                        </a>
                        <a href="#" class="nav-link text-secondary p-2 rounded-3">
                            <i class="bi bi-wallet me-1"></i>
                            Кошелек
                        </a>
                    </nav>
                </div>
                
                <div>
                    <a href="#" class="nav-link text-secondary p-2 rounded-3">
                        <i class="bi bi-headphones me-1"></i>
                        Помощь
                    </a>
                    <a href="#" class="nav-link text-secondary p-2 rounded-3">
                        <i class="bi bi-gear me-1"></i>
                        Настройки
                    </a>
                    <a href="index.html" class="nav-link text-secondary p-2 rounded-3">
                        <i class="bi bi-box-arrow-up-left me-1"></i>
                        Выйти
                    </a>
                </div>
            </aside>

            <main class="col-12 col-md-9 col-xl-10 p-4 p-md-5">
                <header class="d-flex justify-content-between align-items-center mb-5">
                    <div>
                        <h2 class="fw-bold mb-0">Личный кабинет</h2>
                        <p class="text-muted mb-0">Управление личными данными и целями</p>
                    </div>
                </header>

                <div class="row g-4">
                    <div class="col-12 col-xl-8">
                        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                            <div class="d-flex align-items-center mb-4">
                                <img src="images/avatar.jpg" alt="Мой профиль" class="rounded-circle shadow-sm me-3" style="width: 80px; height: 80px; object-fit: cover;">
                                <div>
                                    <h4 class="fw-bold mb-1">Артём Александров</h4>
                                    <p class="text-muted mb-0">Premium пользователь</p>
                                </div>
                            </div>

                            <form>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Имя</label>
                                        <input type="text" class="form-control bg-light border-0 py-2 shadow-none" value="Артём">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Фамилия</label>
                                        <input type="text" class="form-control bg-light border-0 py-2 shadow-none" value="Александров">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Email адрес</label>
                                        <input type="email" class="form-control bg-light border-0 py-2 shadow-none" value="artem@example.com">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-muted small">Дата рождения</label>
                                        <input type="date" class="form-control bg-light border-0 py-2 shadow-none" value="2000-01-01">
                                    </div>
                                    <div class="col-12 mt-4">
                                        <button type="button" class="btn btn-dark w-100 fw-medium py-2">Сохранить изменения</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>

                    <div class="col-12 col-xl-4">
                        <div class="card border-0 shadow-sm rounded-4 p-4 h-100">
                            <h5 class="fw-bold mb-4">Добавить новую цель</h5>
                            <form>
                                <div class="mb-3">
                                    <label class="form-label text-muted small">Название цели</label>
                                    <input type="text" class="form-control bg-light border-0 py-2 shadow-none" placeholder="Например: Новый ноутбук">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label text-muted small">Необходимая сумма (₽)</label>
                                    <input type="number" class="form-control bg-light border-0 py-2 shadow-none" placeholder="100 000">
                                </div>
                                <div class="mb-4">
                                    <label class="form-label text-muted small">Иконка цели</label>
                                    <select class="form-select bg-light border-0 py-2 shadow-none">
                                        <option>Техника</option>
                                        <option>Путешествие</option>
                                        <option>Автомобиль</option>
                                    </select>
                                </div>
                                <button type="button" class="btn btn-outline-dark w-100 py-2 rounded-3 fw-medium">Создать копилку</button>
                            </form>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
