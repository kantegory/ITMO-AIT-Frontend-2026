<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagad - регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-card" aria-labelledby="register-title">
      <a class="brand-link" href="index.html">Omagad</a>
      <h1 id="register-title" class="h3">Регистрация</h1>
      <form class="vstack gap-3">
        <div>
          <label class="form-label" for="name">Имя</label>
          <input class="form-control" id="name" type="text" autocomplete="name" required />
        </div>
        <div>
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" type="email" autocomplete="email" required />
        </div>
        <div>
          <label class="form-label" for="password">Пароль</label>
          <input class="form-control" id="password" type="password" autocomplete="new-password" required />
        </div>
        <button class="btn btn-primary" type="submit">Создать аккаунт</button>
      </form>
      <p class="mt-3 mb-0 text-secondary">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </main>
  </body>
</html>
