<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagad - страница курса</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="navbar container py-3">
        <a class="navbar-brand fw-bold" href="index.html">Omagad</a>
        <a class="btn btn-outline-primary" href="profile.html">Кабинет</a>
      </nav>
    </header>
    <main class="container py-4">
      <section class="work-surface" aria-labelledby="course-title">
        <span class="badge text-bg-success mb-3">Начальный уровень</span>
        <h1 id="course-title">Python для начинающих</h1>
        <p class="text-secondary">Видеолекции, материалы, задания и обсуждения в одной учебной странице.</p>
        <div class="row g-3">
          <article class="col-lg-7">
            <div class="video-placeholder" role="img" aria-label="Область видео-лекции">Видео-лекция</div>
          </article>
          <aside class="col-lg-5">
            <div class="course-card">
              <h2 class="h5">Материалы курса</h2>
              <ul class="mb-0">
                <li>Конспект лекции</li>
                <li>Практическое задание</li>
                <li>Обсуждение с преподавателем</li>
              </ul>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
