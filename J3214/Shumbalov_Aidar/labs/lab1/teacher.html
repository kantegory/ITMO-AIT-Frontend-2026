<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagad - кабинет преподавателя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="navbar container py-3">
        <a class="navbar-brand fw-bold" href="index.html">Omagad</a>
        <a class="btn btn-outline-primary" href="index.html">Каталог</a>
      </nav>
    </header>
    <main class="container py-4">
      <section class="work-surface" aria-labelledby="teacher-title">
        <h1 id="teacher-title">Кабинет преподавателя</h1>
        <p class="text-secondary">Загрузка материалов и управление учебными курсами.</p>
        <form class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="materialTitle">Название материала</label>
            <input class="form-control" id="materialTitle" type="text" placeholder="Лекция 1" />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="courseSelect">Курс</label>
            <select class="form-select" id="courseSelect">
              <option>Python для начинающих</option>
              <option>HTML, CSS, JavaScript</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="description">Описание</label>
            <textarea class="form-control" id="description" rows="4"></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-primary" type="button">Сохранить материал</button>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
