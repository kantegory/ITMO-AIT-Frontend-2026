<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Omagad - кабинет</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="border-bottom bg-white">
      <nav class="navbar container py-3">
        <a class="navbar-brand fw-bold" href="index.html">Omagad</a>
        <a class="btn btn-outline-primary" href="index.html">Каталог</a>
      </nav>
    </header>
    <main class="container py-4">
      <section class="work-surface" aria-labelledby="profile-title">
        <h1 id="profile-title" class="h2">Личный кабинет</h1>
        <p class="text-secondary">Активные курсы, прогресс и сертификаты пользователя.</p>
        <div class="row g-3">
          <article class="col-md-4"><div class="metric-card"><span>Курсов</span><strong>3</strong></div></article>
          <article class="col-md-4"><div class="metric-card"><span>Средний прогресс</span><strong>67%</strong></div></article>
          <article class="col-md-4"><div class="metric-card"><span>Сертификатов</span><strong>2</strong></div></article>
        </div>
      </section>
      <section class="mt-4" aria-labelledby="current-title">
        <h2 id="current-title" class="h4">Текущие курсы</h2>
        <div class="list-group">
          <a class="list-group-item list-group-item-action" href="course.html">Python для начинающих - 72%</a>
          <a class="list-group-item list-group-item-action" href="course.html">HTML, CSS, JavaScript - 45%</a>
          <a class="list-group-item list-group-item-action" href="course.html">SQL для аналитиков - 100%</a>
        </div>
      </section>
    </main>
  </body>
</html>
