        <button

            aria-label="Открыть меню"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >

            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">

                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="search.html">

                </li>

                <li class="nav-item">
                    <a class="nav-link" href="feed.html">

<main class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-9">

                <section class="planner-card">

                    <div class="planner-card-header">

                        <span class="section-label">
                            НОВОЕ ПУТЕШЕСТВИЕ
                        </span>

                        <h1 class="mt-2">
                            Создать поездку
                        </h1>

                        <p class="text-secondary">
                            Создай собственный маршрут
                            и поделись им с другими.
                        </p>

                    </div>


                    <form
                        id="createTripForm"
                        novalidate
                    >

                        <div class="mb-4">

                            <label
                                for="title"
                                class="form-label"
                            >
                                Название поездки
                            </label>

                            <input
                                id="title"
                                type="text"
                                class="form-control"
                                required
                                minlength="3"
                                placeholder="Например: Неделя в Токио"
                            >

                        </div>


                        <div class="row g-3 mb-4">

                            <div class="col-md-6">

                                <label
                                    for="destination"
                                    class="form-label"
                                >
                                    Направление
                                </label>

                                <input
                                    id="destination"
                                    type="text"
                                    class="form-control"
                                    required
                                    placeholder="Токио, Япония"
                                >

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="type"
                                    class="form-label"
                                >
                                    Тип
                                </label>

                                <select
                                    id="type"
                                    class="form-select"
                                >

                                    <option value="city">
                                        🏙️ Город
                                    </option>

                                    <option value="nature">
                                        🌿 Природа
                                    </option>

                                    <option value="beach">
                                        🏖️ Пляж
                                    </option>

                                    <option value="mountains">
                                        ⛰️ Горы
                                    </option>

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="duration"
                                    class="form-label"
                                >
                                    Длительность
                                </label>

                                <input
                                    id="duration"
                                    type="text"
                                    class="form-control"
                                    required
                                    placeholder="7 дней"
                                >

                            </div>


                            <div class="col-md-6">

                                <label
                                    for="budget"
                                    class="form-label"
                                >
                                    Бюджет
                                </label>

                                <input
                                    id="budget"
                                    type="text"
                                    class="form-control"
                                    required
                                    placeholder="100 000 ₽"
                                >

                            </div>

                        </div>


                        <div class="mb-4">

                            <label
                                for="description"
                                class="form-label"
                            >
                                Описание
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="5"
                                required
                                placeholder="Расскажи о поездке..."
                            ></textarea>

                        </div>


                        <div class="mb-4">

                            <label
                                for="tags"
                                class="form-label"
                            >
                                Теги
                            </label>

                            <input
                                id="tags"
                                type="text"
                                class="form-control"
                                placeholder="япония, токио, еда"
                            >

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Точки маршрута
                            </label>

                            <div id="routePoints"></div>

                            <button
                                id="addRoute"
                                type="button"
                                class="btn btn-outline-primary btn-sm"
                            >
                                + Добавить точку
                            </button>

                        </div>


                        <div class="mb-4">

                            <label class="form-label">
                                Любимые места
                            </label>

                            <div id="favoritePlaces"></div>

                            <button
                                id="addPlace"
                                type="button"
                                class="btn btn-outline-primary btn-sm"
                            >
                                + Добавить место
                            </button>

                        </div>


                        <div class="mb-4">

                            <label
                                for="visibility"
                                class="form-label"
                            >
                                Видимость
                            </label>

                            <select
                                id="visibility"
                                class="form-select"
                            >

                                <option value="public">
                                    🌍 Публичная
                                </option>

                                <option value="private">
                                    🔒 Приватная
                                </option>

                            </select>

                        </div>


                        <div
                            id="tripMessage"
                            class="alert d-none"
                            role="alert"
                        ></div>


                        <button
                            type="submit"
                            class="btn btn-primary btn-lg"
                        >
                            Создать поездку
                        </button>

                    </form>

                </section>

            </div>

        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/theme.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        if (!TravellyAuth.requireAuth()) {
            return;
        }


        const user =
            TravellyAuth.getUser();


        const form =
            document.getElementById(
                "createTripForm"
            );


        const routeContainer =
            document.getElementById(
                "routePoints"
            );


        const placesContainer =
            document.getElementById(
                "favoritePlaces"
            );


        const message =
            document.getElementById(
                "tripMessage"
            );


        function addRoute(value = "") {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "input-group mb-2";


            row.innerHTML = `

                <input
                    type="text"
                    class="form-control route-input"
                    value="${escapeHtml(value)}"
                    placeholder="Например: Shibuya"
                >

                <button
                    type="button"
                    class="btn btn-outline-danger remove-route"
                >
                    ×
                </button>

            `;


            row
                .querySelector(".remove-route")
                .addEventListener(
                    "click",
                    () => row.remove()
                );


            routeContainer.appendChild(
                row
            );

        }


        function addPlace(value = "") {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "input-group mb-2";


            row.innerHTML = `

                <input
                    type="text"
                    class="form-control place-input"
                    value="${escapeHtml(value)}"
                    placeholder="Например: Senso-ji"
                >

                <button
                    type="button"
                    class="btn btn-outline-danger remove-place"
                >
                    ×
                </button>

            `;


            row
                .querySelector(".remove-place")
                .addEventListener(
                    "click",
                    () => row.remove()
                );


            placesContainer.appendChild(
                row
            );

        }


        document
            .getElementById("addRoute")
            .addEventListener(
                "click",
                () => addRoute()
            );


        document
            .getElementById("addPlace")
            .addEventListener(
                "click",
                () => addPlace()
            );


        addRoute();
        addPlace();


        form.addEventListener(
            "submit",
            async event => {

                event.preventDefault();


                form.classList.add(
                    "was-validated"
                );


                if (!form.checkValidity()) {
                    return;
                }


                const tags =
                    document
                        .getElementById("tags")
                        .value
                        .split(",")
                        .map(
                            tag =>
                                tag.trim()
                        )
                        .filter(Boolean);


                const route =
                    [
                        ...document.querySelectorAll(
                            ".route-input"
                        )
                    ]
                        .map(
                            input =>
                                input.value.trim()
                        )
                        .filter(Boolean);


                const places =
                    [
                        ...document.querySelectorAll(
                            ".place-input"
                        )
                    ]
                        .map(
                            input =>
                                input.value.trim()
                        )
                        .filter(Boolean);


                const trip = {

                    userId:
                        user.id,

                    title:
                        document
                            .getElementById("title")
                            .value
                            .trim(),

                    destination:
                        document
                            .getElementById("destination")
                            .value
                            .trim(),

                    type:
                        document
                            .getElementById("type")
                            .value,

                    duration:
                        document
                            .getElementById("duration")
                            .value
                            .trim(),

                    budget:
                        document
                            .getElementById("budget")
                            .value
                            .trim(),

                    description:
                        document
                            .getElementById("description")
                            .value
                            .trim(),

                    tags,

                    route,

                    places,

                    visibility:
                        document
                            .getElementById("visibility")
                            .value,

                    createdAt:
                        new Date().toISOString(),

                    likes: 0,

                    comments: 0

                };


                /*
                 * Локальный ключ конкретного пользователя.
                 */

                const localKey =
                    `travelly-user-trips-${user.id}`;


                let localTrips = [];


                try {

                    localTrips =
                        JSON.parse(
                            localStorage.getItem(
                                localKey
                            )
                        ) || [];

                } catch {

                    localTrips = [];

                }


                try {

                    const created =
                        await TravellyAPI.createTrip(
                            trip
                        );


                    /*
                     * Используем настоящий ID API.
                     */

                    trip.id =
                        created.id;


                    localTrips.push(
                        trip
                    );


                    localStorage.setItem(
                        localKey,
                        JSON.stringify(
                            localTrips
                        )
                    );


                    message.className =
                        "alert alert-success";

                    message.textContent =
                        "Поездка сохранена.";


                    setTimeout(
                        () => {

                            window.location.href =
                                "my-trips.html";

                        },
                        700
                    );


                } catch {

                    /*
                     * Fallback, если API не запущен.
                     */

                    trip.id =
                        Date.now();


                    localTrips.push(
                        trip
                    );


                    localStorage.setItem(
                        localKey,
                        JSON.stringify(
                            localTrips
                        )
                    );


                    message.className =
                        "alert alert-warning";

                    message.textContent =
                        "API недоступен. Поездка сохранена локально.";


                    setTimeout(
                        () => {

                            window.location.href =
                                "my-trips.html";

                        },
                        900
                    );

                }

            }
        );


        function escapeHtml(value) {

            const div =
                document.createElement(
                    "div"
                );

            div.textContent =
                String(value);

            return div.innerHTML;

        }

    }
);

</script>

</body>

</html>
