        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    <style>

        .destination-page {
            padding: 45px 0 80px;
        }

        .destination-hero {
            position: relative;
            min-height: 450px;
            margin-bottom: 30px;

            display: flex;
            align-items: flex-end;

            overflow: hidden;

            border-radius: 28px;

            background-size: cover;
            background-position: center;
        }

        .destination-hero::before {
            content: "";

            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    180deg,
                    transparent 20%,
                    rgba(0,0,0,.75)
                );
        }

        .destination-hero-content {
            position: relative;
            z-index: 1;

            padding: 42px;
            color: #fff;
        }

        .destination-hero-content h1,
        .destination-hero-content p {
            color: #fff !important;
        }

        .destination-type {
            display: inline-block;

            margin-bottom: 12px;
            padding: 7px 12px;

            border-radius: 999px;

            background: rgba(255,255,255,.18);

            backdrop-filter: blur(8px);

            font-size: 13px;
            font-weight: 700;
        }

        .destination-content {
            display: grid;

            grid-template-columns:
                minmax(0, 1.55fr)
                minmax(280px, .65fr);

            gap: 28px;
        }

        .destination-main,
        .destination-sidebar {
            display: grid;
            gap: 24px;
            align-content: start;
        }

        .destination-card-box {
            padding: 28px;

            border-radius: 22px;
            border: 1px solid var(--border);

            background: var(--card);

            box-shadow: var(--shadow);
        }

        .destination-description {
            color: var(--text-secondary);

            font-size: 17px;
            line-height: 1.8;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .stat-box {
            padding: 18px;
            text-align: center;

            border-radius: 16px;

            background: var(--background-secondary);
        }

        .stat-box strong {
            display: block;

            color: var(--primary);

            font-size: 20px;
        }

        .stat-box span {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .sights-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 16px;
        }

        .sight-card {
            overflow: hidden;

            border-radius: 18px;
            border: 1px solid var(--border);

            background: var(--card);
        }

        .sight-card img {
            width: 100%;
            height: 190px;

            display: block;

            object-fit: cover;
        }

        .sight-card-body {
            padding: 16px;
        }

        .sight-card-body h3 {
            font-size: 18px;
        }

        .sight-card-body p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .destination-map {
            min-height: 300px;

            position: relative;

            overflow: hidden;

            border-radius: 18px;

            background: var(--map-background);
        }

        .destination-map::before,
        .destination-map::after {
            content: "";

            position: absolute;

            width: 140%;
            height: 2px;

            left: -20%;

            background: var(--border);
        }

        .destination-map::before {
            top: 42%;
            transform: rotate(16deg);
        }

        .destination-map::after {
            top: 64%;
            transform: rotate(-13deg);
        }

        .map-marker {
            position: absolute;

            width: 20px;
            height: 20px;

            border-radius: 50%;

            background: var(--primary);

            border: 4px solid #fff;

            box-shadow:
                0 4px 15px rgba(0,0,0,.18);
        }

        .map-marker.one {
            top: 32%;
            left: 28%;
        }

        .map-marker.two {
            top: 52%;
            left: 53%;
        }

        .map-marker.three {
            top: 67%;
            left: 73%;
        }

        .map-label {
            position: absolute;

            padding: 6px 9px;

            background: var(--card);
            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 9px;

            font-size: 12px;
            font-weight: 700;
        }

        .map-label.one {
            top: 24%;
            left: 23%;
        }

        .map-label.two {
            top: 44%;
            left: 48%;
        }

        .map-label.three {
            top: 75%;
            left: 67%;
        }

        .recommendation-list {
            display: grid;
            gap: 11px;
        }

        .recommendation-item {
            display: flex;
            gap: 11px;

            padding: 14px;

            border-radius: 14px;

            background:
                var(--background-secondary);
        }

        .recommendation-item strong {
            display: block;
            margin-bottom: 3px;
        }

        .recommendation-item span {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .sidebar-list {
            list-style: none;

            padding: 0;
            margin: 0;
        }

        .sidebar-list li {
            display: flex;
            justify-content: space-between;
            gap: 12px;

            padding: 10px 0;

            border-bottom: 1px solid var(--border);
        }

        .sidebar-list span {
            color: var(--text-secondary);
        }

        .review {
            padding: 17px 0;
            border-bottom: 1px solid var(--border);
        }

        .review:last-child {
            border-bottom: none;
        }

        .review-author {
            font-weight: 700;
        }

        .review-stars {
            margin: 5px 0;
        }

        .review p {
            color: var(--text-secondary);
        }

        .not-found {
            max-width: 700px;

            margin: 80px auto;

            padding: 50px 30px;

            text-align: center;

            border-radius: 24px;
            border: 1px solid var(--border);

            background: var(--card);

            box-shadow: var(--shadow);
        }

        @media (max-width: 992px) {

            .destination-content {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 700px) {

            .destination-hero {
                min-height: 350px;
            }

            .destination-hero-content {
                padding: 27px;
            }

            .stats-row,
            .sights-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const container =
            document.getElementById(
                "destinationContainer"
            );

        const params =
            new URLSearchParams(
                window.location.search
            );

        const id =
            params.get("id") ||
            "italy";

        const destination =
            destinations[id];


        if (!destination) {

            container.innerHTML = `
                <section class="not-found">

                    <div style="font-size:52px">
                        🗺️
                    </div>

                    <h1>
                        Направление не найдено
                    </h1>

                    <p class="text-secondary">
                        Попробуй выбрать другое направление.
                    </p>

                    <a
                        href="search.html"
                        class="btn btn-primary"
                    >
                        К поиску
                    </a>

                </section>
            `;

            return;
        }


        document.title =
            `${destination.title} — Travelly`;


        function getSavedKey() {

            const user =
                TravellyAuth.getUser();

            if (!user) {
                return null;
            }

            return `travelly-trips-${user.id}`;
        }


        function getSaved() {

            const key =
                getSavedKey();

            if (!key) {
                return [];
            }

            try {
                return JSON.parse(
                    localStorage.getItem(key)
                ) || [];
            } catch {
                return [];
            }
        }


        function saveSaved(data) {

            const key =
                getSavedKey();

            if (!key) {
                return;
            }

            localStorage.setItem(
                key,
                JSON.stringify(data)
            );
        }


        function render() {

            const saved =
                getSaved().includes(id);


            container.innerHTML = `

                <section
                    class="destination-hero"
                    style="
                        background-image:
                        url('${destination.image}')
                    "
                >

                    <div class="destination-hero-content">

                        <span class="destination-type">
                            ${destination.type}
                        </span>

                        <h1>
                            ${destination.title}
                        </h1>

                        <p class="lead">
                            ${destination.subtitle}
                        </p>

                    </div>

                </section>


                <div class="destination-content">


                    <div class="destination-main">


                        <section class="destination-card-box">

                            <h2>
                                О направлении
                            </h2>

                            <p class="destination-description">
                                ${destination.description}
                            </p>


                            <div class="stats-row mt-4">

                                <div class="stat-box">
                                    <strong>
                                        ${destination.duration}
                                    </strong>

                                        Длительность
                                    </span>
                                </div>

                                    <strong>

                                    </strong>

                                </div>

                                <div class="stat-box">
                                    <strong>
                                        ${destination.rating}
                                    </strong>

                                        Рейтинг
                                    </span>
                                </div>

                            </div>

                        </section>


                        <section class="destination-card-box">

                            <h2>
                                Что посмотреть
                            </h2>

                            <div class="sights-grid">

                                ${destination.sights
                                    .map(
                                        sight => `

                                            <article class="sight-card">

                                                <img
                                                    src="${sight[1]}"
                                                    alt="${sight[0]}"
                                                    loading="lazy"
                                                >

                                                <div class="sight-card-body">

                                                    <h3>
                                                        ${sight[0]}
                                                    </h3>

                                                    <p>
                                                        ${sight[2]}
                                                    </p>

                                                </div>

                                            </article>

                                        `
                                    )
                                    .join("")
                                }

                            </div>

                        </section>


                        <section class="destination-card-box">

                            <h2>
                                Карта
                            </h2>

                            <div class="destination-map">

                                <div class="map-marker one"></div>
                                <div class="map-marker two"></div>
                                <div class="map-marker three"></div>

                                <span class="map-label one">
                                    Центр
                                </span>

                                <span class="map-label two">
                                    Популярное место
                                </span>

                                <span class="map-label three">
                                    Маршрут
                                </span>

                            </div>

                            <a
                                href="trip-planner.html"
                                class="btn btn-primary mt-3"
                            >
                                Построить маршрут
                            </a>

                        </section>

                    </div>


                    <aside class="destination-sidebar">


                        <section class="destination-card-box">

                            <span
                                style="
                                    color:var(--text-secondary);
                                    font-size:13px;
                                "
                            >
                                Примерный бюджет
                            </span>

                            <div
                                style="
                                    color:var(--primary);
                                    font-size:30px;
                                    font-weight:800;
                                    margin-bottom:18px;
                                "
                            >
                                ${destination.price}
                            </div>


                            <button
                                id="saveDestination"
                                type="button"
                                class="btn ${
                                    saved
                                        ? "btn-danger"
                                        : "btn-primary"
                                } w-100"
                            >

                                ${
                                    saved
                                        ? "♥ Сохранено"
                                        : "♡ Сохранить"
                                }

                            </button>


                            <p
                                id="saveHint"
                                class="text-secondary mt-2 mb-0"
                                style="font-size:13px"
                            ></p>

                        </section>


                        <section class="destination-card-box">

                            <h2>
                                Информация
                            </h2>

                            <ul class="sidebar-list">

                                <li>
                                    <span>
                                        Тип
                                    </span>

                                    <strong>
                                        ${destination.type}
                                    </strong>
                                </li>

                                <li>
                                    <span>
                                        Срок
                                    </span>

                                    <strong>
                                        ${destination.duration}
                                    </strong>
                                </li>

                                <li>
                                    <span>
                                        Сезон
                                    </span>

                                    <strong>
                                        ${destination.season}
                                    </strong>
                                </li>

                                <li>
                                    <span>
                                        Рейтинг
                                    </span>

                                    <strong>
                                        ${destination.rating}
                                    </strong>
                                </li>

                            </ul>

                        </section>


                        <section class="destination-card-box">

                            <h2>
                                Готова ехать?
                            </h2>

                            <p class="text-secondary">
                                Сохрани направление или
                                собери маршрут.
                            </p>

                            <a
                                href="trip-planner.html"
                                class="btn btn-primary w-100"
                            >
                                Планировать поездку
                            </a>

                        </section>


                    </aside>

                </div>
            `;


            const button =
                document.getElementById(
                    "saveDestination"
                );


            const hint =
                document.getElementById(
                    "saveHint"
                );


            button.addEventListener(
                "click",
                () => {

                    /*
                     * Сохранять можно только
                     * авторизованному пользователю.
                     */

                    if (
                        !TravellyAuth.isLoggedIn()
                    ) {

                        window.location.href =
                            `login.html?redirect=${encodeURIComponent(
                                window.location.pathname +
                                window.location.search
                            )}`;

                        return;
                    }


                    let current =
                        getSaved();


                    if (
                        current.includes(id)
                    ) {

                        current =
                            current.filter(
                                item =>
                                    item !== id
                            );

                        saveSaved(current);

                    } else {

                        current.push(id);

                        saveSaved(current);

                    }


                    render();

                }
            );

        }


        render();

    }
);

</script>

</body>
