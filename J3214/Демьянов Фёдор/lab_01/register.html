<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | NovaTransit</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Стили проекта -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Кнопка возврата -->
    <div class="position-absolute top-0 start-0 p-4 z-3">
        <a href="index.html" class="text-decoration-none text-muted-custom d-flex align-items-center gap-2"
            style="opacity: 0.85;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span class="letter-spacing-2 text-uppercase fs-7">На главную</span>
        </a>
    </div>

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="glass-panel p-4 p-md-5 w-100" style="max-width: 480px;">

            <div class="text-center mb-5">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="mb-3"
                    xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="11" stroke="white" stroke-width="1" />
                    <path d="M12 1 C12 8 16 12 23 12 C16 12 12 16 12 23 C12 16 8 12 1 12 C8 12 12 8 12 1 Z"
                        fill="white" />
                </svg>
                <h2 class="fw-bold mb-1 letter-spacing-2">РЕГИСТРАЦИЯ</h2>
                <p class="text-muted-custom fs-7 letter-spacing-2 text-uppercase">Регистрация кандидата</p>
            </div>

            <form id="registerForm" class="needs-validation" novalidate>
                <div class="mb-4">
                    <label for="name" class="form-label">Позывной или ФИО</label>
                    <input type="text" class="form-control glass-input shadow-none" id="name" placeholder="John Doe"
                        required minlength="2">
                    <div class="invalid-feedback fs-7">Укажите ваш позывной или полное имя.</div>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">Бортовой Email</label>
                    <input type="email" class="form-control glass-input shadow-none" id="email"
                        placeholder="commander@novatransit.com" required>
                    <div class="invalid-feedback fs-7">Укажите корректный адрес электронной почты.</div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Ключ доступа (Пароль)</label>
                    <input type="password" class="form-control glass-input shadow-none" id="password"
                        placeholder="••••••••" required minlength="6">
                    <div class="invalid-feedback fs-7">Минимальная длина пароля — 6 символов.</div>
                </div>

                <div class="mb-4">
                    <label for="passwordConfirm" class="form-label">Подтверждение ключа</label>
                    <input type="password" class="form-control glass-input shadow-none" id="passwordConfirm"
                        placeholder="••••••••" required>
                    <div class="invalid-feedback fs-7" id="confirmFeedback">Повторите пароль.</div>
                </div>

                <div class="form-check mb-5">
                    <input class="form-check-input shadow-none" type="checkbox" id="rules" required>
                    <label class="form-check-label text-muted-custom fs-7" for="rules">
                        Согласен с регламентом суборбитальных и межпланетных полетов
                    </label>
                    <div class="invalid-feedback fs-7">Необходимо подтвердить согласие с регламентом.</div>
                </div>

                <button type="submit" class="btn btn-accent w-100 py-3 mb-4 letter-spacing-2 fs-7">
                    Создать досье
                </button>

                <p class="text-center text-muted-custom fs-7 mb-0">
                    Уже зарегистрированы? <a href="login.html"
                        class="text-main fw-medium text-decoration-none border-bottom border-secondary pb-1 ms-1">Войти</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Скрипт проверки валидации и совпадения паролей -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');
            const pass = document.getElementById('password');
            const passConfirm = document.getElementById('passwordConfirm');
            const confirmFeedback = document.getElementById('confirmFeedback');

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                event.stopPropagation();

                // Проверка совпадения паролей
                if (pass.value !== passConfirm.value) {
                    passConfirm.setCustomValidity('Пароли не совпадают');
                    confirmFeedback.textContent = 'Введенные ключи доступа не совпадают.';
                } else {
                    passConfirm.setCustomValidity('');
                }

                if (form.checkValidity()) {
                    // Успешная регистрация и перенаправление в личный кабинет
                    window.location.href = 'dashboard.html';
                } else {
                    form.classList.add('was-validated');
                }
            });

            // Сброс ошибки при вводе в поле подтверждения
            passConfirm.addEventListener('input', () => {
                if (pass.value === passConfirm.value) {
                    passConfirm.setCustomValidity('');
                }
            });
        });
    </script>
</body>

</html>
