<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | NovaTransit</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Стили проекта -->
    <link rel="stylesheet" href="style.css">
    <!-- Инициализация темы до рендеринга DOM -->
    <script src="js/theme.js"></script>
</head>

<body>

    <!-- Кнопка возврата -->
    <div class="position-absolute top-0 start-0 p-4 z-3">
        <a href="index.html"
            class="nav-link d-inline-flex align-items-center gap-2 letter-spacing-2 text-uppercase fs-7"
            aria-label="Вернуться на главную страницу NovaTransit">
            <svg class="icon" aria-hidden="true" focusable="false">
                <use href="assets/images/sprite.svg#icon-arrow-left"></use>
            </svg>
            На главную
        </a>
    </div>
    <!-- Тумблер темы Nova / Eclipse -->
    <div class="position-absolute top-0 end-0 p-4 z-3">
        <button type="button" class="theme-toggle-btn shadow-none" aria-label="Сменить тему">
            <i class="bi bi-moon-stars-fill"></i>
        </button>
    </div>

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="glass-panel p-4 p-md-5 w-100" style="max-width: 450px;">

            <div class="text-center mb-4">
                <svg class="icon icon-logo-lg mb-3" aria-hidden="true" focusable="false">
                    <use href="assets/images/sprite.svg#icon-logo"></use>
                </svg>
                <h1 class="fw-bold mb-1 letter-spacing-2 fs-2">ВХОД</h1>
                <p class="text-muted-custom fs-7 letter-spacing-2 text-uppercase">Терминал авторизации</p>
            </div>

            <!-- Форма входа -->
            <form id="loginForm" class="needs-validation" novalidate aria-label="Форма авторизации исследователя">
                <div class="mb-4">
                    <label for="email" class="form-label">Бортовой Email</label>
                    <input type="email" class="form-control glass-input shadow-none" id="email"
                        placeholder="commander@novatransit.com" required aria-required="true"
                        aria-describedby="emailFeedback">
                    <div class="invalid-feedback fs-7" id="emailFeedback">Укажите корректный адрес электронной почты.
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Ключ доступа (Пароль)</label>
                    <input type="password" class="form-control glass-input shadow-none" id="password"
                        placeholder="••••••••" required minlength="6" aria-required="true"
                        aria-describedby="passwordFeedback">
                    <div class="invalid-feedback fs-7" id="passwordFeedback">Пароль должен содержать не менее 6
                        символов.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div class="form-check">
                        <input class="form-check-input shadow-none" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted-custom fs-7" for="rememberMe">
                            Запомнить терминал
                        </label>
                    </div>
                    <a href="#"
                        class="text-decoration-none fs-7 text-muted-custom border-bottom border-secondary border-opacity-50 pb-1">
                        Забыли ключ?
                    </a>
                </div>

                <button type="submit" class="btn btn-accent w-100 py-3 mb-4 letter-spacing-2 fs-7">
                    Войти в систему
                </button>

                <p class="text-center text-muted-custom fs-7 mb-0">
                    Нет допуска? <a href="register.html"
                        class="text-main fw-medium text-decoration-none border-bottom border-secondary pb-1 ms-1">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Подключаем сетевой клиент и модуль авторизации -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Если сессия уже активна - сразу переходим в кабинет
            if (window.auth.getCurrentUser()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                event.stopPropagation();

                if (!form.checkValidity()) {
                    form.classList.add('was-validated');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.textContent;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Авторизация...';

                try {
                    await window.auth.login(emailInput.value.trim(), passwordInput.value);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    alert(error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            });
        });
    </script>
</body>

</html>
