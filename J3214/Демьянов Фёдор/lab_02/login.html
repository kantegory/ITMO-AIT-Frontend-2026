<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | NovaTransit</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Стили проекта -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Кнопка возврата -->
    <div class="position-absolute top-0 start-0 p-4 z-3">
        <a href="index.html" class="text-decoration-none text-muted-custom d-flex align-items-center gap-2"
            style="opacity: 0.85;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span class="letter-spacing-2 text-uppercase fs-7">На главную</span>
        </a>
    </div>

    <main class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="glass-panel p-4 p-md-5 w-100" style="max-width: 450px;">

            <div class="text-center mb-5">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="mb-3"
                    xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="11" stroke="white" stroke-width="1" />
                    <path d="M12 1 C12 8 16 12 23 12 C16 12 12 16 12 23 C12 16 8 12 1 12 C8 12 12 8 12 1 Z"
                        fill="white" />
                </svg>
                <h2 class="fw-bold mb-1 letter-spacing-2">ВХОД</h2>
                <p class="text-muted-custom fs-7 letter-spacing-2 text-uppercase">Терминал авторизации</p>
            </div>

            <!-- Форма с отключенной браузерной валидацией novalidate -->
            <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-4">
                    <label for="email" class="form-label">Бортовой Email</label>
                    <input type="email" class="form-control glass-input shadow-none" id="email"
                        placeholder="commander@novatransit.com" required>
                    <div class="invalid-feedback fs-7">Укажите корректный адрес электронной почты.</div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Ключ доступа (Пароль)</label>
                    <input type="password" class="form-control glass-input shadow-none" id="password"
                        placeholder="••••••••" required minlength="6">
                    <div class="invalid-feedback fs-7">Пароль должен содержать не менее 6 символов.</div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div class="form-check">
                        <input class="form-check-input shadow-none" type="checkbox" id="rememberMe">
                        <label class="form-check-label text-muted-custom fs-7" for="rememberMe">
                            Запомнить терминал
                        </label>
                    </div>
                    <a href="#"
                        class="text-decoration-none fs-7 text-muted-custom border-bottom border-secondary border-opacity-50 pb-1">
                        Забыли ключ?
                    </a>
                </div>

                <button type="submit" class="btn btn-accent w-100 py-3 mb-4 letter-spacing-2 fs-7">
                    Войти в систему
                </button>

                <p class="text-center text-muted-custom fs-7 mb-0">
                    Нет допуска? <a href="register.html"
                        class="text-main fw-medium text-decoration-none border-bottom border-secondary pb-1 ms-1">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </main>

    <!-- Подключаем сетевой клиент и модуль авторизации -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Если сессия уже активна - сразу переходим в кабинет
            if (window.auth.getCurrentUser()) {
                window.location.href = 'dashboard.html';
                return;
            }

            const form = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                event.stopPropagation();

                if (!form.checkValidity()) {
                    form.classList.add('was-validated');
                    return;
                }

                const submitBtn = form.querySelector('button[type="submit"]');
                const originalBtnText = submitBtn.textContent;
                submitBtn.disabled = true;
                submitBtn.textContent = 'Авторизация...';

                try {
                    await window.auth.login(emailInput.value.trim(), passwordInput.value);
                    window.location.href = 'dashboard.html';
                } catch (error) {
                    alert(error.message);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                }
            });
        });
    </script>
</body>

</html>
