<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | NovaTransit</title>
    <!-- Бутстрап -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous">
    <!-- Шрифты от гугла -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Кнопка назад -->
    <div class="position-absolute top-0 start-0 p-4 z-3">
        <a href="index.html"
            class="text-decoration-none text-muted-custom d-flex align-items-center gap-2 transition-all"
            style="opacity: 0.8;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            <span class="letter-spacing-2 text-uppercase fs-7">На главную</span>
        </a>
    </div>

    <!-- Главный контейнер -->
    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">

        <!-- Карточка логина -->
        <div class="glass-panel p-4 p-md-5 w-100" style="max-width: 450px;">
            <div class="text-center mb-5">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="mb-3"
                    xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="12" r="11" stroke="white" stroke-width="1" />
                    <path d="M12 1 C12 8 16 12 23 12 C16 12 12 16 12 23 C12 16 8 12 1 12 C8 12 12 8 12 1 Z"
                        fill="white" />
                </svg>
                <h2 class="fw-bold mb-1">ВХОД</h2>
                <p class="text-muted-custom fs-7 letter-spacing-2 text-uppercase">Доступ к миссиям</p>
            </div>

            <form action="dashboard.html">
                <div class="mb-4">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control glass-input shadow-none" id="email"
                        placeholder="commander@novatransit.com" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control glass-input shadow-none" id="password"
                        placeholder="••••••••" required>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-5">
                    <div class="form-check">
                        <input class="form-check-input shadow-none" type="checkbox" value="" id="rememberMe">
                        <label class="form-check-label text-muted-custom fs-7" for="rememberMe">
                            Запомнить меня
                        </label>
                    </div>
                    <a href="#"
                        class="text-decoration-none fs-7 text-muted-custom border-bottom border-secondary pb-1">Забыли
                        код доступа?</a>
                </div>

                <button type="submit" class="btn btn-accent w-100 py-3 mb-4">Войти в
                    систему</button>

                <p class="text-center text-muted-custom fs-7 mb-0">
                    Нет аккаунта? <a href="register.html"
                        class="text-main fw-medium text-decoration-none border-bottom border-secondary pb-1">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Скрипты бутстрапа -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
