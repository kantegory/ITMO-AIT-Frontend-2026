<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Вход в приложение для планирования путешествий «Маршрут»">
  <title>Вход — Маршрут</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к форме входа</a>
  <nav class="navbar navbar-dark bg-dark" aria-label="Основная навигация">
    <div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="images/icons.svg#icon-compass"></use></svg></span>Маршрут</a><button class="btn btn-outline-light btn-sm theme-toggle" type="button" data-theme-toggle><svg class="icon" aria-hidden="true" focusable="false"><use href="images/icons.svg#icon-moon"></use></svg><span data-theme-label>Тёмная тема</span></button></div>
  </nav>

  <main class="auth-page" id="main-content" tabindex="-1">
    <div class="container">
      <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-2" id="loginTitle">Вход</h1>
          <p class="text-secondary mb-4">Продолжите планирование своих поездок.</p>
          <form class="needs-validation" id="loginForm" aria-labelledby="loginTitle" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Электронная почта</label>
              <input class="form-control" type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" aria-describedby="emailError" required>
              <div class="invalid-feedback" id="emailError">Введите корректный адрес почты.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Пароль</label>
              <input class="form-control" type="password" id="password" name="password" minlength="6" autocomplete="current-password" aria-describedby="passwordError" required>
              <div class="invalid-feedback" id="passwordError">Пароль должен содержать не менее 6 символов.</div>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember" name="remember">
              <label class="form-check-label" for="remember">Запомнить меня</label>
            </div>
            <button class="btn btn-travel w-100" type="submit">Войти</button>
            <div class="form-result mt-3" role="status" aria-live="polite" aria-atomic="true"></div>
          </form>
          <p class="text-center mt-4 mb-0">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
          <p class="text-center mt-2 mb-0"><a href="profile.html">Открыть демонстрационный кабинет</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
