<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Регистрация в приложении для планирования путешествий «Маршрут»">
  <title>Регистрация — Маршрут</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Перейти к форме регистрации</a>
  <nav class="navbar navbar-dark bg-dark" aria-label="Основная навигация">
    <div class="container"><a class="navbar-brand" href="index.html"><span class="brand-mark"><svg class="icon" aria-hidden="true" focusable="false"><use href="images/icons.svg#icon-compass"></use></svg></span>Маршрут</a><button class="btn btn-outline-light btn-sm theme-toggle" type="button" data-theme-toggle><svg class="icon" aria-hidden="true" focusable="false"><use href="images/icons.svg#icon-moon"></use></svg><span data-theme-label>Тёмная тема</span></button></div>
  </nav>

  <main class="auth-page" id="main-content" tabindex="-1">
    <div class="container">
      <div class="card auth-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-2" id="registerTitle">Регистрация</h1>
          <p class="text-secondary mb-4">Создайте профиль для сохранения маршрутов.</p>
          <form class="needs-validation" id="registerForm" aria-labelledby="registerTitle" novalidate>
            <div class="row g-3">
              <div class="col-sm-6">
                <label class="form-label" for="firstName">Имя</label>
                <input class="form-control" id="firstName" name="firstName" autocomplete="given-name" aria-describedby="firstNameError" required>
                <div class="invalid-feedback" id="firstNameError">Укажите имя.</div>
              </div>
              <div class="col-sm-6">
                <label class="form-label" for="lastName">Фамилия</label>
                <input class="form-control" id="lastName" name="lastName" autocomplete="family-name" aria-describedby="lastNameError" required>
                <div class="invalid-feedback" id="lastNameError">Укажите фамилию.</div>
              </div>
              <div class="col-12">
                <label class="form-label" for="registerEmail">Электронная почта</label>
                <input class="form-control" type="email" id="registerEmail" name="email" autocomplete="email" aria-describedby="registerEmailError" required>
                <div class="invalid-feedback" id="registerEmailError">Введите корректный адрес почты.</div>
              </div>
              <div class="col-12">
                <label class="form-label" for="registerPassword">Пароль</label>
                <input class="form-control" type="password" id="registerPassword" name="password" minlength="6" autocomplete="new-password" aria-describedby="registerPasswordError" required>
                <div class="invalid-feedback" id="registerPasswordError">Минимальная длина пароля — 6 символов.</div>
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="agreement" name="agreement" aria-describedby="agreementError" required>
                  <label class="form-check-label" for="agreement">Я согласен с правилами сервиса</label>
                  <div class="invalid-feedback" id="agreementError">Необходимо принять правила.</div>
                </div>
              </div>
            </div>
            <button class="btn btn-travel w-100 mt-4" type="submit">Создать аккаунт</button>
            <div class="form-result mt-3" role="status" aria-live="polite" aria-atomic="true"></div>
          </form>
          <p class="text-center mt-4 mb-0">Уже есть аккаунт? <a href="login.html">Войти</a></p>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
