<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .role-btn { flex:1; border:2px solid #e2e8f0; border-radius:10px; padding:14px 10px; background:#fff; cursor:pointer; transition:all .2s; text-align:center; color:#64748b; }
    .role-btn:hover { border-color:#93c5fd; }
    .role-btn.active { border-color:#0d6efd; background:#eff6ff; color:#0d6efd; }
    .role-btn i { display:block; font-size:1.6rem; margin-bottom:6px; }
    .role-btn span { font-size:.85rem; font-weight:600; }
  </style>
</head>
<body class="auth-page">
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
    </div>
  </nav>
  <div class="container d-flex justify-content-center align-items-center py-5">
    <div class="card shadow-sm border-0 p-4" style="width:100%;max-width:480px;">
      <h2 class="mb-1 fw-bold">Создать аккаунт</h2>
      <p class="text-muted mb-4">Заполните данные для регистрации</p>
      <form onsubmit="handleRegister(event)">
        <div class="mb-4">
          <label class="form-label">Я регистрируюсь как</label>
          <div class="d-flex gap-2">
            <button type="button" class="role-btn active" id="roleStudent" onclick="selectRole('student')">
              <i class="bi bi-person-fill"></i><span>Студент</span>
            </button>
            <button type="button" class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
              <i class="bi bi-person-workspace"></i><span>Преподаватель</span>
            </button>
          </div>
        </div>
        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label">Имя</label>
            <input type="text" class="form-control" id="firstName" placeholder="Иван" />
          </div>
          <div class="col-6">
            <label class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="lastName" placeholder="Иванов" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="you@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-control" placeholder="Минимум 8 символов" />
        </div>
        <div class="mb-4">
          <label class="form-label">Повторите пароль</label>
          <input type="password" class="form-control" placeholder="••••••••" />
        </div>
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="terms" />
          <label class="form-check-label text-muted small" for="terms">
            Я принимаю <a href="#" class="text-primary text-decoration-none">условия использования</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Зарегистрироваться</button>
        <p class="text-center text-muted small">Уже есть аккаунт? <a href="login.html" class="text-primary text-decoration-none">Войти</a></p>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentRole = 'student';
    function selectRole(role) {
      currentRole = role;
      document.getElementById('roleStudent').classList.toggle('active', role === 'student');
      document.getElementById('roleTeacher').classList.toggle('active', role === 'teacher');
    }
    function handleRegister(e) {
      e.preventDefault();
      
      // 1. Проверяем, приняты ли условия
      const termsAccepted = document.getElementById('terms').checked;
      
      if (!termsAccepted) {
        alert('Для регистрации необходимо принять условия использования.');
        return;
      }
      
      // 2. Если условия приняты — продолжаем регистрацию
      const first = document.getElementById('firstName').value.trim() || 'Пользователь';
      const last  = document.getElementById('lastName').value.trim();
      
      sessionStorage.setItem('role', currentRole);
      sessionStorage.setItem('firstName', first);
      sessionStorage.setItem('lastName', last);

      window.location.href = currentRole === 'teacher' 
        ? 'dashboard-teacher.html' 
        : 'dashboard-user.html';
    }
  </script>
</body>
</html>
