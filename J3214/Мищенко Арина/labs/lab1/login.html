<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .role-btn {
      flex: 1;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 14px 10px;
      background: #fff;
      cursor: pointer;
      transition: all .2s;
      text-align: center;
      color: #64748b;
    }
    .role-btn:hover { border-color: #93c5fd; }
    .role-btn.active {
      border-color: #0d6efd;
      background: #eff6ff;
      color: #0d6efd;
    }
    .role-btn i { display: block; font-size: 1.6rem; margin-bottom: 6px; }
    .role-btn span { font-size: .85rem; font-weight: 600; }
  </style>
</head>
<body class="auth-page">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
    </div>
  </nav>

  <main class="container d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
    <div class="card shadow-sm border-0 p-4" style="width: 100%; max-width: 420px;">
      <h2 class="mb-1 fw-bold">Добро пожаловать</h2>
      <p class="text-muted mb-4">Войдите в свой аккаунт</p>

      <!-- Выбор роли -->
      <div class="mb-4">
        <label class="form-label">Войти как</label>
        <div class="d-flex gap-2">
          <button type="button" class="role-btn active" id="roleStudent" onclick="selectRole('student')">
            <i class="bi bi-person-fill"></i>
            <span>Студент</span>
          </button>
          <button type="button" class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
            <i class="bi bi-person-workspace"></i>
            <span>Преподаватель</span>
          </button>
        </div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="emailInput" placeholder="you@example.com" />
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-control" placeholder="••••••••" />
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" />
            <label class="form-check-label text-muted small" for="remember">Запомнить меня</label>
          </div>
          <a href="#" class="small text-primary text-decoration-none">Забыли пароль?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
        <p class="text-center text-muted small">Нет аккаунта? <a href="register.html" class="text-primary text-decoration-none">Зарегистрироваться</a></p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let currentRole = 'student';

    function selectRole(role) {
      currentRole = role;
      document.getElementById('roleStudent').classList.toggle('active', role === 'student');
      document.getElementById('roleTeacher').classList.toggle('active', role === 'teacher');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value.trim();
      // Используем часть email до @ как имя
      const name = email ? email.split('@')[0] : 'Пользователь';
      sessionStorage.setItem('role', currentRole);
      sessionStorage.setItem('firstName', name);
      sessionStorage.setItem('lastName', "");
      window.location.href = currentRole === 'teacher'
        ? 'dashboard-teacher.html'
        : 'dashboard-user.html';
    }
  </script>
</body>
</html>
