<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Личный кабинет — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="search.html">Каталог курсов</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span class="text-muted small" id="navName"></span>
          <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Выйти</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row mb-4">
      <div class="col">
        <h4 class="fw-bold mb-0" id="greeting"></h4>
        <p class="text-muted">Продолжайте обучение там, где остановились</p>
      </div>
    </div>

    <ul class="nav nav-tabs mb-4">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-courses">Мои курсы</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-certs">Сертификаты</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-profile">Профиль</button></li>
    </ul>

    <div class="tab-content">

      <!-- Мои курсы -->
      <div class="tab-pane fade show active" id="tab-courses">
        <div id="coursesLoader" class="text-center py-4">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-2">Загрузка курсов...</p>
        </div>
        <div class="row g-3" id="coursesList"></div>
        <div id="noCoursesMsg" class="d-none text-center py-4">
          <p class="text-muted">Вы ещё не записаны ни на один курс.</p>
          <a href="search.html" class="btn btn-primary btn-sm">Найти курс</a>
        </div>
      </div>

      <!-- Сертификаты -->
      <div class="tab-pane fade" id="tab-certs">
        <div class="row g-3" id="certsList"></div>
        <p class="text-muted text-center py-3" id="noCertsMsg">Завершите курсы, чтобы получить сертификаты</p>
      </div>

      <!-- Профиль -->
      <div class="tab-pane fade" id="tab-profile">
        <div class="row justify-content-center">
          <div class="col-12 col-md-6">
            <div class="card border-0 shadow-sm p-4">
              <div class="text-center mb-4">
                <div class="bg-primary rounded-circle d-inline-flex align-items-center justify-content-center text-white mb-3"
                     style="width:80px;height:80px;font-size:2rem;" id="avatarLetter"></div>
                <h5 class="fw-bold mb-0" id="profileName"></h5>
                <p class="text-muted small">Студент</p>
              </div>
              <form class="d-flex flex-column gap-3">
                <div>
                  <label class="form-label">Имя</label>
                  <input type="text" class="form-control" id="profileFirst" />
                </div>
                <div>
                  <label class="form-label">Фамилия</label>
                  <input type="text" class="form-control" id="profileLast" />
                </div>
                <div class="alert alert-success d-none" id="saveSuccess">Изменения сохранены!</div>
                <button type="button" class="btn btn-primary w-100" onclick="saveProfile()">Сохранить изменения</button>
                <hr class="my-2" />
                <button type="button" class="btn btn-outline-danger w-100" onclick="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Выйти из аккаунта
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка сертификата -->
  <div class="modal fade" id="certModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Сертификат</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center p-5 bg-light rounded">
          <i class="bi bi-award text-warning" style="font-size:4rem;"></i>
          <h4 class="fw-bold mt-3" id="certCourseTitle"></h4>
          <p class="text-muted">Настоящим подтверждается, что</p>
          <h5 class="fw-bold" id="certUserName"></h5>
          <p class="text-muted">успешно завершил курс</p>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-primary w-100"><i class="bi bi-download me-2"></i>Скачать PDF</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://localhost:3000';

    // Проверяем авторизацию (без return на верхнем уровне — иначе скрипт не выполняется)
    const role = sessionStorage.getItem('role');
    if (!role) {
      window.location.href = 'login.html';
    } else if (role === 'teacher') {
      window.location.href = 'dashboard-teacher.html';
    } else {
      initDashboard();
    }

    function initDashboard() {
    const userId    = sessionStorage.getItem('userId');
    const firstName = sessionStorage.getItem('firstName') || '';
    const lastName  = sessionStorage.getItem('lastName')  || '';
    const fullName  = `${firstName} ${lastName}`.trim();

    // Заполняем имя на странице
    function applyName(first, last) {
      const name = `${first} ${last}`.trim();
      document.getElementById('navName').textContent      = name;
      document.getElementById('greeting').textContent     = `Добрый день, ${first} 👋`;
      document.getElementById('avatarLetter').textContent = first.charAt(0).toUpperCase();
      document.getElementById('profileName').textContent  = name;
      document.getElementById('profileFirst').value = first;
      document.getElementById('profileLast').value  = last;
      document.getElementById('certUserName').textContent = name;
    }

    applyName(firstName, lastName);

    // Загружаем записи студента и данные курсов
    async function loadEnrollments() {
      try {
        // Загружаем все записи и фильтруем на клиенте через ==
        // json-server v1 строго сравнивает типы: строка "1" != число 1
        // Оператор == решает эту проблему без изменения сервера
        const enrollRes = await fetch(`${API}/enrollments`);
        if (!enrollRes.ok) throw new Error('Не удалось загрузить записи');
        const allEnrollments = await enrollRes.json();
        if (!Array.isArray(allEnrollments)) throw new Error('Некорректный ответ сервера');
        // String() гарантирует совпадение вне зависимости от того,
        // хранится ли userId как число или строка
        const enrollments = allEnrollments.filter(
          e => String(e.userId) === String(userId)
        );
        console.log('userId из сессии:', userId);
        console.log('Все enrollments:', allEnrollments);
        console.log('Найденные enrollments пользователя:', enrollments);

        document.getElementById('coursesLoader').classList.add('d-none');

        if (enrollments.length === 0) {
          document.getElementById('noCoursesMsg').classList.remove('d-none');
          return;
        }

        // 2. Для каждой записи загружаем данные курса
        const coursePromises = enrollments.map(e =>
          fetch(`${API}/courses/${e.courseId}`).then(async r => {
            if (!r.ok) throw new Error(`Курс ${e.courseId} не найден`);
            return r.json();
          })
        );
        const courses = await Promise.all(coursePromises);

        // 3. Отображаем курсы
        renderCourses(enrollments, courses);
        renderCerts(enrollments, courses);

      } catch (error) {
        console.error('Ошибка:', error);
        const loader = document.getElementById('coursesLoader');
        loader.classList.remove('d-none');
        loader.innerHTML =
          '<p class="text-danger">Не удалось загрузить данные. Запущен ли json-server?</p>';
      }
    }

    function renderCourses(enrollments, courses) {
      const list = document.getElementById('coursesList');

      const statusMap = {
        active:    { label: 'В процессе', cls: 'bg-success-subtle text-success' },
        completed: { label: 'Завершён',   cls: 'bg-primary-subtle text-primary'  },
      };

      list.innerHTML = enrollments.map((enroll, i) => {
        const course = courses[i];
        const status = statusMap[enroll.status] || statusMap.active;
        const btnText = enroll.status === 'completed' ? 'Повторить' : 'Продолжить';

        return `
          <div class="col-12 col-md-6 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
              <div class="card-img-top bg-${course.color} d-flex align-items-center justify-content-center" style="height:120px;">
                <i class="bi ${course.icon} text-white" style="font-size:2.5rem;"></i>
              </div>
              <div class="card-body">
                <span class="badge ${status.cls} mb-2">${status.label}</span>
                <h6 class="fw-bold">${course.title}</h6>
                <p class="text-muted small">Преподаватель: ${course.teacher}</p>
                <div class="mb-2">
                  <div class="d-flex justify-content-between small text-muted mb-1">
                    <span>Прогресс</span><span>${enroll.progress}%</span>
                  </div>
                  <div class="progress" style="height:6px;">
                    <div class="progress-bar" style="width:${enroll.progress}%;"></div>
                  </div>
                </div>
                <a href="course.html?id=${course.id}" class="btn btn-primary btn-sm w-100 mt-2">${btnText}</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderCerts(enrollments, courses) {
      const completed = enrollments.filter(e => e.status === 'completed');

      if (completed.length === 0) return;

      document.getElementById('noCertsMsg').classList.add('d-none');

      document.getElementById('certsList').innerHTML = completed.map((enroll, i) => {
        const course = courses[enrollments.indexOf(enroll)];
        return `
          <div class="col-12 col-md-6">
            <div class="card border-0 shadow-sm">
              <div class="card-body d-flex align-items-center gap-3">
                <div class="bg-warning-subtle rounded p-3">
                  <i class="bi bi-award text-warning" style="font-size:2rem;"></i>
                </div>
                <div class="flex-grow-1">
                  <h6 class="fw-bold mb-0">${course.title}</h6>
                  <span class="badge bg-success-subtle text-success mt-1">Действителен</span>
                </div>
                <button class="btn btn-outline-primary btn-sm" onclick="showCert('${course.title}')">
                  <i class="bi bi-download"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showCert(courseTitle) {
      document.getElementById('certCourseTitle').textContent = courseTitle;
      new bootstrap.Modal(document.getElementById('certModal')).show();
    }

    // Сохранение профиля — обновляем пользователя через PATCH
    async function saveProfile() {
      const newFirst = document.getElementById('profileFirst').value.trim() || firstName;
      const newLast  = document.getElementById('profileLast').value.trim();

      try {
        await fetch(`${API}/users/${userId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ firstName: newFirst, lastName: newLast })
        });

        sessionStorage.setItem('firstName', newFirst);
        sessionStorage.setItem('lastName', newLast);
        applyName(newFirst, newLast);

        const msg = document.getElementById('saveSuccess');
        msg.classList.remove('d-none');
        setTimeout(() => msg.classList.add('d-none'), 2000);

      } catch (error) {
        console.error('Ошибка сохранения:', error);
      }
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = 'index.html';
    }

    loadEnrollments();
    }
  </script>
</body>
</html>
