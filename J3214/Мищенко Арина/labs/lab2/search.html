<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Поиск курсов — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="search.html">Каталог курсов</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <a href="dashboard-user.html" class="btn btn-outline-primary btn-sm">Личный кабинет</a>
          <a href="login.html" class="btn btn-outline-secondary btn-sm" onclick="logout()">Выйти</a>
        </div>
      </div>
    </div>
  </nav>

  <div class="bg-primary py-4">
    <div class="container">
      <h4 class="text-white fw-bold mb-3">Найдите свой курс</h4>
      <div class="input-group input-group-lg">
        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
        <input type="text" class="form-control border-0" id="searchInput" placeholder="Например: Python, дизайн..." />
        <button class="btn btn-warning fw-semibold" onclick="applyFilters()">Найти</button>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div class="row g-4">

      <!-- Фильтры -->
      <div class="col-12 col-md-3">
        <div class="card border-0 shadow-sm p-3">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-bold mb-0">Фильтры</h6>
            <button class="btn btn-link btn-sm p-0 text-muted text-decoration-none" onclick="resetFilters()">Сбросить</button>
          </div>

          <p class="text-muted small mb-2 fw-semibold">ПРЕДМЕТ</p>
          <div class="mb-3">
            <div class="form-check"><input class="form-check-input filter-check" type="checkbox" value="Разработка" /><label class="form-check-label small">Разработка</label></div>
            <div class="form-check"><input class="form-check-input filter-check" type="checkbox" value="Дизайн" /><label class="form-check-label small">Дизайн</label></div>
            <div class="form-check"><input class="form-check-input filter-check" type="checkbox" value="Данные" /><label class="form-check-label small">Данные и аналитика</label></div>
            <div class="form-check"><input class="form-check-input filter-check" type="checkbox" value="Бизнес" /><label class="form-check-label small">Бизнес</label></div>
          </div>
          <hr />
          <p class="text-muted small mb-2 fw-semibold">УРОВЕНЬ</p>
          <div class="mb-3">
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="level" value="" checked /><label class="form-check-label small">Все уровни</label></div>
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="level" value="Начинающий" /><label class="form-check-label small">Начинающий</label></div>
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="level" value="Средний" /><label class="form-check-label small">Средний</label></div>
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="level" value="Продвинутый" /><label class="form-check-label small">Продвинутый</label></div>
          </div>
          <hr />
          <p class="text-muted small mb-2 fw-semibold">ЦЕНА</p>
          <div class="mb-3">
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="price" value="" checked /><label class="form-check-label small">Любая</label></div>
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="price" value="free" /><label class="form-check-label small">Бесплатные</label></div>
            <div class="form-check"><input class="form-check-input filter-radio" type="radio" name="price" value="paid" /><label class="form-check-label small">Платные</label></div>
          </div>
          <button class="btn btn-primary w-100 btn-sm" onclick="applyFilters()">Применить</button>
        </div>
      </div>

      <!-- Список курсов -->
      <div class="col-12 col-md-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <p class="text-muted mb-0 small" id="resultsCount">Загрузка...</p>
        </div>

        <!-- Спиннер загрузки -->
        <div id="loader" class="text-center py-5">
          <div class="spinner-border text-primary" role="status"></div>
          <p class="text-muted mt-3">Загружаем курсы...</p>
        </div>

        <div class="row g-3" id="courseList"></div>

        <div id="emptyState" class="text-center py-5 d-none">
          <i class="bi bi-search text-muted" style="font-size:3rem;"></i>
          <p class="text-muted mt-3">Курсы не найдены. Попробуйте изменить фильтры.</p>
          <button class="btn btn-outline-primary btn-sm" onclick="resetFilters()">Сбросить фильтры</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://localhost:3000';

    // Все курсы храним после загрузки, чтобы фильтровать без повторных запросов
    let allCourses = [];

    // Загружаем курсы при открытии страницы
    async function loadCourses() {
      try {
        const response = await fetch(`${API}/courses`);
        const allData = await response.json();
        // Показываем только опубликованные курсы
        allCourses = allData.filter(c => c.status === 'published' || !c.status);

        document.getElementById('loader').classList.add('d-none');
        renderCourses(allCourses);
      } catch (error) {
        console.error('Ошибка загрузки курсов:', error);
        document.getElementById('loader').innerHTML =
          '<p class="text-danger">Не удалось загрузить курсы. Запущен ли json-server?</p>';
      }
    }

    // Создаём HTML-карточку для одного курса
    function createCourseCard(course) {
      const priceText = course.price === 0
        ? '<span class="fw-bold text-success">Бесплатно</span>'
        : `<span class="fw-bold">${course.price.toLocaleString('ru')} ₽</span>`;

      return `
        <div class="col-12 col-sm-6 col-xl-4">
          <div class="card border-0 shadow-sm h-100">
            <div class="card-img-top bg-${course.color} d-flex align-items-center justify-content-center" style="height:100px;">
              <i class="bi ${course.icon} text-white" style="font-size:2rem;"></i>
            </div>
            <div class="card-body">
              <span class="badge bg-secondary-subtle text-secondary mb-2">${course.level}</span>
              <h6 class="fw-bold">${course.title}</h6>
              <p class="text-muted small mb-2">${course.teacher} · ${course.lessons} уроков · ${course.hours} ч.</p>
              <div class="d-flex align-items-center gap-1 mb-3">
                <i class="bi bi-star-fill text-warning small"></i>
                <span class="small fw-semibold">${course.rating}</span>
                <span class="text-muted small">(${course.reviews})</span>
              </div>
              <div class="d-flex justify-content-between align-items-center">
                ${priceText}
                <a href="course.html?id=${course.id}" class="btn btn-outline-primary btn-sm">Подробнее</a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Выводим массив курсов на страницу
    function renderCourses(courses) {
      const list = document.getElementById('courseList');
      const empty = document.getElementById('emptyState');

      if (courses.length === 0) {
        list.innerHTML = '';
        empty.classList.remove('d-none');
      } else {
        empty.classList.add('d-none');
        list.innerHTML = courses.map(createCourseCard).join('');
      }

      document.getElementById('resultsCount').textContent = `Найдено: ${courses.length} курсов`;
    }

    // Фильтруем уже загруженный массив allCourses
    function applyFilters() {
      const query      = document.getElementById('searchInput').value.toLowerCase();
      const checkedCats = [...document.querySelectorAll('.filter-check:checked')].map(c => c.value);
      const level      = document.querySelector('.filter-radio[name="level"]:checked').value;
      const price      = document.querySelector('.filter-radio[name="price"]:checked').value;

      const filtered = allCourses.filter(course => {
        const matchCat   = checkedCats.length === 0 || checkedCats.includes(course.category);
        const matchLevel = !level || course.level === level;
        const matchPrice = !price
          || (price === 'free' && course.price === 0)
          || (price === 'paid' && course.price > 0);
        const matchQuery = !query || course.title.toLowerCase().includes(query);
        return matchCat && matchLevel && matchPrice && matchQuery;
      });

      renderCourses(filtered);
    }

    function resetFilters() {
      document.getElementById('searchInput').value = '';
      document.querySelectorAll('.filter-check').forEach(c => c.checked = false);
      document.querySelectorAll('.filter-radio[name="level"]')[0].checked = true;
      document.querySelectorAll('.filter-radio[name="price"]')[0].checked = true;
      renderCourses(allCourses);
    }

    function logout() {
      sessionStorage.clear();
    }

    // Вешаем обработчики на фильтры
    document.querySelectorAll('.filter-check, .filter-radio').forEach(el => {
      el.addEventListener('change', applyFilters);
    });

    // Запускаем загрузку курсов
    loadCourses();
  </script>
</body>
</html>
