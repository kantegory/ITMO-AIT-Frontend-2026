<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Курс — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
      <div class="d-flex gap-2">
        <a href="search.html" class="btn btn-outline-secondary btn-sm">Каталог</a>
        <a href="dashboard-user.html" class="btn btn-outline-primary btn-sm">Мой кабинет</a>
      </div>
    </div>
  </nav>

  <!-- Шапка курса -->
  <div id="courseHeader" class="bg-primary text-white py-4">
    <div class="container">
      <div class="spinner-border text-white" role="status"></div>
    </div>
  </div>

  <div class="container py-4">
    <div class="row g-4">

      <!-- Основной контент -->
      <div class="col-12 col-lg-8">
        <ul class="nav nav-tabs mb-4">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-content">Содержание</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-materials">Материалы</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-discuss">Обсуждения</button></li>
        </ul>

        <div class="tab-content">

          <!-- Содержание -->
          <div class="tab-pane fade show active" id="tab-content">
            <!-- Видеоплеер -->
            <div class="bg-dark rounded d-flex align-items-center justify-content-center mb-4"
                 style="height:280px; cursor:pointer;" onclick="togglePlay()">
              <div class="text-center text-white" id="playerOverlay">
                <i class="bi bi-play-circle-fill" style="font-size:4rem; opacity:0.9;"></i>
                <p class="mt-2 mb-0" id="lessonTitle">Урок 1: Введение</p>
              </div>
            </div>

            <!-- Программа курса — заполняется JS -->
            <h5 class="fw-bold mb-3">Программа курса</h5>
            <div id="programLoader" class="text-center py-3">
              <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            </div>
            <div id="programContent"></div>
          </div>

          <!-- Материалы -->
          <div class="tab-pane fade" id="tab-materials">
            <h5 class="fw-bold mb-3">Материалы курса</h5>
            <div id="materialsContent">
              <div class="text-center py-3">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
              </div>
            </div>
          </div>

          <!-- Обсуждения -->
          <div class="tab-pane fade" id="tab-discuss">
            <h5 class="fw-bold mb-3">Обсуждения</h5>
            <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#newPostModal">
              <i class="bi bi-plus me-1"></i>Новая тема
            </button>
            <div id="discussionsList">
              <div class="text-center py-3">
                <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- Сайдбар -->
      <div class="col-12 col-lg-4">
        <div class="card border-0 shadow-sm sticky-top" style="top:80px;" id="courseSidebar">
          <div class="card-body text-center">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Модалка: запись -->
  <div class="modal fade" id="enrollModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Запись на курс</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center py-4" id="enrollModalBody"></div>
        <div class="modal-footer border-0">
          <a href="dashboard-user.html" class="btn btn-primary w-100">Перейти в личный кабинет</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка: задание -->
  <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold" id="taskModalTitle"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="bg-light rounded p-3 mb-3">
            <p class="mb-0" id="taskModalDesc"></p>
          </div>
          <div id="taskAnswerBlock">
            <label class="form-label fw-semibold">Ваш ответ</label>
            <textarea class="form-control mb-3" id="taskAnswer" rows="4"
                      placeholder="Напишите ответ или опишите решение..."></textarea>
            <label class="form-label fw-semibold">Или прикрепите файл</label>
            <input type="file" class="form-control mb-3" id="taskFile" />
          </div>
          <!-- Показывается если задание уже сдано -->
          <div id="taskDoneBlock" class="d-none text-center py-3">
            <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
            <p class="fw-semibold mt-2 mb-0">Задание выполнено!</p>
          </div>
        </div>
        <div class="modal-footer border-0" id="taskModalFooter">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
          <button class="btn btn-primary" id="submitTaskBtn">Отправить решение</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модалка: новая тема -->
  <div class="modal fade" id="newPostModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0">
        <div class="modal-header border-0">
          <h5 class="modal-title fw-bold">Новая тема</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Заголовок</label>
            <input type="text" class="form-control" id="postTitle" placeholder="Вопрос или тема..." />
          </div>
          <div class="mb-3">
            <label class="form-label">Сообщение</label>
            <textarea class="form-control" rows="4" id="postMessage"></textarea>
          </div>
          <div class="alert alert-danger d-none" id="postError">Заполните все поля.</div>
        </div>
        <div class="modal-footer border-0">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
          <button class="btn btn-primary" onclick="submitPost()">Опубликовать</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://localhost:3000';
    const userId   = sessionStorage.getItem('userId');
    const params   = new URLSearchParams(window.location.search);
    const courseId = params.get('id') || '1';

    let currentCourse     = null;
    let currentEnrollment = null;
    let allTasks          = [];
    let taskStateMap      = {}; // taskId → { ctId, reviewed, result, answer }

    // ── Загрузка курса ──────────────────────────────────────────────
    async function loadCourse() {
      try {
        const courseRes = await fetch(`${API}/courses/${courseId}`);
        currentCourse = await courseRes.json();

        // Проверяем запись пользователя
        if (userId) {
          const enrollRes = await fetch(`${API}/enrollments`);
          const allEnrollments = await enrollRes.json();
          currentEnrollment = allEnrollments.find(
            e => String(e.userId) === String(userId) && String(e.courseId) === String(courseId)
          ) || null;
        }

        renderCourseHeader(currentCourse);
        renderSidebar(currentCourse, !!currentEnrollment);
        document.title = `${currentCourse.title} — EduPlatform`;

        // Загружаем программу и материалы параллельно
        loadProgram();
        renderMaterials(currentCourse);
        loadDiscussions();

      } catch (error) {
        console.error('Ошибка загрузки курса:', error);
        document.getElementById('courseHeader').innerHTML =
          '<div class="container"><p class="text-white">Не удалось загрузить курс.</p></div>';
      }
    }

    // ── Шапка и сайдбар ────────────────────────────────────────────
    function renderCourseHeader(course) {
      const priceText = course.price === 0 ? 'Бесплатно' : `${Number(course.price).toLocaleString('ru')} ₽`;
      document.getElementById('courseHeader').innerHTML = `
        <div class="container">
          <nav aria-label="breadcrumb" class="mb-2">
            <ol class="breadcrumb mb-0">
              <li class="breadcrumb-item"><a href="search.html" class="text-white-50 text-decoration-none">Каталог</a></li>
              <li class="breadcrumb-item active text-white">${course.title}</li>
            </ol>
          </nav>
          <h3 class="fw-bold mb-2">${course.title}</h3>
          <p class="mb-3" style="color:rgba(255,255,255,.8);">${course.description}</p>
          <div class="d-flex flex-wrap gap-3 align-items-center">
            <span><i class="bi bi-star-fill text-warning me-1"></i>
              <strong>${course.rating}</strong>
              <span class="text-white-50 small">(${course.reviews} отзывов)</span></span>
            <span class="text-white-50">·</span>
            <span class="small"><i class="bi bi-play-circle me-1"></i>${course.lessons} уроков · ${course.hours} ч.</span>
            <span class="badge bg-secondary">${course.level}</span>
            <span class="badge bg-warning text-dark">${priceText}</span>
          </div>
          <p class="mt-2 mb-0 small text-white-50">Преподаватель: ${course.teacher}</p>
        </div>
      `;
      document.getElementById('lessonTitle').textContent = `Урок 1: ${course.title} — введение`;
    }

    function renderSidebar(course, enrolled) {
      const priceText = course.price === 0
        ? '<span class="fw-bold fs-4 text-success">Бесплатно</span>'
        : `<span class="fw-bold fs-4">${Number(course.price).toLocaleString('ru')} ₽</span>`;

      const enrollBtn = enrolled
        ? `<button class="btn btn-success btn-lg w-100 mb-3" disabled>
             <i class="bi bi-check-circle me-2"></i>Вы записаны
           </button>`
        : `<button class="btn btn-primary btn-lg w-100 mb-3" onclick="enroll()">
             Записаться на курс
           </button>`;

      document.getElementById('courseSidebar').innerHTML = `
        <div class="card-body">
          <div class="text-center mb-3">${priceText}</div>
          ${enrollBtn}
          <ul class="list-unstyled small text-muted">
            <li class="mb-2"><i class="bi bi-play-circle me-2 text-primary"></i>${course.lessons} видеоуроков</li>
            <li class="mb-2"><i class="bi bi-clock me-2 text-primary"></i>${course.hours} часов контента</li>
            <li class="mb-2"><i class="bi bi-infinity me-2 text-primary"></i>Бессрочный доступ</li>
            <li class="mb-2"><i class="bi bi-award me-2 text-primary"></i>Сертификат по завершении</li>
          </ul>
        </div>
      `;
    }

    // ── Программа курса ─────────────────────────────────────────────
    async function loadProgram() {
      try {
        // Загружаем задания курса
        const tasksRes = await fetch(`${API}/tasks`);
        const allTasksData = await tasksRes.json();
        allTasks = allTasksData.filter(t => String(t.courseId) === String(courseId));

        // Загружаем выполненные задания пользователя
        if (userId) {
          const doneRes = await fetch(`${API}/completedTasks`);
          const allDone = await doneRes.json();
          // Строим карту taskId → {ctId, reviewed, result, answer}
          taskStateMap = {};
          allDone
            .filter(d => String(d.userId) === String(userId) && String(d.courseId) === String(courseId))
            .forEach(d => {
              taskStateMap[d.taskId] = { ctId: d.id, reviewed: d.reviewed, result: d.result, answer: d.answer };
            });
        }

        document.getElementById('programLoader').classList.add('d-none');
        renderProgram();

      } catch (error) {
        console.error('Ошибка загрузки программы:', error);
        document.getElementById('programLoader').innerHTML =
          '<p class="text-danger small">Не удалось загрузить программу.</p>';
      }
    }

    function renderProgram() {
      const container = document.getElementById('programContent');

      if (!currentEnrollment) {
        container.innerHTML = `
          <div class="alert alert-info">
            <i class="bi bi-lock me-2"></i>
            Запишитесь на курс, чтобы получить доступ к программе и заданиям.
          </div>`;
        return;
      }

      if (allTasks.length === 0) {
        container.innerHTML = '<p class="text-muted">Задания для курса ещё не добавлены.</p>';
        return;
      }

      const total        = allTasks.length;
      const acceptedCount = Object.values(taskStateMap).filter(s => s.result === 'accepted').length;
      const pendingCount  = Object.values(taskStateMap).filter(s => !s.reviewed).length;
      const pct           = Math.round((acceptedCount / total) * 100);

      const progressBlock = `
        <div class="mb-4">
          <div class="d-flex justify-content-between small text-muted mb-1">
            <span>Принято преподавателем: ${acceptedCount} из ${total}</span>
            <span>${pct}%</span>
          </div>
          <div class="progress mb-1" style="height:8px;">
            <div class="progress-bar bg-success" style="width:${pct}%;"></div>
          </div>
          ${pendingCount > 0 ? `<p class="text-muted small mb-0"><i class="bi bi-clock me-1"></i>На проверке: ${pendingCount}</p>` : ''}
        </div>`;

      // Группируем по урокам
      const byLesson = {};
      allTasks.forEach(t => {
        if (!byLesson[t.lesson]) byLesson[t.lesson] = [];
        byLesson[t.lesson].push(t);
      });

      const accordion = Object.entries(byLesson).map(([lesson, tasks], i) => {
        const lessonAllAccepted = tasks.every(t => taskStateMap[t.id]?.result === 'accepted');

        const taskItems = tasks.map(task => {
          const state = taskStateMap[task.id];

          let icon, labelClass, btnHtml;

          if (!state) {
            // Не сдано
            icon       = 'bi-circle text-muted';
            labelClass = '';
            btnHtml    = `<button class="btn btn-outline-primary btn-sm" onclick="openTask('${task.id}')">Открыть</button>`;
          } else if (!state.reviewed) {
            // Отправлено, ждёт проверки
            icon       = 'bi-clock-history text-warning';
            labelClass = 'text-muted';
            btnHtml    = `<span class="badge bg-warning-subtle text-warning">На проверке</span>`;
          } else if (state.result === 'accepted') {
            // Принято
            icon       = 'bi-check-circle-fill text-success';
            labelClass = 'text-muted';
            btnHtml    = `<button class="btn btn-outline-secondary btn-sm" onclick="openTask('${task.id}')">Просмотр</button>`;
          } else {
            // На доработку
            icon       = 'bi-x-circle-fill text-danger';
            labelClass = '';
            btnHtml    = `<button class="btn btn-outline-danger btn-sm" onclick="openTask('${task.id}')">Переотправить</button>`;
          }

          return `
            <li class="list-group-item d-flex align-items-center gap-3 px-0">
              <i class="bi ${icon}"></i>
              <span class="flex-grow-1 small ${labelClass}">${task.title}</span>
              ${btnHtml}
            </li>`;
        }).join('');

        return `
          <div class="accordion-item border-0 shadow-sm mb-2 rounded">
            <h2 class="accordion-header">
              <button class="accordion-button ${i > 0 ? 'collapsed' : ''} rounded fw-semibold"
                      data-bs-toggle="collapse" data-bs-target="#lesson${i}">
                <i class="bi ${lessonAllAccepted ? 'bi-check-circle-fill text-success' : 'bi-circle text-muted'} me-2"></i>
                ${lesson}
              </button>
            </h2>
            <div id="lesson${i}" class="accordion-collapse collapse ${i === 0 ? 'show' : ''}">
              <div class="accordion-body pt-0">
                <ul class="list-group list-group-flush">${taskItems}</ul>
              </div>
            </div>
          </div>`;
      }).join('');

      container.innerHTML = progressBlock + `<div class="accordion">${accordion}</div>`;
    }

    // ── Открыть задание в модалке ────────────────────────────────────
    function openTask(taskId) {
      currentTaskId = taskId;
      const task  = allTasks.find(t => t.id === taskId);
      const state = taskStateMap[taskId];

      document.getElementById('taskModalTitle').textContent = task.title;
      document.getElementById('taskModalDesc').textContent  = task.description;
      document.getElementById('taskAnswer').value = '';
      document.getElementById('taskFile').value   = '';
      document.getElementById('taskAnswer').classList.remove('is-invalid');

      const answerBlock = document.getElementById('taskAnswerBlock');
      const doneBlock   = document.getElementById('taskDoneBlock');
      const submitBtn   = document.getElementById('submitTaskBtn');

      if (!state) {
        // Не сдано — показываем форму
        answerBlock.classList.remove('d-none');
        doneBlock.classList.add('d-none');
        submitBtn.classList.remove('d-none');
        submitBtn.textContent = 'Отправить решение';

      } else if (!state.reviewed) {
        // На проверке
        answerBlock.classList.add('d-none');
        doneBlock.classList.remove('d-none');
        doneBlock.innerHTML = `
          <div class="text-center py-3">
            <i class="bi bi-clock-history text-warning" style="font-size:2.5rem;"></i>
            <p class="fw-semibold mt-2 mb-1">Ответ отправлен, ожидает проверки</p>
            <p class="text-muted small mb-0">Ваш ответ: ${state.answer}</p>
          </div>`;
        submitBtn.classList.add('d-none');

      } else if (state.result === 'accepted') {
        // Принято
        answerBlock.classList.add('d-none');
        doneBlock.classList.remove('d-none');
        doneBlock.innerHTML = `
          <div class="text-center py-3">
            <i class="bi bi-check-circle-fill text-success" style="font-size:2.5rem;"></i>
            <p class="fw-semibold mt-2 mb-1 text-success">Задание принято преподавателем!</p>
            <p class="text-muted small mb-0">Ваш ответ: ${state.answer}</p>
          </div>`;
        submitBtn.classList.add('d-none');

      } else {
        // На доработку — показываем отклонение + форму пересдачи
        answerBlock.classList.remove('d-none');
        doneBlock.classList.remove('d-none');
        doneBlock.innerHTML = `
          <div class="alert alert-danger py-2 mb-3">
            <i class="bi bi-x-circle me-2"></i>
            <strong>Отправлено на доработку.</strong>
            Ваш предыдущий ответ: ${state.answer}
          </div>`;
        submitBtn.classList.remove('d-none');
        submitBtn.textContent = 'Отправить повторно';
      }

      new bootstrap.Modal(document.getElementById('taskModal')).show();
    }

    // ── Сдать задание ───────────────────────────────────────────────
    document.getElementById('submitTaskBtn').addEventListener('click', async () => {
      const answer = document.getElementById('taskAnswer').value.trim();
      const file   = document.getElementById('taskFile').files[0];

      if (!answer && !file) {
        document.getElementById('taskAnswer').classList.add('is-invalid');
        return;
      }
      document.getElementById('taskAnswer').classList.remove('is-invalid');

      try {
        const prevState = taskStateMap[currentTaskId];

        // Если была пересдача — удаляем старую запись
        if (prevState && prevState.ctId) {
          await fetch(`${API}/completedTasks/${prevState.ctId}`, { method: 'DELETE' });
        }

        // Создаём новую запись
        const postRes = await fetch(`${API}/completedTasks`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId:   String(userId),
            courseId: String(courseId),
            taskId:   currentTaskId,
            answer:   answer || '(файл)',
            reviewed: false,
            result:   null,
            createdAt: new Date().toISOString().slice(0, 10)
          })
        });
        const saved = await postRes.json();

        // Обновляем карту состояний (без обновления enrollment — это делает преподаватель)
        taskStateMap[currentTaskId] = { ctId: saved.id, reviewed: false, result: null, answer: answer || '(файл)' };

        bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
        renderProgram();

      } catch (error) {
        console.error('Ошибка отправки задания:', error);
      }
    });

    // ── Материалы ───────────────────────────────────────────────────
    function renderMaterials(course) {
      const container = document.getElementById('materialsContent');

      if (!currentEnrollment) {
        container.innerHTML = `
          <div class="alert alert-info">
            <i class="bi bi-lock me-2"></i>
            Запишитесь на курс, чтобы получить доступ к материалам.
          </div>`;
        return;
      }

      // Заглушка материалов — в ЛР2 можно было бы загрузить из API
      const materials = [
        { icon: 'bi-file-earmark-pdf text-danger', name: `Конспект: ${course.title}`, meta: 'PDF · 1.2 МБ' },
        { icon: 'bi-file-earmark-code text-primary', name: 'Примеры кода', meta: 'ZIP · 45 КБ' },
        { icon: 'bi-link-45deg text-success', name: 'Дополнительная литература', meta: 'Внешняя ссылка' },
      ];

      container.innerHTML = `
        <div class="list-group list-group-flush">
          ${materials.map(m => `
            <a href="#" class="list-group-item list-group-item-action d-flex align-items-center gap-3 px-0 border-bottom">
              <i class="bi ${m.icon}" style="font-size:1.5rem;"></i>
              <div>
                <p class="mb-0 small fw-semibold">${m.name}</p>
                <p class="mb-0 text-muted" style="font-size:.75rem;">${m.meta}</p>
              </div>
              <i class="bi bi-download ms-auto text-muted"></i>
            </a>`).join('')}
        </div>`;
    }

    // ── Обсуждения ──────────────────────────────────────────────────
    async function loadDiscussions() {
      try {
        const res = await fetch(`${API}/discussions`);
        const all = await res.json();
        const discussions = all.filter(d => String(d.courseId) === String(courseId));
        const container = document.getElementById('discussionsList');

        if (discussions.length === 0) {
          container.innerHTML = '<p class="text-muted small">Обсуждений пока нет. Будьте первым!</p>';
          return;
        }
        container.innerHTML = discussions.map(d => `
          <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
              <div class="d-flex gap-3">
                <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center text-white flex-shrink-0"
                     style="width:36px;height:36px;font-weight:700;">
                  ${d.authorName.charAt(0)}
                </div>
                <div>
                  <p class="mb-1 fw-semibold small">${d.authorName}
                    <span class="text-muted fw-normal">· ${d.createdAt}</span></p>
                  <p class="mb-1 fw-semibold small">${d.title}</p>
                  <p class="mb-0 small text-muted">${d.message}</p>
                </div>
              </div>
            </div>
          </div>`).join('');
      } catch (error) {
        document.getElementById('discussionsList').innerHTML =
          '<p class="text-danger small">Не удалось загрузить обсуждения.</p>';
      }
    }

    async function submitPost() {
      const title   = document.getElementById('postTitle').value.trim();
      const message = document.getElementById('postMessage').value.trim();
      const errorEl = document.getElementById('postError');

      if (!title || !message) { errorEl.classList.remove('d-none'); return; }
      errorEl.classList.add('d-none');

      const firstName  = sessionStorage.getItem('firstName') || 'Пользователь';
      const lastName   = sessionStorage.getItem('lastName')  || '';
      const authorName = `${firstName} ${lastName}`.trim();

      try {
        await fetch(`${API}/discussions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            courseId:   String(courseId),
            userId:     String(userId) || '0',
            authorName,
            title,
            message,
            createdAt: new Date().toISOString().slice(0, 10)
          })
        });
        bootstrap.Modal.getInstance(document.getElementById('newPostModal')).hide();
        document.getElementById('postTitle').value   = '';
        document.getElementById('postMessage').value = '';
        loadDiscussions();
      } catch (error) {
        console.error('Ошибка публикации:', error);
      }
    }

    // ── Запись на курс ──────────────────────────────────────────────
    async function enroll() {
      if (!userId) { window.location.href = 'login.html'; return; }

      try {
        const checkRes = await fetch(`${API}/enrollments`);
        const all = await checkRes.json();
        const already = all.find(
          e => String(e.userId) === String(userId) && String(e.courseId) === String(courseId)
        );

        if (already) {
          currentEnrollment = already;
          renderSidebar(currentCourse, true);
          return;
        }

        const postRes = await fetch(`${API}/enrollments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId:   String(userId),
            courseId: String(courseId),
            progress: 0,
            status:   'active'
          })
        });

        if (!postRes.ok) { console.error('Ошибка POST:', postRes.status); return; }
        currentEnrollment = await postRes.json();

        renderSidebar(currentCourse, true);
        renderProgram();
        renderMaterials(currentCourse);

        document.getElementById('enrollModalBody').innerHTML = `
          <i class="bi bi-check-circle-fill text-success" style="font-size:3rem;"></i>
          <h5 class="fw-bold mt-3">Вы записаны!</h5>
          <p class="text-muted">Курс «${currentCourse.title}» добавлен в личный кабинет</p>`;
        new bootstrap.Modal(document.getElementById('enrollModal')).show();

      } catch (error) {
        console.error('Ошибка записи:', error);
      }
    }

    // ── Утилиты ──────────────────────────────────────────────────────
    function togglePlay() {
      const icon = document.querySelector('#playerOverlay i');
      icon.className = icon.className.includes('play')
        ? 'bi bi-pause-circle-fill'
        : 'bi bi-play-circle-fill';
      icon.style.cssText = 'font-size:4rem; opacity:0.9;';
    }

    loadCourse();
  </script>
</body>
</html>
