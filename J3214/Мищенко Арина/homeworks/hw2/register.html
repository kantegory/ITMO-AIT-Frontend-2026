<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .role-btn { flex:1; border:2px solid #e2e8f0; border-radius:10px; padding:14px 10px; background:#fff; cursor:pointer; transition:all .2s; text-align:center; color:#64748b; }
    .role-btn:hover { border-color:#93c5fd; }
    .role-btn.active { border-color:#0d6efd; background:#eff6ff; color:#0d6efd; }
    .role-btn i { display:block; font-size:1.6rem; margin-bottom:6px; }
    .role-btn span { font-size:.85rem; font-weight:600; }
  </style>
</head>
<body class="auth-page">

  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
    </div>
  </nav>

  <div class="container d-flex justify-content-center align-items-center py-5" style="min-height:calc(100vh - 56px);">
    <div class="card shadow-sm border-0 p-4" style="width:100%;max-width:480px;">
      <h2 class="mb-1 fw-bold">Создать аккаунт</h2>
      <p class="text-muted mb-4">Заполните данные для регистрации</p>

      <form onsubmit="handleRegister(event)">
        <div class="mb-4">
          <label class="form-label">Я регистрируюсь как</label>
          <div class="d-flex gap-2">
            <button type="button" class="role-btn active" id="roleStudent" onclick="selectRole('student')">
              <i class="bi bi-person-fill"></i><span>Студент</span>
            </button>
            <button type="button" class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
              <i class="bi bi-person-workspace"></i><span>Преподаватель</span>
            </button>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-6">
            <label class="form-label">Имя</label>
            <input type="text" class="form-control" id="firstName" placeholder="Иван" required />
          </div>
          <div class="col-6">
            <label class="form-label">Фамилия</label>
            <input type="text" class="form-control" id="lastName" placeholder="Иванов" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="emailInput" placeholder="you@example.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-control" id="passwordInput" placeholder="Минимум 8 символов" required />
        </div>
        <div class="mb-4">
          <label class="form-label">Повторите пароль</label>
          <input type="password" class="form-control" id="passwordConfirm" placeholder="••••••••" required />
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="terms" />
          <label class="form-check-label text-muted small" for="terms">
            Я принимаю <a href="#" class="text-primary text-decoration-none">условия использования</a>
          </label>
        </div>

        <!-- Сообщения -->
        <div class="alert alert-danger d-none mb-3" id="errorMsg"></div>
        <div class="alert alert-success d-none mb-3" id="successMsg">Аккаунт создан! Перенаправляем...</div>

        <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">Зарегистрироваться</button>
        <p class="text-center text-muted small">Уже есть аккаунт? <a href="login.html" class="text-primary text-decoration-none">Войти</a></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://localhost:3000';
    let currentRole = 'student';

    function selectRole(role) {
      currentRole = role;
      document.getElementById('roleStudent').classList.toggle('active', role === 'student');
      document.getElementById('roleTeacher').classList.toggle('active', role === 'teacher');
    }

    async function handleRegister(e) {
      e.preventDefault();

      const firstName = document.getElementById('firstName').value.trim();
      const lastName  = document.getElementById('lastName').value.trim();
      const email     = document.getElementById('emailInput').value.trim();
      const password  = document.getElementById('passwordInput').value;
      const confirm   = document.getElementById('passwordConfirm').value;
      const terms     = document.getElementById('terms').checked;
      const errorMsg  = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errorMsg.classList.add('d-none');

      // Простые проверки
      if (!terms) {
        errorMsg.textContent = 'Необходимо принять условия использования.';
        errorMsg.classList.remove('d-none');
        return;
      }
      if (password !== confirm) {
        errorMsg.textContent = 'Пароли не совпадают.';
        errorMsg.classList.remove('d-none');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Регистрация...';

      try {
        // Проверяем, не занят ли email (ищем только по email, без encodeURIComponent)
        const checkRes = await fetch(`${API}/users?email=${email}`);
        const existing = await checkRes.json();

        if (existing.length > 0) {
          errorMsg.textContent = 'Пользователь с таким email уже существует.';
          errorMsg.classList.remove('d-none');
          return;
        }

        // Создаём нового пользователя
        const newUser = { firstName, lastName, email, password, role: currentRole };

        const createRes = await fetch(`${API}/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newUser)
        });
        const createdUser = await createRes.json();

        // Сохраняем в sessionStorage
        sessionStorage.setItem('role', createdUser.role);
        sessionStorage.setItem('userId', createdUser.id);
        sessionStorage.setItem('firstName', createdUser.firstName);
        sessionStorage.setItem('lastName', createdUser.lastName);

        document.getElementById('successMsg').classList.remove('d-none');

        setTimeout(() => {
          window.location.href = currentRole === 'teacher'
            ? 'dashboard-teacher.html'
            : 'dashboard-user.html';
        }, 1000);

      } catch (error) {
        console.error('Ошибка регистрации:', error);
        errorMsg.textContent = 'Не удалось подключиться к серверу.';
        errorMsg.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Зарегистрироваться';
      }
    }
  </script>
</body>
</html>
