<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вход — EduPlatform</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .role-btn { flex:1; border:2px solid var(--bs-border-color); border-radius:10px; padding:14px 10px; background:var(--bs-body-bg); cursor:pointer; transition:all .2s; text-align:center; color:var(--bs-secondary-color); }
    .role-btn:hover { border-color:#93c5fd; }
    .role-btn.active { border-color:#0d6efd; background:var(--bs-primary-bg-subtle); color:#0d6efd; }
    .role-btn i { display:block; font-size:1.6rem; margin-bottom:6px; }
    .role-btn span { font-size:.85rem; font-weight:600; }
  </style>
  <!-- Тема: скрипт в <head> предотвращает мигание при загрузке -->
  <script>
    (function () {
      var saved = localStorage.getItem('eduTheme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="light.css" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="dark.css"  media="(prefers-color-scheme: dark)"  />
  <link rel="stylesheet" href="light.css" />
  <link rel="stylesheet" href="dark.css"  />
</head>
<body class="auth-page">

  <nav class="navbar navbar-expand-lg bg-body border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="index.html">EduPlatform</a>
      <button id="themeToggle" class="btn btn-outline-secondary btn-sm ms-auto" onclick="toggleTheme()" aria-label="Переключить тему" title="Переключить тему"><i class="bi bi-moon" aria-hidden="true"></i></button>
    </div>
  </nav>

  <div class="container d-flex justify-content-center align-items-center" style="min-height:calc(100vh - 56px);">
    <div class="card shadow-sm border-0 p-4" style="width:100%;max-width:420px;">
      <h2 class="mb-1 fw-bold">Добро пожаловать</h2>
      <p class="text-muted mb-4">Войдите в свой аккаунт</p>

      <div class="mb-4">
        <label class="form-label">Войти как</label>
        <div class="d-flex gap-2">
          <button type="button" class="role-btn active" id="roleStudent" onclick="selectRole('student')">
            <i class="bi bi-person-fill"></i><span>Студент</span>
          </button>
          <button type="button" class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
            <i class="bi bi-person-workspace"></i><span>Преподаватель</span>
          </button>
        </div>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="emailInput" placeholder="you@example.com" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль</label>
          <input type="password" class="form-control" id="passwordInput" placeholder="••••••••" required />
        </div>

        <!-- Сообщение об ошибке -->
        <div class="alert alert-danger d-none mb-3" id="errorMsg">
          Неверный email или пароль
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" />
            <label class="form-check-label text-muted small" for="remember">Запомнить меня</label>
          </div>
          <a href="#" class="small text-primary text-decoration-none">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3" id="submitBtn">Войти</button>
        <p class="text-center text-muted small">Нет аккаунта? <a href="register.html" class="text-primary text-decoration-none">Зарегистрироваться</a></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API = 'http://localhost:3000';
    let currentRole = 'student';

    function selectRole(role) {
      currentRole = role;
      document.getElementById('roleStudent').classList.toggle('active', role === 'student');
      document.getElementById('roleTeacher').classList.toggle('active', role === 'teacher');
    }

    async function handleLogin(e) {
      e.preventDefault();

      const email    = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const errorMsg  = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Вход...';
      errorMsg.classList.add('d-none');

      try {
        // Ищем только по email — проверку пароля и роли делаем на клиенте,
        // чтобы не было проблем с кодированием символов в URL-параметрах
        const response = await fetch(`${API}/users?email=${email}`);
        const users = await response.json();

        const user = users.find(u => u.password === password && u.role === currentRole);

        if (!user) {
          errorMsg.classList.remove('d-none');
          return;
        }

        sessionStorage.setItem('role', user.role);
        sessionStorage.setItem('userId', user.id);
        sessionStorage.setItem('firstName', user.firstName);
        sessionStorage.setItem('lastName', user.lastName);

        window.location.href = user.role === 'teacher'
          ? 'dashboard-teacher.html'
          : 'dashboard-user.html';

      } catch (error) {
        console.error('Ошибка входа:', error);
        errorMsg.textContent = 'Не удалось подключиться к серверу. Проверьте, запущен ли json-server.';
        errorMsg.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Войти';
      }
    }
  </script>
  <script src="theme.js"></script>
</body>
</html>
