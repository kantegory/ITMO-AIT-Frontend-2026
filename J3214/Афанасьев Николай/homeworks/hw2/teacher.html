<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnFlow — Кабинет преподавателя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="main-wrapper">
  <nav class="sidebar" aria-label="Основная навигация">
    <div class="d-flex align-items-center gap-2 mb-4">
      <div style="width:36px;height:36px;background:#534AB7;border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;" role="img" aria-label="Логотип LearnFlow">LF</div>
      <span style="font-size:16px;font-weight:700;">LearnFlow</span>
    </div>
    <div class="nav-section" aria-hidden="true">Преподаватель</div>
    <a class="nav-item active" href="teacher.html" aria-current="page"><span aria-hidden="true">📚</span> Мои курсы</a>
    <a class="nav-item" href="#"><span aria-hidden="true">💬</span> Обсуждения</a>
    <a class="nav-item" href="#"><span aria-hidden="true">📊</span> Аналитика</a>
    <div class="nav-section" aria-hidden="true">Аккаунт</div>
    <a class="nav-item" href="dashboard.html"><span aria-hidden="true">🎓</span> Кабинет студента</a>
    <a class="nav-item" href="settings.html"><span aria-hidden="true">⚙️</span> Настройки</a>
    <div style="margin-top:auto;">
      <a class="nav-item" href="login.html" data-logout style="color:#E24B4A;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </a>
    </div>
  </nav>

  <main class="main-content" id="main-content">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 id="teacher-heading" style="font-size:24px;font-weight:700;color:#222;">Кабинет преподавателя</h1>
        <p style="font-size:14px;color:#888;margin:0;">Управление вашим образовательным контентом</p>
      </div>
      <button class="btn-purple" type="button" onclick="openModal()" aria-haspopup="dialog" aria-controls="createModal">+ Создать курс</button>
    </div>

    <section aria-label="Статистика преподавателя">
      <div class="d-flex gap-3 mb-5">
        <div class="stat-card">
          <dl>
            <dt style="font-size:12px;color:#888;">Активных студентов</dt>
            <dd class="stat-value">1 240</dd>
          </dl>
        </div>
        <div class="stat-card">
          <dl>
            <dt style="font-size:12px;color:#888;">Средний рейтинг</dt>
            <dd class="stat-value">4.9 ★</dd>
          </dl>
        </div>
        <div class="stat-card">
          <dl>
            <dt style="font-size:12px;color:#888;">Доход (мес)</dt>
            <dd class="stat-value">42 800 ₽</dd>
          </dl>
        </div>
      </div>
    </section>

    <section aria-label="Мои курсы">
      <div class="row g-3" id="courses-container" aria-live="polite"></div>
    </section>
  </main>
</div>

<div id="createModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-dialog-title">
  <div class="modal-box">
    <h2 id="modal-dialog-title" style="font-size:20px;font-weight:700;margin-bottom:20px;">Новый курс</h2>

    <label for="modal-title" style="font-size:13px;font-weight:600;margin-bottom:5px;display:block;">Название курса</label>
    <input type="text" id="modal-title" class="form-control-custom" placeholder="Например: JavaScript для начинающих">

    <label for="modal-subject" style="font-size:13px;font-weight:600;margin-bottom:5px;display:block;">Категория</label>
    <select id="modal-subject" class="form-control-custom">
      <option value="Программирование">Программирование</option>
      <option value="Дизайн">Дизайн</option>
      <option value="Математика">Математика</option>
      <option value="ML / AI">ML / AI</option>
      <option value="Базы данных">Базы данных</option>
    </select>

    <label for="modal-level" style="font-size:13px;font-weight:600;margin-bottom:5px;display:block;">Уровень сложности</label>
    <select id="modal-level" class="form-control-custom">
      <option value="Начинающий">Начинающий</option>
      <option value="Средний">Средний</option>
      <option value="Продвинутый">Продвинутый</option>
    </select>

    <div class="d-flex gap-2 mt-4">
      <button onclick="closeModal()" class="btn-action" style="flex:1; background:#eee; color:#333;" type="button">Отмена</button>
      <button onclick="saveNewCourse()" class="btn-purple" style="flex:2;" type="button">Создать курс</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
