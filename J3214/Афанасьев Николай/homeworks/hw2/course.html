<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnFlow — Страница курса</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

<div class="main-wrapper">
  <nav class="sidebar" aria-label="Основная навигация">
    <div class="d-flex align-items-center gap-2 mb-4">
      <svg width="36" height="36" viewBox="0 0 56 56" role="img" aria-label="Логотип LearnFlow">
        <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7F77DD"/><stop offset="100%" stop-color="#3C3489"/></linearGradient></defs>
        <rect width="56" height="56" rx="14" fill="url(#g1)"/>
        <text x="9" y="38" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white" letter-spacing="1">LF</text>
      </svg>
      <span style="font-size:16px;font-weight:500;">LearnFlow</span>
    </div>
    <div class="nav-section" aria-hidden="true">Главное</div>
    <a class="nav-item" href="dashboard.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Дашборд
    </a>
    <a class="nav-item active" href="courses.html" aria-current="page">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      Каталог курсов
    </a>
    <a class="nav-item" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Мой прогресс
    </a>
    <div class="nav-section" aria-hidden="true">Аккаунт</div>
    <a class="nav-item" href="settings.html">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Настройки
    </a>
    <div style="margin-top:auto;">
      <a class="nav-item" href="login.html" data-logout style="color:#E24B4A;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Выйти
      </a>
    </div>
  </nav>

  <main class="main-content" id="main-content">
    <a href="courses.html" style="font-size:13px;color:#888;text-decoration:none;display:inline-flex;align-items:center;gap:6px;margin-bottom:1rem;" aria-label="Вернуться к каталогу курсов">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><polyline points="15 18 9 12 15 6"/></svg>
      Назад к каталогу
    </a>

    <div class="row g-4">
      <div class="col-lg-8" data-course-tabs>
        <section class="video-player mb-3" role="region" aria-label="Видеоплеер">
          <div id="course-video-label" style="position:absolute;top:16px;left:16px;background:rgba(83,74,183,0.85);color:#fff;padding:4px 12px;border-radius:20px;font-size:12px;" aria-live="polite">
            Урок 1 — Введение
          </div>
          <button class="play-btn" type="button" aria-label="Воспроизвести текущий урок" style="border:none;background:rgba(255,255,255,0.18);backdrop-filter:blur(6px);">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="white" aria-hidden="true" focusable="false"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.5);padding:10px 16px;display:flex;align-items:center;gap:12px;">
            <span style="font-size:12px;color:#fff;white-space:nowrap;" aria-label="Текущее время: 12 минут 45 секунд из 28 минут 30 секунд">12:45 / 28:30</span>
            <div style="flex:1;height:3px;background:rgba(255,255,255,0.3);border-radius:2px;overflow:hidden;" role="progressbar" aria-valuenow="45" aria-valuemin="0" aria-valuemax="100" aria-label="Прогресс воспроизведения: 45%">
              <div style="width:45%;height:100%;background:#7F77DD;border-radius:2px;"></div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" aria-hidden="true" focusable="false"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          </div>
        </section>

        <div role="tablist" aria-label="Содержимое урока" style="border-bottom:1px solid #e8e6f5;margin-bottom:1rem;">
          <button class="tab-btn active" type="button" role="tab" id="tab-btn-materials" aria-selected="true" aria-controls="tab-materials" onclick="showTab('materials',this)">Материалы</button>
          <button class="tab-btn" type="button" role="tab" id="tab-btn-tasks" aria-selected="false" aria-controls="tab-tasks" onclick="showTab('tasks',this)">Задания</button>
          <button class="tab-btn" type="button" role="tab" id="tab-btn-discuss" aria-selected="false" aria-controls="tab-discuss" onclick="showTab('discuss',this)">Обсуждения</button>
        </div>

        <div id="tab-materials" role="tabpanel" aria-labelledby="tab-btn-materials">
          <h2 id="course-page-title" style="font-size:15px;font-weight:500;color:#222;margin-bottom:8px;" aria-live="polite">Загрузка…</h2>
          <p id="course-page-desc" style="font-size:13px;color:#555;line-height:1.7;margin-bottom:16px;"></p>
          <ul style="list-style:none;padding:0;margin:0;">
            <li class="file-row">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#534AB7" stroke-width="2" aria-hidden="true" focusable="false"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span style="font-size:13px;color:#222;">lesson_12_functions.pdf</span>
              <span style="font-size:12px;color:#888;margin-left:auto;" aria-label="Размер файла: 245 КБ">245 КБ</span>
            </li>
          </ul>
        </div>

        <div id="tab-tasks" role="tabpanel" aria-labelledby="tab-btn-tasks" hidden>
          <p style="font-size:13px;color:#888;">Задания появятся здесь.</p>
        </div>

        <div id="tab-discuss" role="tabpanel" aria-labelledby="tab-btn-discuss" hidden>
          <p style="font-size:13px;color:#888;">Обсуждения появятся здесь.</p>
        </div>
      </div>

      <aside class="col-lg-4" aria-label="Прогресс по курсу">
        <div style="background:#fff;border:1px solid #e8e6f5;border-radius:12px;padding:16px;">
          <div style="font-size:14px;font-weight:500;color:#222;margin-bottom:4px;" id="course-sidebar-title">Загрузка…</div>
          <div id="course-sidebar-progress-text" style="font-size:12px;color:#888;margin-bottom:8px;" aria-live="polite"></div>
          <div class="progress-bar-custom mb-3" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" aria-labelledby="course-sidebar-progress-text">
            <div id="course-sidebar-progress-fill" class="progress-fill" style="width:0%;"></div>
          </div>
          <ol id="lesson-list" style="display:flex;flex-direction:column;gap:2px;list-style:none;padding:0;margin:0;" aria-label="Уроки курса" aria-live="polite"></ol>
        </div>
      </aside>
    </div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
</body>
</html>
