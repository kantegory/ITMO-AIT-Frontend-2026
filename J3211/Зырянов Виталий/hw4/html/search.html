<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Hub - Поиск</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/theme.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/search.js" defer></script>
</head>
<body class="search-page">
  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-3 p-2 bg-body border rounded" href="#main-content">Перейти к основному контенту</a>
  <header class="top-nav">
    <nav class="container navbar navbar-expand-lg py-3" aria-label="Основная навигация">
      <a class="navbar-brand brand" href="authorization.html" aria-label="AI Model and Dataset Hub, главная">
        <svg class="icon nav-logo-icon" aria-hidden="true">
          <use href="../sprites/sprite.svg#icon-site-logo"></use>
        </svg>
        <span>AI Model & Dataset Hub</span>
      </a>
      <ul class="navbar-nav ms-auto flex-row gap-3">
        <li class="nav-item"><a class="nav-link active" href="search.html" aria-current="page">Поиск</a></li>
        <li class="nav-item"><a class="nav-link" href="profile.html">Профиль</a></li>
        <li class="nav-item"><a class="nav-link" href="model.html?id=1">Модель</a></li>
        <li class="nav-item" id="authNavItem"></li>
      </ul>
    </nav>
  </header>

  <main class="page-shell" id="main-content" tabindex="-1">
    <div class="container">
      <div class="row g-4">
        <div class="col-lg-4 col-xl-3">
          <aside class="hub-card p-4 filter-panel" aria-labelledby="filtersTitle">
            <h2 class="section-title" id="filtersTitle">Фильтры</h2>
            <div class="mb-3">
              <label for="searchInput" class="form-label">Поиск</label>
              <input id="searchInput" type="text" class="form-control" placeholder="Название, задача, фреймворк" autocomplete="off">
            </div>
            <div class="mb-3">
              <label for="task" class="form-label">Задача</label>
              <select id="task" class="form-select">
                <option>Любая</option>
                <option>NLP</option>
                <option>Computer Vision</option>
                <option>Time Series</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="size" class="form-label">Размер</label>
              <select id="size" class="form-select">
                <option>Любой</option>
                <option>До 1 GB</option>
                <option>1 - 16 GB</option>
                <option>16 - 64 GB</option>
                <option>64+ GB</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="framework" class="form-label">Фреймворк</label>
              <select id="framework" class="form-select">
                <option>Любой</option>
                <option>PyTorch</option>
                <option>TensorFlow</option>
              </select>
            </div>
            <button id="applyFiltersBtn" type="button" class="btn btn-primary w-100">Применить фильтры</button>
          </aside>
        </div>

        <div class="col-lg-8 col-xl-9">
          <div class="hub-card p-4 p-md-5" aria-labelledby="resultsTitle">
            <div id="searchMessage" class="d-none" role="status" aria-live="polite"></div>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
              <h1 id="resultsTitle" class="section-title mb-0">Найдено 0 результат(ов)</h1>
              <label for="sortSelect" class="visually-hidden">Сортировка результатов</label>
              <select id="sortSelect" class="form-select w-auto">
                <option value="popular">Популярные</option>
                <option value="new">Новые</option>
              </select>
            </div>
            <div id="activeChips" class="mb-4" role="status" aria-live="polite" aria-label="Активные фильтры"></div>
            <section id="resultList" role="list" aria-label="Результаты поиска моделей"></section>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
