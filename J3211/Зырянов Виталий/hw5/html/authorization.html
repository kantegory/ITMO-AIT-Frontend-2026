<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Hub - Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="../js/theme.js" defer></script>
  <script src="../js/api.js" defer></script>
  <script src="../js/auth.js" defer></script>
  <script src="../js/authorization.js" defer></script>
</head>
<body>
  <a class="visually-hidden-focusable position-absolute top-0 start-0 m-3 p-2 bg-body border rounded" href="#main-content">Перейти к основному контенту</a>
  <header class="top-nav">
    <nav class="container navbar navbar-expand-lg py-3" aria-label="Основная навигация">
      <a class="navbar-brand brand" href="authorization.html" aria-label="AI Model and Dataset Hub, главная">
        <svg class="icon nav-logo-icon" aria-hidden="true">
          <use href="../sprites/sprite.svg#icon-site-logo"></use>
        </svg>
        <span>AI Model & Dataset Hub</span>
      </a>
      <ul class="navbar-nav ms-auto flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="registration.html">Регистрация</a></li>
        <li class="nav-item"><a class="nav-link active" href="authorization.html" aria-current="page">Вход</a></li>
        <li class="nav-item" id="authNavItem"></li>
      </ul>
    </nav>
  </header>

  <main class="page-shell" id="main-content" tabindex="-1">
    <div class="container">
      <div class="row g-4 justify-content-center">
        <div class="col-lg-6">
          <div class="hub-card p-4 p-md-5 h-100">
            <h1 class="section-title mb-2" id="loginTitle">Вход</h1>
            <p class="muted mb-4">Будь частью сообщества AI Model & Dataset Hub</p>
            <form id="loginForm" class="row g-3" aria-labelledby="loginTitle">
              <div class="col-12">
                <label for="login" class="form-label">Email или логин</label>
                <input id="login" name="login" type="text" class="form-control" placeholder="name@example.com" autocomplete="username" required>
              </div>
              <div class="col-12">
                <label for="password" class="form-label">Пароль</label>
                <input id="password" name="password" type="password" class="form-control" placeholder="Введите пароль" autocomplete="current-password" required>
              </div>
              <div class="col-12 d-flex justify-content-between align-items-center">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="remember" checked aria-describedby="rememberHint">
                  <label class="form-check-label" for="remember">Запомнить меня</label>
                  <span id="rememberHint" class="visually-hidden">Сессия сохранится в браузере после закрытия вкладки</span>
                </div>
                <button type="button" class="btn btn-link p-0" aria-label="Восстановление пароля, раздел в разработке" disabled>Забыли пароль?</button>
              </div>
              <div class="col-12 d-grid">
                <button type="submit" class="btn btn-primary">Войти</button>
              </div>
              <div class="col-12">
                <div id="authMessage" class="d-none" role="status" aria-live="polite"></div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
