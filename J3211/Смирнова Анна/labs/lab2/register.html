<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-sm p-4" style="width: 400px;">
        <h3 class="text-center text-primary mb-4">MyFinance</h3>
        <h5 class="text-center mb-4">Создание аккаунта</h5>
        <form id="register-form">
            <div class="mb-3">
                <label class="form-label">Ваше Имя</label>
                <input type="text" class="form-control" id="reg-name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="reg-email" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" id="reg-password" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">Зарегистрироваться</button>
            <div class="text-center">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
        </form>
    </div>

    <script>
        async function register(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value; 
            const password = document.getElementById('reg-password').value; 

            try {
                const response = await fetch('http://localhost:3000/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, firstName })
                });

                if (!response.ok) {
                    const err = await response.json();
                    alert('Ошибка регистрации: ' + (err === 'Email already exists' ? 'Email уже занят' : err));
                    return;
                }

                const data = await response.json();
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                await createDefaultCategories(data.user.id, data.accessToken);
                
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Ошибка:', error);
            }
        }

        async function createDefaultCategories(userId, token) {
            const defaults = [
                { name: 'Продукты', type: 'expense', userId },
                { name: 'Зарплата', type: 'income', userId }
            ];
            for (const cat of defaults) {
                await fetch('http://localhost:3000/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify(cat)
                });
            }
        }

        document.getElementById('register-form').addEventListener('submit', register);
    </script>
</body>
</html>
