<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="d-flex align-items-center justify-content-center vh-100">
        <div class="card shadow-sm p-4" style="width: 400px;">
            <h1 class="text-center text-primary mb-4 h3">MyFinance</h1>
            <h2 class="text-center mb-4 h5">Вход в систему</h2>
            <form id="login-form">
                <div class="mb-3">
                    <label for="login-email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="login-email" autocomplete="email" required aria-required="true">
                </div>
                <div class="mb-3">
                    <label for="login-password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="login-password" autocomplete="current-password" required aria-required="true">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
                <div class="text-center">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        if (localStorage.getItem('accessToken')) {
            window.location.href = 'dashboard.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('login-email').value; 
            const password = document.getElementById('login-password').value; 

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (!response.ok) {
                    alert('Неверный email или пароль!');
                    return;
                }

                const data = await response.json();

                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Ошибка:', error);
            }
        });
    </script>
</body>
</html>
