<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интеграции - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <!-- Сайдбар -->
    <div class="sidebar position-fixed vh-100 p-3 d-flex flex-column" id="sidebar">
        <a href="dashboard.html" class="d-flex align-items-center mb-3 text-decoration-none">
            <i class="bi bi-wallet2 text-primary fs-3 me-2"></i><span class="fs-4 fw-bold text-primary">MyFinance</span>
        </a><hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="dashboard.html" class="nav-link"><i class="bi bi-grid-1x2 me-2"></i> Обзор</a></li>
            <li><a href="transactions.html" class="nav-link"><i class="bi bi-cash-stack me-2"></i> Транзакции</a></li>
            <li><a href="goals.html" class="nav-link"><i class="bi bi-bullseye me-2"></i> Цели</a></li>
            <li><a href="reports.html" class="nav-link"><i class="bi bi-pie-chart me-2"></i> Отчеты и Бюджеты</a></li>
            <li><a href="integrations.html" class="nav-link active"><i class="bi bi-bank me-2"></i> Интеграции</a></li>
        </ul><hr>
        <a href="#" id="logout-btn" class="nav-link text-danger"><i class="bi bi-box-arrow-left me-2"></i> Выход</a>
    </div>

    <div class="main-content flex-grow-1 p-4">
        <div class="d-flex align-items-center mb-4">
            <button class="btn btn-light d-lg-none me-2" id="toggle-sidebar"><i class="bi bi-list"></i></button>
            <h2 class="m-0">Интеграция аккаунтов</h2>
        </div>

        <div class="row g-4">
            <div class="col-12 col-lg-6">
                <div class="card border-0 shadow-sm p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="m-0">Подключенные банки</h5>
                        <button type="button" class="btn btn-sm btn-success" onclick="openSyncModal()">
                            <i class="bi bi-arrow-repeat me-1"></i> Синхронизировать
                        </button>
                    </div>
                    <p class="text-muted small">Подключите банк для автоматического импорта транзакций</p>
                    <ul class="list-group list-group-flush" id="banks-list">
                    </ul>
                </div>
            </div>

            <div class="col-12 col-lg-6">
                <div class="card border-0 shadow-sm p-4 bg-light h-100">
                    <h5 class="mb-3">Настройка правил импорта</h5>
                    <ul class="list-group mb-4" id="rules-list"></ul>
                    <form id="rule-form">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Если описание содержит (слово):</label>
                            <input type="text" class="form-control" id="rule-keyword" placeholder="Например: Яндекс.Еда" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Назначить категорию расхода:</label>
                            <select class="form-select" id="rule-category" required>
                                <!-- Заполняется через JS -->
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg me-2"></i> Добавить правило</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-success text-white">
                <strong class="me-auto">MyFinance</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-message">
            </div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <script>
        fetch('modal.html').then(r => r.text()).then(h => { document.getElementById('modal-container').innerHTML = h; });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/render.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
