<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Интеграции - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <a href="#main-content" class="visually-hidden-focusable p-2 bg-primary text-white text-decoration-none" style="position: absolute; top: 0; left: 0; z-index: 10000;">Перейти к основному контенту</a>
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
    
    <nav class="sidebar p-3 d-flex flex-column" id="sidebar" aria-label="Основное меню">
        <a href="dashboard.html" class="d-flex align-items-center mb-3 text-decoration-none" aria-label="На главную MyFinance">
            <svg class="bi text-primary fs-3 me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-wallet2"></use></svg>
            <span class="fs-4 fw-bold text-primary">MyFinance</span>
        </a>
        <hr aria-hidden="true">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-grid-1x2"></use></svg> Обзор
                </a>
            </li>
            <li>
                <a href="transactions.html" class="nav-link">
                    <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-cash-stack"></use></svg> Транзакции
                </a>
            </li>
            <li>
                <a href="goals.html" class="nav-link">
                    <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-bullseye"></use></svg> Цели
                </a>
            </li>
            <li>
                <a href="reports.html" class="nav-link">
                    <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-pie-chart"></use></svg> Отчеты и Бюджеты
                </a>
            </li>
            <li>
                <a href="integrations.html" class="nav-link active" aria-current="page">
                    <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-bank"></use></svg> Интеграции
                </a>
            </li>
        </ul>
        <hr aria-hidden="true">
        <button class="nav-link w-100 text-start d-flex align-items-center mb-2" id="theme-toggle-btn" aria-label="Переключить тему оформления">
            <svg class="bi me-2" id="theme-icon" aria-hidden="true"><use href="assets/sprite.svg#bi-moon-stars"></use></svg> 
            <span id="theme-text">Тёмная тема</span>
        </button>
        <a href="#" id="logout-btn" class="nav-link text-danger">
            <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-box-arrow-left"></use></svg> Выход
        </a>
    </nav>

    <main class="main-content flex-grow-1 p-4" id="main-content">
        <div class="d-flex align-items-center mb-4">
            <button class="btn btn-light d-lg-none me-2" id="toggle-sidebar" aria-expanded="false" aria-controls="sidebar" aria-label="Открыть меню">
                <svg class="bi" aria-hidden="true"><use href="assets/sprite.svg#bi-list"></use></svg>
            </button>
            <h1 class="m-0 h2">Интеграция аккаунтов</h1>
        </div>

        <div class="row g-4">
            <div class="col-12 col-lg-6">
                <section class="card border-0 shadow-sm p-4 h-100" aria-labelledby="banks-heading">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h2 id="banks-heading" class="m-0 h5">Подключенные банки</h2>
                        <button type="button" class="btn btn-sm btn-success" onclick="openSyncModal()">
                            <svg class="bi me-1" aria-hidden="true"><use href="assets/sprite.svg#bi-arrow-repeat"></use></svg> Синхронизировать
                        </button>
                    </div>
                    <p class="text-muted small">Подключите банк для автоматического импорта транзакций</p>
                    <ul class="list-group list-group-flush" id="banks-list">
                    </ul>
                </section>
            </div>

            <div class="col-12 col-lg-6">
                <section class="card border-0 shadow-sm p-4 h-100" aria-labelledby="rules-heading">
                    <h2 id="rules-heading" class="mb-3 h5">Настройка правил импорта</h2>
                    <ul class="list-group mb-4" id="rules-list"></ul>
                    <form id="rule-form">
                        <div class="mb-3">
                            <label for="rule-keyword" class="form-label small text-muted">Если описание содержит (слово):</label>
                            <input type="text" class="form-control" id="rule-keyword" placeholder="Например: Яндекс.Еда" required aria-required="true">
                        </div>
                        <div class="mb-3">
                            <label for="rule-category" class="form-label small text-muted">Назначить категорию расхода:</label>
                            <select class="form-select" id="rule-category" required aria-required="true">
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <svg class="bi me-2" aria-hidden="true"><use href="assets/sprite.svg#bi-plus-lg"></use></svg> Добавить правило
                        </button>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1060;">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header bg-success text-white">
                <strong class="me-auto">MyFinance</strong>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="toast" aria-label="Закрыть уведомление"></button>
            </div>
            <div class="toast-body" id="toast-message">
            </div>
        </div>
    </div>
    
    <div id="modal-container"></div>
    <script>
        fetch('modal.html').then(r => r.text()).then(h => { document.getElementById('modal-container').innerHTML = h; });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/render.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
