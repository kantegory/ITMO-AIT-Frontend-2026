<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цели и Накопления - MyFinance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="visually-hidden-focusable p-2 bg-primary text-white text-decoration-none" style="position: absolute; top: 0; left: 0; z-index: 10000;">Перейти к основному контенту</a>
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

    <nav class="sidebar p-3 d-flex flex-column" id="sidebar" aria-label="Основное меню">
        <a href="dashboard.html" class="d-flex align-items-center mb-3 text-decoration-none" aria-label="На главную MyFinance">
            <i class="bi bi-wallet2 text-primary fs-3 me-2" aria-hidden="true"></i>
            <span class="fs-4 fw-bold text-primary">MyFinance</span>
        </a>
        <hr aria-hidden="true">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="dashboard.html" class="nav-link">
                    <i class="bi bi-grid-1x2 me-2" aria-hidden="true"></i> Обзор
                </a>
            </li>
            <li>
                <a href="transactions.html" class="nav-link">
                    <i class="bi bi-cash-stack me-2" aria-hidden="true"></i> Транзакции
                </a>
            </li>
            <li>
                <a href="goals.html" class="nav-link active" aria-current="page">
                    <i class="bi bi-bullseye me-2" aria-hidden="true"></i> Цели
                </a>
            </li>
            <li>
                <a href="reports.html" class="nav-link">
                    <i class="bi bi-pie-chart me-2" aria-hidden="true"></i> Отчеты и Бюджеты
                </a>
            </li>
            <li>
                <a href="integrations.html" class="nav-link">
                    <i class="bi bi-bank me-2" aria-hidden="true"></i> Интеграции
                </a>
            </li>
        </ul>
        <hr aria-hidden="true">
        <a href="#" id="logout-btn" class="nav-link text-danger">
            <i class="bi bi-box-arrow-left me-2" aria-hidden="true"></i> Выход
        </a>
    </nav>

    <main class="main-content p-4" id="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-light d-lg-none me-2" id="toggle-sidebar" aria-expanded="false" aria-controls="sidebar" aria-label="Открыть меню">
                    <i class="bi bi-list" aria-hidden="true"></i>
                </button>
                <h1 class="m-0 h2">Мои накопления</h1>
            </div>
            <button class="btn btn-primary btn-sm px-3 py-2" onclick="openGoalModal()">
                <i class="bi bi-plus-lg" aria-hidden="true"></i> Новая цель
            </button>
        </div>

        <section class="row g-4" id="goals-container" aria-label="Список целей">
        </section>
    </main>

    <div id="modal-container"></div>
    <script>
        fetch('modal.html')
            .then(r => r.text())
            .then(h => { document.getElementById('modal-container').innerHTML = h; });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/render.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
