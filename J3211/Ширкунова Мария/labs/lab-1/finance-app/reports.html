<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Отчёты и бюджеты">
    <title>Отчёты | Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/light.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', saved || preferred);
        })();
    </script>
</head>
<body>

    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <header class="app-header p-3">
        <nav class="container d-flex justify-content-between align-items-center" aria-label="Навигация отчётов">
            <h1 class="h4 mb-0 d-flex align-items-center gap-2" style="color: var(--bg-header-text)">
                <svg class="icon" aria-hidden="true"><use xlink:href="icons/sprite.svg#icon-chart"></use></svg>
                Отчёты и Бюджеты
            </h1>
            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="d-flex align-items-center gap-1" style="color: var(--bg-header-text)" aria-label="Вернуться на главную страницу">
                    <svg class="icon" aria-hidden="true"><use xlink:href="icons/sprite.svg#icon-wallet"></use></svg>
                    На главную
                </a>
                <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Переключить тему оформления" title="Сменить тему">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container py-5">
        <section class="card p-4 shadow-sm mb-4" aria-labelledby="budgetHeading">
            <h2 id="budgetHeading" class="h5">Использование бюджета (Октябрь)</h2>
            <div class="mt-4">
                <p class="mb-1" id="foodBudgetLabel">Продукты (потрачено 8 000 из 10 000 ₽)</p>
                <div class="progress mb-3" role="progressbar" aria-labelledby="foodBudgetLabel" aria-valuenow="80" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-warning" style="width: 80%">80%</div>
                </div>

                <p class="mb-1" id="entertainBudgetLabel">Развлечения (потрачено 5 000 из 5 000 ₽)</p>
                <div class="progress mb-3" role="progressbar" aria-labelledby="entertainBudgetLabel" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-danger" style="width: 100%">100%</div>
                </div>

                <p class="mb-1" id="transportBudgetLabel">Транспорт (потрачено 2 000 из 6 000 ₽)</p>
                <div class="progress mb-3" role="progressbar" aria-labelledby="transportBudgetLabel" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-bar bg-success" style="width: 33%">33%</div>
                </div>
            </div>
        </section>

        <div class="text-center">
            <a href="integrations.html" class="btn btn-outline-primary">Перейти к интеграциям</a>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
