<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный кабинет — обзор счетов и добавление транзакций">
    <title>Личный кабинет | Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/light.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            const preferred = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', saved || preferred);
        })();
    </script>
</head>
<body>

    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <noscript>
        <div class="alert alert-danger text-center m-3" role="alert">
            Для работы приложения необходимо включить JavaScript.
        </div>
    </noscript>

    <header class="app-header">
        <nav class="container navbar navbar-expand-lg navbar-dark" aria-label="Главная навигация">
            <a class="navbar-brand" href="index.html">Мои Финансы</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Открыть меню навигации"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" aria-current="page">Обзор</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Транзакции</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html">Отчёты</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="logout()" role="button">Выход</a>
                    </li>
                    <li class="nav-item">
                        <button
                            class="theme-toggle"
                            id="themeToggle"
                            onclick="toggleTheme()"
                            aria-label="Переключить тему оформления"
                            title="Сменить тему"
                        >
                            <span id="themeIcon">🌙</span>
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2">Сводка по счетам</h1>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
                + Добавить транзакцию
            </button>
        </div>

        <section
            class="row mb-5"
            id="accountsContainer"
            aria-label="Список счетов"
            aria-live="polite"
            aria-atomic="true"
        ></section>
    </main>

    <div
        class="modal fade"
        id="addTransactionModal"
        tabindex="-1"
        aria-labelledby="addTransactionModalLabel"
        aria-hidden="true"
    >
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title h5" id="addTransactionModalLabel">Новая транзакция</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть окно"></button>
                </div>
                <div class="modal-body">
                    <form id="transactionForm" novalidate>
                        <fieldset class="mb-3">
                            <legend class="form-label fs-6">Тип операции</legend>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="transType" id="typeExpense" value="expense" checked>
                                    <label class="form-check-label text-danger" for="typeExpense">Расход</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="transType" id="typeIncome" value="income">
                                    <label class="form-check-label text-success" for="typeIncome">Доход</label>
                                </div>
                            </div>
                        </fieldset>

                        <div class="mb-3">
                            <label for="transAccount" class="form-label">Счёт</label>
                            <select class="form-select" id="transAccount" name="accountName" aria-required="true">
                                <option value="Зарплатная карта">Зарплатная карта</option>
                                <option value="Наличные">Наличные</option>
                                <option value="Кредитная карта">Кредитная карта</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="transDescription" class="form-label">Описание</label>
                            <input type="text" class="form-control" id="transDescription" name="description" placeholder="Например: Пятерочка" autocomplete="off" aria-required="true" required>
                        </div>

                        <div class="mb-3">
                            <label for="transAmount" class="form-label">Сумма (₽)</label>
                            <input type="number" class="form-control" id="transAmount" name="amount" placeholder="Например: 1500" min="0" step="0.01" autocomplete="off" aria-required="true" required>
                        </div>

                        <div class="mb-3">
                            <label for="transCategory" class="form-label">Категория</label>
                            <select class="form-select" id="transCategory" name="category" aria-required="true">
                                <option value="food">Супермаркеты</option>
                                <option value="transport">Транспорт</option>
                                <option value="income">Зарплата</option>
                                <option value="transfers">Переводы</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div
            id="successToast"
            class="toast align-items-center text-bg-success border-0 shadow"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <span aria-hidden="true">✅</span> Транзакция успешно добавлена!
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть уведомление"></button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
