<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Регистрация в финансовом приложении">
    <title>Регистрация | Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <noscript>
        <div class="alert alert-danger text-center m-3" role="alert">
            Для работы приложения необходимо включить JavaScript.
        </div>
    </noscript>

    <main id="main-content" class="container d-flex justify-content-center align-items-center vh-100">
        <article class="card shadow p-4" style="width: 100%; max-width: 450px;" role="region" aria-labelledby="registerHeading">
            <div class="card-body">
                <h1 id="registerHeading" class="card-title text-center mb-4 h3">Создать аккаунт</h1>

                <div id="registerError" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

                <form id="registerForm" novalidate>
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Имя</label>
                        <input
                            type="text"
                            class="form-control"
                            id="nameInput"
                            name="firstName"
                            autocomplete="given-name"
                            aria-required="true"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email адрес</label>
                        <input
                            type="email"
                            class="form-control"
                            id="emailInput"
                            name="email"
                            autocomplete="email"
                            aria-required="true"
                            required
                        >
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="passwordInput"
                            name="password"
                            autocomplete="new-password"
                            aria-required="true"
                            aria-describedby="passwordHint"
                            required
                        >
                        <div id="passwordHint" class="form-text">Минимум 4 символа</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Зарегистрироваться</button>
                    <p class="text-center mb-0">
                        <span class="text-muted">Уже есть аккаунт?</span>
                        <a href="login.html">Войти</a>
                    </p>
                </form>
            </div>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1055;">
        <div
            id="registerToast"
            class="toast align-items-center text-bg-success border-0 shadow"
            role="status"
            aria-live="polite"
            aria-atomic="true"
        >
            <div class="d-flex">
                <div class="toast-body fw-bold">
                    <span aria-hidden="true">🎉</span> Регистрация успешна! Входим в кабинет...
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Закрыть уведомление"></button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
