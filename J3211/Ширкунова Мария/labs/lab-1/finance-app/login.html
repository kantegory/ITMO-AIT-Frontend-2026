<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в личный кабинет финансового приложения">
    <title>Вход | Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <noscript>
        <div class="alert alert-danger text-center m-3" role="alert">
            Для работы приложения необходимо включить JavaScript в вашем браузере.
        </div>
    </noscript>

    <main id="main-content" class="container d-flex justify-content-center align-items-center vh-100">
        <article class="card shadow p-4" style="width: 100%; max-width: 400px;" role="region" aria-labelledby="loginHeading">
            <div class="card-body">
                <h1 id="loginHeading" class="card-title text-center mb-4 h3">Вход в систему</h1>

                <div id="loginError" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email адрес</label>
                        <input
                            type="email"
                            class="form-control"
                            id="emailInput"
                            name="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            aria-required="true"
                            aria-describedby="emailHelp"
                            required
                        >
                        <div id="emailHelp" class="form-text">Введите email, указанный при регистрации</div>
                    </div>
                    <div class="mb-3">
                        <label for="passwordInput" class="form-label">Пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="passwordInput"
                            name="password"
                            placeholder="********"
                            autocomplete="current-password"
                            aria-required="true"
                            required
                        >
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
                    <p class="text-center mb-0">
                        <span class="text-muted">Нет аккаунта?</span>
                        <a href="register.html">Зарегистрироваться</a>
                    </p>
                </form>
            </div>
        </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
