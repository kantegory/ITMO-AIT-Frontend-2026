<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="История транзакций с фильтрацией">
    <title>Транзакции | Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

    <noscript>
        <div class="alert alert-danger text-center m-3" role="alert">
            Для работы приложения необходимо включить JavaScript.
        </div>
    </noscript>

    <header class="app-header bg-dark text-white">
        <nav class="container navbar navbar-expand-lg navbar-dark" aria-label="Главная навигация">
            <a class="navbar-brand" href="index.html">Мои Финансы</a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarTransNav"
                aria-controls="navbarTransNav"
                aria-expanded="false"
                aria-label="Открыть меню навигации"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarTransNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">На главную</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="logout()" role="button">Выход</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main id="main-content" class="container py-5">
        <h1 class="h2 mb-4">История транзакций</h1>

        <section class="card p-3 border-0 shadow-sm mb-4" aria-label="Фильтры транзакций">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="searchInput" class="form-label visually-hidden">Поиск по описанию</label>
                    <input
                        type="search"
                        id="searchInput"
                        class="form-control"
                        placeholder="Поиск по описанию..."
                        aria-label="Поиск по описанию транзакции"
                    >
                </div>
                <div class="col-md-3">
                    <label for="accountFilter" class="form-label visually-hidden">Фильтр по счёту</label>
                    <select id="accountFilter" class="form-select" aria-label="Фильтр по счёту">
                        <option value="all">Все счета</option>
                        <option value="Зарплатная">Зарплатная карта</option>
                        <option value="Наличные">Наличные</option>
                        <option value="Кредитная">Кредитная карта</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="categoryFilter" class="form-label visually-hidden">Фильтр по категории</label>
                    <select id="categoryFilter" class="form-select" aria-label="Фильтр по категории">
                        <option value="all">Все категории</option>
                        <option value="food">Еда</option>
                        <option value="transport">Транспорт</option>
                        <option value="income">Поступления / Зарплата</option>
                        <option value="transfers">Переводы</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="filterTransactions()" aria-label="Применить выбранные фильтры">
                        Применить фильтр
                    </button>
                </div>
            </div>
        </section>

        <div class="table-wrapper mb-5" role="region" aria-label="Таблица транзакций" tabindex="0">
            <table class="table table-hover table-borderless align-middle" aria-describedby="tableCaption">
                <caption id="tableCaption" class="visually-hidden">
                    Список транзакций пользователя с датой, счётом, описанием, категорией и суммой
                </caption>
                <thead class="table-light">
                    <tr>
                        <th scope="col" class="py-3 px-4">Дата</th>
                        <th scope="col" class="py-3">Счёт</th>
                        <th scope="col" class="py-3">Описание</th>
                        <th scope="col" class="py-3">Категория</th>
                        <th scope="col" class="py-3">Сумма</th>
                    </tr>
                </thead>
                <tbody id="transactionsTable" aria-live="polite" aria-atomic="true">
                </tbody>
            </table>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
