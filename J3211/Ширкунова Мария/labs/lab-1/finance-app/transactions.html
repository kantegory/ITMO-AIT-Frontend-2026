<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции | Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="app-header bg-dark text-white">
        <nav class="container navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand" href="index.html">Мои Финансы</a>
            <div class="collapse navbar-collapse d-flex justify-content-end">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Назад на главную</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="#" onclick="logout()">Выход</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h2>История транзакций</h2>
        
        <article class="card p-3 border-0 shadow-sm mb-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control" placeholder="Поиск по описанию...">
                </div>
                <div class="col-md-3">
                    <select id="accountFilter" class="form-select">
                        <option value="all">Все счета</option>
                        <option value="Зарплатная">Зарплатная карта</option>
                        <option value="Наличные">Наличные</option>
                        <option value="Кредитная">Кредитная карта</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="categoryFilter" class="form-select">
                        <option value="all">Все категории</option>
                        <option value="food">Еда</option>
                        <option value="transport">Транспорт</option>
                        <option value="income">Поступления / Зарплата</option>
                        <option value="transfers">Переводы</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button class="btn btn-primary w-100" onclick="filterTransactions()">Применить фильтр</button>
                </div>
            </div>
        </article>

        <div class="table-wrapper mb-5">
            <table class="table table-hover table-borderless align-middle">
                <thead class="table-light">
                    <tr>
                        <th class="py-3 px-4">Дата</th>
                        <th class="py-3">Счёт</th>
                        <th class="py-3">Описание</th>
                        <th class="py-3">Категория</th>
                        <th class="py-3">Сумма</th>
                    </tr>
                </thead>
                <tbody id="transactionsTable">
                </tbody>
            </table>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
