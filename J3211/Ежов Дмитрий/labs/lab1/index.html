<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Вход — ТаскерAI</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/style.css" />
        <style>
            .page-wrap {
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 40px 16px;
                position: relative;
                z-index: 1;
            }

            .auth-box {
                width: 100%;
                max-width: 400px;
                padding: 40px 36px;
            }

            .auth-logo {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 32px;
                text-decoration: none;
            }

            .auth-logo-icon {
                width: 34px;
                height: 34px;
                background: var(--gradient-primary);
                border-radius: var(--radius-md);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .auth-logo-name {
                font-size: 1.15rem;
                font-weight: 800;
                letter-spacing: -0.03em;
            }

            .auth-title {
                font-size: 1.5rem;
                margin-bottom: 6px;
            }

            .auth-sub {
                color: var(--text-secondary);
                font-size: 0.9rem;
                margin-bottom: 32px;
            }

            .input-wrapper {
                position: relative;
            }

            .input-wrapper .icon-left {
                position: absolute;
                left: 14px;
                top: 50%;
                transform: translateY(-50%);
                width: 17px;
                height: 17px;
                color: var(--text-muted);
                pointer-events: none;
            }

            .input-wrapper .form-input {
                padding-left: 44px;
            }

            .input-wrapper .icon-right {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: var(--text-muted);
                cursor: pointer;
                background: none;
                border: none;
                padding: 2px;
                display: flex;
                transition: color var(--transition);
            }

            .input-wrapper .icon-right:hover {
                color: var(--text-accent);
            }
            .input-wrapper .form-input.with-right {
                padding-right: 42px;
            }

            .lab-nav {
                margin-top: 20px;
                width: 100%;
                max-width: 600px;
            }

            .lab-nav-title {
                font-size: 0.72rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-muted);
                margin-bottom: 12px;
                text-align: center;
            }

            .lab-nav-grid {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
            }
            .lab-nav-grid > * {
                width: 160px;
            }

            .lab-nav-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 12px 14px;
                background: var(--bg-elevated);
                border: 1px solid var(--border-subtle);
                border-radius: var(--radius-md);
                text-decoration: none;
                color: var(--text-secondary);
                font-size: 0.85rem;
                font-weight: 500;
                transition: all var(--transition);
            }

            .lab-nav-item:hover {
                border-color: var(--border-accent);
                color: var(--text-accent);
                background: rgba(139, 92, 246, 0.06);
            }

            .lab-nav-item.current {
                border-color: var(--violet-500);
                color: var(--violet-400);
                background: rgba(139, 92, 246, 0.1);
            }
        </style>
    </head>

    <body class="bg-grid">
        <div class="bg-glow-1"></div>
        <div class="bg-glow-2"></div>

        <div class="page-wrap">
            <div class="auth-box card-glass">
                <a href="index.html" class="auth-logo">
                    <div class="auth-logo-icon">
                        <svg
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="white"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <polygon
                                points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
                            />
                        </svg>
                    </div>
                    <span class="auth-logo-name text-gradient">ТаскерAI</span>
                </a>

                <h1 class="auth-title">Вход</h1>
                <p class="auth-sub">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <div class="input-wrapper">
                            <svg
                                class="icon-left"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    width="20"
                                    height="16"
                                    x="2"
                                    y="4"
                                    rx="2"
                                />
                                <path
                                    d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"
                                />
                            </svg>
                            <input
                                type="email"
                                id="email"
                                class="form-input"
                                placeholder="you@example.com"
                            />
                        </div>
                        <span class="form-error">Введите корректный email</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Пароль</label>
                        <div class="input-wrapper">
                            <svg
                                class="icon-left"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    width="18"
                                    height="11"
                                    x="3"
                                    y="11"
                                    rx="2"
                                />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                            <input
                                type="password"
                                id="password"
                                class="form-input with-right"
                                placeholder="Ваш пароль"
                            />
                            <button
                                type="button"
                                class="icon-right"
                                id="togglePwd"
                            >
                                <svg
                                    id="eyeOn"
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path
                                        d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"
                                    />
                                    <circle cx="12" cy="12" r="3" />
                                </svg>
                                <svg
                                    id="eyeOff"
                                    width="17"
                                    height="17"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    style="display: none"
                                >
                                    <path
                                        d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
                                    />
                                    <path
                                        d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"
                                    />
                                    <line x1="1" y1="1" x2="23" y2="23" />
                                </svg>
                            </button>
                        </div>
                        <span class="form-error">Введите пароль</span>
                    </div>

                    <button type="submit" class="btn-primary-custom w-full">
                        Войти
                    </button>
                </form>
            </div>

            <!-- Навигация по страницам лабы -->
            <div class="lab-nav">
                <p class="lab-nav-title">Страницы проекта</p>
                <div class="lab-nav-grid">
                    <a href="index.html" class="lab-nav-item current">
                        <span>🔐</span> Вход
                    </a>
                    <a href="register.html" class="lab-nav-item">
                        <span>📝</span> Регистрация
                    </a>
                    <a href="dashboard.html" class="lab-nav-item">
                        <span>🏠</span> Кабинет
                    </a>
                    <a href="search.html" class="lab-nav-item">
                        <span>🔍</span> Поиск задач
                    </a>
                    <a href="task.html" class="lab-nav-item">
                        <span>✅</span> Задача
                    </a>
                </div>
            </div>
        </div>

        <script>
            const pwdInput = document.getElementById("password");

            document
                .getElementById("togglePwd")
                .addEventListener("click", () => {
                    const show = pwdInput.type === "password";
                    pwdInput.type = show ? "text" : "password";
                    document.getElementById("eyeOn").style.display = show
                        ? "none"
                        : "";
                    document.getElementById("eyeOff").style.display = show
                        ? ""
                        : "none";
                });

            document
                .getElementById("loginForm")
                .addEventListener("submit", (e) => {
                    e.preventDefault();
                    const email = document.getElementById("email");
                    const pwd = document.getElementById("password");
                    let ok = true;

                    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                        email.classList.add("is-invalid");
                        ok = false;
                    } else email.classList.remove("is-invalid");

                    if (!pwd.value) {
                        pwd.classList.add("is-invalid");
                        ok = false;
                    } else pwd.classList.remove("is-invalid");

                    if (ok) window.location.href = "dashboard.html";
                });
        </script>
    </body>
</html>
