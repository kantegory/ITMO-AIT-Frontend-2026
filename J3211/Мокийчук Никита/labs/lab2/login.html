<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Войдите в аккаунт MokiichukKnowledge, чтобы получить доступ к онлайн-курсам.">
  <title>Вход — MokiichukKnowledge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css?v=3" rel="stylesheet">
</head>
<body>

  <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

  <main id="main-content" tabindex="-1">
    <div class="auth-wrapper">
      <div class="auth-card" role="region" aria-labelledby="login-heading">

        <div class="text-center mb-2">
          <a href="index.html" class="text-decoration-none auth-logo" aria-label="MokiichukKnowledge — на главную">
            <svg class="svg-icon" aria-hidden="true">
              <use href="sprite/sprite.svg#icon-mortarboard"></use>
            </svg> MokiichukKnowledge
          </a>
        </div>

        <h1 class="h2 text-center" id="login-heading">Вход в аккаунт</h1>
        <p class="text-center">Рады видеть вас снова!</p>

        <form id="loginForm" novalidate aria-label="Форма входа">

          <div class="mb-3">
            <label class="form-label" for="loginEmail">
              Email <span aria-hidden="true" class="text-danger">*</span>
            </label>
            <input
              type="email"
              class="form-control"
              id="loginEmail"
              name="email"
              placeholder="example@mail.ru"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="loginEmailHint">
            <div id="loginEmailHint" class="form-text visually-hidden">Введите адрес электронной почты</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="loginPassword">
              Пароль <span aria-hidden="true" class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control input-no-right-border"
                id="loginPassword"
                name="password"
                placeholder="Введите пароль"
                autocomplete="current-password"
                required
                aria-required="true">
              <button
                class="btn toggle-password"
                type="button"
                aria-label="Показать пароль"
                aria-pressed="false"
                aria-controls="loginPassword">
                <svg class="svg-icon" aria-hidden="true">
                  <use href="sprite/sprite.svg#icon-eye"></use>
                </svg>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
              <label class="form-check-label text-sm-2" for="rememberMe">Запомнить меня</label>
            </div>
            <a
              href="#"
              class="text-decoration-none auth-link"
              data-bs-toggle="modal"
              data-bs-target="#resetModal"
              aria-haspopup="dialog">
              Забыли пароль?
            </a>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Войти</button>
        </form>

        <div class="auth-divider" role="separator" aria-label="или воспользуйтесь другим способом входа">или</div>

        <button
          class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2"
          type="button"
          aria-label="Войти через ВКонтакте"
          onclick="showToast('Вход через VK (заглушка)','info')">
          <i class="bi bi-chat-fill" aria-hidden="true"></i> Войти через VK
        </button>

        <p class="text-center mt-4 mb-0 text-sm-2">
          Нет аккаунта? <a href="register.html" class="fw-bold text-decoration-none">Зарегистрируйтесь</a>
        </p>

      </div>
    </div>
  </main>

  <div
    class="modal fade"
    id="resetModal"
    tabindex="-1"
    role="dialog"
    aria-modal="true"
    aria-labelledby="resetModalLabel"
    aria-describedby="resetModalDesc">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="resetModalLabel">Сброс пароля</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть диалог"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted mb-3" id="resetModalDesc">
            Введите email, и мы отправим вам ссылку для восстановления.
          </p>
          <label for="resetEmail" class="visually-hidden">Email для восстановления пароля</label>
          <input
            type="email"
            class="form-control"
            id="resetEmail"
            name="resetEmail"
            placeholder="Ваш email"
            autocomplete="email"
            aria-required="true">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-primary" id="sendResetBtn">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
