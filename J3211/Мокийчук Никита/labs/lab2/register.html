<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Создайте аккаунт на MokiichukKnowledge и получите доступ к более чем 500 онлайн-курсам.">
  <title>Регистрация — MokiichukKnowledge</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css?v=3" rel="stylesheet">
</head>
<body>

  <a class="skip-link" href="#main-content">Перейти к основному содержимому</a>

  <main id="main-content" tabindex="-1">
    <div class="auth-wrapper">
      <div class="auth-card" role="region" aria-labelledby="register-heading">

        <div class="text-center mb-2">
          <a href="index.html" class="text-decoration-none auth-logo" aria-label="MokiichukKnowledge — на главную">
            <i class="bi bi-mortarboard-fill" aria-hidden="true"></i> MokiichukKnowledge
          </a>
        </div>

        <h1 class="h2 text-center" id="register-heading">Создать аккаунт</h1>
        <p class="text-center">Присоединяйтесь к 50 000+ студентов</p>

        <form id="registerForm" novalidate aria-label="Форма регистрации">

          <div class="mb-3">
            <label class="form-label" for="regName">
              Имя и фамилия <span aria-hidden="true" class="text-danger">*</span>
            </label>
            <input
              type="text"
              class="form-control"
              id="regName"
              name="fullName"
              placeholder="Иван Иванов"
              autocomplete="name"
              required
              aria-required="true">
          </div>

          <div class="mb-3">
            <label class="form-label" for="regEmail">
              Email <span aria-hidden="true" class="text-danger">*</span>
            </label>
            <input
              type="email"
              class="form-control"
              id="regEmail"
              name="email"
              placeholder="example@mail.ru"
              autocomplete="email"
              required
              aria-required="true">
          </div>

          <div class="mb-3">
            <label class="form-label" for="regPassword">
              Пароль <span aria-hidden="true" class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control input-no-right-border"
                id="regPassword"
                name="password"
                placeholder="Минимум 6 символов"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="passwordHint">
              <button
                class="btn toggle-password"
                type="button"
                aria-label="Показать пароль"
                aria-pressed="false"
                aria-controls="regPassword">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
            <div id="passwordHint" class="form-text">Минимум 6 символов</div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="regConfirmPassword">
              Повторите пароль <span aria-hidden="true" class="text-danger">*</span>
            </label>
            <div class="input-group">
              <input
                type="password"
                class="form-control input-no-right-border"
                id="regConfirmPassword"
                name="confirmPassword"
                placeholder="Повторите пароль"
                autocomplete="new-password"
                required
                aria-required="true">
              <button
                class="btn toggle-password"
                type="button"
                aria-label="Показать подтверждение пароля"
                aria-pressed="false"
                aria-controls="regConfirmPassword">
                <i class="bi bi-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <fieldset class="mb-3">
            <legend class="form-label">Я хочу:</legend>
            <div class="d-flex gap-3">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="role"
                  id="roleStudent"
                  value="student"
                  checked
                  aria-describedby="roleStudentDesc">
                <label class="form-check-label" for="roleStudent">Учиться</label>
                <span id="roleStudentDesc" class="visually-hidden">Зарегистрироваться как студент</span>
              </div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  name="role"
                  id="roleTeacher"
                  value="teacher"
                  aria-describedby="roleTeacherDesc">
                <label class="form-check-label" for="roleTeacher">Преподавать</label>
                <span id="roleTeacherDesc" class="visually-hidden">Зарегистрироваться как преподаватель</span>
              </div>
            </div>
          </fieldset>

          <div class="form-check mb-4">
            <input
              class="form-check-input"
              type="checkbox"
              id="agreeTerms"
              name="agreeTerms"
              required
              aria-required="true"
              aria-describedby="agreeTermsDesc">
            <label class="form-check-label text-sm" for="agreeTerms">
              Я принимаю
              <a href="#" class="text-decoration-none fw-bold">условия использования</a>
              и
              <a href="#" class="text-decoration-none fw-bold">политику конфиденциальности</a>
            </label>
            <div id="agreeTermsDesc" class="visually-hidden">Обязательное поле. Необходимо принять условия для регистрации.</div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2">Зарегистрироваться</button>
        </form>

        <div class="auth-divider" role="separator" aria-label="или воспользуйтесь другим способом">или</div>

        <button
          class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2"
          type="button"
          aria-label="Зарегистрироваться через ВКонтакте"
          onclick="showToast('Регистрация через VK (заглушка)','info')">
          <i class="bi bi-chat-fill" aria-hidden="true"></i> Через VK
        </button>

        <p class="text-center mt-4 mb-0 text-sm-2">
          Уже есть аккаунт? <a href="login.html" class="fw-bold text-decoration-none">Войдите</a>
        </p>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
