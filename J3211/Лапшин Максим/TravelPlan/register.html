﻿<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - TravelPlan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm p-4" style="width: 400px;">
        <h3 class="text-center text-primary mb-4">TravelPlan</h3>
        <h5 class="text-center mb-4">Создание аккаунта</h5>
        <form action="dashboard.html">
            <div class="mb-3">
                <label class="form-label">Ваше Имя</label>
                <input type="text" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 mb-3">Зарегистрироваться</button>
            <div class="text-center">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </div>
        </form>
    </div>
</body>
</html>
