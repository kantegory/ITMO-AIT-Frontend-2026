<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск - TravelPlan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    
    <div class="sidebar p-3 d-flex flex-column" id="sidebar">
        <a href="index.html" class="d-flex align-items-center mb-3 text-decoration-none">
            <i class="bi bi-airplane-engines text-primary fs-3 me-2"></i>
            <span class="fs-4 fw-bold text-primary">TravelPlan</span>
        </a>
        <hr class="custom-divider">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="index.html" class="nav-link active"><i class="bi bi-search me-2"></i> Поиск туров</a></li>
            <li><a href="dashboard.html" class="nav-link"><i class="bi bi-person-circle me-2"></i> Кабинет</a></li>
            <li><a href="login.html" class="nav-link"><i class="bi bi-box-arrow-right me-2"></i> Вход</a></li>
        </ul>
        <hr>
        <a href="register.html" class="nav-link text-success"><i class="bi bi-person-plus me-2"></i> Регистрация</a>
    </div>
    
    <div class="main-content p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-light d-lg-none me-2" id="toggle-sidebar"><i class="bi bi-list"></i></button>
                <h2 class="m-0">Поиск направлений</h2>
            </div>
        </div>
        
        <div class="hero-header text-center">
            <h1 class="display-4">Откройте мир вместе с нами</h1>
            <p class="lead">Найдите идеальное место для вашего следующего приключения</p>
        </div>
        
        <div class="card p-4 mb-4 shadow-sm">
            <h4 class="mb-3">Фильтры поиска</h4>
            <form class="row g-3" id="search-form">
                <div class="col-md-4">
                    <label class="form-label">Тип отдыха</label>
                    <select class="form-select" name="type">
                        <option value="all">Любой</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Бюджет ($)</label>
                    <select class="form-select" name="budget">
                        <option value="">Любой</option>
                        <option value="low">Эконом (до $1000)</option>
                        <option value="medium">Стандарт ($1000-2500)</option>
                        <option value="high">Люкс (от $2500)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Длительность (дней)</label>
                    <input type="number" class="form-control" name="duration" placeholder="7" min="1" max="30">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-search me-2"></i>Найти маршруты
                    </button>
                </div>
            </form>
        </div>
        
        <div id="tours-container" class="mt-4"></div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
