<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск туров - TravelPlan</title>
    
    <script>
      (function() {
        console.log('[Theme] Early script running');
        try {
          const saved = localStorage.getItem('theme');
          console.log('[Theme] Early script found:', saved || 'light');
          document.documentElement.setAttribute('data-theme', saved || 'light');
        } catch (e) {
          console.warn('[Theme] Early script error:', e);
        }
      })();
    </script>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#main-content" class="visually-hidden-focusable">Перейти к основному контенту</a>
    
    <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>
    
    <nav class="sidebar p-3 d-flex flex-column" id="sidebar" role="navigation" aria-label="Основное меню">
        <a href="index.html" class="d-flex align-items-center mb-3 text-decoration-none">
            <svg class="bi me-2" width="32" height="32" aria-hidden="true">
                <use href="#airplane"/>
            </svg>
            <span class="fs-4 fw-bold text-primary">TravelPlan</span>
        </a>
        <hr class="custom-divider">
        <ul class="nav nav-pills flex-column mb-auto" role="menubar">
            <li class="nav-item" role="none">
                <a href="index.html" class="nav-link active" role="menuitem" aria-current="page">
                    <svg class="bi me-2" width="16" height="16" aria-hidden="true">
                        <use href="#search"/>
                    </svg>
                    Поиск туров
                </a>
            </li>
            <li role="none">
                <a href="dashboard.html" class="nav-link" role="menuitem">
                    <svg class="bi me-2" width="16" height="16" aria-hidden="true">
                        <use href="#user"/>
                    </svg>
                    Кабинет
                </a>
            </li>
            <li role="none">
                <a href="login.html" class="nav-link" role="menuitem">
                    <svg class="bi me-2" width="16" height="16" aria-hidden="true">
                        <use href="#login"/>
                    </svg>
                    Вход
                </a>
            </li>
        </ul>
        <hr>
        <a href="register.html" class="nav-link text-success" role="menuitem">
            <svg class="bi me-2" width="16" height="16" aria-hidden="true">
                <use href="#register"/>
            </svg>
            Регистрация
        </a>
        <button id="theme-toggle" class="btn btn-outline-secondary mt-3" aria-label="Переключить тему">
            <svg class="bi" width="16" height="16" aria-hidden="true">
                <use href="#sun"/>
            </svg>
        </button>
    </nav>
    
    <main class="main-content p-4" id="main-content" role="main">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-light d-lg-none me-2" id="toggle-sidebar" 
                        aria-label="Открыть меню" aria-expanded="false" aria-controls="sidebar">
                    <svg class="bi" width="24" height="24" aria-hidden="true">
                        <use href="#menu"/>
                    </svg>
                </button>
                <h1 class="h2 m-0">Поиск направлений</h1>
            </div>
        </div>
        
        <header class="hero-header text-center" role="banner">
            <h2 class="display-4">Откройте мир вместе с нами</h2>
            <p class="lead">Найдите идеальное место для вашего следующего приключения</p>
        </header>
        
        <section class="card p-4 mb-4 shadow-sm" aria-labelledby="filters-heading">
            <h3 id="filters-heading" class="h4 mb-3">Фильтры поиска</h3>
            <form class="row g-3" id="search-form" role="search">
                <div class="col-md-4">
                    <label for="tour-type" class="form-label">Тип отдыха</label>
                    <select class="form-select" id="tour-type" name="type">
                        <option value="all">Любой</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="tour-budget" class="form-label">Бюджет ($)</label>
                    <select class="form-select" id="tour-budget" name="budget">
                        <option value="">Любой</option>
                        <option value="low">Эконом (до $1000)</option>
                        <option value="medium">Стандарт ($1000-2500)</option>
                        <option value="high">Люкс (от $2500)</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label for="tour-duration" class="form-label">Длительность (дней)</label>
                    <input type="number" class="form-control" id="tour-duration" 
                           name="duration" placeholder="7" min="1" max="30">
                </div>
                <div class="col-12 text-end">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <svg class="bi me-2" width="16" height="16" aria-hidden="true">
                            <use href="#search"/>
                        </svg>
                        Найти маршруты
                    </button>
                </div>
            </form>
        </section>
        
        <section aria-labelledby="tours-heading">
            <h3 id="tours-heading" class="visually-hidden">Результаты поиска</h3>
            <div id="tours-container" class="mt-4" role="region" aria-live="polite"></div>
        </section>
    </main>
    
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
        <symbol id="airplane" viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5C13 2.67 12.33 2 11.5 2S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></symbol>
        <symbol id="search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></symbol>
        <symbol id="user" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
        <symbol id="login" viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></symbol>
        <symbol id="register" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
        <symbol id="logout" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></symbol>
        <symbol id="menu" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></symbol>
        <symbol id="sun" viewBox="0 0 24 24"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.79 1.41-1.41-1.79-1.79-1.41 1.41zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></symbol>
        <symbol id="moon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></symbol>
        <symbol id="avatar" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></symbol>
    </svg>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
