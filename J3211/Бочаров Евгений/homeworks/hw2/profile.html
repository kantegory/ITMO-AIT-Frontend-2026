<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark" aria-label="Главная навигация">
    <div class="container">
        <a class="navbar-brand" href="index.html" aria-label="MAX афиша - на главную">MAX афиша</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Вход</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Регистрация</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="profile.html">Личный кабинет</a></li>
                <li class="nav-item"><a class="nav-link" href="organizer.html">Организатору</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5" id="main-content">
    <h1 class="mb-4 fs-2">Личный кабинет пользователя</h1>
    <div class="row">
        <div class="col-md-3">
            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <img src="https://placebear.com/100/100" class="rounded-circle mb-3" alt="Аватар пользователя Иван Иванов">
                    <h2 class="fs-5">Иван Иванов</h2>
                    <p class="text-muted">ivan@mail.ru</p>
                </div>
            </div>
        </div>
        <div class="col-md-9">
            <div class="tab-container">
                <ul class="nav nav-tabs" id="profileTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="active-tickets-tab" data-bs-toggle="tab" data-bs-target="#active-tickets" type="button" role="tab" aria-controls="active-tickets" aria-selected="true">Мои билеты (2)</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="returns-tab" data-bs-toggle="tab" data-bs-target="#returns" type="button" role="tab" aria-controls="returns" aria-selected="false">Возвраты</button>
                    </li>
                </ul>
                <div class="tab-content p-4 border border-top-0 rounded-bottom shadow-sm" id="profileTabsContent">
                    <div class="tab-pane fade show active" id="active-tickets" role="tabpanel" aria-labelledby="active-tickets-tab">
                        <div class="list-group">
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <h3 class="fs-6">Вишневый сад</h3>
                                    <small class="text-muted">25 марта, 19:00, Ряд 14, Место 14</small>
                                </div>
                            </div>
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <h3 class="fs-6">Концерт "Руки Вверх"</h3>
                                    <small class="text-muted">22 марта, 20:00, Танц-пол</small>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="returns" role="tabpanel" aria-labelledby="returns-tab">
                        <p class="text-muted">Возвращенных билетов пока нет.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <span>&copy; 2026 eugeron52</span>
    </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</html>
