<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - MAX афиша</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg bg-dark navbar-dark" aria-label="Главная навигация">
    <div class="container">
        <a class="navbar-brand" href="index.html" aria-label="MAX афиша - на главную">MAX афиша</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Вход</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="register.html">Регистрация</a></li>
                <li class="nav-item"><a class="nav-link" href="profile.html">Личный кабинет</a></li>
                <li class="nav-item"><a class="nav-link" href="organizer.html">Организатору</a></li>
                <div class="d-flex">
                    <button class="btn btn-outline-light theme-switch" type="button" aria-label="Переключить тему">
                        <i class="fas fa-moon"></i> Тёмная тема
                    </button>
                </div>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-5" id="main-content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <i class="fas fa-user-plus fa-4x text-success mb-3" aria-hidden="true"></i>
                        <h1 class="fw-bold fs-2">Создать аккаунт</h1>
                        <p class="text-muted">Присоединяйтесь к нам!</p>
                    </div>

                    <form id="register-form" method="post" action="#" aria-label="Форма регистрации">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="firstName" class="form-label">Имя</label>
                                <div class="input-group">
                                    <span class="input-group-text" aria-hidden="true"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="firstName" placeholder="Иван" value="Иван" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="lastName" class="form-label">Фамилия</label>
                                <div class="input-group">
                                    <span class="input-group-text" aria-hidden="true"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="lastName" placeholder="Иванов" value="Иванов" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="name@example.com" value="ivan@mail.ru" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label">Телефон</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true"><i class="fas fa-phone"></i></span>
                                <input type="tel" class="form-control" id="phone" placeholder="+7 (999) 123-45-67" value="+7 (999) 123-45-67">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Пароль</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" value="123456" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                            <div class="input-group">
                                <span class="input-group-text" aria-hidden="true"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" value="123456" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" checked>
                                <label class="form-check-label" for="terms">
                                    Я согласен с <a href="#" data-bs-toggle="modal" data-bs-target="#termsModal">условиями использования</a>
                                </label>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <p class="mb-0">Уже есть аккаунт? <a href="login.html" class="text-decoration-none fw-bold">Войти</a></p>
                        </div>
                        <div id="register-error" class="alert alert-danger d-none" role="alert"></div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg" id="register-btn">Зарегистрироваться</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div class="modal fade" id="termsModal" tabindex="-1" aria-labelledby="termsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="termsModalLabel">Условия использования</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <div class="alert alert-secondary">
                    Здесь будет пользовательское соглашение.
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
        <span>&copy; 2026 eugeron52</span>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/theme.js"></script>
<script type="module">
    import { Auth } from './js/auth.js';

    document.getElementById('register-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('register-btn');
        const errorEl = document.getElementById('register-error');

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            errorEl.classList.remove('d-none');
            errorEl.textContent = 'Пароли не совпадают';
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Регистрация...';
        errorEl.classList.add('d-none');

        try {
            const userData = {
                email: document.getElementById('email').value,
                password: password,
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value || '',
                role: 'user'
            };

            await Auth.register(userData);
            // Редирект в auth.js
        } catch (error) {
            errorEl.classList.remove('d-none');
            errorEl.textContent = error.message;
        } finally {
            btn.disabled = false;
            btn.textContent = 'Зарегистрироваться';
        }
    });
</script>
</body>
</html>
