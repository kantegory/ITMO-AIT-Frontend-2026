<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — MLOps Deploy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <a class="visually-hidden-focusable" href="#main-content">Перейти к основному содержанию</a>

    <nav class="navbar navbar-expand-lg navbar-dark" aria-label="Основная навигация">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-gear-wide-connected me-1" aria-hidden="true"></i> MLOps Deploy
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Навигация">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="pipelines.html">Пайплайны</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="environments.html">Среды</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Кабинет</a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light btn-sm">Войти</a>
                    <a href="register.html" class="btn btn-primary btn-sm">Регистрация</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper" id="main-content">
        <div class="auth-card">
            <h2 class="text-center">Вход</h2>
            <p class="subtitle text-center">Войдите в свой аккаунт MLOps Deploy</p>

            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="user@example.com" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Показать пароль">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember">
                        <label class="form-check-label" for="remember">Запомнить меня</label>
                    </div>
                    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" class="text-decoration-none small">Забыли пароль?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">Войти</button>
                <p class="text-center text-muted small mb-0">
                    Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
                </p>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Если уже авторизован — редирект в кабинет
        if (isLoggedIn()) {
            window.location.href = 'profile.html';
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var errorEl = document.getElementById('loginError');
            errorEl.classList.add('d-none');

            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            document.getElementById('loginBtn').textContent = 'Вход...';
            document.getElementById('loginBtn').disabled = true;

            fetch(API_URL + '/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Неверный email или пароль');
                }
                return response.json();
            })
            .then(function(data) {
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'profile.html';
            })
            .catch(function(err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('d-none');
                document.getElementById('loginBtn').textContent = 'Войти';
                document.getElementById('loginBtn').disabled = false;
            });
        });
    </script>
</body>
</html>
