<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG-спрайт — MLOps Deploy</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151c28;
            --border: #1e2a3a;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #00d4aa;
        }
        body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; margin: 0; padding: 40px; }
        h1 { font-family: 'JetBrains Mono', monospace; font-size: 1.5rem; margin-bottom: 8px; }
        p.sub { color: var(--muted); margin-bottom: 32px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .icon-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 24px 16px;
            text-align: center;
            transition: border-color 0.15s;
        }
        .icon-card:hover { border-color: var(--accent); }
        .icon-card svg { width: 32px; height: 32px; color: var(--accent); margin-bottom: 10px; }
        .icon-card span { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="grid">
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-gear"></use></svg>
            <span>icon-gear</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-arrow-repeat"></use></svg>
            <span>icon-arrow-repeat</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-diagram"></use></svg>
            <span>icon-diagram</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-shield-check"></use></svg>
            <span>icon-shield-check</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-box"></use></svg>
            <span>icon-box</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-people"></use></svg>
            <span>icon-people</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-graph-up"></use></svg>
            <span>icon-graph-up</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-terminal"></use></svg>
            <span>icon-terminal</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-person"></use></svg>
            <span>icon-person</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-funnel"></use></svg>
            <span>icon-funnel</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-plus"></use></svg>
            <span>icon-plus</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-pencil"></use></svg>
            <span>icon-pencil</span>
        </div>
        <div class="icon-card">
            <svg><use href="sprite.svg#icon-person-plus"></use></svg>
            <span>icon-person-plus</span>
        </div>
    </div>

</body>
</html>
