<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — MLOps Deploy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-gear-wide-connected me-1"></i> MLOps Deploy
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Навигация">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="pipelines.html">Пайплайны</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="environments.html">Среды</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="profile.html">Кабинет</a>
                    </li>
                </ul>
                <div class="d-flex gap-2">
                    <a href="login.html" class="btn btn-outline-light btn-sm">Войти</a>
                    <a href="register.html" class="btn btn-primary btn-sm">Регистрация</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2 class="text-center">Регистрация</h2>
            <p class="subtitle text-center">Создайте аккаунт для работы с платформой</p>

            <form>
                <div class="row mb-3">
                    <div class="col">
                        <label for="firstName" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="firstName" placeholder="Иван" required>
                    </div>
                    <div class="col">
                        <label for="lastName" class="form-label">Фамилия</label>
                        <input type="text" class="form-control" id="lastName" placeholder="Иванов" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" placeholder="user@example.com" required>
                </div>
                <div class="mb-3">
                    <label for="company" class="form-label">Команда / Организация</label>
                    <input type="text" class="form-control" id="company" placeholder="Название команды">
                </div>
                <div class="mb-3">
                    <label for="role" class="form-label">Роль</label>
                    <select class="form-select" id="role">
                        <option value="developer">ML-инженер</option>
                        <option value="devops">DevOps-инженер</option>
                        <option value="ds">Data Scientist</option>
                        <option value="manager">Менеджер</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="regPassword" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="regPassword" placeholder="Минимум 8 символов" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Повторите пароль</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="Повторите пароль" required>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="agree" required>
                    <label class="form-check-label" for="agree">
                        Согласен с <a href="#">условиями использования</a>
                    </label>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Создать аккаунт</button>
                <p class="text-center text-muted small mb-0">
                    Уже есть аккаунт? <a href="login.html">Войти</a>
                </p>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
