<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Кабинет организатора - создание и управление мероприятиями. Статистика продаж, выручка, управление событиями.">
  <meta name="keywords" content="организатор, создание событий, статистика, выручка, управление">
  <meta name="author" content="Ямпольский Илья">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">

  <title>Яндекс Афиша - Организатор</title>
</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">Перейти к основному контенту</a>

<header role="banner">
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Яндекс Афиша</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">Поиск</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="dashboard.html">Мои билеты</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="returns.html">Возвраты</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="organizer.html">Организатор</a>
          </li>
        </ul>
        <form class="d-flex mx-auto my-2 my-lg-0" role="search" action="search.html">
          <label for="organizerSearch" class="visually-hidden">Поиск мероприятий</label>
          <input class="form-control me-2" type="search" name="q" id="organizerSearch" placeholder="Поиск..." aria-label="Поиск мероприятий">
          <button class="btn btn-outline-success" type="submit">Поиск</button>
        </form>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

            <a class="nav-link logout-link" href="#" onclick="logout()">Выход</a>
          </li>
        </ul>
      </div>
    </div>

</header>

<main id="main-content" style="padding: 1rem 0;">
  <section style="padding: 0 1rem;">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="organizer-heading">Кабинет организатора</h1>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal">+ Создать событие</button>
    </header>
    <article class="row g-3 mb-4">
      <div class="col-md-4">
        <article class="stat-box">
          <h2 id="eventsCount">0</h2>
          <p class="mb-0">Событий</p>
        </article>
      </div>
      <div class="col-md-4">
        <article class="stat-box">
          <h3 id="ticketsSold">0</h3>
          <p class="mb-0">Продано билетов</p>
        </article>
      </div>
      <div class="col-md-4">
        <article class="stat-box">
          <h4 id="revenue">0 ₽</h4>
          <p class="mb-0">Выручка</p>
        </article>
      </div>
    </article>
    <article class="card shadow-sm">
      <section class="card-body">
        <header>
          <h5 class="h5 mb-3">Мои мероприятия</h5>
        </header>
        <section style="overflow-x: auto;">
          <table style="width: 100% !important; min-width: 1000px !important; table-layout: fixed;">
            <thead class="table-light">
            <tr>
              <th style="min-width: 200px;">Событие</th>
              <th style="min-width: 120px;">Дата</th>
              <th style="min-width: 100px;">Город</th>
              <th style="min-width: 100px;">Место</th>
              <th style="min-width: 100px;">Цена</th>
              <th style="min-width: 100px;">Продано</th>
              <th style="min-width: 120px;">Выручка</th>
              <th style="min-width: 100px;">Действия</th>
            </tr>
            </thead>
            <tbody id="eventsTable"></tbody>
          </table>
        </section>
      </section>
    </article>
  </section>
</main>

<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="createModalLabel">Создать событие</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="eventTitle">Название</label>
          <input type="text" id="eventTitle" class="form-control" placeholder="Название мероприятия">
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventType">Тип</label>
          <select id="eventType" class="form-select">
            <option value="Концерт">Концерт</option>
            <option value="Театр">Театр</option>
            <option value="Выставка">Выставка</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventCity">Город</label>
          <select id="eventCity" class="form-select">
            <option value="Москва">Москва</option>
            <option value="СПб">СПб</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventVenue">Место проведения</label>
          <input type="text" id="eventVenue" class="form-control" placeholder="Адрес места проведения">
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventDescription">Описание</label>
          <textarea id="eventDescription" class="form-control" rows="3" placeholder="Описание мероприятия"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventImageUrl">Ссылка на фото</label>
          <input type="url" id="eventImageUrl" class="form-control" placeholder="https://example.com/image.jpg">
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventDate">Дата</label>
          <input type="date" id="eventDate" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventPrice">Цена</label>
          <input type="number" id="eventPrice" class="form-control" placeholder="500" min="0">
        </div>
        <div class="mb-3">
          <label class="form-label" for="eventCapacity">Количество мест</label>
          <input type="number" id="eventCapacity" class="form-control" placeholder="50" value="50" min="1">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" id="createEventBtn">Создать</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js" ></script>
<script>
  axios.defaults.baseURL = 'http://localhost:3000'

  axios.interceptors.request.use(config => {
    const token = localStorage.accessToken
    if (token) {
      config.headers.Authorization = `Bearer ${token}`
    }
    return config
  })

  function formatDate(dateString) {
    if (!dateString) return ''
    if (dateString.includes('-')) {
      const parts = dateString.split('-')
      if (parts[0].length === 4) {
        return `${parts[2]}-${parts[1]}-${parts[0]}`
      }
      return dateString
    }
    return dateString
  }

  function checkAuth() {
    if (!localStorage.accessToken) {
      window.location.href = "login.html"
    }
  }

  function checkOrganizerAccess() {
    const user = JSON.parse(localStorage.getItem('user'))
    if (!user || user.email !== 'sergo0_1337228007zzz@mail.ru') {
      alert('Доступ запрещён! Только для организатора.')
      window.location.href = "index.html"
      return false
    }
    return true
  }

  function getUser() {
    try {
      return JSON.parse(localStorage.getItem('user'))
    } catch (e) {
      return null
    }
  }

  async function loadEvents() {
    try {
      const eventsResponse = await axios.get('/events')
      const ticketsResponse = await axios.get('/tickets')
      const events = eventsResponse.data
      const tickets = ticketsResponse.data

      renderEvents(events, tickets)
      renderStats(events, tickets)
    } catch (error) {
      console.error('Error loading events:', error)
    }
  }

  function getSoldCountForEvent(eventId, tickets) {
    const eventTickets = tickets.filter(t => t.eventId === eventId)
    let count = 0
    eventTickets.forEach(ticket => {
      if (ticket.seats) {
        const seats = ticket.seats.split(',').map(s => s.trim())
        count += seats.length
      }
    })
    return count
  }

  function renderEvents(events, tickets) {
    const tbody = document.getElementById('eventsTable')
    if (!events || events.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">Нет мероприятий</td></tr>'
      return
    }
    tbody.innerHTML = events.map(event => {
      const soldCount = getSoldCountForEvent(event.id, tickets)
      const revenue = soldCount * event.price
      return `
                <tr>
                    <td style="border: 1px solid gray; padding: 8px;">${event.title}</td>
                    <td style="border: 1px solid gray; padding: 8px;">${formatDate(event.date)}</td>
                    <td style="border: 1px solid gray; padding: 8px;">${event.city}</td>
                    <td style="border: 1px solid gray; padding: 8px;">${event.venue || '-'}</td>
                    <td style="border: 1px solid gray; padding: 8px;">${event.price.toLocaleString()} ₽</td>
                    <td style="border: 1px solid gray; padding: 8px;">${soldCount} / ${event.capacity || 50}</td>
                    <td style="border: 1px solid gray; padding: 8px;">${revenue.toLocaleString()} ₽</td>
                    <td style="border: 1px solid gray; padding: 8px;">
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteEvent(${event.id})">Удалить</button>
                    </td>
                </tr>
            `
    }).join('')
  }

  function renderStats(events, tickets) {
    const totalEvents = events.length
    let totalTickets = 0
    let totalRevenue = 0

    events.forEach(event => {
      const soldCount = getSoldCountForEvent(event.id, tickets)
      totalTickets += soldCount
      totalRevenue += soldCount * event.price
    })

    document.getElementById('eventsCount').textContent = totalEvents
    document.getElementById('ticketsSold').textContent = totalTickets
    document.getElementById('revenue').textContent = `${totalRevenue.toLocaleString()} ₽`
  }

  async function createEvent() {
    try {
      const user = getUser()

      if (!user) {
        alert('Пользователь не авторизован')
        return
      }

      const title = document.getElementById('eventTitle').value
      const type = document.getElementById('eventType').value
      const city = document.getElementById('eventCity').value
      const venue = document.getElementById('eventVenue').value
      const description = document.getElementById('eventDescription').value
      const imageUrl = document.getElementById('eventImageUrl').value
      const dateInput = document.getElementById('eventDate').value
      const price = document.getElementById('eventPrice').value
      const capacity = document.getElementById('eventCapacity').value

      if (!title || !dateInput || !price) {
        alert('Заполните обязательные поля: Название, Дата, Цена')
        return
      }

      const formattedDate = formatDate(dateInput)

      const eventData = {
        title: title,
        type: type,
        city: city,
        venue: venue,
        description: description || '',
        imageUrl: imageUrl || 'https://placebear.com/800/400',
        date: formattedDate,
        price: parseInt(price),
        capacity: parseInt(capacity) || 50,
        userId: user.id,
        seats: {
          sold: [],
          selected: []
        }
      }

      await axios.post('/events', eventData)

      const modalElement = document.getElementById('createModal')
      const modal = bootstrap.Modal.getInstance(modalElement)
      if (modal) {
        modal.hide()
      }

      document.getElementById('eventTitle').value = ''
      document.getElementById('eventVenue').value = ''
      document.getElementById('eventDescription').value = ''
      document.getElementById('eventImageUrl').value = ''
      document.getElementById('eventDate').value = ''
      document.getElementById('eventPrice').value = ''

      await loadEvents()
      alert('Событие создано! Теперь оно доступно на главной странице и в поиске.')
    } catch (error) {
      console.error('Error creating event:', error)
      alert('Ошибка создания события: ' + (error.response?.data || error.message))
    }
  }

  async function deleteEvent(id) {
    if (confirm('Удалить событие?')) {
      try {
        await axios.delete(`/events/${id}`)
        await loadEvents()
      } catch (error) {
        console.error('Error deleting event:', error)
        alert('Ошибка удаления')
      }
    }
  }

  async function logout() {
    localStorage.clear()
    window.location.href = "login.html"
  }

  document.addEventListener('DOMContentLoaded', () => {
    checkAuth()
    if (!checkOrganizerAccess()) return
    loadEvents()

    const createBtn = document.getElementById('createEventBtn')
    if (createBtn) {
      createBtn.addEventListener('click', createEvent)
    }
  })
</script>
</body>
</html>
