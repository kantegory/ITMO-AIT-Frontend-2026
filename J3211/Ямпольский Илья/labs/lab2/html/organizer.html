<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Яндекс Афиша - Организатор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">Перейти к основному контенту</a>

<header role="banner">
  <nav class="navbar navbar-expand-lg bg-body-tertiary" role="navigation" aria-label="Основная навигация">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html" aria-label="Яндекс Афиша - на главную">Яндекс Афиша</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-expanded="false" aria-controls="navbarContent" aria-label="Переключить навигацию">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" role="menubar">
          <li class="nav-item" role="none">
            <a class="nav-link" href="index.html" role="menuitem">Главная</a>
          </li>
          <li class="nav-item" role="none">
            <a class="nav-link" href="search.html" role="menuitem">Поиск</a>
          </li>
          <li class="nav-item" role="none">
            <a class="nav-link" href="dashboard.html" role="menuitem">Мои билеты</a>
          </li>
          <li class="nav-item" role="none">
            <a class="nav-link" href="returns.html" role="menuitem">Возвраты</a>
          </li>
          <li class="nav-item" role="none">
            <a class="nav-link active" href="organizer.html" aria-current="page" role="menuitem">Организатор</a>
          </li>
        </ul>
        <form class="d-flex mx-auto my-2 my-lg-0" role="search" action="search.html" aria-label="Поиск по сайту">
          <label for="organizerSearch" class="visually-hidden">Поиск мероприятий</label>
          <input class="form-control me-2" type="search" name="q" id="organizerSearch" placeholder="Поиск..." aria-label="Поиск мероприятий">
          <button class="btn btn-outline-success" type="submit">Поиск</button>
        </form>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link text-danger" href="#" onclick="logout()" role="menuitem">Выход</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main id="main-content" style="padding: 1rem 0;" role="main">
  <section style="padding: 0 1rem;" aria-labelledby="organizer-heading">
    <header class="d-flex justify-content-between align-items-center mb-4">
      <h1 id="organizer-heading">Кабинет организатора</h1>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createModal" aria-label="Создать новое событие">+ Создать событие</button>
    </header>
    <article class="row g-3 mb-4" aria-label="Статистика">
      <div class="col-md-4">
        <article class="stat-box">
          <h4 id="eventsCount">0</h4>
          <p class="mb-0">Событий</p>
        </article>
      </div>
      <div class="col-md-4">
        <article class="stat-box">
          <h4 id="ticketsSold">0</h4>
          <p class="mb-0">Продано билетов</p>
        </article>
      </div>
      <div class="col-md-4">
        <article class="stat-box">
          <h4 id="revenue">0 ₽</h4>
          <p class="mb-0">Выручка</p>
        </article>
      </div>
    </article>
    <article class="card shadow-sm" aria-labelledby="events-table-heading">
      <section class="card-body">
        <header>
          <h2 id="events-table-heading" class="mb-3">Мои мероприятия</h2>
        </header>
        <section style="overflow-x: auto;">
          <table style="width: 100% !important; min-width: 1000px !important; table-layout: fixed;" aria-describedby="events-table-heading">
            <thead class="table-light">
            <tr>
              <th style="min-width: 200px;" scope="col">Событие</th>
              <th style="min-width: 120px;" scope="col">Дата</th>
              <th style="min-width: 100px;" scope="col">Город</th>
              <th style="min-width: 100px;" scope="col">Цена</th>
              <th style="min-width: 100px;" scope="col">Продано</th>
              <th style="min-width: 120px;" scope="col">Выручка</th>
              <th style="min-width: 100px;" scope="col">Действия</th>
            </tr>
            </thead>
            <tbody id="eventsTable" aria-live="polite"></tbody>
          </table>
        </section>
      </section>
    </article>
  </section>
</main>

<div class="modal fade" id="createModal" tabindex="-1" aria-labelledby="createModalLabel" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="createModalLabel">Создать событие</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть модальное окно"></button>
      </div>
      <div class="modal-body">
        <form id="createEventForm">
          <div class="mb-3">
            <label class="form-label" for="eventTitle">Название</label>
            <input type="text" id="eventTitle" class="form-control" placeholder="Название мероприятия" aria-required="true">
          </div>
          <div class="mb-3">
            <label class="form-label" for="eventCity">Город</label>
            <select id="eventCity" class="form-select" aria-required="true">
              <option value="Москва">Москва</option>
              <option value="СПб">СПб</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="eventVenue">Место проведения</label>
            <input type="text" id="eventVenue" class="form-control" placeholder="Адрес">
          </div>
          <div class="mb-3">
            <label class="form-label" for="eventDate">Дата</label>
            <input type="date" id="eventDate" class="form-control" aria-required="true">
          </div>
          <div class="mb-3">
            <label class="form-label" for="eventPrice">Цена</label>
            <input type="number" id="eventPrice" class="form-control" placeholder="500" aria-required="true" min="0">
          </div>
          <div class="mb-3">
            <label class="form-label" for="eventCapacity">Количество мест</label>
            <input type="number" id="eventCapacity" class="form-control" placeholder="50" value="50" min="1">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" onclick="createEvent()">Создать</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  axios.defaults.baseURL = 'http://localhost:3000'

  axios.interceptors.request.use(config => {
    const token = localStorage.accessToken
    if (token) {
      config.headers.Authorization = `Bearer ${token}`
    }
    return config
  })

  function checkAuth() {
    if (!localStorage.accessToken) {
      window.location.href = "login.html"
    }
  }

  function getUser() {
    return JSON.parse(localStorage.getItem('user'))
  }

  async function loadEvents() {
    try {
      const eventsResponse = await axios.get('/events')
      const ticketsResponse = await axios.get('/tickets')
      const events = eventsResponse.data
      const tickets = ticketsResponse.data

      renderEvents(events, tickets)
      renderStats(events, tickets)
    } catch (error) {
      console.error('Error:', error)
    }
  }

  function getSoldCountForEvent(eventId, tickets) {
    const eventTickets = tickets.filter(t => t.eventId === eventId)
    let count = 0
    eventTickets.forEach(ticket => {
      if (ticket.seats) {
        const seats = ticket.seats.split(',').map(s => s.trim())
        count += seats.length
      }
    })
    return count
  }

  function renderEvents(events, tickets) {
    const tbody = document.getElementById('eventsTable')
    if (!events || events.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Нет мероприятий</td></tr>'
      return
    }
    tbody.innerHTML = events.map(event => {
      const soldCount = getSoldCountForEvent(event.id, tickets)
      const revenue = soldCount * event.price
      return `
                    <tr>
                        <td style="border: 1px solid gray; padding: 8px;">${event.title}</td>
                        <td style="border: 1px solid gray; padding: 8px;">${event.date}</td>
                        <td style="border: 1px solid gray; padding: 8px;">${event.city}</td>
                        <td style="border: 1px solid gray; padding: 8px;">${event.price.toLocaleString()} ₽</td>
                        <td style="border: 1px solid gray; padding: 8px;">${soldCount} / ${event.capacity || 50}</td>
                        <td style="border: 1px solid gray; padding: 8px;">${revenue.toLocaleString()} ₽</td>
                        <td style="border: 1px solid gray; padding: 8px;">
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteEvent(${event.id})" aria-label="Удалить событие ${event.title}">Удалить</button>
                        </td>
                    </tr>
                `
    }).join('')
  }

  function renderStats(events, tickets) {
    const totalEvents = events.length
    let totalTickets = 0
    let totalRevenue = 0

    events.forEach(event => {
      const soldCount = getSoldCountForEvent(event.id, tickets)
      totalTickets += soldCount
      totalRevenue += soldCount * event.price
    })

    document.getElementById('eventsCount').textContent = totalEvents
    document.getElementById('ticketsSold').textContent = totalTickets
    document.getElementById('revenue').textContent = `${totalRevenue.toLocaleString()} ₽`
  }

  async function createEvent() {
    try {
      const user = getUser()
      const eventData = {
        title: document.getElementById('eventTitle').value,
        city: document.getElementById('eventCity').value,
        venue: document.getElementById('eventVenue').value,
        date: document.getElementById('eventDate').value,
        price: parseInt(document.getElementById('eventPrice').value),
        capacity: parseInt(document.getElementById('eventCapacity').value) || 50,
        userId: user.id,
        seats: {
          sold: [],
          selected: []
        }
      }

      if (!eventData.title || !eventData.date || !eventData.price) {
        alert('Заполните обязательные поля')
        return
      }

      await axios.post('/events', eventData)

      const modalElement = document.getElementById('createModal')
      const modal = bootstrap.Modal.getInstance(modalElement)
      if (modal) {
        modal.hide()
      }

      document.getElementById('eventTitle').value = ''
      document.getElementById('eventVenue').value = ''
      document.getElementById('eventDate').value = ''
      document.getElementById('eventPrice').value = ''

      await loadEvents()
      alert('Событие создано!')
    } catch (error) {
      console.error('Error creating event:', error)
      alert('Ошибка создания события')
    }
  }

  async function deleteEvent(id) {
    if (confirm('Удалить событие?')) {
      try {
        await axios.delete(`/events/${id}`)
        await loadEvents()
      } catch (error) {
        console.error('Error deleting event:', error)
        alert('Ошибка удаления')
      }
    }
  }

  async function logout() {
    localStorage.clear()
    window.location.href = "login.html"
  }

  document.addEventListener('DOMContentLoaded', () => {
    checkAuth()
    loadEvents()
  })
</script>
</body>
</html>
