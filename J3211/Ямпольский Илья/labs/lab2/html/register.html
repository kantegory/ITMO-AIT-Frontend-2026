<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Регистрация на Яндекс Афише. Создайте аккаунт для покупки билетов, отслеживания заказов и возврата средств.">
    <meta name="keywords" content="регистрация, создать аккаунт, новый пользователь">
    <meta name="author" content="Ямпольский Илья">

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">

    <title>Яндекс Афиша - Регистрация</title>
</head>
<body>
<a href="#main-content" class="visually-hidden-focusable">Перейти к основному контенту</a>

<header>
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="login.html">Яндекс Афиша</a>
        </div>
    </nav>
</header>

<main id="main-content">
    <section class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
        <article class="card shadow-sm" style="width: 400px;">
            <section class="card-body p-4">
                <header>
                    <h1 class="text-center mb-4">Регистрация</h1>
                </header>
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Имя</label>
                        <label>
                            <input type="text" name="firstName" class="form-control" placeholder="Иван" required>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Фамилия</label>
                        <label>
                            <input type="text" name="lastName" class="form-control" placeholder="Иванов" required>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <label>
                            <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
                        </label>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <label>
                            <input type="password" name="password" class="form-control" placeholder="********" required>
                        </label>
                    </div>
                    <footer>
                        <button type="submit" class="btn btn-primary w-100">Создать аккаунт</button>
                    </footer>
                </form>
                <footer class="text-center mt-3 mb-0 small">
                    Есть аккаунт? <a href="login.html">Войти</a>
                </footer>
            </section>
        </article>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js" ></script>
<script>
    async function register(event) {
        event.preventDefault()
        const formData = new FormData(event.target)
        const registerData = {}
        formData.forEach((value, label) => registerData[label] = value)

        try {
            const response = await axios.post('http://localhost:3000/signup', registerData)
            const { accessToken, user } = response.data

            localStorage.accessToken = accessToken
            localStorage.user = JSON.stringify(user)

            window.location.href = "index.html"
        } catch (error) {
            alert('Ошибка: ' + (error.response?.data || error.message))
        }
    }

    document.getElementById('registerForm')?.addEventListener('submit', register)
</script>
</body>
</html>
