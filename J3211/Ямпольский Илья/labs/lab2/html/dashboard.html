<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Яндекс Афиша - Мои билеты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>

<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Яндекс Афиша</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="search.html">Поиск</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="dashboard.html">Мои билеты</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="returns.html">Возвраты</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="organizer.html">Организатор</a>
          </li>
        </ul>
        <form class="d-flex mx-auto my-2 my-lg-0" role="search" action="search.html">
          <input class="form-control me-2" type="search" name="q" placeholder="Поиск..." aria-label="Search">
          <button class="btn btn-outline-success" type="submit">Поиск</button>
        </form>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link text-danger" href="#" onclick="logout()">Выход</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<main style="padding-top: 1rem;">
  <section class="dashboard-content container py-4">
    <header>
      <h4 class="mb-4">Мои билеты</h4>
    </header>
    <article class="row g-4" id="ticketsContainer"></article>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  axios.defaults.baseURL = 'http://localhost:3000'

  axios.interceptors.request.use(config => {
    const token = localStorage.accessToken
    if (token) {
      config.headers.Authorization = 'Bearer ' + token
    }
    return config
  })

  function checkAuth() {
    if (!localStorage.accessToken) {
      window.location.href = "login.html"
    }
  }

  function getUser() {
    return JSON.parse(localStorage.getItem('user'))
  }

  async function loadTickets() {
    try {
      const user = getUser()
      const response = await axios.get('/tickets', { params: { userId: user.id, status: 'active' } })
      renderTickets(response.data)
    } catch (error) {
      console.error('Error:', error)
    }
  }

  function renderTickets(tickets) {
    const container = document.getElementById('ticketsContainer')
    if (!tickets || tickets.length === 0) {
      container.innerHTML = '<p class="text-muted">У вас пока нет билетов</p>'
      return
    }
    container.innerHTML = tickets.map(ticket => `
            <div class="col-12 col-lg-6">
                <article class="card shadow-sm ticket-item h-100">
                    <section class="card-body">
                        <header class="d-flex justify-content-between">
                            <h5 class="mb-1">${ticket.eventName || 'Билет #' + ticket.id}</h5>
                            <span class="badge bg-success">${ticket.totalPrice.toLocaleString()} ₽</span>
                        </header>
                        <p class="text-muted mb-1">Места: ${ticket.seats}</p>
                        <p class="text-muted mb-1">Дата покупки: ${ticket.purchaseDate}</p>
                        <footer class="d-flex justify-content-between align-items-center mt-2">
                            <small class="text-muted">Заказ #${ticket.id}</small>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="returnTicket(${ticket.id}, ${ticket.totalPrice})">Вернуть</button>
                        </footer>
                    </section>
                </article>
            </div>
        `).join('')
  }

  async function returnTicket(ticketId, amount) {
    if (!confirm('Вернуть билет? Средства будут возвращены в течение 3-5 рабочих дней.')) {
      return
    }

    try {
      const user = getUser()
      const returnData = {
        ticketId: ticketId,
        userId: user.id,
        status: 'processing',
        requestDate: new Date().toISOString().split('T')[0],
        amount: amount
      }

      await axios.post('/returns', returnData)

      await axios.patch('/tickets/' + ticketId, { status: 'returned' })

      alert('Заявка на возврат создана!')
      await loadTickets()
    } catch (error) {
      console.error('Error returning ticket:', error)
      alert('Ошибка при создании заявки на возврат')
    }
  }

  async function logout() {
    localStorage.clear()
    window.location.href = "login.html"
  }

  document.addEventListener('DOMContentLoaded', () => {
    checkAuth()
    loadTickets()
  })
</script>
</body>
</html>
