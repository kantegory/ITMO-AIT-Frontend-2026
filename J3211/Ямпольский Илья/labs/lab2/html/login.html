<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Яндекс Афиша - Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
</head>
<body>

<header>
  <nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="login.html">Яндекс Афиша</a>
    </div>
  </nav>
</header>

<main>
  <section class="d-flex justify-content-center align-items-center" style="min-height: calc(100vh - 56px);">
    <article class="card shadow-sm" style="width: 400px;">
      <section class="card-body p-4">
        <header>
          <h4 class="text-center mb-4">Вход</h4>
        </header>
        <form id="loginForm">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <label>
              <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
            </label>
          </div>
          <div class="mb-3">
            <label class="form-label">Пароль</label>
            <label>
              <input type="password" name="password" class="form-control" placeholder="********" required>
            </label>
          </div>
          <footer>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
          </footer>
        </form>
        <footer class="text-center mt-3 mb-0 small">
          Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </footer>
      </section>
    </article>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function checkAuth() {
    if (localStorage.accessToken) {
      window.location.href = "index.html"
    }
  }

  async function login(event) {
    event.preventDefault()
    const formData = new FormData(event.target)
    const loginData = {}
    formData.forEach((value, label) => loginData[label] = value)

    try {
      const response = await axios.post('http://localhost:3000/login', loginData)
      const { accessToken, user } = response.data

      localStorage.accessToken = accessToken
      localStorage.user = JSON.stringify(user)

      window.location.href = "index.html"
    } catch (error) {
      alert('Ошибка: ' + (error.response?.data || error.message))
    }
  }

  document.getElementById('loginForm')?.addEventListener('submit', login)
  document.addEventListener('DOMContentLoaded', () => checkAuth())
</script>
</body>
</html>
