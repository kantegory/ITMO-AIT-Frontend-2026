<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Регистрация на платформе Learnify. Создайте аккаунт для доступа к онлайн-курсам по программированию, дизайну и веб-разработке.">
    <meta name="color-scheme" content="light dark">
    <title>Регистрация — Learnify</title>

    <link rel="preload" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/light.css">
    <link rel="stylesheet" href="css/dark.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages.css">
    
</head>

<body>
    <a href="#main-content" class="skip-link">Перейти к основному содержимому</a>
    <div id="navbar-container" style="min-height:56px"></div>

    <main class="container my-5" id="main-content" tabindex="-1">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card">
                    <div class="card-body p-4 p-md-5">
                        <h1 class="h3 text-center mb-4">Регистрация</h1>

                        <form id="registerForm" novalidate>
                            <div class="mb-3">
                                <label for="registerName" class="form-label">Имя</label>
                                <input type="text" class="form-control" id="registerName" name="name"
                                    placeholder="Ваше имя" autocomplete="name" required>
                            </div>

                            <div class="mb-3">
                                <label for="registerEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="registerEmail" name="email"
                                    placeholder="name@example.com" autocomplete="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="registerPassword" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="registerPassword" name="password"
                                    placeholder="Минимум 6 символов" autocomplete="new-password" required minlength="6">
                            </div>

                            <div class="mb-3">
                                <label for="registerPasswordConfirm" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control" id="registerPasswordConfirm" name="passwordConfirm"
                                    placeholder="Повторите пароль" autocomplete="new-password" required>
                            </div>

                            <div id="formError" class="text-danger small mb-3" style="display: none;" role="alert" aria-live="assertive"></div>

                            <button type="submit" class="btn btn-primary-custom w-100">
                                Зарегистрироваться
                            </button>
                        </form>

                        <p class="text-center mt-3 small mb-0">
                            Уже есть аккаунт? <a href="login.html">Войти</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4" role="contentinfo">
        <div class="container text-center">
            <p class="mb-1 fw-semibold">Learnify</p>
            <p class="mb-0 small text-light">Платформа для онлайн-курсов и обучения</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/theme.js" defer></script>
    <script src="js/storage.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/auth.js" defer></script>
</body>

</html>
