<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет - TravelPlan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div class="sidebar p-3 d-flex flex-column" id="sidebar">
        <a href="index.html" class="d-flex align-items-center mb-3 text-decoration-none">
            <i class="bi bi-airplane-engines text-primary fs-3 me-2"></i>
            <span class="fs-4 fw-bold text-primary">TravelPlan</span>
        </a>
        <hr class="custom-divider">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item"><a href="index.html" class="nav-link"><i class="bi bi-search me-2"></i> Поиск туров</a></li>
            <li><a href="dashboard.html" class="nav-link active"><i class="bi bi-person-circle me-2"></i> Кабинет</a></li>
            <li><a href="login.html" class="nav-link text-danger"><i class="bi bi-box-arrow-left me-2"></i> Выход</a></li>
        </ul>
    </div>
    <div class="main-content p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center">
                <button class="btn btn-light d-lg-none me-2" id="toggle-sidebar"><i class="bi bi-list"></i></button>
                <h2 class="m-0">Личный кабинет</h2>
            </div>
        </div>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body text-center">
                        <img src="https://source.unsplash.com/150x150/?portrait" class="rounded-circle mb-3" alt="User">
                        <h4>Алексей Петров</h4>
                        <p class="text-muted">Путешественник</p>
                        <hr>
                        <div class="d-grid gap-2">
                            <button class="btn btn-outline-primary">Профиль</button>
                            <button class="btn btn-outline-danger">Выйти</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Мои сохранённые маршруты</h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            <a href="#" class="list-group-item list-group-item-action">
                                <div>
                                    <h6 class="mb-1">Поездка в Карелию</h6>
                                    <small class="text-muted">Запланировано на: 20.05.2026</small>
                                </div>
                            </a>
                            <a href="#" class="list-group-item list-group-item-action">
                                <div>
                                    <h6 class="mb-1">Выходные в Санкт-Петербурге</h6>
                                    <small class="text-muted">Завершено: 10.01.2026</small>
                                </div>
                            </a>
                        </div>
                    </div>
                </div>
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">Путевые заметки</h5>
                    </div>
                    <div class="card-body">
                        <textarea class="form-control mb-3" rows="5" placeholder="Ваши впечатления..."></textarea>
                        <button class="btn btn-primary">Сохранить</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
