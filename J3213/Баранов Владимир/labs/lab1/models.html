<!doctype html>
<html lang="ru">
    <head>
        <title>PipelineLab - Модели</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                <div class="container">

                    <a class="navbar-brand" href="index.html">PipelineLab</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarMenu">

                        <div class="navbar-nav ms-auto">
                            <a class="nav-link" href="index.html">Главная</a>
                            <a class="nav-link" href="dashboard.html">Личный кабинет</a>
                            <a class="nav-link" href="experiments.html">Эксперименты</a>
                            <a class="nav-link" href="models.html">Модели</a>
                            <a class="nav-link" href="login.html" id="navAuthLink">Вход</a>
                        </div>

                    </div>

                </div>

            </nav>
        </header>

        <main>
            <div class="container mt-5 mb-5">

                <h1 class="mb-4">Модели</h1>

                <div class="card">
                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Список моделей</h5>
                            <button type="button" class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#createModelModal">
                                + Зарегистрировать модель
                            </button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped mb-0" id="modelsTable">
                                <thead>
                                    <tr>
                                        <th scope="col">Название</th>
                                        <th scope="col">Версия</th>
                                        <th scope="col">Статус</th>
                                        <th scope="col">Дата</th>
                                        <th scope="col">Действия</th>
                                    </tr>
                                </thead>
                                <tbody id="modelsTbody">
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>

            </div>
        </main>

        <!-- Modal: регистрация модели -->
        <div class="modal fade" id="createModelModal" tabindex="-1" aria-labelledby="createModelModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="createModelModalLabel">Зарегистрировать модель</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
                    </div>
                    <form id="createModelForm">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="modelNameInput" class="form-label">Название модели</label>
                                <input type="text" class="form-control" id="modelNameInput" placeholder="Например: ResNet-50" required>
                            </div>
                            <div class="mb-3">
                                <label for="modelVersionInput" class="form-label">Версия</label>
                                <input type="text" class="form-control" id="modelVersionInput" placeholder="Например: v1.0" required>
                            </div>
                            <div class="mb-3">
                                <label for="modelFramework" class="form-label">Фреймворк</label>
                                <select class="form-select" id="modelFramework">
                                    <option value="PyTorch">PyTorch</option>
                                    <option value="TensorFlow">TensorFlow</option>
                                    <option value="scikit-learn">scikit-learn</option>
                                    <option value="XGBoost">XGBoost</option>
                                    <option value="ONNX">ONNX</option>
                                </select>
                            </div>
                            <div id="createModelError" class="alert alert-danger d-none"></div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                            <button type="submit" class="btn btn-primary">Зарегистрировать</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/models.js"></script>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
