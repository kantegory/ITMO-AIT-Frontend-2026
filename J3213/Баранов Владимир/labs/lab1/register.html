<!doctype html>
<html lang="ru">
    <head>
        <title>PipelineLab - Регистрация</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="description" content="Регистрация в PipelineLab: создание аккаунта для работы с экспериментами и моделями." />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d6efd'/%3E%3C/svg%3E" type="image/svg+xml" />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="style.css">
        <script src="js/theme.js"></script>
    </head>

    <body>
        <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" display="none">
            <!-- Feather Icons v4.29 (MIT) https://github.com/feathericons/feather -->

            <symbol id="artifactCube" viewBox="0 0 24 24">
                <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                    <line x1="12" y1="22.08" x2="12" y2="12"/>
                </g>
            </symbol>
        </svg>
        <header>
            <nav class="navbar navbar-expand-lg navbar-themed">

                <div class="container"> 

                    <a class="navbar-brand d-inline-flex align-items-center gap-2" href="index.html"><svg class="icon icon--brand" aria-hidden="true" focusable="false"><use xlink:href="#artifactCube"></use></svg>PipelineLab</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Открыть меню навигации">
                        <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarMenu">

                        <div class="navbar-nav ms-auto align-items-lg-center flex-lg-row gap-lg-1">
                            <a class="nav-link" href="index.html">Главная</a>
                            <a class="nav-link" href="dashboard.html">Личный кабинет</a>
                            <a class="nav-link" href="experiments.html">Эксперименты</a>
                            <a class="nav-link" href="models.html">Модели</a>
                            <a class="nav-link" href="login.html" id="navAuthLink">Вход</a>
                            <button type="button" class="btn btn-theme-toggle ms-lg-2" id="themeToggle" aria-pressed="false" aria-label="Включить тёмную тему Pipeline" title="Сейчас тема Lab — переключить на Pipeline">
                                <span class="btn-theme-toggle__icon" data-show-when="lab" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8l4 4-4 4M14 16h4"/></svg>
                                </span>
                                <span class="btn-theme-toggle__icon d-none" data-show-when="pipeline" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                                </span>
                            </button>
                        </div>

                    </div>

                </div>

            </nav>
        </header>
        <main class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card p-4">
                        <h1 class="h2 text-center mb-4">Регистрация</h1>
                        
                        <div class="alert alert-danger d-none" id="registerError"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="username"
                                    id="username"
                                    placeholder="Введите имя"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    id="email"
                                    placeholder="example@mail.com"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    id="password"
                                    placeholder="Введите пароль"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    name="confirmPassword"
                                    id="confirmPassword"
                                    placeholder="Повторите пароль"
                                    required
                                />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Зарегистрироваться
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="login.html">Уже есть аккаунт? Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="app-footer border-top mt-5 py-4">
            <div class="container text-center small">
                <p class="mb-0">PipelineLab — учебный проект по фронтенд-разработке</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/register.js"></script>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
