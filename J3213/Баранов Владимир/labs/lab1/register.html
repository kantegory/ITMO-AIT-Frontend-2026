<!doctype html>
<html lang="ru">
    <head>
        <title>PipelineLab - Регистрация</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="description" content="Регистрация в PipelineLab: создание аккаунта для работы с экспериментами и моделями." />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d6efd'/%3E%3C/svg%3E" type="image/svg+xml" />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                <div class="container"> 

                    <a class="navbar-brand" href="index.html">PipelineLab</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Открыть меню навигации">
                        <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarMenu">

                        <div class="navbar-nav ms-auto">
                            <a class="nav-link" href="index.html">Главная</a>
                            <a class="nav-link" href="dashboard.html">Личный кабинет</a>
                            <a class="nav-link" href="experiments.html">Эксперименты</a>
                            <a class="nav-link" href="models.html">Модели</a>
                            <a class="nav-link" href="login.html" id="navAuthLink">Вход</a>
                        </div>

                    </div>

                </div>

            </nav>
        </header>
        <main class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card p-4">
                        <h1 class="h2 text-center mb-4">Регистрация</h1>
                        
                        <div class="alert alert-danger d-none" id="registerError"></div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="username"
                                    id="username"
                                    placeholder="Введите имя"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    id="email"
                                    placeholder="example@mail.com"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    id="password"
                                    placeholder="Введите пароль"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">Подтвердите пароль</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    name="confirmPassword"
                                    id="confirmPassword"
                                    placeholder="Повторите пароль"
                                    required
                                />
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                Зарегистрироваться
                            </button>
                        </form>

                        <div class="text-center mt-3">
                            <a href="login.html">Уже есть аккаунт? Войти</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="border-top mt-5 py-4 bg-white">
            <div class="container text-center small text-muted">
                <p class="mb-0">PipelineLab — учебный проект по фронтенд-разработке</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/register.js"></script>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
