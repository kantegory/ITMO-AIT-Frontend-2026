<!doctype html>
<html lang="ru">
    <head>
        <title>PipelineLab - Эксперимент</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="description" content="Карточка эксперимента PipelineLab: описание, метрики, артефакты, логи и смена статуса." />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d6efd'/%3E%3C/svg%3E" type="image/svg+xml" />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="style.css">
        <script src="js/theme.js"></script>
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-themed">

                <div class="container">

                    <a class="navbar-brand" href="index.html">PipelineLab</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Открыть меню навигации">
                        <span class="navbar-toggler-icon" aria-hidden="true"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarMenu">

                        <div class="navbar-nav ms-auto align-items-lg-center flex-lg-row gap-lg-1">
                            <a class="nav-link" href="index.html">Главная</a>
                            <a class="nav-link" href="dashboard.html">Личный кабинет</a>
                            <a class="nav-link active" href="experiments.html">Эксперименты</a>
                            <a class="nav-link" href="models.html">Модели</a>
                            <a class="nav-link" href="login.html" id="navAuthLink">Вход</a>
                            <button type="button" class="btn btn-theme-toggle ms-lg-2" id="themeToggle" aria-pressed="false" aria-label="Включить тёмную тему Pipeline" title="Сейчас тема Lab — переключить на Pipeline">
                                <span class="btn-theme-toggle__icon" data-show-when="lab" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8l4 4-4 4M14 16h4"/></svg>
                                </span>
                                <span class="btn-theme-toggle__icon d-none" data-show-when="pipeline" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
                                </span>
                            </button>
                        </div>

                    </div>

                </div>

            </nav>
        </header>

        <main>
            <div class="container mt-5 mb-5">

                <h1 class="mb-4" id="experimentTitle">Эксперимент</h1>

                <div class="row">

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3">Информация об эксперименте</h2>

                                <p class="mb-1"><strong>Название:</strong> <span id="expName">-</span></p>
                                <p class="mb-1"><strong>Статус:</strong> <span id="expStatus">-</span></p>
                                <p class="mb-1"><strong>Этап:</strong> <span id="expStage">-</span></p>
                                <p class="mb-1"><strong>Модель:</strong> <span id="expModel">-</span></p>
                                <p class="mb-1"><strong>Автор:</strong> <span id="expAuthor">-</span></p>
                                <p class="mb-1"><strong>Дата запуска:</strong> <span id="expDate">-</span></p>
                                <p class="mb-1"><strong>Теги:</strong> <span id="expTags">-</span></p>
                                <p class="mb-0"><strong>Описание:</strong> <span id="expDescription">-</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3">Метрики</h2>

                                <form id="addMetricForm" class="mb-3">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label for="metricNameInput" class="visually-hidden">Название метрики</label>
                                            <input type="text" class="form-control" id="metricNameInput" placeholder="Metric name" required>
                                        </div>
                                        <div class="col-4">
                                            <label for="metricValueInput" class="visually-hidden">Значение метрики</label>
                                            <input type="number" class="form-control" id="metricValueInput" placeholder="Value" step="0.0001" required>
                                        </div>
                                        <div class="col-2 d-grid">
                                            <button type="submit" class="btn btn-sm btn-primary" aria-label="Добавить метрику">+</button>
                                        </div>
                                    </div>
                                </form>

                                <ul class="mb-0" id="metricsList">
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3">Артефакты</h2>

                                <form id="addArtifactForm" class="mb-3">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <label for="artifactNameInput" class="visually-hidden">Название артефакта</label>
                                            <input type="text" class="form-control" id="artifactNameInput" placeholder="Artifact name" required>
                                        </div>
                                        <div class="col-4">
                                            <label for="artifactTypeInput" class="visually-hidden">Тип артефакта</label>
                                            <select class="form-select" id="artifactTypeInput">
                                                <option value="model">model</option>
                                                <option value="image">image</option>
                                                <option value="config">config</option>
                                                <option value="metrics">metrics</option>
                                                <option value="other">other</option>
                                            </select>
                                        </div>
                                        <div class="col-2 d-grid">
                                            <button type="submit" class="btn btn-sm btn-primary" aria-label="Добавить артефакт">+</button>
                                        </div>
                                    </div>
                                </form>

                                <ul class="mb-0" id="artifactsList">
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h2 class="card-title h5 mb-3">Логи</h2>

                                <div class="mb-3">
                                    <div class="btn-group mb-2" role="group" aria-label="Смена статуса эксперимента">
                                        <button type="button" class="btn btn-sm btn-outline-primary" id="setRunningBtn" aria-label="Статус Running">Start</button>
                                        <button type="button" class="btn btn-sm btn-outline-success" id="setCompletedBtn" aria-label="Статус Completed">Finish</button>
                                        <button type="button" class="btn btn-sm btn-outline-danger" id="setFailedBtn" aria-label="Статус Failed">Fail</button>
                                    </div>
                                    <form id="addLogForm">
                                        <div class="input-group">
                                            <label for="logTextInput" class="visually-hidden">Текст лога или комментария</label>
                                            <input type="text" class="form-control" id="logTextInput" placeholder="Комментарий / лог">
                                            <button type="submit" class="btn btn-outline-secondary">Добавить лог</button>
                                        </div>
                                    </form>
                                </div>

                                <p class="text-muted mb-0" id="logsBlock">
                                </p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </main>

        <footer class="app-footer border-top mt-5 py-4">
            <div class="container text-center small">
                <p class="mb-0">PipelineLab — учебный проект по фронтенд-разработке</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/experiment.js"></script>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
