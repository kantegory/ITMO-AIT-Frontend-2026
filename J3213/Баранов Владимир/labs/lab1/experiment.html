<!doctype html>
<html lang="ru">
    <head>
        <title>PipelineLab - Эксперимент</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        />

        <!-- Bootstrap CSS v5.3.2 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
            crossorigin="anonymous"
        />

        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                <div class="container">

                    <a class="navbar-brand" href="index.html">PipelineLab</a>

                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse" id="navbarMenu">

                        <div class="navbar-nav ms-auto">
                            <a class="nav-link" href="index.html">Главная</a>
                            <a class="nav-link" href="dashboard.html">Личный кабинет</a>
                            <a class="nav-link" href="experiments.html">Эксперименты</a>
                            <a class="nav-link" href="models.html">Модели</a>
                            <a class="nav-link" href="login.html" id="navAuthLink">Вход</a>
                        </div>

                    </div>

                </div>

            </nav>
        </header>

        <main>
            <div class="container mt-5 mb-5">

                <h1 class="mb-4" id="experimentTitle">Эксперимент</h1>

                <div class="row">

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Информация об эксперименте</h5>

                                <p class="mb-1"><strong>Название:</strong> <span id="expName">-</span></p>
                                <p class="mb-1"><strong>Статус:</strong> <span id="expStatus">-</span></p>
                                <p class="mb-1"><strong>Этап:</strong> <span id="expStage">-</span></p>
                                <p class="mb-1"><strong>Модель:</strong> <span id="expModel">-</span></p>
                                <p class="mb-1"><strong>Автор:</strong> <span id="expAuthor">-</span></p>
                                <p class="mb-1"><strong>Дата запуска:</strong> <span id="expDate">-</span></p>
                                <p class="mb-1"><strong>Теги:</strong> <span id="expTags">-</span></p>
                                <p class="mb-0"><strong>Описание:</strong> <span id="expDescription">-</span></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Метрики</h5>

                                <form id="addMetricForm" class="mb-3">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="text" class="form-control" id="metricNameInput" placeholder="Metric name" required>
                                        </div>
                                        <div class="col-4">
                                            <input type="number" class="form-control" id="metricValueInput" placeholder="Value" step="0.0001" required>
                                        </div>
                                        <div class="col-2 d-grid">
                                            <button type="submit" class="btn btn-sm btn-primary">+</button>
                                        </div>
                                    </div>
                                </form>

                                <ul class="mb-0" id="metricsList">
                                </ul>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Артефакты</h5>

                                <form id="addArtifactForm" class="mb-3">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="text" class="form-control" id="artifactNameInput" placeholder="Artifact name" required>
                                        </div>
                                        <div class="col-4">
                                            <select class="form-select" id="artifactTypeInput">
                                                <option value="model">model</option>
                                                <option value="image">image</option>
                                                <option value="config">config</option>
                                                <option value="metrics">metrics</option>
                                                <option value="other">other</option>
                                            </select>
                                        </div>
                                        <div class="col-2 d-grid">
                                            <button type="submit" class="btn btn-sm btn-primary">+</button>
                                        </div>
                                    </div>
                                </form>

                                <ul class="mb-0" id="artifactsList">
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6 mb-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title mb-3">Логи</h5>

                                <div class="mb-3">
                                    <div class="btn-group mb-2" role="group">
                                        <button type="button" class="btn btn-sm btn-outline-primary" id="setRunningBtn">Start</button>
                                        <button type="button" class="btn btn-sm btn-outline-success" id="setCompletedBtn">Finish</button>
                                        <button type="button" class="btn btn-sm btn-outline-danger" id="setFailedBtn">Fail</button>
                                    </div>
                                    <form id="addLogForm">
                                        <div class="input-group">
                                            <input type="text" class="form-control" id="logTextInput" placeholder="Комментарий / лог">
                                            <button type="submit" class="btn btn-outline-secondary">Добавить лог</button>
                                        </div>
                                    </form>
                                </div>

                                <p class="text-muted mb-0" id="logsBlock">
                                </p>
                            </div>
                        </div>
                    </div>

                </div>

            </div>
        </main>

        <footer>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
        <script src="js/api.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/experiment.js"></script>

        <!-- Bootstrap JavaScript Libraries -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
            integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
            crossorigin="anonymous"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
            integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
