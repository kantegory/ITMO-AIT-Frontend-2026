<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPass - Вход и регистрация</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-page py-5">
    <div class="container">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
          <section class="auth-card shadow-lg">
            <div class="auth-header text-center">
              <h1 class="h3 mb-1">EventPass</h1>
              <p class="mb-0 text-secondary">Платформа покупки билетов на мероприятия</p>
            </div>

            <div class="auth-switch p-3 p-sm-4 pb-0">
              <div class="btn-group w-100" role="group" aria-label="Переключение форм">
                <button type="button" class="btn btn-primary active" id="loginTab">Вход</button>
                <button type="button" class="btn btn-outline-primary" id="registerTab">Регистрация</button>
              </div>
            </div>

            <div class="p-3 p-sm-4">
              <div id="authMessage" class="mb-3"></div>

              <form id="loginForm" class="needs-validation" novalidate>
                <div class="mb-3">
                  <label for="loginEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="loginEmail" placeholder="you@example.com" required>
                  <div class="invalid-feedback">Введите корректный email.</div>
                </div>

                <div class="mb-3">
                  <label for="loginPassword" class="form-label">Пароль</label>
                  <div class="input-group">
                    <input type="password" class="form-control password-input" id="loginPassword" required>
                    <button class="btn btn-outline-secondary toggle-password" type="button">Показать</button>
                    <div class="invalid-feedback">Введите пароль.</div>
                  </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4 gap-2 flex-wrap">
                  <div class="form-check m-0">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Запомнить меня</label>
                  </div>
                  <button type="button" class="btn btn-link p-0" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                    Забыли пароль?
                  </button>
                </div>

                <button type="submit" class="btn btn-primary w-100">Войти</button>
              </form>

              <form id="registerForm" class="needs-validation d-none" novalidate>
                <div class="mb-3">
                  <label for="registerName" class="form-label">Имя и фамилия</label>
                  <input type="text" class="form-control" id="registerName" required minlength="2">
                  <div class="invalid-feedback">Введите имя (минимум 2 символа).</div>
                </div>

                <div class="mb-3">
                  <label for="registerEmail" class="form-label">Email</label>
                  <input type="email" class="form-control" id="registerEmail" required>
                  <div class="invalid-feedback">Введите корректный email.</div>
                </div>

                <div class="mb-3">
                  <label for="registerPhone" class="form-label">Телефон</label>
                  <input type="tel" class="form-control" id="registerPhone" placeholder="+7 (999) 000-00-00" required>
                  <div class="invalid-feedback">Введите номер телефона.</div>
                </div>

                <div class="row g-3">
                  <div class="col-sm-6">
                    <label for="registerPassword" class="form-label">Пароль</label>
                    <div class="input-group">
                      <input type="password" class="form-control password-input" id="registerPassword" required>
                      <button class="btn btn-outline-secondary toggle-password" type="button">Показать</button>
                      <div class="invalid-feedback">Введите пароль.</div>
                    </div>
                  </div>
                  <div class="col-sm-6">
                    <label for="registerPasswordConfirm" class="form-label">Повтор пароля</label>
                    <input type="password" class="form-control" id="registerPasswordConfirm" required>
                    <div class="invalid-feedback">Пароли должны совпадать.</div>
                  </div>
                </div>

                <fieldset class="mt-3">
                  <legend class="fs-6 mb-2">Тип аккаунта</legend>
                  <div class="d-flex flex-wrap gap-3">
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="accountType" id="buyerType" value="buyer" checked>
                      <label class="form-check-label" for="buyerType">Покупатель</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="radio" name="accountType" id="organizerType" value="organizer">
                      <label class="form-check-label" for="organizerType">Организатор</label>
                    </div>
                  </div>
                </fieldset>

                <button type="submit" class="btn btn-primary w-100 mt-4">Создать аккаунт</button>
              </form>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="forgotPasswordModalLabel">Восстановление пароля</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body">
          <label for="resetEmail" class="form-label">Укажите email, и мы отправим инструкцию</label>
          <input type="email" class="form-control" id="resetEmail" placeholder="you@example.com">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Отмена</button>
          <button type="button" class="btn btn-primary">Отправить</button>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
  <script src="JS/common.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>
