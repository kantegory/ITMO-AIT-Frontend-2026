<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <!-- Сложные маршруты -->
    <symbol id="icon-diagram" viewBox="0 0 24 24">
        <path d="M21 16v-2a5 5 0 0 0-5-5H8a5 5 0 0 0-5 5v2" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="12" cy="16" r="3" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M12 13V9" stroke="currentColor" stroke-width="2"/>
        <path d="M7 9V5" stroke="currentColor" stroke-width="2"/>
        <path d="M17 9V5" stroke="currentColor" stroke-width="2"/>
    </symbol>

    <!-- Планируй бюджет -->
    <symbol id="icon-calculator" viewBox="0 0 24 24">
        <rect x="4" y="2" width="16" height="20" rx="2" stroke="currentColor" fill="none" stroke-width="2"/>
        <line x1="8" y1="6" x2="16" y2="6" stroke="currentColor" stroke-width="2"/>
        <line x1="8" y1="10" x2="16" y2="10" stroke="currentColor" stroke-width="2"/>
        <circle cx="9" cy="15" r="1.5" fill="currentColor"/>
        <circle cx="15" cy="15" r="1.5" fill="currentColor"/>
        <circle cx="12" cy="18" r="1.5" fill="currentColor"/>
    </symbol>

    <!-- Обмен маршрутами -->
    <symbol id="icon-share" viewBox="0 0 24 24">
        <circle cx="6" cy="18" r="3" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="18" cy="6" r="3" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M9 15L15 9" stroke="currentColor" stroke-width="2"/>
        <path d="M15 15L9 9" stroke="currentColor" stroke-width="2"/>
    </symbol>

    <!-- Новые места -->
    <symbol id="icon-compass" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" stroke="currentColor" fill="none" stroke-width="2"/>
        <polygon points="12 3 14 10 21 12 14 14 12 21 10 14 3 12 10 10 12 3" fill="currentColor"/>
    </symbol>

    <!-- Иконка человека (для имени) -->
    <symbol id="icon-person" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2" stroke="currentColor" fill="none" stroke-width="2"/>
    </symbol>

    <!-- Иконка конверта (для email) -->
    <symbol id="icon-envelope" viewBox="0 0 24 24">
        <path d="M22 6L12 13 2 6" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
        <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" fill="none" stroke-width="2"/>
    </symbol>

    <!-- Иконка замка (для пароля) -->
    <symbol id="icon-lock" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2" stroke="currentColor" fill="none" stroke-width="2"/>
        <path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Иконка галочки (для подтверждения пароля) -->
    <symbol id="icon-check" viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Telegram -->
    <symbol id="icon-telegram" viewBox="0 0 24 24">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Instagram -->
    <symbol id="icon-instagram" viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="12" cy="12" r="4" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="17.5" cy="6.5" r="1.5" fill="currentColor"/>
    </symbol>

    <!-- VK -->
    <symbol id="icon-vk" viewBox="0 0 24 24">
        <path d="M7 7h10v10H7z" stroke="currentColor" fill="none" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" stroke="currentColor" fill="none" stroke-width="2"/>
    </symbol>
</svg>