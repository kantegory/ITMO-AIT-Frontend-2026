<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">Online Courses</div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="courses.html">Курсы</a>
                <a href="login.html">Вход</a>
                <a href="register.html">Регистрация</a>
            </nav>
        </div>
    </header>

    <section class="form-page">
        <div class="form-box">
            <h2>Регистрация</h2>
            <form>
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" id="name" placeholder="Введите имя">
                </div>

                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" placeholder="Введите email">
                </div>

                <div class="form-group">
                    <label for="reg-password">Пароль</label>
                    <input type="password" id="reg-password" placeholder="Введите пароль">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" placeholder="Повторите пароль">
                </div>

                <a href="profile.html" class="btn" style="width: 100%; text-align: center;">Зарегистрироваться</a>

                <div class="form-link">
                    <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
                </div>
            </form>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>© 2026 Online Courses</p>
        </div>
    </footer>

</body>
</html>
