<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceControl ITMO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #212529;
            --text-muted: #6c757d;
            --sidebar-bg: #212529;
            --sidebar-text: #ffffff;
            --border-color: #dee2e6;
            --accent-color: #0d6efd;
            --table-hover: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-main: #f8f9fa;
            --text-muted: #a0a0a0;
            --sidebar-bg: #000000;
            --sidebar-text: #e0e0e0;
            --border-color: #333333;
            --accent-color: #3700b3;
            --table-hover: rgba(255, 255, 255, 0.05);
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            font-family: sans-serif;
        }

        .sidebar {
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            min-height: 100vh;
        }

        .card {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        .table {
            color: var(--text-main);
            border-color: var(--border-color);
        }

        .table-hover tbody tr:hover {
            background-color: var(--table-hover);
            color: var(--text-main);
        }

        .text-muted {
            color: var(--text-muted) !important;
        }

        .nav-link {
            color: var(--sidebar-text);
            opacity: 0.8;
            display: flex;
            align-items: center;
        }

        .nav-link:hover, .nav-link.active {
            opacity: 1;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-right: 10px;
        }

        a:focus, button:focus {
            outline: 3px solid #ffc107;
            outline-offset: 2px;
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }

        .promo-img {
            width: 100%;
            max-width: 600px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        #profile-section {
            display: none;
        }
    </style>
</head>
<body>

<svg style="display: none;">
    <symbol id="icon-dashboard" viewBox="0 0 24 24">
        <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
    </symbol>
    <symbol id="icon-wallet" viewBox="0 0 24 24">
        <path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
    </symbol>
</svg>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top" role="navigation" aria-label="Главная навигация">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">Finance ITMO</a>
            <div class="d-flex align-items-center">
                <button id="theme-btn" class="btn btn-outline-light btn-sm me-3" aria-label="Переключить цветовую тему">Тема</button>
                <div id="auth-buttons">
                    <button class="btn btn-outline-light btn-sm me-2" data-bs-toggle="modal" data-bs-target="#loginModal">Вход</button>
                    <button class="btn btn-info btn-sm" onclick="showCabinet()">Демо-вход</button>
                </div>
            </div>
        </div>
    </nav>
</header>

<div class="container-fluid">
    <div class="row">
        <aside class="col-md-2 d-none d-md-block sidebar p-3 shadow" role="complementary">
            <div class="mb-4">
                <h6 class="mb-0">Вахменина Т. М.</h6>
                <small class="text-muted">Группа J3113</small>
            </div>
            <nav aria-label="Меню разделов">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a href="#" class="nav-link active mb-2" aria-current="page">
                            <svg class="icon"><use xlink:href="#icon-dashboard"></use></svg>
                            Дашборд
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link mb-2">
                            <svg class="icon"><use xlink:href="#icon-wallet"></use></svg>
                            Счета
                        </a>
                    </li>
                    <hr class="text-secondary" aria-hidden="true">
                    <li class="nav-item"><a href="#" class="nav-link text-danger" onclick="location.reload()">Выход</a></li>
                </ul>
            </nav>
        </aside>

        <main class="col-md-10 ms-sm-auto px-md-4 py-4" role="main">
            <div id="welcome-msg" class="text-center py-5">
                <picture>
                    <source srcset="https://placehold.co/1000x400/0d6efd/ffffff?text=Finance+Desktop" media="(min-width: 992px)">
                    <source srcset="https://placehold.co/700x300/0d6efd/ffffff?text=Finance+Tablet" media="(min-width: 576px)">
                    <img src="https://placehold.co/400x250/0d6efd/ffffff?text=Finance+Mobile" alt="Финансовая аналитика" class="promo-img">
                </picture>
                <h1>FinanceControl</h1>
                <p class="text-muted">Инструмент для мониторинга ваших средств</p>
            </div>

            <section id="profile-section" aria-labelledby="cabinet-title">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="cabinet-title">Личный кабинет</h2>
                    <button class="btn btn-success btn-sm d-flex align-items-center" onclick="loadDashboardData()" aria-label="Обновить данные">
                        <svg class="icon m-0 me-1" style="width:16px; height:16px;"><use xlink:href="#icon-refresh"></use></svg>
                        Обновить
                    </button>
                </div>

                <div class="row mb-4">
                    <div class="col-md-4">
                        <article class="card p-4 shadow-sm">
                            <h3 class="h6 text-muted">Общий баланс</h3>
                            <p class="h2 my-2" id="main-balance" aria-live="polite">0 ₽</p>
                        </article>
                    </div>
                </div>

                <div class="card shadow-sm p-4 mb-4">
                    <h3>Фильтрация</h3>
                    <form class="row g-2" role="search">
                        <div class="col-md-4">
                            <label for="filterCategory" class="visually-hidden">Категория</label>
                            <input type="text" class="form-control" id="filterCategory" placeholder="Категория">
                        </div>
                        <div class="col-md-4">
                            <label for="filterDate" class="visually-hidden">Дата</label>
                            <input type="date" class="form-control" id="filterDate">
                        </div>
                        <div class="col-md-4">
                            <button type="button" class="btn btn-dark w-100" onclick="applyFilters()">Применить</button>
                        </div>
                    </form>
                </div>

                <div class="card shadow-sm">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" aria-label="Таблица транзакций">
                            <thead>
                                <tr>
                                    <th scope="col">Дата</th>
                                    <th scope="col">Категория</th>
                                    <th scope="col">Статус</th>
                                    <th scope="col" class="text-end">Сумма</th>
                                </tr>
                            </thead>
                            <tbody id="transaction-table"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>

<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="loginTitle">Авторизация</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
            </div>
            <div class="modal-body">
                <form onsubmit="event.preventDefault(); showCabinet();">
                    <div class="mb-3">
                        <label for="emailInput" class="form-label">Email</label>
                        <input type="email" class="form-control" id="emailInput" required>
                    </div>
                    <div class="mb-3">
                        <label for="passInput" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="passInput" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" data-bs-dismiss="modal">Войти</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = 'http://localhost:3000';
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('theme-btn');

    themeBtn.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlEl.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme) {
        htmlEl.setAttribute('data-theme', savedTheme);
    } else if (prefersDark) {
        htmlEl.setAttribute('data-theme', 'dark');
    }

    async function loadDashboardData() {
        try {
            const [tRes, pRes] = await Promise.all([
                fetch(`${API_URL}/transactions`),
                fetch(`${API_URL}/profile`)
            ]);
            const transactions = await tRes.json();
            const profile = await pRes.json();
            document.getElementById('main-balance').innerText = profile.balance.toLocaleString() + ' ₽';
            renderTransactions(transactions);
        } catch (e) {
            console.error(e);
        }
    }

    function renderTransactions(list) {
        const tbody = document.getElementById('transaction-table');
        tbody.innerHTML = '';
        list.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.date}</td>
                <td>${item.category}</td>
                <td><span class="badge rounded-pill ${item.status === 'success' ? 'bg-success' : 'bg-warning text-dark'}">
                    ${item.status === 'success' ? 'OK' : '...'}
                </span></td>
                <td class="text-end" style="color: ${item.amount < 0 ? '#e63946' : '#2a9d8f'}">
                    ${item.amount.toLocaleString()} ₽
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    function showCabinet() {
        document.getElementById('welcome-msg').style.display = 'none';
        document.getElementById('profile-section').style.display = 'block';
        loadDashboardData();
    }

    async function applyFilters() {
        const cat = document.getElementById('filterCategory').value;
        let url = `${API_URL}/transactions`;
        if (cat) url += `?category=${encodeURIComponent(cat)}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            renderTransactions(data);
        } catch (e) {
            console.error(e);
        }
    }
</script>
</body>
</html>
