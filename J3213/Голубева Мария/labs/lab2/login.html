<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход - SpeakEasy</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background-color: #f7f7fb;
    }

    .login-card {
      border: none;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 20px;
    }

    .badge-box {
      display: inline-block;
      background-color: #ffe082;
      color: #4a3b00;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .login-title {
      color: #4f58d8;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .btn-main {
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
    }

    footer {
      margin-top: 60px;
      padding: 20px 0;
      background: linear-gradient(135deg, #5b5bd6, #8d8df1);
      color: white;
    }

    .navbar .btn-register {
      margin-left: 10px;
      border-radius: 12px;
      padding: 8px 16px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-light py-3">
    <div class="container">
      <a class="navbar-brand fw-bold fs-2" href="index.html">SpeakEasy</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="courses.html">Курсы</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="login.html">Вход</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-register" href="register.html">Регистрация</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5 mb-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">

        <div class="card login-card">
          <div class="text-center mb-4">
            <div class="badge-box">Добро пожаловать</div>
            <h2 class="login-title">Вход</h2>
            <p class="text-muted mb-0">
              Войдите в аккаунт, чтобы продолжить обучение
            </p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Введите email" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Пароль</label>
              <input type="password" class="form-control" id="password" placeholder="Введите пароль" required>
            </div>

            <div class="text-danger mt-2 mb-3" id="message"></div>

            <div class="d-grid">
              <button type="submit" class="btn btn-primary btn-main">
                Войти
              </button>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="mb-2">Нет аккаунта?</p>
            <div class="d-grid">
              <a href="register.html" class="btn btn-primary btn-main">
                Зарегистрироваться
              </a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="text-center">
    <p class="mb-0">© 2026 SpeakEasy</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>

</body>

</html>
