<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный кабинет для учета финансов. Главная страница.">
    <title>Главная - Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header role="banner">
        <nav class="navbar navbar-expand-lg navbar-dark mb-4" aria-label="Главная навигация сайта">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html" aria-label="На главную страницу Мои Финансы">Мои Финансы</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto" role="menubar">
                        <li class="nav-item" role="presentation"><a class="nav-link active" aria-current="page" href="index.html" role="menuitem">Главная</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" href="transactions.html" role="menuitem">Транзакции</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" href="reports.html" role="menuitem">Отчеты</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-white fw-bold" id="user-display-name" aria-live="polite">Загрузка...</span>
                        <button class="btn btn-outline-light btn-sm" id="logout-btn" aria-label="Выйти из учетной записи">Выйти</button>
                        <!-- КНОПКА ТЕМЫ -->
                        <button class="btn btn-outline-light btn-sm ms-2" id="theme-toggle" aria-label="Переключить тему" title="Сменить тему">🌙</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container" role="main">
        <div id="alert-container" aria-live="assertive" role="alert"></div>

        <section class="row mb-4" aria-labelledby="balance-heading">
            <div class="col-lg-4 mb-3">
                <div class="card shadow-sm text-bg-primary h-100" style="background-color: var(--app-nav-bg) !important;">
                    <div class="card-body">
                        <h1 id="balance-heading" class="card-subtitle mb-2 opacity-75 fs-6 text-white">Общий баланс</h1>
                        <div class="card-title fw-bold fs-2 text-white" id="total-balance" aria-live="polite" aria-atomic="true">
                            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Загрузка...
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-header fw-bold" id="actions-heading">Быстрые действия</div>
                    <div class="card-body d-flex align-items-center gap-3" aria-labelledby="actions-heading">
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTransactionModal" aria-haspopup="dialog" aria-expanded="false">
                            + Добавить транзакцию
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="card shadow-sm mb-5" aria-labelledby="tx-heading">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h2 id="tx-heading" class="fw-bold fs-6 mb-0">Последние транзакции</h2>
                <a href="transactions.html" class="btn btn-sm btn-outline-primary" aria-label="Посмотреть все транзакции">Все транзакции</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" role="table">
                        <caption class="visually-hidden">Таблица последних транзакций пользователя</caption>
                        <thead>
                            <tr>
                                <th scope="col">Дата</th>
                                <th scope="col">Название</th>
                                <th scope="col">Категория</th>
                                <th scope="col" class="text-end">Сумма</th>
                            </tr>
                        </thead>
                        <tbody id="index-transactions-tbody" aria-live="polite">
                            <!-- Заполняется JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="addTransactionModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true" role="dialog">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="addModalLabel">Добавить транзакцию</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть окно"></button>
                </div>
                <div class="modal-body">
                    <form id="add-transaction-form">
                        <div class="mb-3">
                            <label for="add-type" class="form-label">Тип операции</label>
                            <select class="form-select" id="add-type" required aria-required="true">
                                <option value="expense">Расход</option>
                                <option value="income">Доход</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="add-date" class="form-label">Дата</label>
                            <input type="date" class="form-control" id="add-date" required aria-required="true">
                        </div>
                        <div class="mb-3">
                            <label for="add-name" class="form-label">Название</label>
                            <input type="text" class="form-control" id="add-name" placeholder="Например: Супермаркет" required aria-required="true">
                        </div>
                        <div class="mb-3">
                            <label for="add-category" class="form-label">Категория</label>
                            <select class="form-select" id="add-category" required aria-required="true">
                                <option value="Продукты">Продукты</option>
                                <option value="Развлечения">Развлечения</option>
                                <option value="Транспорт">Транспорт</option>
                                <option value="Покупки">Покупки</option>
                                <option value="Зарплата">Зарплата</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="add-amount" class="form-label">Сумма (₽)</label>
                            <input type="number" class="form-control" id="add-amount" min="1" required aria-required="true">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
