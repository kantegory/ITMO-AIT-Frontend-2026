<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Полная история транзакций с возможностью фильтрации">
    <title>История транзакций - Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header role="banner">
        <nav class="navbar navbar-expand-lg navbar-dark mb-4" aria-label="Главная навигация сайта">
            <div class="container">
                <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html" aria-label="На главную страницу">
                    <svg class="icon"><use href="img/sprite.svg#icon-wallet"></use></svg>
                    Мои Финансы
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto" role="menubar">
                        <li class="nav-item" role="presentation"><a class="nav-link" href="index.html" role="menuitem">Главная</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link active" aria-current="page" href="transactions.html" role="menuitem">Транзакции</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" href="reports.html" role="menuitem">Отчеты</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-white fw-bold" id="user-display-name" aria-live="polite">Загрузка...</span>
                        <button class="btn btn-outline-light btn-sm d-flex align-items-center gap-1" id="logout-btn" aria-label="Выйти из учетной записи">
                            <svg class="icon"><use href="img/sprite.svg#icon-logout"></use></svg>
                            Выйти
                        </button>
                        <button class="btn btn-outline-light btn-sm ms-2" id="theme-toggle" aria-label="Переключить тему" title="Сменить тему"></button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container" role="main">
        <div id="alert-container" aria-live="assertive" role="alert"></div>

        <section class="card shadow-sm mb-4" aria-labelledby="filter-heading">
            <div class="card-header fw-bold">
                <h1 id="filter-heading" class="fs-6 mb-0">Фильтрация операций</h1>
            </div>
            <div class="card-body">
                <form id="filter-form" class="row g-3" aria-label="Форма фильтрации транзакций">
                    <div class="col-md-4">
                        <label for="filter-search" class="form-label">Поиск по названию</label>
                        <input type="text" class="form-control" id="filter-search" placeholder="Например: Аптека">
                    </div>
                    <div class="col-md-4">
                        <label for="filter-category" class="form-label">Категория</label>
                        <select class="form-select" id="filter-category">
                            <option value="">Все категории</option>
                            <option value="Продукты">Продукты</option>
                            <option value="Развлечения">Развлечения</option>
                            <option value="Транспорт">Транспорт</option>
                            <option value="Покупки">Покупки</option>
                            <option value="Зарплата">Зарплата</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-min" class="form-label">Мин. сумма</label>
                        <input type="number" class="form-control" id="filter-min" placeholder="0" min="0">
                    </div>
                    <div class="col-md-2">
                        <label for="filter-max" class="form-label">Макс. сумма</label>
                        <input type="number" class="form-control" id="filter-max" placeholder="100000" min="0">
                    </div>
                    <div class="col-12 d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-outline-secondary" id="btn-reset-filters" aria-label="Сбросить все фильтры">Сбросить</button>
                        <button type="submit" class="btn btn-primary" aria-label="Применить выбранные фильтры">Применить фильтр</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm mb-5" aria-labelledby="history-heading">
            <div class="card-header fw-bold">
                <h2 id="history-heading" class="fs-6 mb-0">Список транзакций</h2>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive" tabindex="0" aria-label="Прокручиваемая таблица транзакций">
                    <table class="table table-hover mb-0" role="table">
                        <caption class="visually-hidden">Полная история доходов и расходов</caption>
                        <thead>
                            <tr>
                                <th scope="col">Дата</th>
                                <th scope="col">Название</th>
                                <th scope="col">Категория</th>
                                <th scope="col" class="text-end">Сумма</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-tbody" aria-live="polite">
                            <!-- Заполняется JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
