<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Вход в личный кабинет учета финансов">
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm p-4">
                    <div class="card-body">
                        <h1 class="h4 card-title text-center mb-4">Вход в систему</h1>
                        
                        <div id="login-alert" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-email" class="form-label">Email адрес</label>
                                <input type="email" class="form-control" id="login-email" required placeholder="ivan@mail.ru" autocomplete="email">
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="login-password" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3">Войти</button>
                        </form>
                        <div class="text-center">
                            <small class="text-muted">Еще нет аккаунта? <a href="register.html">Зарегистрироваться</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
