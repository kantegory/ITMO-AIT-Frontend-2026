<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="История транзакций с фильтрацией">
    <title>История транзакций</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" aria-label="Главная навигация">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Мои Финансы</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить меню">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="transactions.html">Транзакции</a></li>
                        <li class="nav-item"><a class="nav-link" href="reports.html">Отчеты</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-white fw-bold" id="user-display-name">Загрузка...</span>
                        <button class="btn btn-outline-light btn-sm" id="logout-btn" aria-label="Выйти">Выйти</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div id="alert-container" aria-live="polite"></div>

        <section class="card shadow-sm mb-4" aria-labelledby="filter-heading">
            <div class="card-header bg-white fw-bold" id="filter-heading">Фильтрация операций</div>
            <div class="card-body">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-4">
                        <label for="filter-search" class="form-label">Поиск по названию</label>
                        <input type="text" class="form-control" id="filter-search" placeholder="Поиск...">
                    </div>
                    <div class="col-md-4">
                        <label for="filter-category" class="form-label">Категория</label>
                        <select class="form-select" id="filter-category">
                            <option value="">Все категории</option>
                            <option value="Продукты">Продукты</option>
                            <option value="Развлечения">Развлечения</option>
                            <option value="Транспорт">Транспорт</option>
                            <option value="Покупки">Покупки</option>
                            <option value="Зарплата">Зарплата</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="filter-min" class="form-label">Мин. сумма</label>
                        <input type="number" class="form-control" id="filter-min" placeholder="0">
                    </div>
                    <div class="col-md-2">
                        <label for="filter-max" class="form-label">Макс. сумма</label>
                        <input type="number" class="form-control" id="filter-max" placeholder="100000">
                    </div>
                    <div class="col-12 d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-outline-secondary" id="btn-reset-filters">Сбросить</button>
                        <button type="submit" class="btn btn-primary">Применить фильтр</button>
                    </div>
                </form>
            </div>
        </section>

        <section class="card shadow-sm mb-5" aria-labelledby="history-heading">
            <div class="card-header bg-white fw-bold" id="history-heading">Список транзакций</div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" role="grid">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Дата</th>
                                <th scope="col">Название</th>
                                <th scope="col">Категория</th>
                                <th scope="col" class="text-end">Сумма</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-tbody">
                            <!-- Заполняется JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
