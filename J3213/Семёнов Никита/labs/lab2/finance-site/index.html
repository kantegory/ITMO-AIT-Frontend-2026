<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Личный кабинет для учета финансов">
    <title>Главная - Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" aria-label="Главная навигация">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Мои Финансы</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить меню навигации">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Главная</a></li>
                        <li class="nav-item"><a class="nav-link" href="transactions.html">Транзакции</a></li>
                        <li class="nav-item"><a class="nav-link" href="reports.html">Отчеты</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-white fw-bold" id="user-display-name">Загрузка...</span>
                        <button class="btn btn-outline-light btn-sm" id="logout-btn" aria-label="Выйти из личного кабинета">Выйти</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container">
        <div id="alert-container" aria-live="polite"></div>

        <section class="row mb-4" aria-labelledby="balance-heading">
            <div class="col-lg-4 mb-3">
                <div class="card shadow-sm text-bg-primary h-100">
                    <div class="card-body">
                        <h6 id="balance-heading" class="card-subtitle mb-2 opacity-75">Общий баланс</h6>
                        <h2 class="card-title fw-bold" id="total-balance">
                            <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Загрузка...
                        </h2>
                    </div>
                </div>
            </div>

            <div class="col-lg-8 mb-3">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-white fw-bold">Быстрые действия</div>
                    <div class="card-body d-flex align-items-center gap-3">
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTransactionModal" aria-label="Открыть форму добавления транзакции">
                            + Добавить транзакцию
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section class="card shadow-sm mb-5" aria-labelledby="tx-heading">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <span id="tx-heading" class="fw-bold">Последние транзакции</span>
                <a href="transactions.html" class="btn btn-sm btn-outline-primary" aria-label="Перейти ко всем транзакциям">Все транзакции</a>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" role="grid">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Дата</th>
                                <th scope="col">Название</th>
                                <th scope="col">Категория</th>
                                <th scope="col" class="text-end">Сумма</th>
                            </tr>
                        </thead>
                        <tbody id="index-transactions-tbody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <div class="modal fade" id="addTransactionModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addModalLabel">Добавить транзакцию</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть диалоговое окно"></button>
                </div>
                <div class="modal-body">
                    <form id="add-transaction-form">
                        <div class="mb-3">
                            <label for="add-type" class="form-label">Тип операции</label>
                            <select class="form-select" id="add-type" required>
                                <option value="expense">Расход</option>
                                <option value="income">Доход</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="add-date" class="form-label">Дата</label>
                            <input type="date" class="form-control" id="add-date" required>
                        </div>
                        <div class="mb-3">
                            <label for="add-name" class="form-label">Название</label>
                            <input type="text" class="form-control" id="add-name" placeholder="Например: Супермаркет" required>
                        </div>
                        <div class="mb-3">
                            <label for="add-category" class="form-label">Категория</label>
                            <select class="form-select" id="add-category" required>
                                <option value="Продукты">Продукты</option>
                                <option value="Развлечения">Развлечения</option>
                                <option value="Транспорт">Транспорт</option>
                                <option value="Покупки">Покупки</option>
                                <option value="Зарплата">Зарплата</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="add-amount" class="form-label">Сумма (₽)</label>
                            <input type="number" class="form-control" id="add-amount" min="1" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
