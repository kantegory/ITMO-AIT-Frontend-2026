<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Транзакции - Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">Мои Финансы</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="transactions.html">Транзакции</a></li>
                    <li class="nav-item"><a class="nav-link" href="reports.html">Отчёты</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <span class="text-white fw-bold" id="user-display-name">Гость</span>
                    <button class="btn btn-outline-light btn-sm" id="logout-btn">Выйти</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="mb-0">История транзакций</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTransactionModal">+ Добавить</button>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="filter-form" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label small">Поиск по названию</label>
                        <input type="text" class="form-control" id="filter-search" placeholder="Например: Пятёрочка">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small">Категория</label>
                        <select class="form-select" id="filter-category">
                            <option value="">Все категории</option>
                            <option value="Продукты">Продукты</option>
                            <option value="Транспорт">Транспорт</option>
                            <option value="Покупки">Покупки</option>
                            <option value="Зарплата">Зарплата</option>
                            <option value="Развлечения">Развлечения</option>
                            <option value="Коммунальные услуги">Коммунальные услуги</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Сумма от</label>
                        <input type="number" class="form-control" id="filter-min" placeholder="0">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small">Сумма до</label>
                        <input type="number" class="form-control" id="filter-max" placeholder="100000">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Дата с</label>
                        <input type="date" class="form-control" id="filter-date-from">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small">Дата по</label>
                        <input type="date" class="form-control" id="filter-date-to">
                    </div>
                    <div class="col-md-6 d-flex align-items-end gap-2">
                        <button type="submit" class="btn btn-primary">Применить фильтры</button>
                        <button type="button" class="btn btn-secondary" id="btn-reset-filters">Сбросить</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="alert-container"></div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Дата</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th class="text-end pe-3">Сумма</th>
                            </tr>
                        </thead>
                        <tbody id="transactions-tbody">
                            <!-- Динамические строки -->
                        </tbody>
                    </table>
                </div>
                <div id="no-data-alert" class="p-3 text-center text-muted d-none">По вашему запросу ничего не найдено.</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно добавления транзакции -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить транзакцию</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-transaction-form">
                        <div class="mb-3">
                            <label class="form-label">Тип операции</label>
                            <select class="form-select" id="add-type" required>
                                <option value="expense">Расход</option>
                                <option value="income">Доход</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Дата</label>
                            <input type="date" class="form-control" id="add-date" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Название</label>
                            <input type="text" class="form-control" id="add-name" placeholder="Например: Кофе" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select class="form-select" id="add-category" required>
                                <option value="Продукты">Продукты</option>
                                <option value="Транспорт">Транспорт</option>
                                <option value="Развлечения">Развлечения</option>
                                <option value="Покупки">Покупки</option>
                                <option value="Зарплата">Зарплата</option>
                                <option value="Коммунальные услуги">Коммунальные услуги</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сумма (₽)</label>
                            <input type="number" class="form-control" id="add-amount" placeholder="0" required min="1">
                        </div>
                        <button type="submit" class="btn btn-success w-100">Сохранить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
