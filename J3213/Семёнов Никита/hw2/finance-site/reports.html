<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Аналитика и графики расходов по категориям">
    <title>Отчеты - Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header role="banner">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4" aria-label="Главная навигация сайта">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html" aria-label="На главную страницу">Мои Финансы</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Открыть меню навигации">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto" role="menubar">
                        <li class="nav-item" role="presentation"><a class="nav-link" href="index.html" role="menuitem">Главная</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link" href="transactions.html" role="menuitem">Транзакции</a></li>
                        <li class="nav-item" role="presentation"><a class="nav-link active" aria-current="page" href="reports.html" role="menuitem">Отчеты</a></li>
                    </ul>
                    <div class="d-flex align-items-center gap-3">
                        <span class="text-white fw-bold" id="user-display-name" aria-live="polite">Загрузка...</span>
                        <button class="btn btn-outline-light btn-sm" id="logout-btn" aria-label="Выйти из учетной записи">Выйти</button>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="container" role="main">
        <div id="alert-container" aria-live="assertive" role="alert"></div>

        <section class="row justify-content-center" aria-labelledby="reports-heading">
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">
                        <h1 id="reports-heading" class="fs-6 mb-0">Структура расходов по категориям</h1>
                    </div>
                    <div class="card-body d-flex justify-content-center">
                        <div style="width: 100%; max-width: 500px;" tabindex="0" aria-label="Контейнер с графиком расходов">
                            <canvas id="expenseChart" aria-label="Круговая диаграмма, показывающая расходы по категориям" role="img">
                                Ваш браузер не поддерживает элемент canvas, необходимый для отображения графика.
                            </canvas>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> 
    <script src="js/script.js"></script>
</body>
</html>
