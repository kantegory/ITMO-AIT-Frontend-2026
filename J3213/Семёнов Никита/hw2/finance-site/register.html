<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Регистрация нового пользователя">
    <title>Регистрация - Финансы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
    <main class="container" role="main">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm p-4">
                    <div class="card-body">
                        <h1 class="h4 card-title text-center mb-4">Регистрация</h1>

                        <div id="reg-alert" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

                        <form id="reg-form" aria-label="Форма регистрации">
                            <div class="mb-3">
                                <label for="reg-name" class="form-label">Имя и Фамилия</label>
                                <input type="text" class="form-control" id="reg-name" required aria-required="true" placeholder="Иван Иванов" autocomplete="name">
                            </div>
                            <div class="mb-3">
                                <label for="reg-email" class="form-label">Email адрес</label>
                                <input type="email" class="form-control" id="reg-email" required aria-required="true" placeholder="ivan@mail.ru" autocomplete="email">
                            </div>
                            <div class="mb-3">
                                <label for="reg-password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="reg-password" required aria-required="true" autocomplete="new-password">
                            </div>
                            <div class="mb-3">
                                <label for="reg-confirm" class="form-label">Подтвердите пароль</label>
                                <input type="password" class="form-control" id="reg-confirm" required aria-required="true" autocomplete="new-password">
                            </div>
                            <button type="submit" class="btn btn-success w-100 mb-3" aria-label="Завершить регистрацию">Зарегистрироваться</button>
                        </form>
                        <div class="text-center">
                            <small class="text-muted">Уже есть аккаунт? <a href="login.html" aria-label="Перейти на страницу входа">Войти</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
