<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aNikral — Регистрация</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-body-tertiary">
  <div class="card shadow-sm p-4" style="width:100%;max-width:400px">
    <h1 class="h4 text-center mb-1">a<span class="text-primary">Nikral</span></h1>
    <p class="text-center text-muted small mb-4">Создать аккаунт</p>

    <div id="reg-error" class="alert alert-danger d-none" role="alert"></div>

    <form id="register-form" aria-label="Форма регистрации" novalidate>
      <div class="mb-3">
        <label class="form-label" for="reg-name">Имя</label>
        <input type="text" class="form-control" id="reg-name" placeholder="Иван Иванов" autocomplete="name" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="reg-email">Email</label>
        <input type="email" class="form-control" id="reg-email" placeholder="example@mail.ru" autocomplete="email" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="reg-password">Пароль</label>
        <input type="password" class="form-control" id="reg-password" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="reg-confirm">Подтверждение пароля</label>
        <input type="password" class="form-control" id="reg-confirm" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="reg-btn">Зарегистрироваться</button>
    </form>

    <p class="text-center small text-muted mt-3 mb-0">
      Уже есть аккаунт? <a href="index.html">Войти</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  if (localStorage.getItem('token')) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('register-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('reg-btn');
    var errEl = document.getElementById('reg-error');
    var name = document.getElementById('reg-name').value.trim();
    var email = document.getElementById('reg-email').value.trim();
    var password = document.getElementById('reg-password').value;
    var confirm = document.getElementById('reg-confirm').value;

    errEl.classList.add('d-none');

    if (password !== confirm) {
      errEl.textContent = 'Пароли не совпадают';
      errEl.classList.remove('d-none');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Регистрируем...';

    register(name, email, password)
      .then(function () {
        window.location.href = 'dashboard.html';
      })
      .catch(function (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Зарегистрироваться';
      });
  });
</script>
</body>
</html>
