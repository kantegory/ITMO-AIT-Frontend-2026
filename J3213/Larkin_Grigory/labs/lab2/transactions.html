<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aNikral — Транзакции</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body border-bottom" aria-label="Основная навигация">
  <div class="container">
    <a class="navbar-brand brand-name" href="dashboard.html">a<span>Nikral</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-home"/></svg>Кабинет</a></li>
        <li class="nav-item"><a class="nav-link active" href="transactions.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-list"/></svg>Транзакции</a></li>
        <li class="nav-item"><a class="nav-link" href="reports.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-chart"/></svg>Отчёты</a></li>
        <li class="nav-item"><a class="nav-link" href="accounts.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-card"/></svg>Счета</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="logout-btn"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-logout"/></svg>Выйти</a></li>
      </ul>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-3" type="button">Тёмная</button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <h1 class="h4 mb-4">Транзакции</h1>

  <div class="card mb-4">
    <div class="card-body">
      <form id="filter-form" aria-label="Фильтрация транзакций">
        <div class="row g-3">
          <div class="col-md-5">
            <label class="form-label" for="filter-query">Поиск</label>
            <input type="text" class="form-control" id="filter-query" placeholder="Введите описание">
          </div>
          <div class="col-md-4">
            <label class="form-label" for="filter-category">Категория</label>
            <select class="form-select" id="filter-category">
              <option value="">Все категории</option>
              <option value="income">Доход</option>
              <option value="food">Еда</option>
              <option value="housing">Жильё</option>
              <option value="transport">Транспорт</option>
              <option value="entertainment">Развлечения</option>
              <option value="services">Сервисы</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary">Найти</button>
            <button type="reset" class="btn btn-outline-secondary" id="reset-btn">Сбросить</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card" id="transactions-card">
    <div class="card-body text-muted">Загрузка...</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  requireAuth();

  var userId = localStorage.getItem('userId');
  var allTransactions = [];

  function renderTransactions(list) {
    if (list.length === 0) {
      document.getElementById('transactions-card').innerHTML =
        '<div class="card-body text-muted">Транзакции не найдены</div>';
      return;
    }
    var rows = list.map(function (t) {
      var cls = t.amount >= 0 ? 'amount-plus' : 'amount-minus';
      return '<tr>' +
        '<td>' + t.description + '</td>' +
        '<td><span class="badge ' + CATEGORY_BADGES[t.category] + '">' + CATEGORY_LABELS[t.category] + '</span></td>' +
        '<td class="text-muted small">' + formatDate(t.date) + '</td>' +
        '<td class="text-end ' + cls + '">' + formatAmount(t.amount) + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('transactions-card').innerHTML =
      '<div class="table-responsive"><table class="table mb-0" aria-label="Список транзакций">' +
      '<thead><tr><th scope="col">Описание</th><th scope="col">Категория</th><th scope="col">Дата</th><th scope="col" class="text-end">Сумма</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }

  apiGet('/transactions?userId=' + userId).then(function (data) {
    allTransactions = data;
    renderTransactions(data);
  }).catch(function () {
    showError(document.getElementById('transactions-card'), 'Не удалось загрузить транзакции. Запущен ли json-server?');
  });

  document.getElementById('filter-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var query = document.getElementById('filter-query').value.toLowerCase();
    var category = document.getElementById('filter-category').value;

    var filtered = allTransactions.filter(function (t) {
      var matchQuery = !query || t.description.toLowerCase().includes(query);
      var matchCategory = !category || t.category === category;
      return matchQuery && matchCategory;
    });

    renderTransactions(filtered);
  });

  document.getElementById('reset-btn').addEventListener('click', function () {
    renderTransactions(allTransactions);
  });
</script>
</body>
</html>
