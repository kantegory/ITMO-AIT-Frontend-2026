<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aNikral — Кабинет</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body border-bottom" aria-label="Основная навигация">
  <div class="container">
    <a class="navbar-brand brand-name" href="dashboard.html">a<span>Nikral</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="dashboard.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-home"/></svg>Кабинет</a></li>
        <li class="nav-item"><a class="nav-link" href="transactions.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-list"/></svg>Транзакции</a></li>
        <li class="nav-item"><a class="nav-link" href="reports.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-chart"/></svg>Отчёты</a></li>
        <li class="nav-item"><a class="nav-link" href="accounts.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-card"/></svg>Счета</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="logout-btn"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-logout"/></svg>Выйти</a></li>
      </ul>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-3" type="button">Тёмная</button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <h1 class="h4 mb-4">Личный кабинет</h1>

  <div class="row g-3 mb-4" id="stats-row">
    <div class="col-12 text-muted">Загрузка...</div>
  </div>

  <h2 class="h6 mb-3">Последние транзакции</h2>
  <div class="card" id="recent-transactions">
    <div class="card-body text-muted">Загрузка...</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  requireAuth();

  var userId = localStorage.getItem('userId');

  Promise.all([
    apiGet('/transactions?userId=' + userId),
    apiGet('/accounts?userId=' + userId)
  ]).then(function (results) {
    var transactions = results[0];
    var accounts = results[1];

    var totalBalance = accounts.reduce(function (sum, a) { return sum + a.balance; }, 0);
    var income = transactions.filter(function (t) { return t.amount > 0; })
                             .reduce(function (sum, t) { return sum + t.amount; }, 0);
    var expenses = transactions.filter(function (t) { return t.amount < 0; })
                               .reduce(function (sum, t) { return sum + t.amount; }, 0);
    var saved = income + expenses;

    document.getElementById('stats-row').innerHTML =
      '<div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="text-muted small mb-1">Общий баланс</div>' +
      '<div class="fs-5 fw-bold">' + totalBalance.toLocaleString('ru-RU') + ' ₽</div></div></div>' +
      '<div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="text-muted small mb-1">Доходы за период</div>' +
      '<div class="fs-5 fw-bold amount-plus">+' + income.toLocaleString('ru-RU') + ' ₽</div></div></div>' +
      '<div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="text-muted small mb-1">Расходы за период</div>' +
      '<div class="fs-5 fw-bold amount-minus">−' + Math.abs(expenses).toLocaleString('ru-RU') + ' ₽</div></div></div>' +
      '<div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="text-muted small mb-1">Накоплено</div>' +
      '<div class="fs-5 fw-bold">' + saved.toLocaleString('ru-RU') + ' ₽</div></div></div>';

    var recent = transactions.slice(0, 5);
    var rows = recent.map(function (t) {
      var cls = t.amount >= 0 ? 'amount-plus' : 'amount-minus';
      return '<tr>' +
        '<td>' + t.description + '</td>' +
        '<td><span class="badge ' + CATEGORY_BADGES[t.category] + '">' + CATEGORY_LABELS[t.category] + '</span></td>' +
        '<td class="text-muted small">' + formatDate(t.date) + '</td>' +
        '<td class="text-end ' + cls + '">' + formatAmount(t.amount) + '</td>' +
        '</tr>';
    }).join('');

    document.getElementById('recent-transactions').innerHTML =
      '<div class="table-responsive"><table class="table mb-0" aria-label="Последние транзакции">' +
      '<thead><tr><th>Описание</th><th>Категория</th><th>Дата</th><th class="text-end">Сумма</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  }).catch(function (err) {
    showError(document.getElementById('stats-row'), 'Не удалось загрузить данные. Запущен ли json-server?');
  });
</script>
</body>
</html>
