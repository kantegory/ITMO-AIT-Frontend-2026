<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aNikral — Отчёты</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-body border-bottom" aria-label="Основная навигация">
  <div class="container">
    <a class="navbar-brand brand-name" href="dashboard.html">a<span>Nikral</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Открыть меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-home"/></svg>Кабинет</a></li>
        <li class="nav-item"><a class="nav-link" href="transactions.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-list"/></svg>Транзакции</a></li>
        <li class="nav-item"><a class="nav-link active" href="reports.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-chart"/></svg>Отчёты</a></li>
        <li class="nav-item"><a class="nav-link" href="accounts.html"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-card"/></svg>Счета</a></li>
        <li class="nav-item"><a class="nav-link" href="#" id="logout-btn"><svg width="16" height="16" class="me-1"><use href="icons/sprite.svg#icon-logout"/></svg>Выйти</a></li>
      </ul>
      <button id="theme-toggle" class="btn btn-sm btn-outline-secondary ms-3" type="button">Тёмная</button>
    </div>
  </div>
</nav>

<main class="container my-4">
  <h1 class="h4 mb-4">Отчёты</h1>

  <div class="row g-3 mb-4" id="summary-row">
    <div class="col-12 text-muted">Загрузка...</div>
  </div>

  <h2 class="h6 mb-3">Расходы по категориям</h2>
  <div class="card" id="categories-card">
    <div class="card-body text-muted">Загрузка...</div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  requireAuth();

  var userId = localStorage.getItem('userId');

  apiGet('/transactions?userId=' + userId).then(function (transactions) {
    var income = transactions.filter(function (t) { return t.amount > 0; })
                             .reduce(function (s, t) { return s + t.amount; }, 0);
    var expenses = transactions.filter(function (t) { return t.amount < 0; })
                               .reduce(function (s, t) { return s + t.amount; }, 0);

    document.getElementById('summary-row').innerHTML =
      '<div class="col-sm-4"><div class="card p-3"><div class="text-muted small mb-1">Доходы</div>' +
      '<div class="fs-5 fw-bold amount-plus">+' + income.toLocaleString('ru-RU') + ' ₽</div></div></div>' +
      '<div class="col-sm-4"><div class="card p-3"><div class="text-muted small mb-1">Расходы</div>' +
      '<div class="fs-5 fw-bold amount-minus">−' + Math.abs(expenses).toLocaleString('ru-RU') + ' ₽</div></div></div>' +
      '<div class="col-sm-4"><div class="card p-3"><div class="text-muted small mb-1">Чистый итог</div>' +
      '<div class="fs-5 fw-bold">' + (income + expenses).toLocaleString('ru-RU') + ' ₽</div></div></div>';

    var byCategory = {};
    transactions.filter(function (t) { return t.amount < 0; }).forEach(function (t) {
      byCategory[t.category] = (byCategory[t.category] || 0) + Math.abs(t.amount);
    });

    var totalExpenses = Math.abs(expenses) || 1;
    var rows = Object.keys(byCategory).map(function (cat) {
      var pct = Math.round(byCategory[cat] / totalExpenses * 100);
      return '<div class="mb-3">' +
        '<div class="d-flex justify-content-between mb-1">' +
        '<span class="badge ' + CATEGORY_BADGES[cat] + '">' + CATEGORY_LABELS[cat] + '</span>' +
        '<span class="text-muted small">' + byCategory[cat].toLocaleString('ru-RU') + ' ₽ (' + pct + '%)</span>' +
        '</div>' +
        '<div class="progress" style="height:8px" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100">' +
        '<div class="progress-bar" style="width:' + pct + '%"></div></div></div>';
    }).join('');

    document.getElementById('categories-card').innerHTML = '<div class="card-body">' + (rows || '<p class="text-muted mb-0">Нет данных о расходах</p>') + '</div>';
  }).catch(function () {
    showError(document.getElementById('summary-row'), 'Не удалось загрузить данные. Запущен ли json-server?');
  });
</script>
</body>
</html>
