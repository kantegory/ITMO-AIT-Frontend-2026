<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aNikral — Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="min-vh-100 d-flex align-items-center justify-content-center bg-body-tertiary">
  <div class="card shadow-sm p-4" style="width:100%;max-width:400px">
    <h1 class="h4 text-center mb-1">a<span class="text-primary">Nikral</span></h1>
    <p class="text-center text-muted small mb-4">Управление личными финансами</p>

    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

    <form id="login-form" aria-label="Форма входа" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input type="email" class="form-control" id="email" placeholder="user@example.com" autocomplete="email" required>
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Пароль</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100" id="login-btn">Войти</button>
    </form>

    <p class="text-center small text-muted mt-3 mb-0">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </p>
    <p class="text-center small text-muted mt-2 mb-0">
      Демо: <code>user@example.com</code> / <code>password123</code>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
  if (localStorage.getItem('token')) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = document.getElementById('login-btn');
    var errEl = document.getElementById('login-error');
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    btn.disabled = true;
    btn.textContent = 'Входим...';
    errEl.classList.add('d-none');

    login(email, password)
      .then(function () {
        window.location.href = 'dashboard.html';
      })
      .catch(function (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Войти';
      });
  });
</script>
</body>
</html>
