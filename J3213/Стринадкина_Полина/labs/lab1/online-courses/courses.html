<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог курсов</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">SECly</a>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="mb-4">Каталог курсов</h1>

    <div class="row mb-4 g-3">
      <div class="col-md-4">
        <input type="text" class="form-control" placeholder="Поиск курса">
      </div>
      <div class="col-md-3">
        <select class="form-select">
          <option>Все предметы</option>
          <option>Программирование</option>
          <option>Дизайн</option>
          <option>Маркетинг</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select">
          <option>Любой уровень</option>
          <option>Начальный</option>
          <option>Средний</option>
          <option>Продвинутый</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select">
          <option>Любая цена</option>
          <option>Бесплатно</option>
          <option>До 5000 ₽</option>
          <option>От 5000 ₽</option>
        </select>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Основы HTML и CSS</h5>
            <p class="card-text">Уровень: Начальный</p>
            <p class="card-text fw-bold">3000 ₽</p>
            <a href="course.html" class="btn btn-primary">Подробнее</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Figma для начинающих</h5>
            <p class="card-text">Уровень: Начальный</p>
            <p class="card-text fw-bold">2500 ₽</p>
            <a href="course.html" class="btn btn-primary">Подробнее</a>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">JavaScript Advanced</h5>
            <p class="card-text">Уровень: Средний</p>
            <p class="card-text fw-bold">5500 ₽</p>
            <a href="course.html" class="btn btn-primary">Подробнее</a>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
