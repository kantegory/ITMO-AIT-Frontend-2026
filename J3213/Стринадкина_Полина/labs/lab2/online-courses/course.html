<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница курса</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-3" id="course-title">Курс</h1>
    <p class="text-muted" id="course-teacher">Преподаватель: —</p>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="ratio ratio-16x9 mb-4">
          <iframe id="course-video" src="" title="Видео" allowfullscreen></iframe>
        </div>

        <ul class="nav nav-tabs" id="courseTabs" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#materials">Материалы</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tasks">Задания</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#discussion">Обсуждения</button>
          </li>
        </ul>

        <div class="tab-content border border-top-0 p-4 bg-white">
          <div class="tab-pane fade show active" id="materials"></div>
          <div class="tab-pane fade" id="tasks"></div>
          <div class="tab-pane fade" id="discussion"></div>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4>О курсе</h4>
            <p id="course-description"></p>
            <p class="fw-bold" id="course-price"></p>
            <button class="btn btn-success w-100 mb-2">Купить курс</button>
            <button class="btn btn-outline-primary w-100" data-bs-toggle="modal" data-bs-target="#infoModal">
              Подробнее о курсе
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="infoModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Подробная информация</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="course-duration"></p>
          <p id="course-lessons"></p>
          <p id="course-format"></p>
          <p id="course-level"></p>
          <p id="course-category"></p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/course.js"></script>
</body>
</html>
