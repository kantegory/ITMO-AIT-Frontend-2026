<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Личный кабинет пользователя</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light-bg">

  <div class="container py-5">
    <h1 class="mb-4">Личный кабинет пользователя</h1>

    <div class="row g-4">

      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h4>Профиль</h4>
            <p><strong>ФИО:</strong> <span id="user-name">—</span></p>
            <p><strong>Email:</strong> <span id="user-email">—</span></p>
            <p><strong>Роль:</strong> <span id="user-role">—</span></p>
            <p><strong>Статус:</strong> Активен</p>
          </div>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h4>Мои курсы</h4>
            <div id="user-courses"></div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <h4>Сертификаты</h4>
          <ul class="list-group" id="certificates-list"></ul>
        </div>
      </div>
      
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/user.js"></script>

</body>
</html>
