<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог курсов</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">SECly</a>
    </div>
  </nav>

  <div class="container py-5">
    <h1 class="mb-4">Каталог курсов</h1>

    <div class="row mb-4 g-3">
      <div class="col-md-4">
        <input type="text" class="form-control" id="search-input" placeholder="Поиск курса">
      </div>
      <div class="col-md-3">
        <select class="form-select" id="category-filter">
          <option value="">Все предметы</option>
          <option value="Frontend">Программирование</option>
          <option value="Design">Дизайн</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" id="level-filter">
          <option value="">Любой уровень</option>
          <option value="Начальный">Начальный</option>
          <option value="Средний">Средний</option>
          <option value="Продвинутый">Продвинутый</option>
        </select>
      </div>
      <div class="col-md-2">
        <select class="form-select" id="price-filter">
          <option value="">Любая цена</option>
          <option value="До 3000 ₽">До 3000 ₽</option>
          <option value="От 3000 ₽">От 3000 ₽</option>
        </select>
      </div>
    </div>

    <div class="row g-4" id="courses-list"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/courses.js"></script>

</body>
</html>
