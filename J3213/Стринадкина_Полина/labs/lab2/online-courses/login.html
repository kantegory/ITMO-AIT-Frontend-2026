<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow">
          <div class="card-body p-4">
            <h2 class="text-center mb-4">Вход</h2>
            <form>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Введите email">
              </div>
              <div class="mb-3">
                <label class="form-label">Пароль</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="loginPassword" placeholder="Введите пароль">
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('loginPassword')">Показать</button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>
            <p class="text-center mt-3 mb-0">
              Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
